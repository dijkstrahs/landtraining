<script>
/* Lateral band walk: mini-squat, elastiek boven de knieën of om de enkels, zijwaarts stappen */
const EX={key:'bandwalk',VW:640,VH:440,variants:['knie','enkel','monster'],reduceT:1,
  layout(variant){return[
    {kind:'front',cx:210,cy:400,sc:.66,ly:430,matW:520,matX:30},
    {kind:'side',cx:520,cy:400,sc:.66,ly:430,matW:260,matX:variant==='monster'?40:0}];},
  state(mode,variant,time){
    const N=variant==='enkel'?32:40,W=variant==='enkel'?62:74;
    if(mode==='iso'){const k=isoT(time);return{feet:[V(-50,12,0),V(50,12,0)],lift:[0,0],k:.55*k+.15,glow:.85+.15*Math.sin(time*Math.PI*2*6.5),push:1};}
    const Ts=.9,n=Math.floor(time/Ts),u=ease((time/Ts)%1),step=n%4;
    let seq;
    if(variant==='monster'){const X=44,Z=60;
      seq=[[V(-X,12,0),V(X,12,0)],[V(-X,12,0),V(X,12,Z)],[V(-X,12,Z),V(X,12,Z)],[V(-X,12,Z),V(X,12,0)],[V(-X,12,0),V(X,12,0)]];}
    else{const d=W*2-N*2;
      seq=[[V(-N,12,0),V(N,12,0)],[V(-N,12,0),V(N+d,12,0)],[V(-N+d,12,0),V(N+d,12,0)],[V(-N,12,0),V(N+d,12,0)],[V(-N,12,0),V(N,12,0)]];}
    const a=seq[step],b=seq[step+1],feet=[0,1].map(i=>lerp(a[i],b[i],u));
    const mv=[0,1].map(i=>len(sub(a[i],b[i]))>1?Math.sin(Math.PI*u):0);
    if(variant==='monster')mv.forEach((m,i)=>{feet[i].x+=(i?1:-1)*10*m;});
    const sp=feet[1].x-feet[0].x;
    const k=variant==='monster'?clamp((sp-80)/40)*.6+.25:clamp((sp-2*N)/(2*W-2*N));
    return{feet,lift:mv.map(m=>14*m),k,glow:.4+.6*k,push:0};
  },
  scene(st,variant){
    const ft=st.feet.map((p,i)=>add(p,V(0,st.lift[i],0)));
    const cx=(st.feet[0].x+st.feet[1].x)/2,cz=(st.feet[0].z+st.feet[1].z)/2;
    const lean=16*DEG,Hc=V(cx,260,cz-20);
    const f=body(Hc,add(Hc,mul(V(0,Math.cos(lean),Math.sin(lean)),155)));
    for(let i=0;i<2;i++){const s=i?1:-1;leg(f,i,ft[i],V(s*(.3+.2*st.push),0,1));}
    for(let i=0;i<2;i++){const s=i?1:-1;
      armIK(f,i,sum(f.Hc,mul(f.up,46),mul(f.lat,s*40),mul(f.fwd,2)),V(s,-.1,-.6),'fist');}
    const g=st.glow,td=(f.Hc.z+f.Sc.z)/2;
    /* elastiek: boven de knieën of om de enkels */
    const ank=variant==='enkel';
    const ringP=i=>{const L=f.legs[i];return ank?lerp(L.kn,L.an,.86):lerp(L.hip,L.kn,.8);};
    const rr=ank?11:17;
    const pL=add(ringP(0),V(-rr,0,0)),pR=add(ringP(1),V(rr,0,0));
    const ring=(v,c,i,far)=>{
      const L=f.legs[i],a=ank?L.kn:L.hip,b=ank?L.an:L.kn,o=far?P(-10,-3):P(0,0);
      const A=v.pr(a),B=v.pr(b),C=v.pr(ringP(i)),dx=B.x-A.x,dy=B.y-A.y,l=Math.hypot(dx,dy)||1,nx=-dy/l*(rr+3),ny=dx/l*(rr+3);
      ctx.strokeStyle=far?c.bandfar:c.band;ctx.lineCap='round';ctx.lineWidth=6;
      ctx.beginPath();ctx.moveTo(C.x+nx+o.x,C.y+ny+o.y);ctx.lineTo(C.x-nx+o.x,C.y-ny+o.y);ctx.stroke();
    };
    return{fig:f,
      bands:[{a:pL,b:pR,k:st.k,sag:4,w:7.5,views:['front'],depth:{front:td-30},near:true}],
      extras:[{views:['side'],d:v=>v.dp(lerp(f.legs[0].hip,f.legs[0].kn,.5))+1,fn:(v,c)=>{ring(v,c,0,false);
          musSide(v,c);}},
              {views:['side'],d:v=>v.dp(lerp(f.legs[1].hip,f.legs[1].kn,.5))+1,fn:(v,c)=>ring(v,c,1,true)}],
      onTorso(v,f,c){
        if(v.kind!=='front')return;
        for(const s of [-1,1]){
          mus(v,c,sum(f.Hc,mul(f.lat,s*40),mul(f.up,10)),V(s,0,0),11,19,0,Math.min(1,g*1.5));
          const L=f.legs[s>0?1:0];musLimb(v,c,L.hip,L.kn,.25,.7,11,8,g*.5);
        }
      }};
    function musSide(v,c){
      ctx.save();ctx.globalAlpha=Math.min(1,g*1.3);ctx.fillStyle=c.mus;
      const p=v.pr(sum(f.Hc,mul(f.fwd,-8),mul(f.up,16)));const r=torsoRot(v,f);
      ctx.beginPath();ctx.ellipse(p.x,p.y,13,17,r,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=g*.5;const q=v.pr(sum(f.Hc,mul(f.fwd,-17),mul(f.up,-10)));
      ctx.beginPath();ctx.ellipse(q.x,q.y,15,18,r,0,Math.PI*2);ctx.fill();ctx.restore();
    }
  }
};

/* ===== Gedeelde engine groep 3 (staand met elastiek) =====
   Zelfde helpers en maten als plank / standing row / pass-through.
   Het figuur wordt als 3D-skelet opgebouwd (x = opzij, y = omhoog, z = naar voren)
   en per aanzicht geprojecteerd: voor, achter, zij (gezicht naar rechts) of boven. */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();ctx.fill();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
const P=(x,y)=>({x,y});
const ease=t=>.5-.5*Math.cos(Math.PI*t);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const DEG=Math.PI/180;

/* vaste spierprofielen */
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
/* voor-/achter-/bovenaanzicht: symmetrische varianten (zoals horse stance / pass-through) */
const S_UA=[[4,.5,.22]],S_FA=[[3,.25,.2]],S_TH_F=[[5,.45,.28]],S_TH_B=[[4,.4,.3]],S_SH=[[3,.28,.18]];
const L_TH=148,L_SH=132,L_UA=104,L_FA=81;

/* ---------- 3D ---------- */
const V=(x,y,z)=>({x,y,z});
const add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z),sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z);
const mul=(a,k)=>V(a.x*k,a.y*k,a.z*k),dt3=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const len=a=>Math.hypot(a.x,a.y,a.z),nrm=a=>mul(a,1/(len(a)||1));
const lerp=(a,b,t)=>V(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t,a.z+(b.z-a.z)*t);
const cross=(a,b)=>V(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x);
const sum=(...p)=>p.reduce(add);
function ik3(A,B,l1,l2,pole){
  let d=sub(B,A),L=len(d);const u=nrm(d);
  if(L>l1+l2-.01){L=l1+l2-.01;B=add(A,mul(u,L));}
  const a=(l1*l1-l2*l2+L*L)/(2*L),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  const p=nrm(sub(pole,mul(u,dt3(pole,u))));
  return [add(add(A,mul(u,a)),mul(p,h)),B];
}

/* ---------- figuur ---------- index 0 = kant x<0, index 1 = kant x>0 */
function body(Hc,Sc){
  const up=nrm(sub(Sc,Hc)),lat=V(1,0,0),fwd=nrm(cross(lat,up));
  const f={Hc,Sc,up,lat,fwd,arms:[null,null],legs:[null,null]};
  f.sh=[-1,1].map(s=>add(Sc,mul(lat,s*50)));
  f.hip=[-1,1].map(s=>sum(Hc,mul(lat,s*20),mul(up,-4)));
  f.head=sum(Sc,mul(up,56),mul(fwd,5));
  f.neck=[add(Sc,mul(up,14)),sum(Sc,mul(up,30),mul(fwd,2))];
  return f;
}
function leg(f,i,an,pole,foot){
  const [kn,a]=ik3(f.hip[i],an,L_TH,L_SH,pole);
  const fd=foot&&foot.dir?nrm(foot.dir):V(0,0,1);
  const heel=foot&&foot.heel?foot.heel:add(a,add(mul(fd,-6),V(0,-2,0)));
  const toe=foot&&foot.toe?foot.toe:add(a,add(mul(fd,38),V(0,-6,0)));
  f.legs[i]={hip:f.hip[i],kn,an:a,heel,toe,flatFront:!(foot&&foot.toe)};
}
function armDir(f,i,dUA,dFA,hand){
  const el=add(f.sh[i],mul(nrm(dUA),L_UA)),wr=add(el,mul(nrm(dFA),L_FA));
  f.arms[i]={sh:f.sh[i],el,wr,hand:hand||'fist'};
}
function armIK(f,i,wr,pole,hand){
  const [el,w]=ik3(f.sh[i],wr,L_UA,L_FA,pole);
  f.arms[i]={sh:f.sh[i],el,wr:w,hand:hand||'fist'};
}
/* ontspannen hangende arm langs het lichaam */
function armHang(f,i,swing=0){
  const s=i?1:-1;
  armDir(f,i,V(s*.08,-1,swing+f.up.z*.25),V(s*.04,-1,.12+swing+f.up.z*.25),'hang');
}
/* staande basishouding: voeten op heupbreedte, knieën heel licht gebogen */
function standing(o={}){
  const Hc=o.Hc||V(0,290,-4),lean=o.lean||0;
  const up=V(0,Math.cos(lean),Math.sin(lean));
  const f=body(Hc,add(Hc,mul(up,155)));
  for(let i=0;i<2;i++){const s=i?1:-1;
    const an=o.an?o.an[i]:V(s*(o.feet||24),12,0);
    leg(f,i,an,V(s*(o.kneeOut||0),0,1),o.foot?o.foot[i]:null);}
  return f;
}
const fistC=a=>add(a.wr,mul(nrm(sub(a.wr,a.el)),9));

/* ---------- aanzichten ---------- */
function mkView(kind,cx,cy,sc,label){
  const v={kind,cx,cy,sc,label};
  if(kind==='front'){v.pr=p=>P(p.x,-p.y);v.dp=p=>p.z;v.cam=V(0,0,1);}
  else if(kind==='back'){v.pr=p=>P(-p.x,-p.y);v.dp=p=>-p.z;v.cam=V(0,0,-1);}
  else if(kind==='side'){v.pr=p=>P(p.z,-p.y);v.dp=p=>-p.x;v.cam=V(-1,0,0);}
  else {v.pr=p=>P(p.x,p.z);v.dp=p=>p.y;v.cam=V(0,1,0);}
  return v;
}
const LABELS={front:'VOORAANZICHT',back:'ACHTERAANZICHT',side:'ZIJAANZICHT',top:'BOVENAANZICHT'};

function outlined(c,col,fn){
  const f0=ctx.fill;ctx.strokeStyle=c.stage;ctx.lineWidth=5;ctx.lineJoin='round';
  ctx.fill=function(){ctx.stroke();};fn(true);ctx.fill=f0;
  ctx.fillStyle=col;fn(false);
}
function offP(p,o){return o?P(p.x+o.x,p.y+o.y):p;}

function drawLeg(v,L,o){
  const pr=p=>offP(v.pr(p),o);
  const H=pr(L.hip),K=pr(L.kn),A=pr(L.an);
  const side=v.kind==='side';
  const thigh=()=>{side?limb(H,K,24,15,THIGH_F,THIGH_B):limb(H,K,24,16,S_TH_F,S_TH_B);dot(K,side?14.5:15);};
  const shin=()=>{side?limb(K,A,14.5,9,SHIN_F,SHIN_B):limb(K,A,15,9,S_SH,S_SH);foot();};
  const foot=()=>{
    if((v.kind==='front'||v.kind==='back')&&L.flatFront){
      ctx.beginPath();ctx.ellipse(A.x,A.y+4,13,10,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(A.x,A.y+7,16,6,0,0,Math.PI*2);ctx.fill();
    }else{
      const he=pr(L.heel),to=pr(L.toe);
      if(Math.hypot(to.x-he.x,to.y-he.y)<6){ctx.beginPath();ctx.ellipse(A.x,A.y+5,12,8,0,0,Math.PI*2);ctx.fill();}
      else capsule(he,v.kind==='top'?9:10,to,v.kind==='top'?8:6);
    }
  };
  const dT=v.dp(lerp(L.hip,L.kn,.5)),dS=v.dp(lerp(L.kn,L.an,.5));
  if(dS<dT-4){shin();thigh();}else{thigh();shin();}
}
function drawHand(v,a,o){
  const pr=p=>offP(v.pr(p),o);
  if(a.hand==='none')return;
  const d=nrm(sub(a.wr,a.el)),W=pr(a.wr);
  const off=a.hand==='hang'?11:9,C=pr(add(a.wr,mul(d,off)));
  const dx=C.x-W.x,dy=C.y-W.y,h=Math.hypot(dx,dy)/off;
  ctx.save();ctx.translate(C.x,C.y);ctx.rotate(Math.atan2(dy,dx));ctx.beginPath();
  if(a.hand==='hang')ctx.ellipse(0,0,Math.max(8.5,10.5*h),8.5,0,0,Math.PI*2);
  else ctx.ellipse(0,0,9.5+1.5*h,9.5,0,0,Math.PI*2);
  ctx.fill();ctx.restore();
}
function drawArm(v,a,o,hook){
  const pr=p=>offP(v.pr(p),o);
  const S=pr(a.sh),E=pr(a.el),W=pr(a.wr),side=v.kind==='side';
  const ua=()=>{side?limb(S,E,16,11,UA_F,UA_B):limb(S,E,16,11,S_UA,S_UA);dot(E,11);};
  const fa=()=>{side?limb(E,W,11.5,6.5,FA_F,FA_B):limb(E,W,11.5,6.5,S_FA,S_FA);drawHand(v,a,o);};
  const sh=()=>{if(side)dot(P(S.x+3,S.y-2),21);else dot(S,v.kind==='top'?18:17);if(hook)hook();};
  const dU=v.dp(lerp(a.sh,a.el,.5)),dF=v.dp(lerp(a.el,a.wr,.5));
  const parts=dF<dU-4?[fa,ua]:[ua,fa];
  /* arm die naar de camera wijst: schouderbol eerst, anders verdwijnt de vuist erachter */
  if(v.dp(a.el)>v.dp(a.sh)+8){sh();parts.forEach(p=>p());}
  else{parts.forEach(p=>p());sh();}
}
function drawTorso(v,f,c){
  const S=v.pr(f.Sc),H=v.pr(f.Hc);
  if(v.kind==='front'||v.kind==='back'){
    const k=Math.max(.55,(H.y-S.y)/155);
    ctx.save();ctx.translate(S.x,S.y);ctx.scale(1,k*155/128);ctx.translate(0,300);
    ctx.beginPath();ctx.moveTo(-15,-314);
    ctx.quadraticCurveTo(-28,-306,-44,-300);ctx.quadraticCurveTo(-54,-280,-49,-258);
    ctx.quadraticCurveTo(-42,-232,-37,-208);ctx.quadraticCurveTo(-46,-190,-45,-172);
    ctx.lineTo(45,-172);ctx.quadraticCurveTo(46,-190,37,-208);ctx.quadraticCurveTo(42,-232,49,-258);
    ctx.quadraticCurveTo(54,-280,44,-300);ctx.quadraticCurveTo(28,-306,15,-314);
    ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.ellipse(0,-172,48,16,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
    capsule(v.pr(f.neck[0]),13,v.pr(f.neck[1]),11);
    const hd=v.pr(f.head);ctx.beginPath();ctx.ellipse(hd.x,hd.y,24,30,0,0,Math.PI*2);ctx.fill();
  }else if(v.kind==='side'){
    F=-1;
    limb(S,H,27,24,T_FRONT,T_BACK);
    const rot=Math.atan2(S.x-H.x,-(S.y-H.y));
    const B=v.pr(sub(f.Hc,mul(f.fwd,15)));
    ctx.beginPath();ctx.ellipse(B.x,B.y,23,31,rot,0,Math.PI*2);ctx.fill();
    capsule(v.pr(f.neck[0]),12,v.pr(f.neck[1]),11);
    const hd=v.pr(f.head);ctx.beginPath();ctx.ellipse(hd.x,hd.y,25,29,rot*.6,0,Math.PI*2);ctx.fill();
  }else{
    const a=v.pr(f.Sc),b=v.pr(f.Hc);
    ctx.beginPath();ctx.moveTo(a.x-54,a.y);ctx.lineTo(b.x-42,b.y);ctx.lineTo(b.x+42,b.y);ctx.lineTo(a.x+54,a.y);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.ellipse(b.x,b.y,42,24,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(a.x,a.y,56,28,0,0,Math.PI*2);ctx.fill();
  }
}
function drawTopHead(v,f){
  const hd=v.pr(f.head);ctx.beginPath();ctx.ellipse(hd.x,hd.y,25,29,0,0,Math.PI*2);ctx.fill();
}
/* elastiek: a -> b, rek 0..1 maakt hem dunner en strakker; stub = alleen het eerste stuk vanaf a */
function drawBand(v,b,c){
  const A=v.pr(b.a),B0=v.pr(b.b),st=b.stub||1;
  const B=P(A.x+(B0.x-A.x)*st,A.y+(B0.y-A.y)*st);
  const sag=v.kind==='top'?0:(1-b.k)*(b.sag==null?14:b.sag)*st+1;
  ctx.strokeStyle=b.far?c.bandfar:c.band;ctx.lineCap='round';
  ctx.lineWidth=Math.max(2.6,(b.w||7)-3.6*b.k);
  ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.quadraticCurveTo((A.x+B.x)/2,(A.y+B.y)/2+sag,B.x,B.y);ctx.stroke();
}
/* spier op het lichaam: zichtbaarheid volgt de richting van het huidoppervlak t.o.v. de camera */
function mus(v,c,p3,n3,rx,ry,rot,alpha){
  const vis=clamp((dt3(nrm(n3),v.cam)+.35)/.6);
  if(vis<=0||alpha<=0)return;
  const p=v.pr(p3);
  ctx.save();ctx.globalAlpha=alpha*vis;ctx.fillStyle=c.mus;
  ctx.beginPath();ctx.ellipse(p.x,p.y,rx,ry,rot,0,Math.PI*2);ctx.fill();ctx.restore();
}
function torsoRot(v,f){const a=v.pr(f.Hc),b=v.pr(f.Sc);return Math.atan2(b.x-a.x,-(b.y-a.y));}
/* spier langs een ledemaatdeel */
function musLimb(v,c,p,q,t0,t1,r0,r1,alpha,n3){
  const vis=n3?clamp((dt3(nrm(n3),v.cam)+.35)/.6):1;if(vis<=0||alpha<=0)return;
  const a=v.pr(lerp(p,q,t0)),b=v.pr(lerp(p,q,t1));
  ctx.save();ctx.globalAlpha=alpha*vis;ctx.fillStyle=c.mus;capsule(a,r0,b,r1);ctx.restore();
}

function drawFigure(v,f,c,scene){
  const G=[],side=v.kind==='side',flat=v.kind==='front'||v.kind==='back';
  const td=v.dp(lerp(f.Hc,f.Sc,.5));
  const farOf=i=>side&&i===1;
  const col=i=>farOf(i)?c.far:c.body,off=i=>farOf(i)?P(-10,-3):null;
  for(let i=0;i<2;i++){const L=f.legs[i];if(!L)continue;
    let d=v.dp(lerp(L.hip,L.kn,.5));if(flat)d=td-40+d*.01;
    G.push({d,fn:()=>{ctx.fillStyle=v.kind==='top'?c.far:col(i);drawLeg(v,L,off(i));}});}
  G.push({d:td,fn:()=>{ctx.fillStyle=c.body;drawTorso(v,f,c);if(scene.onTorso)scene.onTorso(v,f,c);}});
  if(v.kind==='top')G.push({d:v.dp(f.head)-1,fn:()=>{outlined(c,c.body,()=>drawTopHead(v,f));if(scene.onHead)scene.onHead(v,f,c);}});
  for(let i=0;i<2;i++){const a=f.arms[i];if(!a)continue;
    let d=v.dp(lerp(a.el,a.wr,.5));
    if(flat&&d>td-25)d+=20;if(v.kind==='top')d+=5;
    const behind=d<td;
    const hook=scene.onArm?()=>scene.onArm(v,f,c,i):null;
    G.push({d,fn:()=>{
      if(behind||farOf(i)){ctx.fillStyle=col(i);drawArm(v,a,off(i),farOf(i)?null:hook);}
      else outlined(c,col(i),st=>drawArm(v,a,null,st?null:hook));}});}
  for(const b of scene.bands||[]){
    if(b.views&&!b.views.includes(v.kind))continue;
    const bb=Object.assign({},b);
    if(b.stubIn&&b.stubIn.includes(v.kind))bb.stub=b.stubLen||.18;
    let d=v.dp(lerp(b.a,b.b,bb.stub?bb.stub/2:.5))+(b.bias||0);
    if(b.depth&&b.depth[v.kind]!=null)d=b.depth[v.kind];
    bb.far=!b.near&&(d<td-10||b.forceFar);
    G.push({d,fn:()=>drawBand(v,bb,c)});
  }
  for(const x of scene.extras||[])if(!x.views||x.views.includes(v.kind))G.push({d:typeof x.d==='function'?x.d(v,td):x.d,fn:()=>x.fn(v,c)});
  G.sort((a,b)=>a.d-b.d).forEach(g=>g.fn());
  if(scene.onTop)scene.onTop(v,f,c);
}

/* paal of deurpost (token --post) */
function postFlat(c,x,top,bottom=0,w=16){ctx.fillStyle=c.post;ctx.beginPath();ctx.roundRect(x-w/2,-top,w,top-bottom,4);ctx.fill();}
function anchorClip(c,p){ctx.fillStyle=c.band;ctx.beginPath();ctx.roundRect(p.x-11,p.y-9,22,18,6);ctx.fill();}
function postTop(c,p){ctx.fillStyle=c.post;ctx.beginPath();ctx.roundRect(p.x-11,p.y-11,22,22,4);ctx.fill();}

/* ---------- pagina / afspelen ---------- */
let playing=true,slow=false,phaseT=0,last=performance.now();
let MODE='dyn',VAR=EX.variants[0];
function colors(){return{stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),
  muted:tok('--muted'),band:tok('--band'),bandfar:tok('--bandfar'),post:tok('--post')};}
function render(){
  const k=cv.width/EX.VW;ctx.setTransform(k,0,0,k,0,0);
  const c=colors();
  ctx.fillStyle=c.stage;ctx.fillRect(0,0,EX.VW,EX.VH);
  const time=window.__time!=null?window.__time:phaseT;
  const mode=window.__mode||MODE,variant=window.__var||VAR;
  const st=EX.state(mode,variant,time);
  if(window.__t!=null)st.t=window.__t;
  if(reduce&&window.__t==null){st.t=EX.reduceT!=null?EX.reduceT:1;st.t2=st.t;}
  const scene=EX.scene(st,variant,mode);
  const views=EX.layout(variant,mode);
  for(const vd of views){
    const v=mkView(vd.kind,vd.cx,vd.cy,vd.sc,vd.label);
    ctx.save();ctx.translate(v.cx,v.cy);ctx.scale(v.sc,v.sc);
    if(v.kind!=='top'&&vd.mat!==false){ctx.fillStyle=c.mat;const w=vd.matW||300;ctx.beginPath();ctx.roundRect((vd.matX||0)-w/2,0,w,10,5);ctx.fill();}
    if(scene.props)scene.props(v,c);
    drawFigure(v,scene.fig,c,scene);
    ctx.restore();
    ctx.fillStyle=c.muted;ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign='center';
    ctx.fillText(vd.label||LABELS[vd.kind],vd.lx!=null?vd.lx:vd.cx,vd.ly);
  }
}
function frame(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;
  if(playing&&!reduce)phaseT+=dt*(slow?.5:1);
  render();
  requestAnimationFrame(frame);
}
/* hulpfuncties voor de tijdlijn */
function cycle(ph,out,hold,back,rest){
  const T=out+hold+back+rest;ph=((ph%T)+T)%T;
  if(ph<out)return ease(ph/out);
  if(ph<out+hold)return 1;
  if(ph<out+hold+back)return 1-ease((ph-out-hold)/back);
  return 0;
}
function repIndex(ph,T){return Math.floor(ph/T);}
/* isometrisch: vasthouden met lichte trillende spanning en ademhaling */
function isoT(time,hold=1){return hold-.012*(.5+.5*Math.sin(time*Math.PI*2*6.5))-.018*(.5+.5*Math.sin(time*Math.PI*2/4));}

function setMode(m){MODE=m;phaseT=0;document.querySelectorAll('[data-m]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===m)));save();}
function setVar(x){VAR=x;phaseT=0;document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===x)));save();}
function save(){try{localStorage.setItem(EX.key,JSON.stringify({m:MODE,v:VAR}))}catch(e){}}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>setVar(b.dataset.v));
try{const s=JSON.parse(localStorage.getItem(EX.key)||'null');if(s){if(s.m)setMode(s.m);if(s.v&&EX.variants.includes(s.v))setVar(s.v);}}catch(e){}
setMode(MODE);setVar(VAR);
document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
requestAnimationFrame(frame);

<\/script>

</body></html>
</script>
<script type="text/plain" data-ex="squat">
<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Squat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one stage card with the animation, mode/variation/playback controls and a muscle legend */
:root{
  --bg:#EDF0EE; --stage:#F8FAF9; --ink:#1E2426; --muted:#5E686A; --body:#2A3134; --far:#7C8689;
  --muscle:#E0452B; --mat:#D6DCD9; --line:#D3D9D6; --band:#2C8C7E; --bandfar:#8CC2B9; --post:#B9C1BE;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --text:"Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121617; --stage:#1A1F20; --ink:#E8ECEA; --muted:#98A3A0; --body:#D9E0DD; --far:#7F8A87;
  --muscle:#FF5B3E; --mat:#2A3133; --line:#2C3335; --band:#4DBDAC; --bandfar:#2F6E66; --post:#3A4345; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121617; --stage:#1A1F20; --ink:#E8ECEA; --muted:#98A3A0; --body:#D9E0DD; --far:#7F8A87;
  --muscle:#FF5B3E; --mat:#2A3133; --line:#2C3335; --band:#4DBDAC; --bandfar:#2F6E66; --post:#3A4345; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
main{max-width:860px;margin:0 auto;display:grid;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,7vw,52px);line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;height:auto}
.bar{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;border-top:1px solid var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button[aria-pressed="true"]{background:var(--ink);color:var(--stage);border-color:var(--ink)}
.mode{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.03em;text-transform:uppercase;padding:4px 12px}
button:focus-visible{outline:2px solid var(--muscle);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:15px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muscle);flex:none}
.dot.soft{opacity:.55}
</style>

<main>
  <header>
    <h1>Squat</h1>
    <p class="sub">Bovenbenen en bilspieren</p>
  </header>

  <section class="stage">
    <canvas id="c" width="1200" height="900" aria-label="Animatie van een squat, van voren en van opzij"></canvas>
    <div class="bar">
      <div class="seg" role="group" aria-label="Uitvoering">
        <button class="mode" data-mode="iso" aria-pressed="false">Isometrisch</button>
        <button class="mode" data-mode="dyn" aria-pressed="true">Dynamisch</button>
      </div>
      <div class="seg" role="group" aria-label="Variatie">
        <button data-var="voor" aria-pressed="true">Armen voor</button>
        <button data-var="stroom" aria-pressed="false">Stroomlijn</button>
        <button data-var="band" aria-pressed="false">Met elastiek</button>
      </div>
      <div class="seg">
        <button id="play" aria-pressed="false">Pauze</button>
        <button id="slow" aria-pressed="false">Langzaam</button>
      </div>
    </div>
  </section>

  <div class="legend">
    <span><i class="dot "></i>Quadriceps (primair)</span>
    <span><i class="dot soft"></i>Bilspieren (secundair)</span>
  </div>
</main>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let playing=true,slow=false,phaseT=0,last=performance.now();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

/* paint: fill normally, stroke when drawing the background-coloured edge of an overlapping limb */
let OUT=false;
const paint=()=>{OUT?ctx.stroke():ctx.fill()};
function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();paint();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();paint();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);paint();};
const ell=(x,y,rx,ry,rot)=>{ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);paint();};
const P=(x,y)=>({x,y});
const add=(a,b,k=1)=>P(a.x+b.x*k,a.y+b.y*k);
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>.5-.5*Math.cos(Math.PI*Math.max(0,Math.min(1,t)));
const rot=(v,a)=>P(v.x*Math.cos(a)-v.y*Math.sin(a),v.x*Math.sin(a)+v.y*Math.cos(a));
/* angle measured from straight down, positive toward the front (+x): 0 hangs, PI/2 forward, PI overhead */
const dirA=a=>P(Math.sin(a),Math.cos(a));

/* shared body standard: torso 155, thigh 148, shin 132, upper arm 104, forearm 81 */
const L_T=155,L_TH=148,L_SH=132,L_UA=104,L_FA=81;
const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];

/* two-bone IK; dir +1 bends toward the front side of a->b (knee), -1 toward the back (elbow) */
function ik(a,b,l1,l2,dir){
  const dx=b.x-a.x,dy=b.y-a.y;let d=Math.hypot(dx,dy)||1;
  const ux=dx/d,uy=dy/d;d=Math.max(Math.abs(l1-l2)+.01,Math.min(d,l1+l2-.01));
  const base=Math.atan2(uy,ux),off=Math.acos(Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d))));
  const c1=P(a.x+l1*Math.cos(base+off),a.y+l1*Math.sin(base+off)),c2=P(a.x+l1*Math.cos(base-off),a.y+l1*Math.sin(base-off));
  const nx=uy,ny=-ux,s1=(c1.x-a.x)*nx+(c1.y-a.y)*ny;
  return (s1*dir>0)?c1:c2;
}
function armFK(S,a,b){const E=add(S,dirA(a),L_UA),W=add(E,dirA(a+b),L_FA);return {E,W};}
/* torso frame from hip + lean (0 upright, + forward) */
function torso(H,lean){const u=P(Math.sin(lean),-Math.cos(lean)),n=P(Math.cos(lean),Math.sin(lean));return {u,n,S:add(H,u,L_T)};}

/* hands */
function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-4,W.y-9);
  ctx.quadraticCurveTo(W.x+14,W.y-10,W.x+28,W.y-3);
  ctx.quadraticCurveTo(W.x+40,W.y+1,W.x+40,W.y+5);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+16,W.y+8);
  ctx.lineTo(W.x-6,W.y+8);
  ctx.closePath();paint();
}
/* the same flat hand turned with the forearm (fingers continue the forearm line) */
function handAlong(W,E,flip){
  const a=Math.atan2(W.y-E.y,W.x-E.x);
  ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);if(flip)ctx.scale(1,-1);hand(P(0,0));ctx.restore();
}
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);paint();ctx.restore();}
const fistC=(W,E)=>{const d=Math.hypot(W.x-E.x,W.y-E.y)||1;return P(W.x+(W.x-E.x)/d*9,W.y+(W.y-E.y)/d*9);};

/* foot: heel to toe capsule, fa = plantar flexion (heel up, + clockwise) */
function foot(A,fa,air){
  if(air||fa<.08){capsule(add(A,rot(P(-6,2),fa)),10,add(A,rot(P(38,6),fa)),6);return;}
  /* on the toes: heel-to-ball part tilts, the toes stay flat on the ground */
  const ball=add(A,rot(P(30,6),fa));
  capsule(add(A,rot(P(-6,2),fa)),10,ball,6.5);
  capsule(ball,6.5,P(ball.x+11,ball.y+.5),5.5);
}

/* muscle strip along a limb a->b; side +1 front, -1 back */
function strip(a,b,t0,t1,side,o0,o1,r0,r1){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,nx=dy/L,ny=-dx/L;
  capsule(P(a.x+dx*t0+nx*side*o0,a.y+dy*t0+ny*side*o0),r0,P(a.x+dx*t1+nx*side*o1,a.y+dy*t1+ny*side*o1),r1);
}

/* recursive blend of two poses (numbers mix, everything else from the target) */
function mixPose(a,b,t){
  if(typeof b==='number'&&typeof a==='number')return a+(b-a)*t;
  if(b&&typeof b==='object'&&a&&typeof a==='object'&&!Array.isArray(b)){const o={};for(const k in b)o[k]=(k in a)?mixPose(a[k],b[k],t):b[k];return o;}
  if(Array.isArray(b)&&Array.isArray(a)&&a.length===b.length)return b.map((v,i)=>mixPose(a[i],v,t));
  return b;
}

/*
 Side view figure, facing +x, ground at y=0.
 q = {H, lean, tilt, ln:{K,A,fa}, lf:{K,A,fa,lift}, an:{E,W,h}, af:{E,W,h}}
 h = 'flat' | 'fist' | 'none'
*/
const FAR_OFF=P(-11,-3);
function legPaint(H,L,off,offA){
  const h=add(H,off),k=add(L.K,off),a=add(L.A,offA);
  limb(h,k,24,15,THIGH_F,THIGH_B);dot(k,14.5);
  limb(k,a,14.5,9,SHIN_F,SHIN_B);
  foot(a,L.fa||0,L.lift);
}
function armPaint(S,A,off){
  const s=add(S,off),e=add(A.E,off),w=add(A.W,off);
  limb(s,e,16,11,UA_F,UA_B);dot(e,11);
  limb(e,w,11.5,6.5,FA_F,FA_B);
  if(A.h==='fist')fist(w,e);
  else if(A.h==='flatR')handAlong(w,e,true);
  else if(A.h!=='none')handAlong(w,e,false);
}
function headPaint(q,T){
  const tilt=q.tilt||0,uh=P(Math.sin(q.lean-tilt),-Math.cos(q.lean-tilt)),nh=P(Math.cos(q.lean-tilt),Math.sin(q.lean-tilt));
  const nb=add(T.S,T.u,14);
  capsule(nb,12,add(nb,uh,16),11);
  const c=add(add(nb,uh,42),nh,5);
  ell(c.x,c.y,25,29,q.lean-tilt);
}
function sideFigure(q,col,hooks){
  hooks=hooks||{};F=-1;
  const T=torso(q.H,q.lean);q.S=T.S;q.u=T.u;q.n=T.n;
  const offA=P(FAR_OFF.x,q.lf.lift?FAR_OFF.y:0);
  ctx.fillStyle=col.far;
  if(q.af)armPaint(T.S,q.af,P(-12,-4));
  legPaint(q.H,q.lf,FAR_OFF,offA);
  if(hooks.farMus)hooks.farMus(q,T);
  ctx.fillStyle=col.body;
  limb(T.S,q.H,27,24,T_FRONT,T_BACK);
  dot(q.H,27);
  const b=add(q.H,T.n,-15);ell(b.x,b.y,23,31,q.lean);
  legPaint(q.H,q.ln,P(0,0),P(0,0));
  if(hooks.mus){ctx.save();hooks.mus(q,T);ctx.restore();ctx.fillStyle=col.body;}
  headPaint(q,T);
  if(hooks.beforeArm)hooks.beforeArm(q,T);
  ctx.fillStyle=col.body;
  if(q.an){
    OUT=true;ctx.strokeStyle=col.stage;ctx.lineWidth=5;ctx.lineJoin='round';armPaint(T.S,q.an,P(0,0));OUT=false;
    armPaint(T.S,q.an,P(0,0));
  }
  dot(add(T.S,P(1,-2)),21);
  if(hooks.after)hooks.after(q,T);
}
/* standing leg from hip and ankle */
const legIK=(H,A,fa,lift)=>({K:ik(H,A,L_TH,L_SH,1),A,fa:fa||0,lift:!!lift});
const ANK=-12;

/*
 Front view figure (camera in front), ground y=0, hip centre at (hx,hy).
 f = {hx,hy,lean,sh (shoulder tilt), legs:[{K,A},{K,A}] for s=-1,+1, arms:'forward'|'up'|'hips'}
*/
function frontFigure(f,col,hooks){
  hooks=hooks||{};
  const body=col.body,edge=col.stage;
  const sy=.12+.88*Math.cos(f.lean);
  ctx.fillStyle=body;
  const thighShort=Math.abs(f.legs[0].K.y-f.hy)<75;
  const legs=()=>{ctx.fillStyle=body;[-1,1].forEach((s,i)=>{
    const L=f.legs[i],Hp=P(f.hx+s*24,f.hy);
    limb(Hp,L.K,24,16,[[5,.45,.28]],[[4,.4,.3]]);dot(L.K,15);
    limb(L.K,L.A,15,9,[[3,.28,.18]],[[3,.28,.18]]);
    const fx=L.A.x+s*(L.out||0);
    ell(fx,L.A.y+2,13,10,0);ell(fx+s*(L.out?3:1),L.A.y+5,16,6,s*(L.out?.25:0));
  });
  if(hooks.legMus){ctx.save();hooks.legMus(f);ctx.restore();ctx.fillStyle=body;}};
  if(!thighShort)legs();
  ctx.save();ctx.translate(f.hx,f.hy);ctx.scale(1,sy);
  const y=0;
  const path=()=>{ctx.beginPath();ctx.moveTo(-15,-144);
    ctx.quadraticCurveTo(-28,-136,-44,-130);ctx.quadraticCurveTo(-54,-110,-49,-88);
    ctx.quadraticCurveTo(-42,-62,-37,-38);ctx.quadraticCurveTo(-46,-20,-45,-2);
    ctx.lineTo(45,-2);ctx.quadraticCurveTo(46,-20,37,-38);ctx.quadraticCurveTo(42,-62,49,-88);
    ctx.quadraticCurveTo(54,-110,44,-130);ctx.quadraticCurveTo(28,-136,15,-144);ctx.closePath();};
  path();ctx.fill();
  ell(0,0,46,15,0);
  capsule(P(0,-132),13,P(0,-148),11);
  ctx.restore();
  /* head stays round (not squashed by lean) */
  const hy=f.hy-148*sy-28;
  ell(f.hx,hy,24,30,0);
  const Sy=f.hy-120*sy;
  [-1,1].forEach(s=>{
    const S=P(f.hx+s*50,Sy);
    if(f.arms==='forward'){
      dot(S,16);
      ctx.beginPath();ctx.moveTo(S.x-s*14,S.y-2);ctx.lineTo(S.x+s*14,S.y-2);ctx.lineTo(S.x+s*6,S.y+24);ctx.lineTo(S.x-s*12,S.y+24);ctx.closePath();ctx.fill();
      ell(S.x-s*4,S.y+26,13,12,0);
      ctx.strokeStyle=edge;ctx.lineWidth=2;ctx.stroke();
    }else if(f.arms==='up'){
      const W=P(f.hx+s*9,Sy-178*(.25+.75*Math.cos(f.lean))),E=P(S.x+(W.x-S.x)*.56-s*3,S.y+(W.y-S.y)*.56);
      ctx.save();OUT=true;ctx.strokeStyle=edge;ctx.lineWidth=4;
      capsule(S,16,E,11);capsule(E,11,W,7);OUT=false;ctx.restore();
      capsule(S,16,E,11);dot(E,11);capsule(E,11,W,7);
      ell(W.x-s*3,W.y-16,9,19,s*.08);
      dot(S,18);
    }else{
      dot(S,16);
      const E=P(f.hx+s*70,Sy+52),W=P(f.hx+s*40,f.hy-12);
      capsule(S,15,E,11);dot(E,11);capsule(E,11,W,7);ell(W.x+s*2,W.y+4,10,12,0);
    }
  });
  if(thighShort){
    /* thighs come toward the camera: knees in front of the pelvis, with a thin edge */
    ctx.save();OUT=true;ctx.strokeStyle=edge;ctx.lineWidth=4;
    [-1,1].forEach((s,i)=>{const L=f.legs[i];dot(L.K,16);capsule(P(f.hx+s*24,f.hy),24,L.K,16);});
    OUT=false;ctx.restore();legs();
  }
  if(hooks.after)hooks.after(f);
}

function label(txt,x,y,align){
  ctx.fillStyle=tok('--muted');ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign=align||'center';
  ctx.fillText(txt,x,y);
}
function colors(){return {body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),stage:tok('--stage'),post:tok('--post'),band:tok('--band'),bandfar:tok('--bandfar')};}
/* view: translate to ground point, scale; draw mat */
function view(cx,gy,sc,matW,fn,matX){
  ctx.save();ctx.translate(cx,gy);ctx.scale(sc,sc);
  ctx.fillStyle=tok('--mat');ctx.beginPath();ctx.roundRect(matX!=null?matX:-matW/2,0,matW,10,5);ctx.fill();
  fn();ctx.restore();
}
function wallRect(x0,top,w){ctx.fillStyle=tok('--post');ctx.beginPath();ctx.roundRect(x0,top,w,-top,4);ctx.fill();}

/* ui state */
let mode='dyn',variant=null,prevPose=null,blendT=1,curPose=null;
function setGroup(sel,val,attr){document.querySelectorAll(sel).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset[attr]===val)));}
function bindUI(key,onChange){
  const save=()=>{try{localStorage.setItem(key,JSON.stringify({mode,variant}))}catch(e){}};
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(mode!==b.dataset.mode){prevPose=curPose;blendT=0;mode=b.dataset.mode;phaseT=0;}setGroup('[data-mode]',mode,'mode');save();onChange&&onChange();});
  document.querySelectorAll('[data-var]').forEach(b=>b.onclick=()=>{if(variant!==b.dataset.var){prevPose=curPose;blendT=0;variant=b.dataset.var;phaseT=0;}setGroup('[data-var]',variant,'var');save();onChange&&onChange();});
  try{const s=JSON.parse(localStorage.getItem(key)||'null');if(s){if(s.mode&&document.querySelector('[data-mode="'+s.mode+'"]'))mode=s.mode;if(s.variant&&document.querySelector('[data-var="'+s.variant+'"]'))variant=s.variant;}}catch(e){}
  const h=location.hash.slice(1);
  if(h){const [m,v]=h.split('.');if((m==='iso'||m==='dyn')&&document.querySelector('[data-mode="'+m+'"]'))mode=m;if(v&&document.querySelector('[data-var="'+v+'"]'))variant=v;}
  setGroup('[data-mode]',mode,'mode');setGroup('[data-var]',variant,'var');
  document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
  document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
}
/* main loop: page supplies pose(t) for the current mode/variant and render(q,glow) */
function run(cycle,poseFn,render){
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(playing&&!reduce){phaseT+=dt*(slow?.5:1);}
    const C=cycle();
    let t=window.__t!=null?window.__t*C:(reduce?C*.5:phaseT%C);
    let q=poseFn(t);
    if(blendT<1&&prevPose&&!reduce&&window.__t==null){blendT=Math.min(1,blendT+dt*3);q=mixPose(prevPose,q,ease(blendT));}
    curPose=q;
    render(q,t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

const VW=640,VH=480,GY=452;
variant='voor';
/* depth curve for one rep: down, short pause, up, pause at the top */
function depth(t){
  if(t<1.4)return ease(t/1.4);
  if(t<1.7)return 1;
  if(t<2.9)return 1-ease((t-1.7)/1.2);
  return 0;
}
function squatSide(s,v){
  const A=P(0,ANK);
  const st=v==='stroom';
  const phi=st?.04+.6*s:.04+.52*s;            /* shin forward lean */
  const psi=-.04+1.38*s;                      /* thigh, hip behind knee */
  const K=add(A,P(Math.sin(phi),-Math.cos(phi)),L_SH);
  const H=add(K,P(-Math.sin(psi),-Math.cos(psi)),L_TH);
  const lean=st?.05+.4*s:.06+.56*s;
  return mk(H,K,A,lean,s,v,null);
}
function wallSit(b,v){
  const A=P(0,ANK);
  const K=P(A.x,A.y-L_SH),H=P(K.x-Math.sqrt(L_TH*L_TH-b*b*.36),K.y+b*.6);
  return mk(H,K,A,-.03,1,v,H.x-15-23-1);
}
function mk(H,K,A,lean,s,v,wall){
  const T=torso(H,lean);
  let an,af;
  if(v==='stroom'){
    const a=Math.PI-lean+.07;
    an={...armFK(T.S,a,0),h:'flat'};af={...armFK(T.S,a-.02,0),h:'flat'};
  }else{
    const a=Math.PI/2+.02;
    an={...armFK(T.S,a,.04),h:'flat'};af={...armFK(T.S,a+.01,.04),h:'flat'};
  }
  return {H,lean,tilt:lean*.45,ln:{K,A,fa:0},lf:{K,A,fa:0},an,af,s,wall,v};
}
function frontPose(q){
  const s=q.s,aw=34,kw=36+9*s;
  const legs=[-1,1].map(sd=>({K:P(sd*kw,q.ln.K.y),A:P(sd*aw,-10),out:0}));
  return {hx:0,hy:q.H.y,lean:Math.max(0,q.lean),legs,arms:q.v==='stroom'?'up':'forward'};
}
function pose(t){
  if(mode==='iso'){const b=Math.sin(t*Math.PI*2/4);return wallSit(b,variant);}
  return squatSide(depth(t),variant);
}
const cycle=()=>mode==='iso'?8:3.6;

function bandSide(q,col,far){
  const H=q.H,K=q.ln.K,o=far?FAR_OFF:P(0,0);
  const a=add(H,o),k=add(K,o),dx=k.x-a.x,dy=k.y-a.y,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
  const c=P(a.x+dx*.86,a.y+dy*.86),nx=uy,ny=-ux;
  ctx.strokeStyle=far?col.bandfar:col.band;ctx.lineWidth=far?5:6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(c.x+nx*19,c.y+ny*19);ctx.lineTo(c.x-nx*19,c.y-ny*19);ctx.stroke();
}
function render(q,t){
  const c=cv.width/VW;ctx.setTransform(c,0,0,c,0,0);
  const col=colors();
  ctx.fillStyle=col.stage;ctx.fillRect(0,0,VW,VH);
  const glow=mode==='iso'?.78+.22*(.5+.5*Math.sin(t*Math.PI)):.35+.65*q.s;
  /* front view */
  const f=frontPose(q);
  view(160,GY,.6,420,()=>{
    frontFigure(f,col,{legMus:ff=>{
      ctx.fillStyle=col.mus;ctx.globalAlpha=glow;
      ff.legs.forEach((L,i)=>{const sd=i?1:-1,a=P(ff.hx+sd*38,ff.hy-4),b=P(lerp(a.x,L.K.x,.85),lerp(a.y,L.K.y,.85)-4);
        if(Math.hypot(b.x-a.x,b.y-a.y)>6)capsule(a,12,b,9);});
      if(q.v==='band'){
        ctx.globalAlpha=1;const y=lerp(ff.hy,ff.legs[0].K.y,.82);const xl=lerp(ff.hx-24,ff.legs[0].K.x,.82)-16,xr=lerp(ff.hx+24,ff.legs[1].K.x,.82)+16;
        const span=xr-xl;ctx.strokeStyle=col.band;ctx.lineCap='round';ctx.lineWidth=Math.max(4,8-span/40);
        ctx.beginPath();ctx.moveTo(xl,y);ctx.quadraticCurveTo((xl+xr)/2,y+4-span/60,xr,y);ctx.stroke();
      }
    }});
  });
  label('VOORAANZICHT',160,GY+24);
  /* side view */
  view(440,GY,.6,430,()=>{
    if(q.wall!=null&&mode==='iso')wallRect(q.wall-24,-760,24);
    sideFigure(q,col,{
      farMus:()=>{if(q.v==='band')bandSide(q,col,true);},
      mus:(q,T)=>{
        ctx.fillStyle=col.mus;ctx.globalAlpha=glow;
        strip(q.H,q.ln.K,.22,.86,1,12,8,12,8);
        ctx.globalAlpha=glow*.55;
        const g=add(q.H,T.n,-21);ell(g.x,g.y+4,15,18,q.lean);
        ctx.globalAlpha=1;
        if(q.v==='band')bandSide(q,col,false);
      }
    });
  });
  label('ZIJAANZICHT',440,GY+24);
}
bindUI('squat-state');
run(cycle,pose,render);

<\/script>

</body></html>
</script>
<script type="text/plain" data-ex="horse">
<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Horse stance squat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one stage card with the animation, mode + variation buttons and playback controls, then a muscle legend */
:root{
  --bg:#EDF0EE; --stage:#F8FAF9; --ink:#1E2426; --muted:#5E686A; --body:#2A3134; --far:#7C8689;
  --muscle:#E0452B; --mat:#D6DCD9; --line:#D3D9D6; --band:#2C8C7E; --bandfar:#8CC2B9; --post:#B9C1BE;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --text:"Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121617; --stage:#1A1F20; --ink:#E8ECEA; --muted:#98A3A0; --body:#D9E0DD; --far:#7F8A87;
  --muscle:#FF5B3E; --mat:#2A3133; --line:#2C3335; --band:#4DBDAC; --bandfar:#2F6E66; --post:#3A4345; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121617; --stage:#1A1F20; --ink:#E8ECEA; --muted:#98A3A0; --body:#D9E0DD; --far:#7F8A87;
  --muscle:#FF5B3E; --mat:#2A3133; --line:#2C3335; --band:#4DBDAC; --bandfar:#2F6E66; --post:#3A4345; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
main{max-width:860px;margin:0 auto;display:grid;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,7vw,52px);line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;height:auto;margin:0 auto}
.bar{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:12px 16px;border-top:1px solid var(--line)}
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button[aria-pressed="true"]{background:var(--ink);color:var(--stage);border-color:var(--ink)}
.opt{font-family:var(--display);font-weight:500;font-size:18px;letter-spacing:.03em;padding:4px 12px}
.seg.main .opt{font-weight:700;text-transform:uppercase;letter-spacing:.05em}
button:focus-visible{outline:2px solid var(--muscle);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:15px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muscle)}
.dot.soft{opacity:.55}

</style>

<main>
  <header>
    <h1>Horse stance squat</h1>
    <p class="sub">Breed staand · bovenbenen, bilspieren en binnenkant dijen</p>
  </header>

  <section class="stage">
    <canvas id="c" width="1200" height="788" aria-label="Animatie van een horse stance squat, van voren en van opzij"></canvas>
    <div class="bar">
      <div class="opts">
        <div class="seg main" data-g="mode" role="group" aria-label="Uitvoering">
          <button class="opt" data-v="iso" aria-pressed="true">Isometrisch</button>
          <button class="opt" data-v="dyn" aria-pressed="false">Dynamisch</button>
        </div>
        <div class="seg" data-g="v" role="group" aria-label="Variatie">
          <button class="opt" data-v="front" aria-pressed="true">Armen voor</button>
          <button class="opt" data-v="fists" aria-pressed="false">Vuisten in de zij</button>
        </div>
      </div>
      <div class="seg">
        <button id="play" aria-pressed="false">Pauze</button>
        <button id="slow" aria-pressed="false">Langzaam</button>
      </div>
    </div>
  </section>

  <div class="legend">
    <span><i class="dot"></i>Quadriceps (primair)</span>
    <span><i class="dot soft"></i>Bilspieren en adductoren (secundair)</span>
  </div>
</main>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let playing=true,slow=false,phaseT=0,last=performance.now();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
const ease=t=>.5-.5*Math.cos(Math.PI*t);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const P=(x,y)=>({x,y});
const DEG=Math.PI/180;

function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();ctx.fill();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
/* two-bone IK: returns the joint; pick(a,b) chooses between the two solutions */
function ik(S,T,l1,l2,pick){
  const dx=T.x-S.x,dy=T.y-S.y,d=Math.max(1,Math.min(Math.hypot(dx,dy),l1+l2-.5));
  const base=Math.atan2(dy,dx),off=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));
  const a=P(S.x+l1*Math.cos(base+off),S.y+l1*Math.sin(base+off));
  const b=P(S.x+l1*Math.cos(base-off),S.y+l1*Math.sin(base-off));
  return pick(a,b);
}
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
/* draw everything an outline function draws as a stroke in the stage colour (gap where a limb crosses the body) */
function outlined(fn){
  const f0=ctx.fill;ctx.save();ctx.strokeStyle=tok('--stage');ctx.lineWidth=5;ctx.lineJoin='round';
  ctx.fill=function(){ctx.stroke();};fn();ctx.fill=f0;ctx.restore();fn();
}
const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];

/* UI: Isometrisch / Dynamisch + variation groups */
const ui={mode:'dyn'};
function bindSeg(g,cb){
  const bs=[...document.querySelectorAll('.seg[data-g="'+g+'"] button')];
  const sel=v=>{bs.forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===v)));ui[g]=v;phaseT=0;cb&&cb(v);legend();};
  bs.forEach(b=>b.onclick=()=>sel(b.dataset.v));
  const on=bs.find(b=>b.getAttribute('aria-pressed')==='true')||bs[0];ui[g]=on.dataset.v;
  return sel;
}
function legend(){
  document.querySelectorAll('.legend [data-when]').forEach(el=>{
    const [g,vals]=el.dataset.when.split(':');el.hidden=!vals.split(',').includes(ui[g]);
  });
}
function startLoop(period,render){
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(playing&&!reduce){phaseT+=dt*(slow?.5:1);}
    const ph=window.__ph!=null?window.__ph:(reduce?null:phaseT%period(ui));
    render(ph,ui);
    requestAnimationFrame(frame);
  }
  document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
  document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
  legend();
  requestAnimationFrame(frame);
}
/* isometric hold: light breathing between .97 and 1 */
const breath=ph=>ph==null?0:.5+.5*Math.sin(ph*Math.PI*2/4);

const VX=120,VY=40,VW=640,VH=460;

function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-4,W.y-8);
  ctx.quadraticCurveTo(W.x+14,W.y-10,W.x+28,W.y-3);
  ctx.quadraticCurveTo(W.x+40,W.y+1,W.x+40,W.y+5);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+16,W.y+8);
  ctx.lineTo(W.x-6,W.y+8);
  ctx.closePath();ctx.fill();
}
/* 3D legs: x sideways, y up (negative), z forward. q = squat depth 0 (standing) .. 1 (deep horse stance) */
const V3=(x,y,z)=>({x,y,z}),sub3=(a,b)=>V3(a.x-b.x,a.y-b.y,a.z-b.z),len3=a=>Math.hypot(a.x,a.y,a.z);
const FOOT_X=108,FOOT_Z=52,ANK_Y=-12;
function body(q){
  const hy=lerp(-278,-160,q),hz=lerp(48,-58,q),lean=lerp(.05,.5,q);
  const legs=[-1,1].map(s=>{
    const H=V3(s*24,hy,hz),A=V3(s*FOOT_X,ANK_Y,FOOT_Z);
    const d=sub3(A,H),L=Math.min(len3(d),279.5),u=V3(d.x/len3(d),d.y/len3(d),d.z/len3(d));
    const a=(148*148-132*132+L*L)/(2*L),h=Math.sqrt(Math.max(0,148*148-a*a));
    /* knee bends forward and out, over the toes */
    let b=V3(s*.6,0,1);const dp=b.x*u.x+b.y*u.y+b.z*u.z;b=V3(b.x-dp*u.x,b.y-dp*u.y,b.z-dp*u.z);const bl=len3(b);b=V3(b.x/bl,b.y/bl,b.z/bl);
    const K=V3(H.x+u.x*a+b.x*h,H.y+u.y*a+b.y*h,H.z+u.z*a+b.z*h);
    return {H,K,A};
  });
  return {hy,hz,lean,legs};
}
function frontView(B,glow,c,v){
  const y=B.hy+160,ts=Math.cos(B.lean)*.98;
  for(const [i,s] of [[0,-1],[1,1]]){
    const L=B.legs[i],Hp=P(L.H.x,L.H.y),K=P(L.K.x,L.K.y),A=P(L.A.x,L.A.y);
    ctx.fillStyle=c.body;F=s<0?1:-1;
    limb(Hp,K,24,15,[[5,.45,.28]],[[4,.4,.3]]);dot(K,14.5);
    limb(K,A,14.5,9,[[3,.28,.18]],[[3,.28,.18]]);
    ctx.beginPath();ctx.ellipse(s*(FOOT_X+3),-8,13,10,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(s*(FOOT_X+4),-5,16,6,0,0,Math.PI*2);ctx.fill();
    ctx.save();ctx.fillStyle=c.mus;ctx.globalAlpha=glow;
    capsule(P(lerp(Hp.x,K.x,.2),lerp(Hp.y,K.y,.2)-4),12,P(lerp(Hp.x,K.x,.85),lerp(Hp.y,K.y,.85)-4),8);
    ctx.globalAlpha=glow*.55;capsule(P(lerp(Hp.x,K.x,.15)-s*6,lerp(Hp.y,K.y,.15)+12),8,P(lerp(Hp.x,K.x,.6)-s*4,lerp(Hp.y,K.y,.6)+12),6);
    ctx.restore();
  }
  F=-1;
  ctx.fillStyle=c.body;
  ctx.save();ctx.translate(0,-170+y);ctx.scale(1,ts);ctx.translate(0,170-y);
  ctx.beginPath();ctx.moveTo(-15,-314+y);
  ctx.quadraticCurveTo(-28,-306+y,-44,-300+y);
  ctx.quadraticCurveTo(-54,-280+y,-49,-258+y);
  ctx.quadraticCurveTo(-42,-232+y,-37,-208+y);
  ctx.quadraticCurveTo(-46,-190+y,-45,-172+y);
  ctx.lineTo(45,-172+y);
  ctx.quadraticCurveTo(46,-190+y,37,-208+y);
  ctx.quadraticCurveTo(42,-232+y,49,-258+y);
  ctx.quadraticCurveTo(54,-280+y,44,-300+y);
  ctx.quadraticCurveTo(28,-306+y,15,-314+y);
  ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.ellipse(0,-170+y,46,15,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  const sy=-170+y-(170-(-300+y)+(-170+y))*0+(-300+y+170-y)*ts;
  const top=-170+y+(-300-(-170))*ts;
  capsule(P(0,top-2),13,P(0,top-18),11);
  ctx.beginPath();ctx.ellipse(0,top-44,25,29,0,0,Math.PI*2);ctx.fill();
  for(const s of [-1,1]){
    if(v==='front'){
      ctx.save();ctx.translate(0,top+10);
      dot(P(s*50,0),16);
      ctx.beginPath();ctx.moveTo(s*36,-2);ctx.lineTo(s*64,-2);ctx.lineTo(s*56,24);ctx.lineTo(s*38,24);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.ellipse(s*46,26,13,12,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=c.stage;ctx.lineWidth=2;ctx.stroke();
      ctx.restore();
    }else{
      /* elbows bent back, fists chambered at the waist (forearm points towards the viewer) */
      const Sh=P(s*50,top+10),El=P(s*62,top+10+96*ts),Fs=P(s*50,top+10+108*ts);
      outlined(()=>{dot(Sh,16);capsule(Sh,16,El,11);dot(El,11);capsule(El,11,Fs,9);ctx.beginPath();ctx.ellipse(Fs.x,Fs.y+2,11,9.5,0,0,Math.PI*2);ctx.fill();});
    }
  }
}
function sideView(B,glow,c,v){
  F=-1;
  const lean=B.lean,ux=Math.sin(lean),uy=-Math.cos(lean);
  const L=B.legs[1],Lf=B.legs[0];
  const H=P(L.H.z,L.H.y),S=P(H.x+ux*155,H.y+uy*155);
  const legs=(LL,dx,dy)=>{
    const h=P(LL.H.z+dx,LL.H.y+dy),k=P(LL.K.z+dx,LL.K.y+dy),a=P(LL.A.z+dx,LL.A.y);
    limb(h,k,24,15,THIGH_F,THIGH_B);dot(k,14.5);
    limb(k,a,14.5,9,SHIN_F,SHIN_B);
    capsule(P(a.x-8,a.y+3),9,P(a.x+34,a.y+6),6);
  };
  const arm=(dx,dy)=>{
    const s0=P(S.x-4+dx,S.y+dy);
    if(v==='front'){
      const e=P(s0.x+104,s0.y+8),f=P(e.x+81,e.y+4);
      limb(s0,e,16,11,UA_F,UA_B);dot(e,11);
      limb(e,f,11.5,7,FA_F,FA_B);hand(f);
    }else{
      const e=P(s0.x-44+ux*0,s0.y+94),f=P(e.x+77,e.y-24);
      limb(s0,e,16,11,UA_F,UA_B);dot(e,11);
      limb(e,f,11.5,6.5,FA_F,FA_B);fist(f,e);
    }
  };
  ctx.fillStyle=c.far;legs(Lf,-10,-3);arm(-10,-3);
  ctx.fillStyle=c.body;
  limb(S,H,27,24,T_FRONT,T_BACK);
  dot(H,27);ctx.beginPath();ctx.ellipse(H.x-Math.cos(lean)*15,H.y+Math.sin(lean)*-15*0+2,23,31,lean,0,Math.PI*2);ctx.fill();
  legs(L,0,0);
  ctx.save();ctx.fillStyle=c.mus;ctx.globalAlpha=glow;
  const k=P(L.K.z,L.K.y),tx=k.x-H.x,ty=k.y-H.y,tl=Math.hypot(tx,ty),ox=ty/tl,oy=-tx/tl;
  capsule(P(H.x+tx*.22+ox*12,H.y+ty*.22+oy*12),12,P(H.x+tx*.85+ox*8,H.y+ty*.85+oy*8),8);
  ctx.globalAlpha=glow*.55;
  ctx.beginPath();ctx.ellipse(H.x-Math.cos(lean)*20,H.y+4,15,20,lean,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.fillStyle=c.body;
  capsule(P(S.x+ux*14,S.y+uy*14),12,P(S.x+ux*30+2,S.y+uy*30),11);
  ctx.beginPath();ctx.ellipse(S.x+ux*56+5,S.y+uy*56,25,29,lean*.5,0,Math.PI*2);ctx.fill();
  if(v==='front')arm(0,0);else outlined(()=>arm(0,0));
  dot(P(S.x-2,S.y-2),21);
}
function draw(ph,u){
  const k=cv.width/VW;
  ctx.setTransform(k,0,0,k,-VX*k,-VY*k);
  const c={stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),muted:tok('--muted')};
  ctx.fillStyle=c.stage;ctx.fillRect(VX,VY,VW,VH);
  let q=1,glow=.85;
  if(ph!=null){
    if(u.mode==='iso'){q=.985+.015*Math.sin(ph*Math.PI*2/4);glow=.75+.25*(.5+.5*Math.sin(ph*Math.PI));}
    else{const x=ph%3.4;q=x<1.4?ease(x/1.4):x<1.8?1:x<3.2?1-ease((x-1.8)/1.4):0;glow=.35+.65*q;}
  }
  const B=body(q);
  const views=[[VX+170,frontView,'VOORAANZICHT'],[VX+418,sideView,'ZIJAANZICHT']];
  for(const [cx,fn,label] of views){
    ctx.save();ctx.translate(cx,VY+414);ctx.scale(.74,.74);
    ctx.fillStyle=c.mat;ctx.beginPath();ctx.roundRect(-180,0,360,10,5);ctx.fill();
    fn(B,glow,c,u.v);
    ctx.restore();
    ctx.fillStyle=c.muted;ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign='center';
    ctx.fillText(label,cx,VY+446);
  }
}
bindSeg('mode');bindSeg('v');
startLoop(u=>u.mode==='iso'?4:3.4,draw);
<\/script>

</body></html>
</script>

<title>Squat jump</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>

.stage{background:var(--stage);border:1px solid var(--line);border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;height:auto}
.bar{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;border-top:1px solid var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button[aria-pressed="true"]{background:var(--ink);color:var(--stage);border-color:var(--ink)}
.mode{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.03em;text-transform:uppercase;padding:4px 12px}
button:focus-visible{outline:2px solid var(--muscle);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:15px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muscle);flex:none}
.dot.soft{opacity:.55}
</style>

<main>
  <header>
    <h1>Squat jump</h1>
    <p class="sub">Explosieve beenkracht · bovenbenen, bilspieren en kuiten</p>
  </header>

  <section class="stage">
    <canvas id="c" width="1200" height="1000" aria-label="Animatie van een squat jump, van opzij"></canvas>
    <div class="bar">
      <div class="seg" role="group" aria-label="Variatie">
        <button data-var="zwaai" aria-pressed="true">Armen zwaaien</button>
        <button data-var="stroom" aria-pressed="false">Streamline jump</button>
        <button data-var="tuck" aria-pressed="false">Tuck jump</button>
      </div>
      <div class="seg">
        <button id="play" aria-pressed="false">Pauze</button>
        <button id="slow" aria-pressed="false">Langzaam</button>
      </div>
    </div>
  </section>

  <div class="legend">
    <span><i class="dot "></i>Quadriceps en bilspieren (primair)</span>
    <span><i class="dot soft"></i>Kuitspieren (secundair)</span>
  </div>
</main>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let playing=true,slow=false,phaseT=0,last=performance.now();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

/* paint: fill normally, stroke when drawing the background-coloured edge of an overlapping limb */
let OUT=false;
const paint=()=>{OUT?ctx.stroke():ctx.fill()};
function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();paint();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();paint();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);paint();};
const ell=(x,y,rx,ry,rot)=>{ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);paint();};
const P=(x,y)=>({x,y});
const add=(a,b,k=1)=>P(a.x+b.x*k,a.y+b.y*k);
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>.5-.5*Math.cos(Math.PI*Math.max(0,Math.min(1,t)));
const rot=(v,a)=>P(v.x*Math.cos(a)-v.y*Math.sin(a),v.x*Math.sin(a)+v.y*Math.cos(a));
/* angle measured from straight down, positive toward the front (+x): 0 hangs, PI/2 forward, PI overhead */
const dirA=a=>P(Math.sin(a),Math.cos(a));

/* shared body standard: torso 155, thigh 148, shin 132, upper arm 104, forearm 81 */
const L_T=155,L_TH=148,L_SH=132,L_UA=104,L_FA=81;
const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];

/* two-bone IK; dir +1 bends toward the front side of a->b (knee), -1 toward the back (elbow) */
function ik(a,b,l1,l2,dir){
  const dx=b.x-a.x,dy=b.y-a.y;let d=Math.hypot(dx,dy)||1;
  const ux=dx/d,uy=dy/d;d=Math.max(Math.abs(l1-l2)+.01,Math.min(d,l1+l2-.01));
  const base=Math.atan2(uy,ux),off=Math.acos(Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d))));
  const c1=P(a.x+l1*Math.cos(base+off),a.y+l1*Math.sin(base+off)),c2=P(a.x+l1*Math.cos(base-off),a.y+l1*Math.sin(base-off));
  const nx=uy,ny=-ux,s1=(c1.x-a.x)*nx+(c1.y-a.y)*ny;
  return (s1*dir>0)?c1:c2;
}
function armFK(S,a,b){const E=add(S,dirA(a),L_UA),W=add(E,dirA(a+b),L_FA);return {E,W};}
/* torso frame from hip + lean (0 upright, + forward) */
function torso(H,lean){const u=P(Math.sin(lean),-Math.cos(lean)),n=P(Math.cos(lean),Math.sin(lean));return {u,n,S:add(H,u,L_T)};}

/* hands */
function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-4,W.y-9);
  ctx.quadraticCurveTo(W.x+14,W.y-10,W.x+28,W.y-3);
  ctx.quadraticCurveTo(W.x+40,W.y+1,W.x+40,W.y+5);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+16,W.y+8);
  ctx.lineTo(W.x-6,W.y+8);
  ctx.closePath();paint();
}
/* the same flat hand turned with the forearm (fingers continue the forearm line) */
function handAlong(W,E,flip){
  const a=Math.atan2(W.y-E.y,W.x-E.x);
  ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);if(flip)ctx.scale(1,-1);hand(P(0,0));ctx.restore();
}
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);paint();ctx.restore();}
const fistC=(W,E)=>{const d=Math.hypot(W.x-E.x,W.y-E.y)||1;return P(W.x+(W.x-E.x)/d*9,W.y+(W.y-E.y)/d*9);};

/* foot: heel to toe capsule, fa = plantar flexion (heel up, + clockwise) */
function foot(A,fa,air){
  if(air||fa<.08){capsule(add(A,rot(P(-6,2),fa)),10,add(A,rot(P(38,6),fa)),6);return;}
  /* on the toes: heel-to-ball part tilts, the toes stay flat on the ground */
  const ball=add(A,rot(P(30,6),fa));
  capsule(add(A,rot(P(-6,2),fa)),10,ball,6.5);
  capsule(ball,6.5,P(ball.x+11,ball.y+.5),5.5);
}

/* muscle strip along a limb a->b; side +1 front, -1 back */
function strip(a,b,t0,t1,side,o0,o1,r0,r1){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,nx=dy/L,ny=-dx/L;
  capsule(P(a.x+dx*t0+nx*side*o0,a.y+dy*t0+ny*side*o0),r0,P(a.x+dx*t1+nx*side*o1,a.y+dy*t1+ny*side*o1),r1);
}

/* recursive blend of two poses (numbers mix, everything else from the target) */
function mixPose(a,b,t){
  if(typeof b==='number'&&typeof a==='number')return a+(b-a)*t;
  if(b&&typeof b==='object'&&a&&typeof a==='object'&&!Array.isArray(b)){const o={};for(const k in b)o[k]=(k in a)?mixPose(a[k],b[k],t):b[k];return o;}
  if(Array.isArray(b)&&Array.isArray(a)&&a.length===b.length)return b.map((v,i)=>mixPose(a[i],v,t));
  return b;
}

/*
 Side view figure, facing +x, ground at y=0.
 q = {H, lean, tilt, ln:{K,A,fa}, lf:{K,A,fa,lift}, an:{E,W,h}, af:{E,W,h}}
 h = 'flat' | 'fist' | 'none'
*/
const FAR_OFF=P(-11,-3);
function legPaint(H,L,off,offA){
  const h=add(H,off),k=add(L.K,off),a=add(L.A,offA);
  limb(h,k,24,15,THIGH_F,THIGH_B);dot(k,14.5);
  limb(k,a,14.5,9,SHIN_F,SHIN_B);
  foot(a,L.fa||0,L.lift);
}
function armPaint(S,A,off){
  const s=add(S,off),e=add(A.E,off),w=add(A.W,off);
  limb(s,e,16,11,UA_F,UA_B);dot(e,11);
  limb(e,w,11.5,6.5,FA_F,FA_B);
  if(A.h==='fist')fist(w,e);
  else if(A.h==='flatR')handAlong(w,e,true);
  else if(A.h!=='none')handAlong(w,e,false);
}
function headPaint(q,T){
  const tilt=q.tilt||0,uh=P(Math.sin(q.lean-tilt),-Math.cos(q.lean-tilt)),nh=P(Math.cos(q.lean-tilt),Math.sin(q.lean-tilt));
  const nb=add(T.S,T.u,14);
  capsule(nb,12,add(nb,uh,16),11);
  const c=add(add(nb,uh,42),nh,5);
  ell(c.x,c.y,25,29,q.lean-tilt);
}
function sideFigure(q,col,hooks){
  hooks=hooks||{};F=-1;
  const T=torso(q.H,q.lean);q.S=T.S;q.u=T.u;q.n=T.n;
  const offA=P(FAR_OFF.x,q.lf.lift?FAR_OFF.y:0);
  ctx.fillStyle=col.far;
  if(q.af)armPaint(T.S,q.af,P(-12,-4));
  legPaint(q.H,q.lf,FAR_OFF,offA);
  if(hooks.farMus)hooks.farMus(q,T);
  ctx.fillStyle=col.body;
  limb(T.S,q.H,27,24,T_FRONT,T_BACK);
  dot(q.H,27);
  const b=add(q.H,T.n,-15);ell(b.x,b.y,23,31,q.lean);
  legPaint(q.H,q.ln,P(0,0),P(0,0));
  if(hooks.mus){ctx.save();hooks.mus(q,T);ctx.restore();ctx.fillStyle=col.body;}
  headPaint(q,T);
  if(hooks.beforeArm)hooks.beforeArm(q,T);
  ctx.fillStyle=col.body;
  if(q.an){
    OUT=true;ctx.strokeStyle=col.stage;ctx.lineWidth=5;ctx.lineJoin='round';armPaint(T.S,q.an,P(0,0));OUT=false;
    armPaint(T.S,q.an,P(0,0));
  }
  dot(add(T.S,P(1,-2)),21);
  if(hooks.after)hooks.after(q,T);
}
/* standing leg from hip and ankle */
const legIK=(H,A,fa,lift)=>({K:ik(H,A,L_TH,L_SH,1),A,fa:fa||0,lift:!!lift});
const ANK=-12;

/*
 Front view figure (camera in front), ground y=0, hip centre at (hx,hy).
 f = {hx,hy,lean,sh (shoulder tilt), legs:[{K,A},{K,A}] for s=-1,+1, arms:'forward'|'up'|'hips'}
*/
function frontFigure(f,col,hooks){
  hooks=hooks||{};
  const body=col.body,edge=col.stage;
  const sy=.12+.88*Math.cos(f.lean);
  ctx.fillStyle=body;
  const thighShort=Math.abs(f.legs[0].K.y-f.hy)<75;
  const legs=()=>{ctx.fillStyle=body;[-1,1].forEach((s,i)=>{
    const L=f.legs[i],Hp=P(f.hx+s*24,f.hy);
    limb(Hp,L.K,24,16,[[5,.45,.28]],[[4,.4,.3]]);dot(L.K,15);
    limb(L.K,L.A,15,9,[[3,.28,.18]],[[3,.28,.18]]);
    const fx=L.A.x+s*(L.out||0);
    ell(fx,L.A.y+2,13,10,0);ell(fx+s*(L.out?3:1),L.A.y+5,16,6,s*(L.out?.25:0));
  });
  if(hooks.legMus){ctx.save();hooks.legMus(f);ctx.restore();ctx.fillStyle=body;}};
  if(!thighShort)legs();
  ctx.save();ctx.translate(f.hx,f.hy);ctx.scale(1,sy);
  const y=0;
  const path=()=>{ctx.beginPath();ctx.moveTo(-15,-144);
    ctx.quadraticCurveTo(-28,-136,-44,-130);ctx.quadraticCurveTo(-54,-110,-49,-88);
    ctx.quadraticCurveTo(-42,-62,-37,-38);ctx.quadraticCurveTo(-46,-20,-45,-2);
    ctx.lineTo(45,-2);ctx.quadraticCurveTo(46,-20,37,-38);ctx.quadraticCurveTo(42,-62,49,-88);
    ctx.quadraticCurveTo(54,-110,44,-130);ctx.quadraticCurveTo(28,-136,15,-144);ctx.closePath();};
  path();ctx.fill();
  ell(0,0,46,15,0);
  capsule(P(0,-132),13,P(0,-148),11);
  ctx.restore();
  /* head stays round (not squashed by lean) */
  const hy=f.hy-148*sy-28;
  ell(f.hx,hy,24,30,0);
  const Sy=f.hy-120*sy;
  [-1,1].forEach(s=>{
    const S=P(f.hx+s*50,Sy);
    if(f.arms==='forward'){
      dot(S,16);
      ctx.beginPath();ctx.moveTo(S.x-s*14,S.y-2);ctx.lineTo(S.x+s*14,S.y-2);ctx.lineTo(S.x+s*6,S.y+24);ctx.lineTo(S.x-s*12,S.y+24);ctx.closePath();ctx.fill();
      ell(S.x-s*4,S.y+26,13,12,0);
      ctx.strokeStyle=edge;ctx.lineWidth=2;ctx.stroke();
    }else if(f.arms==='up'){
      const W=P(f.hx+s*9,Sy-178*(.25+.75*Math.cos(f.lean))),E=P(S.x+(W.x-S.x)*.56-s*3,S.y+(W.y-S.y)*.56);
      ctx.save();OUT=true;ctx.strokeStyle=edge;ctx.lineWidth=4;
      capsule(S,16,E,11);capsule(E,11,W,7);OUT=false;ctx.restore();
      capsule(S,16,E,11);dot(E,11);capsule(E,11,W,7);
      ell(W.x-s*3,W.y-16,9,19,s*.08);
      dot(S,18);
    }else{
      dot(S,16);
      const E=P(f.hx+s*70,Sy+52),W=P(f.hx+s*40,f.hy-12);
      capsule(S,15,E,11);dot(E,11);capsule(E,11,W,7);ell(W.x+s*2,W.y+4,10,12,0);
    }
  });
  if(thighShort){
    /* thighs come toward the camera: knees in front of the pelvis, with a thin edge */
    ctx.save();OUT=true;ctx.strokeStyle=edge;ctx.lineWidth=4;
    [-1,1].forEach((s,i)=>{const L=f.legs[i];dot(L.K,16);capsule(P(f.hx+s*24,f.hy),24,L.K,16);});
    OUT=false;ctx.restore();legs();
  }
  if(hooks.after)hooks.after(f);
}

function label(txt,x,y,align){
  ctx.fillStyle=tok('--muted');ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign=align||'center';
  ctx.fillText(txt,x,y);
}
function colors(){return {body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),stage:tok('--stage'),post:tok('--post'),band:tok('--band'),bandfar:tok('--bandfar')};}
/* view: translate to ground point, scale; draw mat */
function view(cx,gy,sc,matW,fn,matX){
  ctx.save();ctx.translate(cx,gy);ctx.scale(sc,sc);
  ctx.fillStyle=tok('--mat');ctx.beginPath();ctx.roundRect(matX!=null?matX:-matW/2,0,matW,10,5);ctx.fill();
  fn();ctx.restore();
}
function wallRect(x0,top,w){ctx.fillStyle=tok('--post');ctx.beginPath();ctx.roundRect(x0,top,w,-top,4);ctx.fill();}

/* ui state */
let mode='dyn',variant=null,prevPose=null,blendT=1,curPose=null;
function setGroup(sel,val,attr){document.querySelectorAll(sel).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset[attr]===val)));}
function bindUI(key,onChange){
  const save=()=>{try{localStorage.setItem(key,JSON.stringify({mode,variant}))}catch(e){}};
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(mode!==b.dataset.mode){prevPose=curPose;blendT=0;mode=b.dataset.mode;phaseT=0;}setGroup('[data-mode]',mode,'mode');save();onChange&&onChange();});
  document.querySelectorAll('[data-var]').forEach(b=>b.onclick=()=>{if(variant!==b.dataset.var){prevPose=curPose;blendT=0;variant=b.dataset.var;phaseT=0;}setGroup('[data-var]',variant,'var');save();onChange&&onChange();});
  try{const s=JSON.parse(localStorage.getItem(key)||'null');if(s){if(s.mode&&document.querySelector('[data-mode="'+s.mode+'"]'))mode=s.mode;if(s.variant&&document.querySelector('[data-var="'+s.variant+'"]'))variant=s.variant;}}catch(e){}
  const h=location.hash.slice(1);
  if(h){const [m,v]=h.split('.');if((m==='iso'||m==='dyn')&&document.querySelector('[data-mode="'+m+'"]'))mode=m;if(v&&document.querySelector('[data-var="'+v+'"]'))variant=v;}
  setGroup('[data-mode]',mode,'mode');setGroup('[data-var]',variant,'var');
  document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
  document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
}
/* main loop: page supplies pose(t) for the current mode/variant and render(q,glow) */
function run(cycle,poseFn,render){
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(playing&&!reduce){phaseT+=dt*(slow?.5:1);}
    const C=cycle();
    let t=window.__t!=null?window.__t*C:(reduce?C*.5:phaseT%C);
    let q=poseFn(t);
    if(blendT<1&&prevPose&&!reduce&&window.__t==null){blendT=Math.min(1,blendT+dt*3);q=mixPose(prevPose,q,ease(blendT));}
    curPose=q;
    render(q,t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

const VW=640,VH=533,GY=500,SC=.6;
variant='zwaai';
const BALL=P(30,ANK+6);
const ankleAt=fa=>add(BALL,rot(P(-30,-6),fa));
const LAND=.4,TOE=.6,JUMP=72;
function ground(s,fa){
  const A=ankleAt(fa);
  /* s=1: deep squat, hips below the knees, heels down */
  const phi=.04+.66*s,psi=-.04+1.86*s;
  const K=add(A,P(Math.sin(phi),-Math.cos(phi)),L_SH);
  const H=add(K,P(-Math.sin(psi),-Math.cos(psi)),L_TH);
  return {H,K,A,fa,lean:.06+.72*s};
}
/* one jump: timeline of depth s, toe angle, height, tuck amount and arm swing */
const K_=[ /* t, s, fa, armSwing(zwaai), armTuck */
  [0,0,0,.05,.05],[.3,0,0,.05,.05],[.95,1,0,-.85,-.85],[1.15,0,TOE,2.7,2.4],
  [1.45,0,TOE,2.75,1.25],[1.75,0,TOE,2.2,1.6],[2.15,LAND,0,1.2,1.0],[2.7,0,0,.05,.05],[3,0,0,.05,.05]];
function track(t){
  let i=0;while(i<K_.length-2&&t>K_[i+1][0])i++;
  const a=K_[i],b=K_[i+1],u=ease((t-a[0])/(b[0]-a[0]));
  return a.map((v,j)=>lerp(v,b[j],u));
}
function build(s,fa,hgt,tuck,armA,v,b){
  const g=ground(s,fa);
  let {H,K,A}=g;
  const lean=g.lean;
  if(hgt>0||tuck>0){
    H=P(H.x,H.y-hgt);K=P(K.x,K.y-hgt);A=P(A.x,A.y-hgt);
    if(tuck>0){
      const th=1.5*tuck,kf=2.15*tuck;
      const Kt=add(H,dirA(th),L_TH),At=add(Kt,dirA(th-kf),L_SH);
      K=P(lerp(K.x,Kt.x,tuck),lerp(K.y,Kt.y,tuck));A=P(lerp(A.x,At.x,tuck),lerp(A.y,At.y,tuck));
      K=add(H,P(K.x-H.x,K.y-H.y),L_TH/Math.hypot(K.x-H.x,K.y-H.y));
      A=add(K,P(A.x-K.x,A.y-K.y),L_SH/Math.hypot(A.x-K.x,A.y-K.y));
    }
  }
  H=P(H.x,H.y+(b||0));
  const T=torso(H,lean);
  let an,af;

  const air=hgt>0;
  const leg={K,A,fa:air?Math.max(fa,.9+.5*tuck):fa,lift:air};

function pose(t){
  const [,s,fa,swing,armT]=track(t);

const cycle=()=>3;
mode='dyn';
function render(q,t){
  const c=cv.width/VW;ctx.setTransform(c,0,0,c,0,0);
  const col=colors();
  ctx.fillStyle=col.stage;ctx.fillRect(0,0,VW,VH);
  const eff=Math.min(1,.3+1.1*q.s+(q.fa>.2?.5:0));
  const calf=Math.min(1,.25+q.fa*1.4);
  view(VW/2+20,GY,SC,500,()=>{
    /* shadow on the mat while in the air */
    if(q.hgt>0){ctx.fillStyle=col.far;ctx.globalAlpha=.18*(1-q.hgt/JUMP*.6);ctx.beginPath();ctx.ellipse(10,4,70-q.hgt*.3,5,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}

      mus:(q,T)=>{
        ctx.fillStyle=col.mus;
        ctx.globalAlpha=eff;strip(q.H,q.ln.K,.22,.86,1,12,8,12,8);
        const g=add(q.H,T.n,-21);ell(g.x,g.y+4,15,18,q.lean);
        ctx.globalAlpha=calf*.6;strip(q.ln.K,q.ln.A,.1,.45,-1,12,8,9,6.5);
      }
    });
  });
  label('ZIJAANZICHT',VW/2+20,GY+24);
}
bindUI('jump-state');
run(cycle,pose,render);

<\/script>

<script>
/* ===== Gedeelde helpers (zelfde maten en spierprofielen als Plank hold / Bird dog) ===== */
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));

  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);

}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
function curveLimb(a,c,b,rA,rB,front,back){
  const N=36,prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,cc,w]of bs)r+=m*Math.exp(-(((t-cc)/w)**2));return r};
  const pt=t=>P((1-t)*(1-t)*a.x+2*(1-t)*t*c.x+t*t*b.x,(1-t)*(1-t)*a.y+2*(1-t)*t*c.y+t*t*b.y);
  const tg=t=>{const x=2*(1-t)*(c.x-a.x)+2*t*(b.x-c.x),y=2*(1-t)*(c.y-a.y)+2*t*(b.y-c.y),l=Math.hypot(x,y)||1;return P(x/l,y/l)};
  const L=[],Rr=[];
  for(let i=0;i<=N;i++){const t=i/N,p=pt(t),u=tg(t),nx=-u.y*F,ny=u.x*F,rf=prof(t,front),rb=prof(t,back);
    L.push(P(p.x+nx*rf,p.y+ny*rf));Rr.push(P(p.x-nx*rb,p.y-ny*rb));}
  ctx.beginPath();L.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
  for(let i=N;i>=0;i--)ctx.lineTo(Rr[i].x,Rr[i].y);ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
  return {pt,tg};
}
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
const P=(x,y)=>({x,y});
const ell=(c,rx,ry,a)=>{ctx.beginPath();ctx.ellipse(c.x,c.y,rx,ry,a||0,0,Math.PI*2);ctx.fill();};

function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-4,W.y-9);
  ctx.quadraticCurveTo(W.x+14,W.y-10,W.x+28,W.y-3);
  ctx.quadraticCurveTo(W.x+40,W.y+1,W.x+40,W.y+5);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+16,W.y+8);
  ctx.lineTo(W.x-6,W.y+8);
  ctx.closePath();ctx.fill();
}
/* vlakke hand gedraaid; ang 0 = vingers naar voren plat op de vloer */
function rotHand(W,ang,flip){ctx.save();ctx.translate(W.x,W.y);ctx.rotate(ang);if(flip)ctx.scale(1,-1);hand(P(0,0));ctx.restore();}
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
function edgeHand(W,T){const dx=T.x-W.x,dy=T.y-W.y,L=Math.hypot(dx,dy);if(L<1){dot(W,8);return;}const a=Math.atan2(dy,dx),h=Math.min(1,L/16);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(2+17*h,0,6+15*h,9,0,0,Math.PI*2);ctx.fill();ctx.restore();}

const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];
const L_TORSO=155,L_THIGH=148,L_SHIN=132,L_UA=104,L_FA=81;

const ease=t=>.5-.5*Math.cos(Math.PI*Math.max(0,Math.min(1,t)));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const DEG=Math.PI/180,lerp=(a,b,t)=>a+(b-a)*t;
const add=(a,b)=>P(a.x+b.x,a.y+b.y),sub=(a,b)=>P(a.x-b.x,a.y-b.y),mul=(a,k)=>P(a.x*k,a.y*k);
const len=a=>Math.hypot(a.x,a.y),nrm=a=>{const l=len(a)||1;return P(a.x/l,a.y/l)};
const dirA=a=>P(Math.cos(a),Math.sin(a));
const along=(a,b,t)=>P(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t);
/* 2D-IK: gewricht tussen A en B, aan de kant van richting pref */
function ik(A,B,l1,l2,pref){
  const d0=len(sub(B,A)),d=Math.min(Math.max(d0,Math.abs(l1-l2)+.01),l1+l2-.01);
  const u=nrm(sub(B,A)),n=P(-u.y,u.x),a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  const s=(n.x*pref.x+n.y*pref.y)>=0?1:-1;

}
/* 3D-punten {x,y,z}: x naar voren, y omlaag (scherm), z naar rechts van de persoon (naar de camera) */
const V=(x,y,z)=>({x,y,z:z||0});
const vadd=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z),vsub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z),vmul=(a,k)=>V(a.x*k,a.y*k,a.z*k);
const vdot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,vlen=a=>Math.sqrt(vdot(a,a)),vnrm=a=>vmul(a,1/(vlen(a)||1));
const vlerp=(a,b,t)=>V(lerp(a.x,b.x,t),lerp(a.y,b.y,t),lerp(a.z,b.z,t));
function ik3(A,B,l1,l2,pref){
  const AB=vsub(B,A),d0=vlen(AB),d=Math.min(Math.max(d0,Math.abs(l1-l2)+.01),l1+l2-.01),u=vnrm(AB);
  let n=vsub(pref,vmul(u,vdot(pref,u)));if(vlen(n)<1e-6)n=V(0,-1,0);n=vnrm(n);
  const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  return vadd(vadd(A,vmul(u,a)),vmul(n,h));
}
const sideP=p=>P(p.x,p.y),topP=p=>P(p.x,p.z);

/* ===== Onderdelen van het zijaanzicht (figuur kijkt naar rechts) ===== */
function torso(S,H){limb(S,H,27,24,T_FRONT,T_BACK);}
function bil(S,H){const u=nrm(sub(H,S)),a=Math.atan2(u.y,u.x);ell(P(H.x-u.y*15-u.x*2,H.y+u.x*15-u.y*2),31,23,a);}
function bilSeated(S,H){const u=nrm(sub(H,S)),a=Math.atan2(u.y,u.x);ell(P(H.x-u.y*9+u.x*3,H.y+u.x*9+u.y*3),27,22,a+.25);}
function head(S,hd){
  capsule(P(S.x+hd.x*14,S.y+hd.y*14),12,P(S.x+hd.x*30,S.y+hd.y*30),11);
  ell(P(S.x+hd.x*56,S.y+hd.y*56),29,25,Math.atan2(hd.y,hd.x));
}
function leg(H,K,A,footFn){limb(H,K,24,15,THIGH_F,THIGH_B);dot(K,14.5);limb(K,A,14.5,9,SHIN_F,SHIN_B);if(footFn)footFn(A,K);}
function arm(Sj,E,W,handFn){limb(Sj,E,16,11,UA_F,UA_B);dot(E,11);limb(E,W,11.5,6.5,FA_F,FA_B);if(handFn)handFn(W,E);dot(P(Sj.x+2,Sj.y-2),21);}
/* voeten */
const footStand=(A,rise)=>{rise=rise||0;const T=P(A.x+32,A.y+7),hl=P(A.x-6,A.y+3);
  if(!rise){capsule(hl,9,T,6);return;}const a=-rise,c=Math.cos(a),s=Math.sin(a),rot=p=>P(T.x+(p.x-T.x)*c-(p.y-T.y)*s,T.y+(p.x-T.x)*s+(p.y-T.y)*c);capsule(rot(hl),9,T,6);};
const footFlatBack=A=>capsule(A,9,P(A.x-34,A.y+6),6);
const footTucked=A=>{capsule(P(A.x-6,A.y+2),9,P(A.x+12,A.y+15),6);capsule(P(A.x+12,A.y+15),6,P(A.x+22,A.y+16),4);};
const footDir=(A,ang)=>{const d=dirA(ang);capsule(P(A.x-d.x*4,A.y-d.y*4),9,P(A.x+d.x*34,A.y+d.y*34),6);};
