function label(c,t,x,y,align='center'){ctx.fillStyle=c.muted;ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign=align;ctx.fillText(t,x,y);}
function mat(c,x0,w,y=0,h=10){ctx.fillStyle=c.mat;ctx.beginPath();ctx.roundRect(x0,y,w,h,h/2);ctx.fill();}
const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];
/* vooraanzicht-romp (zoals pass-through/horse stance): schouders op Sy, heup op Hy */
function frontTorso(Sy,Hy){
  const s=(Hy-Sy)/126;
  ctx.save();ctx.translate(0,Hy);ctx.scale(1,s);ctx.translate(0,172);
  ctx.beginPath();ctx.moveTo(-15,-314);
  ctx.quadraticCurveTo(-28,-306,-44,-300);ctx.quadraticCurveTo(-54,-280,-49,-258);
  ctx.quadraticCurveTo(-42,-232,-37,-208);ctx.quadraticCurveTo(-46,-190,-45,-172);
  ctx.lineTo(45,-172);ctx.quadraticCurveTo(46,-190,37,-208);ctx.quadraticCurveTo(42,-232,49,-258);
  ctx.quadraticCurveTo(54,-280,44,-300);ctx.quadraticCurveTo(28,-306,15,-314);
  ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.ellipse(0,-172,48,16,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function frontHead(Sy,dx=0){capsule(P(dx*.5,Sy-12),13,P(dx*.8,Sy-30),11);ctx.beginPath();ctx.ellipse(dx,Sy-56,25,29,0,0,Math.PI*2);ctx.fill();}
/* lichte trilling bij vasthouden, 0..1 */
const trem=T=>.5+.5*Math.sin(T*Math.PI*2*5.3)*Math.sin(T*Math.PI*2*.9+1);
const breath=T=>Math.sin(T*Math.PI*2/4);

/* 90-90 hip rotations: zittend 3D-model (x opzij, y omhoog negatief, z naar voren), voor- en bovenaanzicht.
   u = 0: knieën naar rechts (+x), .5 = beide knieën omhoog, voeten vóór je op de grond, 1: knieën naar links. */
const PAGE={key:'hip9090-state',defMode:'dyn',
  groups:[{id:'v',label:'Armen',opts:[['back','Handen achter'],['free','Handen vrij']]}]};
VX=0;VY=0;VW=640;VH=440;
PAGE.period=st=>st.mode==='iso'?8:6.4;
PAGE.still=st=>st.mode==='iso'?3:0;
const HIP_Y=-30;
/* 90-90-stand (knieën naar rechts): beide dijen 45° schuin naar voren, 90° ten opzichte van elkaar.
   Voorste been (-x): dij schuin linksvoor, scheen dwars naar rechtsvoor, voet vóór het lichaam.
   Achterste been (+x): dij schuin rechtsvoor, scheen schuin rechtsachter. */
const C45=Math.SQRT1_2;
function stance(side){
  const H=V3(side*24,HIP_Y,0);
  const front=side<0,td=front?V3(-C45,.1,C45):V3(C45,.1,C45),sd=front?V3(C45,.06,C45):V3(C45,.06,-C45);
  const K=add3(H,mul3(nrm3(td),148)),A=add3(K,mul3(nrm3(sd),132));A.y=-10;
  const pole=nrm3(sub3(K,lerp3(H,A,.5)));
  const fd=front?V3(.39,.1,.88):V3(.39,.1,-.88);
  return {A,pole,fd};
}
const mxS=o=>({A:V3(-o.A.x,o.A.y,o.A.z),pole:V3(-o.pole.x,o.pole.y,o.pole.z),fd:V3(-o.fd.x,o.fd.y,o.fd.z)});
/* tussenstand: voeten plat op de grond vóór je, knieën omhoog */
const midS=side=>({A:V3(side*118,-10,168),pole:nrm3(V3(side*.25,-1,.15)),fd:V3(side*.15,.1,1)});
function legKey(side,u){
  const R=stance(side),L=mxS(stance(-side)),Mi=midS(side);
  const k=u<.5?ease(u*2):ease(u*2-1),f=u<.5?R:Mi,t=u<.5?Mi:L;
  return {A:lerp3(f.A,t.A,k),pole:nrm3(lerp3(f.pole,t.pole,k)),fd:nrm3(lerp3(f.fd,t.fd,k))};
}
function motionU(st,T){
  if(st.mode==='iso')return 0;
  const x=T%6.4;
  return x<.8?0:x<3.2?(x-.8)/2.4:x<4?1:1-(x-4)/2.4;
}
function pose(st,T){
  const u=motionU(st,T),M={u};
  M.legs=[-1,1].map(s=>{
    const g=legKey(s,u),H=V3(s*24,HIP_Y,0),A=g.A;
    const K=ik3(H,A,148,132,g.pole);K.y=Math.min(K.y,-15);
    const Tt=add3(A,mul3(g.fd,34));Tt.y=Math.min(Tt.y,-6);
    return {H,K,A,T:Tt,s};
  });
  const back=st.v==='back',iso=st.mode==='iso';
  /* isometrisch: romp indraaien naar het voorste been en voorover buigen over de voorste scheen */
  const fold=iso?(T<1.6?ease(T/1.6):T<6.4?1:1-ease((T-6.4)/1.6)):0;
  const yaw=-27*DEG*fold;
  const lean=lerp(back?-9:2,40,fold)*DEG+(iso?.8*DEG*breath(T)*fold:0);
  const tu=V3(Math.sin(lean)*Math.sin(yaw),-Math.cos(lean),Math.sin(lean)*Math.cos(yaw)),rt=V3(Math.cos(yaw),0,-Math.sin(yaw));
  M.H=V3(0,HIP_Y,-6);M.S=add3(M.H,mul3(tu,155));M.tu=tu;M.yaw=yaw;
  M.neck=[add3(M.S,mul3(tu,14)),add3(M.S,mul3(tu,30))];M.head=add3(M.S,mul3(tu,56));
  /* steunhanden op de grond: één vóór de voorste scheen, één aan de binnenkant ervan */
  const HFold={'-1':V3(-125,-8,165),'1':V3(-15,-8,160)};
  M.arms=[-1,1].map(s=>{
    const Sh=add3(add3(M.S,mul3(rt,s*50)),V3(0,2,0));
    let W,pole;
    if(back){W=lerp3(V3(s*66,-10,-84),HFold[s],fold);pole=nrm3(lerp3(V3(s*.3,0,1),V3(s,.3,-.4),fold));}
    else{
      const W0=V3(s*66,Sh.y+96,Sh.z+148),dir=nrm3(V3(Math.sin(yaw)*.75,.66,Math.cos(yaw)*.75));
      W=lerp3(W0,add3(Sh,mul3(dir,180)),fold);pole=nrm3(lerp3(V3(s,.2,-.3),V3(s*.3,1,0),fold));
    }
    const E=ik3(Sh,W,104,81,pole);
    return {Sh,E,W,s,back,flat:back&&fold>.5};
  });
  M.glow=st.mode==='iso'?.8+.15*trem(T):.45+.55*Math.sin(Math.PI*clamp(u,0,1)*1)*1+.0;
  if(st.mode!=='iso')M.glow=.45+.55*Math.abs(Math.sin(Math.PI*u));
  return M;
}
/* tekenlijst met diepte, zodat dichtbije delen over verre delen liggen */
function scene(M,c,pr,depth,top){
  const L=[];
  const seg=(a,b,ra,rb,bump,dd)=>L.push({d:dd!=null?dd:(depth(a)+depth(b))/2,f:()=>{F=-1;limb(pr(a),pr(b),ra,rb,[[bump,.42,.28]],[[bump,.42,.28]]);}});
  for(const g of M.legs){
    seg(g.H,g.K,24,15,4.5);
    L.push({d:depth(g.K)+.1,f:()=>dot(pr(g.K),14.5)});
    seg(g.K,g.A,14.5,9,3);
    L.push({d:depth(g.A)+.05,f:()=>{const a=pr(g.A),t=pr(g.T);capsule(a,9,lerpP(a,t,.75),6.5);capsule(lerpP(a,t,.75),6.5,t,4.5);}});
    L.push({d:(depth(g.H)+depth(g.K))/2+.2,f:()=>{
      ctx.save();ctx.fillStyle=c.mus;ctx.globalAlpha=.55*M.glow;
      const h=pr(g.H),k=pr(g.K);if(dist(h,k)>40)capsule(lerpP(h,k,top?.4:.25),9,lerpP(h,k,.75),6);
      if(top){ctx.globalAlpha=M.glow;capsule(lerpP(h,k,.04),14,lerpP(h,k,.26),11);}
      ctx.restore();}});
  }
  /* romp en heup */
  const torsoD=top?depth(M.S):depth(M.H)+2;
  L.push({d:top?depth(M.H)+5:depth(M.H)-1,f:()=>{
    const h=pr(M.H);
    ctx.beginPath();ctx.ellipse(h.x,h.y+(top?-4:-6),48,top?30:20,0,0,Math.PI*2);ctx.fill();
    if(!top){ctx.save();ctx.fillStyle=c.mus;ctx.globalAlpha=M.glow;
    for(const s of [-1,1]){ctx.beginPath();ctx.ellipse(h.x+s*34,h.y-6,14,15,0,0,Math.PI*2);ctx.fill();}
    ctx.restore();}}});
  for(const a of M.arms){
    const dd=top?Math.min(depth(a.Sh),depth(a.E))-1:(depth(a.Sh)+depth(a.W))/2;
    L.push({d:dd,f:()=>{
      const s0=pr(a.Sh),e=pr(a.E),w=pr(a.W);
      outlined(()=>{F=-1;limb(s0,e,16,11,[[4,.5,.22]],[[4,.5,.22]]);dot(e,11);limb(e,w,11.5,6.5,[[3,.25,.2]],[[3,.25,.2]]);
      if(a.back){
        if(top){const u=unit(e,w);ctx.save();ctx.translate(w.x,w.y);ctx.rotate(Math.atan2(u.y,u.x));ctx.beginPath();ctx.ellipse(13,0,16,10,0,0,Math.PI*2);ctx.fill();ctx.restore();}
        else{ctx.beginPath();ctx.ellipse(w.x+a.s*3,w.y+4,a.flat?11:13,7,0,0,Math.PI*2);ctx.fill();}
      }else{
        if(top)edgeHand(w,P(w.x,w.y+20),8);
        else{ctx.beginPath();ctx.ellipse(w.x,w.y+2,9.5,12,0,0,Math.PI*2);ctx.fill();}
      }});}});
  }
  L.push({d:torsoD,f:()=>{
    if(top){
      const s=pr(M.S),h=pr(M.H);
      const ra=Math.atan2(-Math.sin(M.yaw),Math.cos(M.yaw)),L2=dist(s,h)/2;
      ctx.beginPath();ctx.ellipse((s.x+h.x)/2,(s.y+h.y)/2-2,46,L2+24,ra,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(s.x,s.y,54,24,ra,0,Math.PI*2);ctx.fill();
      for(const a of M.arms)dot(pr(a.Sh),17);
      const hd=pr(M.head);outlined(()=>{ctx.beginPath();ctx.ellipse(hd.x,hd.y,23,26,ra,0,Math.PI*2);ctx.fill();},c.mat);
    }else{
      const Hy=M.H.y-6,k=M.S.x/(M.S.y-Hy);
      ctx.save();ctx.transform(1,0,k,1,-k*Hy,0);frontTorso(M.S.y,Hy);ctx.restore();
      const n0=pr(M.neck[0]),n1=pr(M.neck[1]),hd=pr(M.head);
      capsule(n0,13,n1,11);ctx.beginPath();ctx.ellipse(hd.x,hd.y,25,29,0,0,Math.PI*2);ctx.fill();
      for(const a of M.arms)dot(P(a.Sh.x,a.Sh.y),17);
    }}});
  L.sort((a,b)=>a.d-b.d);
  ctx.fillStyle=c.body;
  for(const it of L){ctx.fillStyle=c.body;it.f();}
}
PAGE.draw=(st,T,c)=>{
  const M=pose(st,T);
  /* vooraanzicht */
  ctx.save();ctx.translate(155,352);ctx.scale(.6,.6);
  mat(c,-250,500);
  scene(M,c,p=>P(p.x,p.y),p=>p.z,false);
  ctx.restore();
  label(c,'VOORAANZICHT',155,400);
  /* bovenaanzicht: voorkant van het figuur naar onder */
  ctx.save();ctx.translate(478,205);ctx.scale(.6,.6);
  ctx.fillStyle=c.mat;ctx.beginPath();ctx.roundRect(-268,-215,536,482,22);ctx.fill();
  scene(M,c,p=>P(p.x,p.z),p=>-p.y,true);
  ctx.restore();
  label(c,'BOVENAANZICHT',478,400);
};


/* ---------- knoppen, toestand en afspeellus ---------- */
(function(){
  const MODES=PAGE.modes===false?[]:[['iso','Isometrisch'],['dyn','Dynamisch']];
  const groups=PAGE.groups;
  const st={mode:PAGE.defMode||'iso'};groups.forEach(g=>st[g.id]=g.def||g.opts[0][0]);
  let playing=true,slow=false,phaseT=0,last=performance.now();
  const bar=document.getElementById('opts');
  const mk=(key,list,cls,aria)=>{if(!list.length)return;const box=document.createElement('div');box.className='seg '+cls;box.setAttribute('role','group');box.setAttribute('aria-label',aria);box.dataset.g=key;
    list.forEach(([id,lab])=>{const b=document.createElement('button');b.type='button';b.id=key+'-'+id;b.textContent=lab;b.dataset.v=id;b.onclick=()=>set(key,id);box.appendChild(b);});bar.appendChild(box);};
  mk('mode',MODES,'modes','Uitvoering');
  groups.forEach(g=>mk(g.id,g.opts,'vars',g.label));
  function sync(){
    bar.querySelectorAll('.seg').forEach(box=>{const k=box.dataset.g;box.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===st[k])));});
    document.querySelectorAll('.legend [data-when]').forEach(el=>{const [g,vals]=el.dataset.when.split(':');el.hidden=!vals.split(',').includes(st[g]);});
    if(PAGE.onChange)PAGE.onChange(st);
  }
  function set(k,v){st[k]=v;phaseT=0;sync();try{localStorage.setItem(PAGE.key,JSON.stringify(st))}catch(e){}}
  try{const s=JSON.parse(localStorage.getItem(PAGE.key)||'null');if(s){if(MODES.some(m=>m[0]===s.mode))st.mode=s.mode;groups.forEach(g=>{if(g.opts.some(o=>o[0]===s[g.id]))st[g.id]=s[g.id];});}}catch(e){}
  sync();
  window.__set=o=>{Object.assign(st,o);sync();};
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(playing&&!reduce)phaseT+=dt*(slow?.5:1);
    const per=PAGE.period(st);if(per)phaseT%=per;
    const T=window.__T!=null?window.__T:(reduce?PAGE.still(st):phaseT);
    const k=cv.width/VW;
    ctx.setTransform(k,0,0,k,-VX*k,-VY*k);
    const c={stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),muted:tok('--muted'),post:tok('--post'),band:tok('--band'),bandfar:tok('--bandfar'),ink:tok('--ink')};
    ctx.fillStyle=c.stage;ctx.fillRect(VX,VY,VW,VH);
    PAGE.draw(st,T,c,dt);
    requestAnimationFrame(frame);
  }
  document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
  document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
  requestAnimationFrame(frame);
})();

<\/script>

<script>
/* ===== Gedeelde helpers (zelfde maten en spierprofielen als Plank hold / Bird dog) ===== */
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();ctx.fill();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);

const SV_A=P(0,FLAT_ANK);

function svPose(v,kn,kf,b){

  const H0=add(SV_A,P(-legV*Math.sin(6*DEG),-legV*Math.cos(6*DEG)));
  const kk=Math.max(kn,kf);
  const H=add(H0,P(5*kk,10*kk+(b||0)));
  const lean=LEAN*DEG+(v?6:3)*DEG*kk;
  const S=shoulderAt(H,lean);

  const Hn=add(H,P(-5*kf,20*kn-10*kf)),Hf=add(H,P(-5*kn,20*kf-10*kn));

  const Kn=kneeOf(Hn,kn),Kf=kneeOf(Hf,kf);
  let Wn,Wf,hand;
  if(v===0){

    Wn=add(shoulderAt(H0,LEAN*DEG),P(8,176));Wf=add(Wn,P(-4,0));hand='along';}
  else if(v===1){Wn=P(14,-46);Wf=P(10,-48);hand='along';}
  else{

  const mid=along(S,H,.5),u=nrm(sub(S,H)),C=add(mid,P(u.y*-10,-u.x*-10));
  return {v,H,S,C,Hn,Hf,Kn,Kf,En,Ef,Wn,Wf,hand,kn,kf,lean};
}

    F=-1;limb(h,k,24,15,THIGH_F,THIGH_B);dot(k,14.5);

    capsule(P(a.x-8,a.y+3),9,P(a.x+34,a.y+6),6);
  };
  ctx.fillStyle=c.far;leg(-10,-3);const farArm=arm(-12,-3);
  /* dumbbell van opzij: de schijf achter de handen */
  if(weight){const fc=fistC(farArm.W,farArm.E);ctx.fillStyle=c.band;dot(P(fc.x+6,fc.y+2),22);ctx.fillStyle=c.stage;dot(P(fc.x+6,fc.y+2),5);}
  ctx.fillStyle=c.body;
  F=-1;const sp=curveLimb(S,C,H,27,24,T_FRONT,T_BACK);
  /* bil: lange as langs de romp bij de heup */
  const t1=sp.tg(1),nf=P(t1.y,-t1.x),ga=Math.atan2(t1.y,t1.x);
  ctx.beginPath();ctx.ellipse(H.x-nf.x*15+t1.x*2,H.y-nf.y*15+t1.y*2,31,23,ga,0,Math.PI*2);ctx.fill();
  leg(0,0);
  /* hoofd en nek volgen de bovenrug en buigen als eerste in */
  const up=P(-sp.tg(0).x,-sp.tg(0).y),hd=rot(up,55*DEG*M.n),fw=rot(hd,Math.PI/2);
  capsule(P(S.x+hd.x*14,S.y+hd.y*14),12,P(S.x+hd.x*30+fw.x*2,S.y+hd.y*30+fw.y*2),11);
  ctx.beginPath();ctx.ellipse(S.x+hd.x*56+fw.x*5,S.y+hd.y*56+fw.y*5,25,29,Math.atan2(hd.y,hd.x)+Math.PI/2,0,Math.PI*2);ctx.fill();
  /* spieren: hamstrings en rugstrekkers rekken mee met het afrollen */
  const g=.25+.75*M.q;
  ctx.save();ctx.fillStyle=c.mus;ctx.globalAlpha=g;
  const tx=K.x-H.x,ty=K.y-H.y,tl=Math.hypot(tx,ty),bx=-ty/tl,by=tx/tl;
  capsule(P(H.x+tx*.25+bx*13,H.y+ty*.25+by*13),11,P(H.x+tx*.85+bx*9,H.y+ty*.85+by*9),7);
  for(let i=0;i<=22;i++){const t=.12+.72*i/22,p=sp.pt(t),u=sp.tg(t),nx=-u.y*F,ny=u.x*F;dot(P(p.x-nx*19,p.y-ny*19),8);}
  ctx.globalAlpha=.55*g;
  const sx=A.x-K.x,sy=A.y-K.y,sl=Math.hypot(sx,sy),cx=-sy/sl,cy=sx/sl;
  capsule(P(K.x+sx*.2+cx*9,K.y+sy*.2+cy*9),9,P(K.x+sx*.5+cx*5,K.y+sy*.5+cy*5),5);
  ctx.restore();
  ctx.fillStyle=c.body;
  dot(P(S.x-2,S.y-2),21);
  const near=(()=>{let r;outlined(()=>{r=arm(0,0);});return r;})();
}
PAGE.draw=(st,T,c)=>{
  const weight=st.v==='weight',G=weight?-STEP_H:0;
  const M=pose(curlQ(st,T),G);
  ctx.save();ctx.translate(300,396);ctx.scale(.62,.62);
  mat(c,-260,520);
  if(weight){ctx.fillStyle=c.post;ctx.beginPath();ctx.roundRect(-110,-STEP_H,156,STEP_H,6);ctx.fill();}
  drawFig(M,c,weight);
  ctx.restore();
  label(c,'ZIJAANZICHT',300,428);
};


/* ---------- knoppen, toestand en afspeellus ---------- */
(function(){
  const MODES=PAGE.modes===false?[]:[['iso','Isometrisch'],['dyn','Dynamisch']];
  const groups=PAGE.groups;
  const st={mode:PAGE.defMode||'iso'};groups.forEach(g=>st[g.id]=g.def||g.opts[0][0]);
  let playing=true,slow=false,phaseT=0,last=performance.now();
  const bar=document.getElementById('opts');
  const mk=(key,list,cls,aria)=>{if(!list.length)return;const box=document.createElement('div');box.className='seg '+cls;box.setAttribute('role','group');box.setAttribute('aria-label',aria);box.dataset.g=key;
    list.forEach(([id,lab])=>{const b=document.createElement('button');b.type='button';b.id=key+'-'+id;b.textContent=lab;b.dataset.v=id;b.onclick=()=>set(key,id);box.appendChild(b);});bar.appendChild(box);};
  mk('mode',MODES,'modes','Uitvoering');
  groups.forEach(g=>mk(g.id,g.opts,'vars',g.label));
  function sync(){
    bar.querySelectorAll('.seg').forEach(box=>{const k=box.dataset.g;box.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===st[k])));});
    document.querySelectorAll('.legend [data-when]').forEach(el=>{const [g,vals]=el.dataset.when.split(':');el.hidden=!vals.split(',').includes(st[g]);});
    if(PAGE.onChange)PAGE.onChange(st);
  }
  function set(k,v){st[k]=v;phaseT=0;sync();try{localStorage.setItem(PAGE.key,JSON.stringify(st))}catch(e){}}
  try{const s=JSON.parse(localStorage.getItem(PAGE.key)||'null');if(s){if(MODES.some(m=>m[0]===s.mode))st.mode=s.mode;groups.forEach(g=>{if(g.opts.some(o=>o[0]===s[g.id]))st[g.id]=s[g.id];});}}catch(e){}
  sync();
  window.__set=o=>{Object.assign(st,o);sync();};
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(playing&&!reduce)phaseT+=dt*(slow?.5:1);
    const per=PAGE.period(st);if(per)phaseT%=per;
    const T=window.__T!=null?window.__T:(reduce?PAGE.still(st):phaseT);
    const k=cv.width/VW;
    ctx.setTransform(k,0,0,k,-VX*k,-VY*k);
    const c={stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),muted:tok('--muted'),post:tok('--post'),band:tok('--band'),bandfar:tok('--bandfar'),ink:tok('--ink')};
    ctx.fillStyle=c.stage;ctx.fillRect(VX,VY,VW,VH);
    PAGE.draw(st,T,c,dt);
    requestAnimationFrame(frame);
  }
  document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
  document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
  requestAnimationFrame(frame);
})();

<\/script>

<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<main>

<script>
/* ===== Gedeelde helpers (zelfde maten en spierprofielen als Plank hold / Bird dog) ===== */
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();ctx.fill();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
function curveLimb(a,c,b,rA,rB,front,back){
  const N=36,prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,cc,w]of bs)r+=m*Math.exp(-(((t-cc)/w)**2));return r};
  const pt=t=>P((1-t)*(1-t)*a.x+2*(1-t)*t*c.x+t*t*b.x,(1-t)*(1-t)*a.y+2*(1-t)*t*c.y+t*t*b.y);
  const tg=t=>{const x=2*(1-t)*(c.x-a.x)+2*t*(b.x-c.x),y=2*(1-t)*(c.y-a.y)+2*t*(b.y-c.y),l=Math.hypot(x,y)||1;return P(x/l,y/l)};
  const L=[],Rr=[];
  for(let i=0;i<=N;i++){const t=i/N,p=pt(t),u=tg(t),nx=-u.y*F,ny=u.x*F,rf=prof(t,front),rb=prof(t,back);
    L.push(P(p.x+nx*rf,p.y+ny*rf));Rr.push(P(p.x-nx*rb,p.y-ny*rb));}
  ctx.beginPath();L.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
  for(let i=N;i>=0;i--)ctx.lineTo(Rr[i].x,Rr[i].y);ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
  return {pt,tg};
}
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
const P=(x,y)=>({x,y});
const ell=(c,rx,ry,a)=>{ctx.beginPath();ctx.ellipse(c.x,c.y,rx,ry,a||0,0,Math.PI*2);ctx.fill();};

function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-4,W.y-9);
  ctx.quadraticCurveTo(W.x+14,W.y-10,W.x+28,W.y-3);
  ctx.quadraticCurveTo(W.x+40,W.y+1,W.x+40,W.y+5);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+16,W.y+8);
  ctx.lineTo(W.x-6,W.y+8);
  ctx.closePath();ctx.fill();
}
/* vlakke hand gedraaid; ang 0 = vingers naar voren plat op de vloer */
function rotHand(W,ang,flip){ctx.save();ctx.translate(W.x,W.y);ctx.rotate(ang);if(flip)ctx.scale(1,-1);hand(P(0,0));ctx.restore();}
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
function edgeHand(W,T){const dx=T.x-W.x,dy=T.y-W.y,L=Math.hypot(dx,dy);if(L<1){dot(W,8);return;}const a=Math.atan2(dy,dx),h=Math.min(1,L/16);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(2+17*h,0,6+15*h,9,0,0,Math.PI*2);ctx.fill();ctx.restore();}

const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];
const L_TORSO=155,L_THIGH=148,L_SHIN=132,L_UA=104,L_FA=81;

const ease=t=>.5-.5*Math.cos(Math.PI*Math.max(0,Math.min(1,t)));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const DEG=Math.PI/180,lerp=(a,b,t)=>a+(b-a)*t;
const add=(a,b)=>P(a.x+b.x,a.y+b.y),sub=(a,b)=>P(a.x-b.x,a.y-b.y),mul=(a,k)=>P(a.x*k,a.y*k);
const len=a=>Math.hypot(a.x,a.y),nrm=a=>{const l=len(a)||1;return P(a.x/l,a.y/l)};
const dirA=a=>P(Math.cos(a),Math.sin(a));
const along=(a,b,t)=>P(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t);
/* 2D-IK: gewricht tussen A en B, aan de kant van richting pref */
function ik(A,B,l1,l2,pref){
  const d0=len(sub(B,A)),d=Math.min(Math.max(d0,Math.abs(l1-l2)+.01),l1+l2-.01);
  const u=nrm(sub(B,A)),n=P(-u.y,u.x),a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  const s=(n.x*pref.x+n.y*pref.y)>=0?1:-1;
  return P(A.x+u.x*a+n.x*h*s,A.y+u.y*a+n.y*h*s);
}
/* 3D-punten {x,y,z}: x naar voren, y omlaag (scherm), z naar rechts van de persoon (naar de camera) */
const V=(x,y,z)=>({x,y,z:z||0});
const vadd=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z),vsub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z),vmul=(a,k)=>V(a.x*k,a.y*k,a.z*k);
const vdot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,vlen=a=>Math.sqrt(vdot(a,a)),vnrm=a=>vmul(a,1/(vlen(a)||1));
const vlerp=(a,b,t)=>V(lerp(a.x,b.x,t),lerp(a.y,b.y,t),lerp(a.z,b.z,t));
function ik3(A,B,l1,l2,pref){
  const AB=vsub(B,A),d0=vlen(AB),d=Math.min(Math.max(d0,Math.abs(l1-l2)+.01),l1+l2-.01),u=vnrm(AB);
  let n=vsub(pref,vmul(u,vdot(pref,u)));if(vlen(n)<1e-6)n=V(0,-1,0);n=vnrm(n);
  const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  return vadd(vadd(A,vmul(u,a)),vmul(n,h));
}
const sideP=p=>P(p.x,p.y),topP=p=>P(p.x,p.z);

/* ===== Onderdelen van het zijaanzicht (figuur kijkt naar rechts) ===== */
function torso(S,H){limb(S,H,27,24,T_FRONT,T_BACK);}
function bil(S,H){const u=nrm(sub(H,S)),a=Math.atan2(u.y,u.x);ell(P(H.x-u.y*15-u.x*2,H.y+u.x*15-u.y*2),31,23,a);}
function bilSeated(S,H){const u=nrm(sub(H,S)),a=Math.atan2(u.y,u.x);ell(P(H.x-u.y*9+u.x*3,H.y+u.x*9+u.y*3),27,22,a+.25);}
function head(S,hd){
  capsule(P(S.x+hd.x*14,S.y+hd.y*14),12,P(S.x+hd.x*30,S.y+hd.y*30),11);
  ell(P(S.x+hd.x*56,S.y+hd.y*56),29,25,Math.atan2(hd.y,hd.x));
}
function leg(H,K,A,footFn){limb(H,K,24,15,THIGH_F,THIGH_B);dot(K,14.5);limb(K,A,14.5,9,SHIN_F,SHIN_B);if(footFn)footFn(A,K);}
function arm(Sj,E,W,handFn){limb(Sj,E,16,11,UA_F,UA_B);dot(E,11);limb(E,W,11.5,6.5,FA_F,FA_B);if(handFn)handFn(W,E);dot(P(Sj.x+2,Sj.y-2),21);}
/* voeten */
const footStand=(A,rise)=>{rise=rise||0;const T=P(A.x+32,A.y+7),hl=P(A.x-6,A.y+3);
  if(!rise){capsule(hl,9,T,6);return;}const a=-rise,c=Math.cos(a),s=Math.sin(a),rot=p=>P(T.x+(p.x-T.x)*c-(p.y-T.y)*s,T.y+(p.x-T.x)*s+(p.y-T.y)*c);capsule(rot(hl),9,T,6);};
const footFlatBack=A=>capsule(A,9,P(A.x-34,A.y+6),6);
const footTucked=A=>{capsule(P(A.x-6,A.y+2),9,P(A.x+12,A.y+15),6);capsule(P(A.x+12,A.y+15),6,P(A.x+22,A.y+16),4);};
const footDir=(A,ang)=>{const d=dirA(ang);capsule(P(A.x-d.x*4,A.y-d.y*4),9,P(A.x+d.x*34,A.y+d.y*34),6);};
/* handen */
const hFlat=W=>hand(W);
const hAlong=(W,E)=>rotHand(W,Math.atan2(W.y-E.y,W.x-E.x));
/* nabije arm met dun randje in de achtergrondkleur */
function outlined(fn,c,col){const f0=ctx.fill;ctx.strokeStyle=c.stage;ctx.lineWidth=5;ctx.lineJoin='round';ctx.fill=function(){ctx.stroke();};fn();ctx.fill=f0;ctx.fillStyle=col||c.body;fn();}
function glow(alpha,fn){ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,alpha));ctx.fillStyle=COL.mus;fn();ctx.restore();}
/* spier langs een segment, naar de voorkant (+1) of achterkant (-1) */
function muscleOn(a,b,t0,t1,off,r0,r1){const u=nrm(sub(b,a)),n=P(u.y,-u.x);const p0=add(along(a,b,t0),mul(n,off)),p1=add(along(a,b,t1),mul(n,off));capsule(p0,r0,p1,r1);}
function label(txt,x,y,align){ctx.fillStyle=COL.muted;ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign=align||'left';ctx.fillText(txt,x,y);}
function mat(x,y,w){ctx.fillStyle=COL.mat;ctx.beginPath();ctx.roundRect(x,y,w,10,5);ctx.fill();}
let COL={};

/* ===== Extra helpers voor groep 6 ===== */
const hBack=W=>rotHand(W,Math.PI,true);           /* vlakke hand op de vloer, vingers naar achteren */
const rotV=(v,a)=>P(v.x*Math.cos(a)-v.y*Math.sin(a),v.x*Math.sin(a)+v.y*Math.cos(a));
/* staande voet; fa = hiel omhoog (rad), de bal blijft op de grond */
function footRise(A,fa){
  fa=fa||0;const r=v=>add(A,rotV(v,fa));
  const ball=r(P(27,6));capsule(r(P(-6,3)),9,ball,6.5);
  const toe=fa<.05?r(P(37,6.5)):P(ball.x+10,ball.y+.3);capsule(ball,6.5,toe,5);
}
const ankleOnBall=(ball,fa)=>add(ball,rotV(P(-27,-6),fa||0));
const FLAT_ANK=-13;                 /* hoogte van de enkel bij een platte voet */
/* arm met hoeken: a = schouderhoek vanaf recht omlaag (+ naar voren), b = elleboog (+ buigt naar voren) */
const dirD=a=>P(Math.sin(a),Math.cos(a));
function armFK(S,a,b){const E=add(S,mul(dirD(a),L_UA)),W=add(E,mul(dirD(a+(b||0)),L_FA));return {E,W};}
function legFK(H,a,b){const K=add(H,mul(dirD(a),L_THIGH)),A=add(K,mul(dirD(a-(b||0)),L_SHIN));return {K,A};}
/* tijdelijke laag met doorzichtigheid (voor in- en uitfaden zonder overlap te zien) */
const OFF=document.createElement('canvas');
function layer(alpha,fn){
  if(alpha>=.999){fn();return;}if(alpha<=.001)return;
  OFF.width=cv.width;OFF.height=cv.height;const o=OFF.getContext('2d');o.setTransform(ctx.getTransform());
  const m=ctx;ctx=o;try{fn();}finally{ctx=m;}
  m.save();m.setTransform(1,0,0,1,0,0);m.globalAlpha=alpha;m.drawImage(OFF,0,0);m.restore();
}
/* hoofdrichting: rompas (heup naar schouder) gedraaid met tilt (+ = kin naar de borst) */
function headDir(S,H,tilt){const u=nrm(sub(S,H)),n=P(-u.y,u.x),t=tilt||0;return P(u.x*Math.cos(t)+n.x*Math.sin(t),u.y*Math.cos(t)+n.y*Math.sin(t));}
/*
 Algemeen zijaanzicht, figuur kijkt naar rechts (+x), grond y=0.
 q: {H,S,C?(controlepunt ronde rug),tilt|hd,seat,
     legs:[ver,nabij] {H?,K,A,foot(A,K)}, arms:[ver,nabij] {Sj?,E,W,hand(W,E)}}
 hk: haken mus (spieren na het nabije been), far (na de verre ledematen), after
*/
function figSide(q,c,hk){
  hk=hk||{};F=-1;
  const fo=q.farOff||P(-11,-3),ao=q.farArmOff||P(-12,-4);
  const hd=q.hd||headDir(q.S,q.H,q.tilt);
  const L=(l,o)=>{ctx.save();ctx.translate(o.x,o.y);leg(l.H||q.H,l.K,l.A,l.foot);ctx.restore();};
  const A=(a,o)=>{ctx.save();ctx.translate(o.x,o.y);arm(a.Sj||q.S,a.E,a.W,a.hand);ctx.restore();};
  ctx.fillStyle=c.far;
  if(q.arms&&q.arms[0])A(q.arms[0],ao);
  if(q.legs&&q.legs[0])L(q.legs[0],fo);
  if(hk.far){ctx.save();hk.far();ctx.restore();}
  ctx.fillStyle=c.body;
  if(q.C)curveLimb(q.S,q.C,q.H,27,24,T_FRONT,T_BACK);else torso(q.S,q.H);
  (q.seat?bilSeated:bil)(q.C||q.S,q.H);
  if(q.legs&&q.legs[1]){if(q.legOutline)outlined(()=>L(q.legs[1],P(0,0)),c);else L(q.legs[1],P(0,0));}
  if(hk.mus){ctx.save();hk.mus();ctx.restore();}
  ctx.fillStyle=c.body;
  if(!q.noHead)head(q.S,hd);
  if(hk.beforeArm){ctx.save();hk.beforeArm();ctx.restore();ctx.fillStyle=c.body;}
  if(q.arms&&q.arms[1]){if(q.armPlain)A(q.arms[1],P(0,0));else outlined(()=>A(q.arms[1],P(0,0)),c);}
  if(hk.after){ctx.save();hk.after();ctx.restore();}
}
/* oplossen: rompkanteling zodat de schouder op afstand d van punt W ligt (bisectie) */
function leanFor(H,W,d,lo,hi){
  const f=l=>len(sub(add(H,P(L_TORSO*Math.sin(l),-L_TORSO*Math.cos(l))),W))-d;
  let a=lo,b=hi;for(let i=0;i<40;i++){const m=(a+b)/2;(f(a)*f(m)<=0)?b=m:a=m;}return (a+b)/2;
}
const shoulderAt=(H,lean)=>add(H,P(L_TORSO*Math.sin(lean),-L_TORSO*Math.cos(lean)));
const trem=t=>.5+.5*Math.sin(t*Math.PI*2*5.3)*Math.sin(t*Math.PI*2*.9+1);
const lerpP=(a,b,t)=>P(lerp(a.x,b.x,t),lerp(a.y,b.y,t));

/* hand plat op de vloer van bovenaf (handpalm naar beneden): palm + vingers ca. 22 voorbij de pols, duim aan de binnenkant.
   W = pols, d = richting van de onderarm (eenheid), inner = punt aan de lichaamskant */
function topHand(W,d,inner){
  const a=Math.atan2(d.y,d.x),ly=P(-d.y,d.x),s=((inner.x-W.x)*ly.x+(inner.y-W.y)*ly.y)>=0?1:-1;
  ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);
  ctx.beginPath();ctx.roundRect(-3,-8.5,25,17,[5,8,8,5]);ctx.fill();
  ctx.beginPath();ctx.ellipse(5,s*9.5,7.5,4.2,s*.55,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

/* ===== Child's pose met zijreik: op de hielen, borst op de dijen, armen naar voren op de vloer ===== */
const C_K=P(70,-14),C_A=P(-62,-12);
const C_H=add(C_K,mul(nrm(sub(P(-66,-60),C_K)),L_THIGH));
const C_CH=148,C_SY=-50,C_R=171,C_SW=42;
/* r: -1 = naar links (in het bovenaanzicht naar boven), +1 = naar rechts (naar de camera, onder) */
function childModel(r,b){
  const be=r*15*DEG,ga=r*34*DEG;
  const H=P(C_H.x,C_H.y-b*.6);
  const Sx=H.x+C_CH*Math.cos(be),Sz=C_CH*Math.sin(be)*.92;
  const S=P(Sx,C_SY-b*.8);
  /* schouderlijn loodrecht op de eindrichting van de rug (2*be) */
  const te=2*be,perp=P(-Math.sin(te),Math.cos(te));
  const arms=[-1,1].map(z=>{
    const sh={x:Sx+perp.x*z*C_SW,z:Sz+perp.y*z*C_SW};
    const W={x:sh.x+C_R*Math.cos(ga),z:sh.z+C_R*Math.sin(ga)};
    return {sh,W};
  });
  return {H,S,Sz,be,te,ga,r,b,arms,C:P((H.x+S.x)/2-6,(H.y+S.y)/2-17-2.5*b)};
}
const EX={
  key:'childs-pose',VW:640,VH:460,
  period:(m,v)=>m==='iso'?5:(v===0?9.6:4.8),
  still:(m,v)=>m==='iso'?0:2,
  state(m,v,t){
    const b=Math.sin(t*Math.PI*2/(m==='iso'?5:4.8));
    let r;
    if(m==='iso')r=[0,-1,1][v];
    else{
      const one=u=>u<1.6?ease(u/1.6):u<2.6?1:u<4.2?1-ease((u-2.6)/1.6):0;
      r=v===0?(t<4.8?-one(t):one(t-4.8)):(v===1?-one(t):one(t));
    }
    const o=childModel(r,m==='iso'?b:b*.4);
    o.g=m==='iso'?.85+.15*b:.45+.55*Math.abs(r);
    return o;
  },
  draw(m,c){
    ctx.save();ctx.translate(225,200);mat(-150,0,480);childSide(m,c);ctx.restore();
    ctx.save();ctx.translate(250,345);ctx.scale(.6,.6);childTop(m,c);ctx.restore();
    label('ZIJAANZICHT',24,236);label('BOVENAANZICHT',24,272);
  }
};
function sideHand(W,sc){ctx.save();ctx.translate(W.x,W.y);ctx.scale(Math.max(.35,sc),1);hand(P(0,0));ctx.restore();}
function childSide(m,c){
  F=-1;
  const S=m.S,H=m.H,fore=Math.cos(m.ga);
  const armSide=k=>{const a=m.arms[k],W=P(a.W.x,-10),E=add(along(S,W,.56),P(0,-5));
    arm(S,E,W,W2=>sideHand(W2,fore));};
  const legSide=()=>leg(H,C_K,C_A,footFlatBack);
  ctx.fillStyle=c.far;
  ctx.save();ctx.translate(-10,0);legSide();ctx.translate(0,-3);armSide(0);ctx.restore();
  ctx.fillStyle=c.body;
  legSide();
  const sp=curveLimb(S,m.C,H,27,24,T_FRONT,T_BACK);
  bilSeated(m.C,H);
  head(S,dirA(26*DEG));
  /* lat (rek): zijkant van de romp onder de oksel; onderrug secundair */
  const near=.45+.55*clamp(-m.r,0,1),far=.45+.55*clamp(m.r,0,1);
  glow(m.g*Math.max(near,far*.7),()=>{for(let i=0;i<=14;i++){const t=.08+.42*i/14,p=sp.pt(t),u=sp.tg(t);dot(P(p.x+u.y*4,p.y-u.x*4),10-4*i/14);}});
  glow(m.g*.55,()=>{for(let i=0;i<=10;i++){const t=.6+.3*i/10,p=sp.pt(t),u=sp.tg(t);dot(P(p.x-u.y*16,p.y+u.x*16),7);}});
  ctx.fillStyle=c.body;
  outlined(()=>armSide(1),c);
}
/* bovenaanzicht: x naar voren, y = rechterkant van de persoon (naar de camera in het zijaanzicht) */
function childTop(m,c){
  F=1;ctx.fillStyle=c.body;
  const k=C_CH/155,Hx=m.H.x;
  const P0=P(Hx,0),P1=P(Hx+C_CH*.5,0),P2=P(m.S.x,m.Sz);
  const bz=t=>P((1-t)*(1-t)*P0.x+2*(1-t)*t*P1.x+t*t*P2.x,(1-t)*(1-t)*P0.y+2*(1-t)*t*P1.y+t*t*P2.y);
  const bt=t=>nrm(P(2*(1-t)*(P1.x-P0.x)+2*t*(P2.x-P1.x),2*(1-t)*(P1.y-P0.y)+2*t*(P2.y-P1.y)));
  const spine=s=>{if(s<0)return {p:P(Hx+s*k,0),u:P(1,0)};if(s<=155)return {p:bz(s/155),u:bt(s/155)};const u=bt(1);return {p:add(P2,mul(u,(s-155)*k)),u};};
  /* voetzolen achter de billen */
  /* voetzolen naar boven, hielen tegen de billen, tenen naar achteren */
  for(const z of [-1,1]){ell(P(C_A.x-18,z*12),22,11,z*.05);}
  /* romp */
  const keys=[[-24,0],[-15,26],[0,34],[33,32],[64,28],[105,38],[138,47],[157,44],[172,18],[178,13]];
  const wAt=x=>{for(let i=1;i<keys.length;i++){if(x<=keys[i][0]){const[x0,w0]=keys[i-1],[x1,w1]=keys[i],u=ease((x-x0)/(x1-x0));return w0+(w1-w0)*u}}return 13};
  const Lp=[],Rp=[];
  for(let s=-24;s<=178;s+=3){const {p,u}=spine(s),w=wAt(s);Lp.push(P(p.x+u.y*w,p.y-u.x*w));Rp.push(P(p.x-u.y*w,p.y+u.x*w));}
  ctx.beginPath();Lp.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));for(let i=Rp.length-1;i>=0;i--)ctx.lineTo(Rp[i].x,Rp[i].y);ctx.closePath();ctx.fill();
  /* lat aan de bolle kant (naar rechts reiken = linkerlat rekt) */
  const lat=(sg,a)=>glow(a,()=>{for(let i=0;i<=12;i++){const s=62+84*i/12,{p,u}=spine(s),w=wAt(s)-10;dot(P(p.x+u.y*w*-sg,p.y-u.x*w*-sg),9-3*i/12);}});
  lat(-1,m.g*(.4+.6*clamp(m.r,0,1)));lat(1,m.g*(.4+.6*clamp(-m.r,0,1)));
  glow(m.g*.55,()=>{for(const z of [-1,1])capsule(add(spine(10).p,P(0,z*9)),7,add(spine(60).p,P(0,z*9)),6);});
  /* armen plat op de vloer, handen met de vingers naar voren */
  ctx.fillStyle=c.body;
  for(const a of m.arms){
    const s=P(a.sh.x,a.sh.z),w=P(a.W.x,a.W.z),el=along(s,w,.56);
    limb(s,el,15,11,[[3,.5,.22]],[[3,.5,.22]]);dot(el,11);
    limb(el,w,11,6.5,[[3,.22,.2]],[[3,.22,.2]]);
    /* hand plat op de vloer, van bovenaf: handpalm-ellips die ca. 20 voorbij de pols eindigt */
    const o=m.arms[0]===a?m.arms[1]:m.arms[0];topHand(w,nrm(sub(w,el)),P((a.W.x+o.W.x)/2,(a.W.z+o.W.z)/2));
  }
  for(const a of m.arms)dot(P(a.sh.x,a.sh.z),17);
  const e=spine(155),hc=add(e.p,mul(e.u,34));
  ell(hc,25,21,Math.atan2(e.u.y,e.u.x));
}

/* ===== Afspelen, modus- en variatieknoppen ===== */
let mode='iso',vari=0,playing=true,slow=false,phaseT=0,last=performance.now();
let shown=null,blendFrom=null,blendT=1;
function lerpObj(a,b,k){
  if(typeof b==='number')return typeof a==='number'?a+(b-a)*k:b;
  if(Array.isArray(b))return b.map((v,i)=>lerpObj(a&&a[i],v,k));
  if(b&&typeof b==='object'){const o={};for(const key in b)o[key]=lerpObj(a?a[key]:undefined,b[key],k);return o;}
  return b;
}
function render(s){
  const k=cv.width/EX.VW;
  ctx.setTransform(k,0,0,k,0,0);
  COL={stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),muted:tok('--muted'),band:tok('--band'),post:tok('--post')};
  ctx.fillStyle=COL.stage;ctx.fillRect(0,0,EX.VW,EX.VH);
  EX.draw(s,COL);
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!window.__freeze){
    if(playing&&!reduce)phaseT+=dt*(slow?.5:1);
    const per=EX.period(mode,vari);if(phaseT>=per)phaseT%=per;
    const target=EX.state(mode,vari,reduce?EX.still(mode,vari):phaseT);
    if(blendT<1&&blendFrom){blendT=Math.min(1,blendT+dt/.6);shown=lerpObj(blendFrom,target,ease(blendT));}else shown=target;
    render(shown);
  }
  requestAnimationFrame(frame);
}
function sync(){
  document.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===mode)));
  document.querySelectorAll('.var').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===vari)));
  try{localStorage.setItem(EX.key,mode+'-'+vari)}catch(e){}
}
function choose(m,v){if(m===mode&&v===vari)return;blendFrom=shown;blendT=0;mode=m;vari=v;phaseT=0;sync();}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>choose(b.dataset.m,vari));
document.querySelectorAll('.var').forEach(b=>b.onclick=()=>choose(mode,+b.dataset.v));
document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
(function init(){
  if(EX.modes){if(!EX.modes.includes(mode))mode=EX.modes[0];
    document.querySelectorAll('.mode').forEach(b=>{if(!EX.modes.includes(b.dataset.m))b.hidden=true;});}
  let s=null;try{s=localStorage.getItem(EX.key)}catch(e){}
  const h=location.hash.match(/^#(iso|dyn)-(\d)$/);if(h)s=h[1]+'-'+h[2];
  if(s){const[m,v]=s.split('-');if((m==='iso'||m==='dyn')&&(!EX.modes||EX.modes.includes(m))&&document.querySelector('.var[data-v="'+v+'"]')){mode=m;vari=+v;}}
  sync();
})();
/* testhaak: één moment tekenen */
window.__render=(m,v,ph)=>{window.__freeze=true;mode=m;vari=v;render(EX.state(m,v,ph));};
requestAnimationFrame(frame);

<\/script>

</body></html>
</script>
<script type="text/plain" data-ex="heupbuiger">
<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Heupbuiger-stretch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one stage card with the animation, mode + variation buttons, playback controls and a muscle legend */
:root{
  --bg:#EDF0EE; --stage:#F8FAF9; --ink:#1E2426; --muted:#5E686A; --body:#2A3134; --far:#7C8689;
  --muscle:#E0452B; --mat:#D6DCD9; --line:#D3D9D6; --band:#2C8C7E; --post:#C9D1CE;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --text:"Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121617; --stage:#1A1F20; --ink:#E8ECEA; --muted:#98A3A0; --body:#D9E0DD; --far:#7F8A87;
  --muscle:#FF5B3E; --mat:#2A3133; --line:#2C3335; --band:#4DBDAC; --post:#323A3C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121617; --stage:#1A1F20; --ink:#E8ECEA; --muted:#98A3A0; --body:#D9E0DD; --far:#7F8A87;
  --muscle:#FF5B3E; --mat:#2A3133; --line:#2C3335; --band:#4DBDAC; --post:#323A3C; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
main{max-width:860px;margin:0 auto;display:grid;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,7vw,52px);line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;height:auto}
.bar{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;border-top:1px solid var(--line)}
.bar .row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button[aria-pressed="true"]{background:var(--ink);color:var(--stage);border-color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.mode{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.03em;text-transform:uppercase;padding:3px 12px}
button:focus-visible{outline:2px solid var(--muscle);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:15px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muscle)}
.dot.soft{opacity:.55}
</style>

<main>
  <header>
    <h1>Heupbuiger-stretch</h1>
    <p class="sub">Rek van de heupbuigers · bil van het achterste been aangespannen</p>
  </header>

  <section class="stage">
    <canvas id="c" width="1200" height="788" aria-label="Animatie van de half-knielende heupbuiger-stretch met de heup naar voren, van opzij en van voren"></canvas>
    <div class="bar">
      <div class="row">
        <div class="seg" role="group" aria-label="Vorm">
          <button class="mode" data-m="iso" aria-pressed="true">Isometrisch</button>
          <button class="mode" data-m="dyn" aria-pressed="false">Dynamisch</button>
        </div>
        <div class="seg" role="group" aria-label="Variatie">
          <button class="var" data-v="0" aria-pressed="true">Arm omhoog</button>
          <button class="var" data-v="1" aria-pressed="false">Met zijbuiging</button>
          <button class="var" data-v="2" aria-pressed="false">Met rotatie</button>
        </div>
      </div>
      <div class="seg">
        <button id="play" aria-pressed="false">Pauze</button>
        <button id="slow" aria-pressed="false">Langzaam</button>
      </div>
    </div>
  </section>

  <div class="legend">
    <span><i class="dot"></i>Heupbuigers van het achterste been (rek, primair)</span>
    <span><i class="dot soft"></i>Bil, zijkant van de romp (secundair)</span>
  </div>

</main>

<script>
/* ===== Gedeelde helpers (zelfde maten en spierprofielen als Plank hold / Bird dog) ===== */
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();ctx.fill();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
function curveLimb(a,c,b,rA,rB,front,back){
  const N=36,prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,cc,w]of bs)r+=m*Math.exp(-(((t-cc)/w)**2));return r};
  const pt=t=>P((1-t)*(1-t)*a.x+2*(1-t)*t*c.x+t*t*b.x,(1-t)*(1-t)*a.y+2*(1-t)*t*c.y+t*t*b.y);
  const tg=t=>{const x=2*(1-t)*(c.x-a.x)+2*t*(b.x-c.x),y=2*(1-t)*(c.y-a.y)+2*t*(b.y-c.y),l=Math.hypot(x,y)||1;return P(x/l,y/l)};
  const L=[],Rr=[];
  for(let i=0;i<=N;i++){const t=i/N,p=pt(t),u=tg(t),nx=-u.y*F,ny=u.x*F,rf=prof(t,front),rb=prof(t,back);
    L.push(P(p.x+nx*rf,p.y+ny*rf));Rr.push(P(p.x-nx*rb,p.y-ny*rb));}
  ctx.beginPath();L.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
  for(let i=N;i>=0;i--)ctx.lineTo(Rr[i].x,Rr[i].y);ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
  return {pt,tg};
}
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
const P=(x,y)=>({x,y});
const ell=(c,rx,ry,a)=>{ctx.beginPath();ctx.ellipse(c.x,c.y,rx,ry,a||0,0,Math.PI*2);ctx.fill();};

function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-4,W.y-9);
  ctx.quadraticCurveTo(W.x+14,W.y-10,W.x+28,W.y-3);
  ctx.quadraticCurveTo(W.x+40,W.y+1,W.x+40,W.y+5);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+16,W.y+8);
  ctx.lineTo(W.x-6,W.y+8);
  ctx.closePath();ctx.fill();
}
/* vlakke hand gedraaid; ang 0 = vingers naar voren plat op de vloer */
function rotHand(W,ang,flip){ctx.save();ctx.translate(W.x,W.y);ctx.rotate(ang);if(flip)ctx.scale(1,-1);hand(P(0,0));ctx.restore();}
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
function edgeHand(W,T){const dx=T.x-W.x,dy=T.y-W.y,L=Math.hypot(dx,dy);if(L<1){dot(W,8);return;}const a=Math.atan2(dy,dx),h=Math.min(1,L/16);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(2+17*h,0,6+15*h,9,0,0,Math.PI*2);ctx.fill();ctx.restore();}

const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];
const L_TORSO=155,L_THIGH=148,L_SHIN=132,L_UA=104,L_FA=81;

const ease=t=>.5-.5*Math.cos(Math.PI*Math.max(0,Math.min(1,t)));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const DEG=Math.PI/180,lerp=(a,b,t)=>a+(b-a)*t;
const add=(a,b)=>P(a.x+b.x,a.y+b.y),sub=(a,b)=>P(a.x-b.x,a.y-b.y),mul=(a,k)=>P(a.x*k,a.y*k);
const len=a=>Math.hypot(a.x,a.y),nrm=a=>{const l=len(a)||1;return P(a.x/l,a.y/l)};
const dirA=a=>P(Math.cos(a),Math.sin(a));
const along=(a,b,t)=>P(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t);
/* 2D-IK: gewricht tussen A en B, aan de kant van richting pref */
function ik(A,B,l1,l2,pref){
  const d0=len(sub(B,A)),d=Math.min(Math.max(d0,Math.abs(l1-l2)+.01),l1+l2-.01);
  const u=nrm(sub(B,A)),n=P(-u.y,u.x),a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  const s=(n.x*pref.x+n.y*pref.y)>=0?1:-1;
  return P(A.x+u.x*a+n.x*h*s,A.y+u.y*a+n.y*h*s);
}
/* 3D-punten {x,y,z}: x naar voren, y omlaag (scherm), z naar rechts van de persoon (naar de camera) */
const V=(x,y,z)=>({x,y,z:z||0});
const vadd=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z),vsub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z),vmul=(a,k)=>V(a.x*k,a.y*k,a.z*k);
const vdot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,vlen=a=>Math.sqrt(vdot(a,a)),vnrm=a=>vmul(a,1/(vlen(a)||1));
const vlerp=(a,b,t)=>V(lerp(a.x,b.x,t),lerp(a.y,b.y,t),lerp(a.z,b.z,t));
function ik3(A,B,l1,l2,pref){
  const AB=vsub(B,A),d0=vlen(AB),d=Math.min(Math.max(d0,Math.abs(l1-l2)+.01),l1+l2-.01),u=vnrm(AB);
  let n=vsub(pref,vmul(u,vdot(pref,u)));if(vlen(n)<1e-6)n=V(0,-1,0);n=vnrm(n);
  const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  return vadd(vadd(A,vmul(u,a)),vmul(n,h));
}
const sideP=p=>P(p.x,p.y),topP=p=>P(p.x,p.z);

/* ===== Onderdelen van het zijaanzicht (figuur kijkt naar rechts) ===== */
function torso(S,H){limb(S,H,27,24,T_FRONT,T_BACK);}
function bil(S,H){const u=nrm(sub(H,S)),a=Math.atan2(u.y,u.x);ell(P(H.x-u.y*15-u.x*2,H.y+u.x*15-u.y*2),31,23,a);}
function bilSeated(S,H){const u=nrm(sub(H,S)),a=Math.atan2(u.y,u.x);ell(P(H.x-u.y*9+u.x*3,H.y+u.x*9+u.y*3),27,22,a+.25);}
function head(S,hd){
  capsule(P(S.x+hd.x*14,S.y+hd.y*14),12,P(S.x+hd.x*30,S.y+hd.y*30),11);
  ell(P(S.x+hd.x*56,S.y+hd.y*56),29,25,Math.atan2(hd.y,hd.x));
}
function leg(H,K,A,footFn){limb(H,K,24,15,THIGH_F,THIGH_B);dot(K,14.5);limb(K,A,14.5,9,SHIN_F,SHIN_B);if(footFn)footFn(A,K);}
function arm(Sj,E,W,handFn){limb(Sj,E,16,11,UA_F,UA_B);dot(E,11);limb(E,W,11.5,6.5,FA_F,FA_B);if(handFn)handFn(W,E);dot(P(Sj.x+2,Sj.y-2),21);}
/* voeten */
const footStand=(A,rise)=>{rise=rise||0;const T=P(A.x+32,A.y+7),hl=P(A.x-6,A.y+3);
  if(!rise){capsule(hl,9,T,6);return;}const a=-rise,c=Math.cos(a),s=Math.sin(a),rot=p=>P(T.x+(p.x-T.x)*c-(p.y-T.y)*s,T.y+(p.x-T.x)*s+(p.y-T.y)*c);capsule(rot(hl),9,T,6);};
const footFlatBack=A=>capsule(A,9,P(A.x-34,A.y+6),6);
const footTucked=A=>{capsule(P(A.x-6,A.y+2),9,P(A.x+12,A.y+15),6);capsule(P(A.x+12,A.y+15),6,P(A.x+22,A.y+16),4);};
const footDir=(A,ang)=>{const d=dirA(ang);capsule(P(A.x-d.x*4,A.y-d.y*4),9,P(A.x+d.x*34,A.y+d.y*34),6);};
/* handen */
const hFlat=W=>hand(W);
const hAlong=(W,E)=>rotHand(W,Math.atan2(W.y-E.y,W.x-E.x));
/* nabije arm met dun randje in de achtergrondkleur */
function outlined(fn,c,col){const f0=ctx.fill;ctx.strokeStyle=c.stage;ctx.lineWidth=5;ctx.lineJoin='round';ctx.fill=function(){ctx.stroke();};fn();ctx.fill=f0;ctx.fillStyle=col||c.body;fn();}
function glow(alpha,fn){ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,alpha));ctx.fillStyle=COL.mus;fn();ctx.restore();}
/* spier langs een segment, naar de voorkant (+1) of achterkant (-1) */
function muscleOn(a,b,t0,t1,off,r0,r1){const u=nrm(sub(b,a)),n=P(u.y,-u.x);const p0=add(along(a,b,t0),mul(n,off)),p1=add(along(a,b,t1),mul(n,off));capsule(p0,r0,p1,r1);}
function label(txt,x,y,align){ctx.fillStyle=COL.muted;ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign=align||'left';ctx.fillText(txt,x,y);}
function mat(x,y,w){ctx.fillStyle=COL.mat;ctx.beginPath();ctx.roundRect(x,y,w,10,5);ctx.fill();}
let COL={};

/* ===== Extra helpers voor groep 6 ===== */
const hBack=W=>rotHand(W,Math.PI,true);           /* vlakke hand op de vloer, vingers naar achteren */
const rotV=(v,a)=>P(v.x*Math.cos(a)-v.y*Math.sin(a),v.x*Math.sin(a)+v.y*Math.cos(a));
/* staande voet; fa = hiel omhoog (rad), de bal blijft op de grond */
function footRise(A,fa){
  fa=fa||0;const r=v=>add(A,rotV(v,fa));
  const ball=r(P(27,6));capsule(r(P(-6,3)),9,ball,6.5);
  const toe=fa<.05?r(P(37,6.5)):P(ball.x+10,ball.y+.3);capsule(ball,6.5,toe,5);
}
const ankleOnBall=(ball,fa)=>add(ball,rotV(P(-27,-6),fa||0));
const FLAT_ANK=-13;                 /* hoogte van de enkel bij een platte voet */
/* arm met hoeken: a = schouderhoek vanaf recht omlaag (+ naar voren), b = elleboog (+ buigt naar voren) */
const dirD=a=>P(Math.sin(a),Math.cos(a));
function armFK(S,a,b){const E=add(S,mul(dirD(a),L_UA)),W=add(E,mul(dirD(a+(b||0)),L_FA));return {E,W};}
function legFK(H,a,b){const K=add(H,mul(dirD(a),L_THIGH)),A=add(K,mul(dirD(a-(b||0)),L_SHIN));return {K,A};}
/* tijdelijke laag met doorzichtigheid (voor in- en uitfaden zonder overlap te zien) */
const OFF=document.createElement('canvas');
function layer(alpha,fn){
  if(alpha>=.999){fn();return;}if(alpha<=.001)return;
  OFF.width=cv.width;OFF.height=cv.height;const o=OFF.getContext('2d');o.setTransform(ctx.getTransform());
  const m=ctx;ctx=o;try{fn();}finally{ctx=m;}
  m.save();m.setTransform(1,0,0,1,0,0);m.globalAlpha=alpha;m.drawImage(OFF,0,0);m.restore();
}
/* hoofdrichting: rompas (heup naar schouder) gedraaid met tilt (+ = kin naar de borst) */
function headDir(S,H,tilt){const u=nrm(sub(S,H)),n=P(-u.y,u.x),t=tilt||0;return P(u.x*Math.cos(t)+n.x*Math.sin(t),u.y*Math.cos(t)+n.y*Math.sin(t));}
/*
 Algemeen zijaanzicht, figuur kijkt naar rechts (+x), grond y=0.
 q: {H,S,C?(controlepunt ronde rug),tilt|hd,seat,
     legs:[ver,nabij] {H?,K,A,foot(A,K)}, arms:[ver,nabij] {Sj?,E,W,hand(W,E)}}
 hk: haken mus (spieren na het nabije been), far (na de verre ledematen), after
*/
function figSide(q,c,hk){
  hk=hk||{};F=-1;
  const fo=q.farOff||P(-11,-3),ao=q.farArmOff||P(-12,-4);
  const hd=q.hd||headDir(q.S,q.H,q.tilt);
  const L=(l,o)=>{ctx.save();ctx.translate(o.x,o.y);leg(l.H||q.H,l.K,l.A,l.foot);ctx.restore();};
  const A=(a,o)=>{ctx.save();ctx.translate(o.x,o.y);arm(a.Sj||q.S,a.E,a.W,a.hand);ctx.restore();};
  ctx.fillStyle=c.far;
  if(q.arms&&q.arms[0])A(q.arms[0],ao);
  if(q.legs&&q.legs[0])L(q.legs[0],fo);
  if(hk.far){ctx.save();hk.far();ctx.restore();}
  ctx.fillStyle=c.body;
  if(q.C)curveLimb(q.S,q.C,q.H,27,24,T_FRONT,T_BACK);else torso(q.S,q.H);
  (q.seat?bilSeated:bil)(q.C||q.S,q.H);
  if(q.legs&&q.legs[1]){if(q.legOutline)outlined(()=>L(q.legs[1],P(0,0)),c);else L(q.legs[1],P(0,0));}
  if(hk.mus){ctx.save();hk.mus();ctx.restore();}
  ctx.fillStyle=c.body;
  if(!q.noHead)head(q.S,hd);
  if(hk.beforeArm){ctx.save();hk.beforeArm();ctx.restore();ctx.fillStyle=c.body;}
  if(q.arms&&q.arms[1]){if(q.armPlain)A(q.arms[1],P(0,0));else outlined(()=>A(q.arms[1],P(0,0)),c);}
  if(hk.after){ctx.save();hk.after();ctx.restore();}
}
/* oplossen: rompkanteling zodat de schouder op afstand d van punt W ligt (bisectie) */
function leanFor(H,W,d,lo,hi){
  const f=l=>len(sub(add(H,P(L_TORSO*Math.sin(l),-L_TORSO*Math.cos(l))),W))-d;
  let a=lo,b=hi;for(let i=0;i<40;i++){const m=(a+b)/2;(f(a)*f(m)<=0)?b=m:a=m;}return (a+b)/2;
}
const shoulderAt=(H,lean)=>add(H,P(L_TORSO*Math.sin(lean),-L_TORSO*Math.cos(lean)));
const trem=t=>.5+.5*Math.sin(t*Math.PI*2*5.3)*Math.sin(t*Math.PI*2*.9+1);
const lerpP=(a,b,t)=>P(lerp(a.x,b.x,t),lerp(a.y,b.y,t));

/* hand plat op de vloer van bovenaf (handpalm naar beneden): palm + vingers ca. 22 voorbij de pols, duim aan de binnenkant.
   W = pols, d = richting van de onderarm (eenheid), inner = punt aan de lichaamskant */
function topHand(W,d,inner){
  const a=Math.atan2(d.y,d.x),ly=P(-d.y,d.x),s=((inner.x-W.x)*ly.x+(inner.y-W.y)*ly.y)>=0?1:-1;
  ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);
  ctx.beginPath();ctx.roundRect(-3,-8.5,25,17,[5,8,8,5]);ctx.fill();
  ctx.beginPath();ctx.ellipse(5,s*9.5,7.5,4.2,s*.55,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

/* ===== Heupbuiger-stretch: half-knielend, nabije (rechter)knie op de grond, verre (linker)voet voor ===== */
const HB_KB=P(0,-14.5),HB_AB=P(-132,-12),HB_AF=P(222,FLAT_ANK);
/* f: heup naar voren 0..1; o: {v, up (arm omhoog 0..1), be (zijbuiging rad), ro (rotatie rad)} */
function hfPose(f,o){
  const th=lerp(5,35,f)*DEG,H=add(HB_KB,P(L_THIGH*Math.sin(th),-L_THIGH*Math.cos(th)));
  const Kf=ik(H,HB_AF,L_THIGH,L_SHIN,P(.25,-1));
  const lean=-(2+2*f)*DEG;
  const tl=L_TORSO*(1-.06*Math.sin(o.be||0)*3);
  const S=add(H,P(tl*Math.sin(lean),-tl*Math.cos(lean)));
  return {f,th,H,Kf,S,lean,...o};
}
const EX={
  key:'heupbuiger-stretch',VW:640,VH:420,
  period:m=>m==='iso'?4:5,
  still:()=>2.2,
  state(m,v,t){
    const b=Math.sin(t*Math.PI*2/4);
    const osc=u=>u<1.8?ease(u/1.8):u<2.6?1:u<4.4?1-ease((u-2.6)/1.8):0;
    const f=m==='iso'?1:osc(t);
    let o;
    if(v===0)o={v,up:m==='iso'?1:.25+.75*f,be:0,ro:0};
    else if(v===1)o={v,up:1,be:(m==='iso'?1:f)*22*DEG,ro:0};
    else o={v,up:0,be:0,ro:lerp(5,40,m==='iso'?1:f)*DEG};
    const p=hfPose(m==='iso'?1+.025*b:f,o);
    p.g=m==='iso'?.8+.2*trem(t*.5):.4+.6*f;
    return p;
  },
  draw(m,c){
    if(m.v===0){
      ctx.save();ctx.translate(260,392);ctx.scale(.7,.7);mat(-230,0,520);hfSide(m,c);ctx.restore();
      label('ZIJAANZICHT',24,412);return;
    }
    ctx.save();ctx.translate(158,392);ctx.scale(.7,.7);mat(-205,0,470);hfSide(m,c);ctx.restore();
    if(m.v===1){
      ctx.save();ctx.translate(486,392);ctx.scale(.7,.7);mat(-190,0,380);hfFront(m,c);ctx.restore();
      label('ZIJAANZICHT',158,412,'center');label('VOORAANZICHT',486,412,'center');
    }else{
      ctx.save();ctx.translate(452,222);ctx.scale(.7,.7);hfTop(m,c);ctx.restore();
      label('ZIJAANZICHT',158,412,'center');label('BOVENAANZICHT',470,412,'center');
    }
  }
};
function hfArms(m){
  const S=m.S;
  if(m.v===2){
    /* armen gekruist voor de borst (handen op de andere schouder), romp draait naar het voorste been */
    const X=crossArms(m.ro);
    const pt=v=>P(S.x+v.x,S.y+v.y);
    const hand=(W,E)=>hAlong(W,E);
    return [{Sj:pt(X[0].sh),E:pt(X[0].el),W:pt(X[0].wr),hand},{Sj:pt(X[1].sh),E:pt(X[1].el),W:pt(X[1].wr),hand}];
  }
  /* nabije arm omhoog (bij zijbuiging verkort hij in beeld), verre hand op de voorste knie */
  const a=lerp(18,182,m.up)*DEG,sc=Math.cos((m.be||0)*1.7);
  const dv=dirD(a),Wn=add(S,P(dv.x*185,dv.y*185*(dv.y<0?sc:1))),En=add(S,P(dv.x*104,dv.y*104*(dv.y<0?sc:1)));
  const Wf=add(m.Kf,P(-8,-24)),Ef=ik(S,Wf,L_UA,L_FA,P(-.2,1));
  const ta=Math.atan2(m.Kf.y-m.H.y,m.Kf.x-m.H.x);
  return [{E:Ef,W:Wf,hand:W=>rotHand(W,ta)},{E:En,W:Wn,hand:hAlong}];
}
/* gekruiste armen in 3D rond de schouder-middenpunt: x naar voren, y omlaag, z naar rechts; [ver (links), nabij (rechts)] */
function crossArms(ro){
  const rot=v=>({x:v.x*Math.cos(ro)+v.z*Math.sin(ro),y:v.y,z:-v.x*Math.sin(ro)+v.z*Math.cos(ro)});
  return [-1,1].map(s=>({sh:rot({x:0,y:0,z:s*48}),el:rot({x:85,y:45,z:s*10}),wr:rot({x:24,y:12,z:-s*40})}));
}
function hfSide(m,c){
  const arms=hfArms(m);
  figSide({H:m.H,S:m.S,tilt:-.04,
    legs:[{K:m.Kf,A:HB_AF,foot:A=>footRise(A,0)},{K:HB_KB,A:HB_AB,foot:footFlatBack}],arms},c,{
    mus(){
      glow(m.g,()=>{muscleOn(m.H,HB_KB,.02,.55,12,12,8);muscleOn(m.S,m.H,.8,1,15,9,11);});
      glow(m.g*.55,()=>{const u=nrm(sub(m.H,m.S));ell(P(m.H.x-u.y*18,m.H.y+u.x*18),16,21,Math.atan2(u.y,u.x));});
      if(m.be)glow(m.g*.55*m.be/(22*DEG),()=>{muscleOn(m.S,m.H,.25,.7,0,10,9);});
    }
  });
}
/* vooraanzicht: persoon kijkt naar de camera; rechterknie (scherm links) op de grond, linkervoet voor */
function hfFront(m,c){
  const Hy=m.H.y,Kfy=m.Kf.y,be=m.be;
  const T=(x,y)=>{const cs=Math.cos(be),sn=Math.sin(be);return P(x*cs-y*sn,Hy+x*sn+y*cs);};
  ctx.fillStyle=c.body;
  /* achterste dij recht omlaag naar de knie op de grond */
  limb(P(-24,Hy),P(-27,-14.5),24,15,[[4,.4,.3]],[[4,.4,.3]]);dot(P(-27,-14.5),15);
  /* verre (linker)arm: hand op de voorste knie */
  const ShR=T(-50,-151),ShL=T(50,-151);
  const WL=P(46,Kfy-20),EL=ik(ShL,WL,L_UA,L_FA,P(1,.1));
  /* romp met zijbuiging om het heupmidden */
  ctx.save();
  ctx.translate(0,Hy);ctx.rotate(be);ctx.scale(1,155/126);ctx.translate(0,172);
  ctx.beginPath();ctx.moveTo(-15,-314);
  ctx.quadraticCurveTo(-28,-306,-44,-300);ctx.quadraticCurveTo(-54,-280,-49,-258);
  ctx.quadraticCurveTo(-42,-232,-37,-208);ctx.quadraticCurveTo(-46,-190,-45,-172);
  ctx.lineTo(45,-172);ctx.quadraticCurveTo(46,-190,37,-208);ctx.quadraticCurveTo(42,-232,49,-258);
  ctx.quadraticCurveTo(54,-280,44,-300);ctx.quadraticCurveTo(28,-306,15,-314);
  ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.ellipse(0,-172,48,16,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  const hb=be*1.25,nk=T(0,-163),hc=add(nk,P(Math.sin(hb)*44,-Math.cos(hb)*44));
  capsule(nk,13,add(nk,P(Math.sin(hb)*18,-Math.cos(hb)*18)),11);
  ell(hc,24,30,hb);
  /* voorste been: dij naar de camera (verkort), onderbeen recht omlaag */
  const kf=P(32,Kfy+6);
  outlined(()=>{limb(P(24,Hy+6),kf,24,17,[[3,.5,.3]],[[3,.5,.3]]);dot(kf,17);},c);
  limb(kf,P(34,-14),15,9,[[3,.28,.18]],[[3,.28,.18]]);
  ell(P(35,-8),13,10);
  /* spieren: heupbuiger rechts (scherm links), zijkant van de romp aan de bolle kant */
  glow(m.g,()=>{capsule(P(-25,Hy+12),11,P(-26,Hy+66),8);});
  glow(m.g*.55*be/(22*DEG),()=>{capsule(T(-40,-118),8,T(-36,-38),10);});
  ctx.fillStyle=c.body;
  limb(ShL,EL,16,11,[[4,.5,.22]],[[4,.5,.22]]);dot(EL,11);limb(EL,WL,11.5,6.5,[[3,.25,.2]],[[3,.25,.2]]);
  ell(P(WL.x+2,WL.y+8),10,14);
  for(const s of [ShR,ShL])dot(s,17);
  /* nabije (rechter)arm boven het hoofd, mee over naar de andere kant */
  const ph=-6*DEG+be*.9;
  const WR=T(-50+185*Math.sin(ph+14*DEG),-151-185*Math.cos(ph+14*DEG)),ER=T(-50+104*Math.sin(ph),-151-104*Math.cos(ph));
  outlined(()=>{limb(ShR,ER,16,11,[[4,.5,.22]],[[4,.5,.22]]);dot(ER,11);limb(ER,WR,11.5,6.5,[[3,.25,.2]],[[3,.25,.2]]);
    const d=nrm(sub(WR,ER));ctx.save();ctx.translate(WR.x,WR.y);ctx.rotate(Math.atan2(d.y,d.x));ctx.beginPath();ctx.ellipse(17,0,18,9,0,0,Math.PI*2);ctx.fill();ctx.restore();dot(ShR,17);},c);
}
/* bovenaanzicht: x naar voren, y = rechterkant (camerakant in het zijaanzicht) */
function hfTop(m,c){
  F=1;ctx.fillStyle=c.body;
  const Hx=m.H.x,kf=P(m.Kf.x,-24),Sx=m.S.x;
  /* achterste been: dij loopt schuin omlaag (verkort), onderbeen en wreef plat naar achteren */
  limb(P(0,22),P(-132,22),14,8.5,[[6,.27,.18]],[[6,.27,.18]]);ell(P(-150,22),22,9);
  limb(P(Hx,19),P(0,22),23,15,[[4,.45,.28]],[[4,.45,.28]]);dot(P(0,22),14.5);
  /* voorste been: dij naar voren, voet plat onder en voor de knie */
  ell(P(HB_AF.x+14,-24),24,10);
  if(HB_AF.x-kf.x>6)limb(kf,P(HB_AF.x,-24),14.5,9,[[3,.28,.18]],[[3,.28,.18]]);
  limb(P(Hx,-19),kf,23,15,[[5,.45,.28]],[[5,.45,.28]]);dot(kf,14.5);
  /* bekken */
  ell(P(Hx-8,0),26,40);
  /* bovenrug en schouders van bovenaf, gedraaid naar het voorste been */
  ctx.save();ctx.translate(Sx-4,0);ctx.rotate(m.ro);ell(P(0,0),28,52);ctx.restore();
  const d=P(Math.sin(m.ro),Math.cos(m.ro));
  for(const z of [-1,1])dot(P(Sx+d.x*48*z,d.y*48*z),19);
  glow(m.g*.55,()=>{ctx.save();ctx.translate(Sx-6,0);ctx.rotate(m.ro);capsule(P(0,-30),9,P(0,30),9);ctx.restore();});
  /* gekruiste armen voor de borst */
  ctx.fillStyle=c.body;
  const X=crossArms(m.ro),tp=v=>P(Sx+v.x,v.z);
  for(const k of [0,1]){
    const A=X[k],sh=tp(A.sh),el=tp(A.el),w=tp(A.wr);
    outlined(()=>{limb(sh,el,15,11,[[3,.5,.22]],[[3,.5,.22]]);dot(el,11);limb(el,w,11,6.5,[[3,.22,.2]],[[3,.22,.2]]);
      topHand(w,nrm(sub(w,el)),tp(X[1-k].wr));},c);
  }
  ctx.save();ctx.translate(Sx+6,0);ctx.rotate(m.ro*.8);ell(P(0,0),24,21);ell(P(20,0),7,6);ctx.restore();
}

/* ===== Afspelen, modus- en variatieknoppen ===== */
let mode='iso',vari=0,playing=true,slow=false,phaseT=0,last=performance.now();
let shown=null,blendFrom=null,blendT=1;
function lerpObj(a,b,k){
  if(typeof b==='number')return typeof a==='number'?a+(b-a)*k:b;
  if(Array.isArray(b))return b.map((v,i)=>lerpObj(a&&a[i],v,k));
  if(b&&typeof b==='object'){const o={};for(const key in b)o[key]=lerpObj(a?a[key]:undefined,b[key],k);return o;}
  return b;
}
function render(s){
  const k=cv.width/EX.VW;
  ctx.setTransform(k,0,0,k,0,0);
  COL={stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),muted:tok('--muted'),band:tok('--band'),post:tok('--post')};
  ctx.fillStyle=COL.stage;ctx.fillRect(0,0,EX.VW,EX.VH);
  EX.draw(s,COL);
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!window.__freeze){
    if(playing&&!reduce)phaseT+=dt*(slow?.5:1);
    const per=EX.period(mode,vari);if(phaseT>=per)phaseT%=per;
    const target=EX.state(mode,vari,reduce?EX.still(mode,vari):phaseT);
    if(blendT<1&&blendFrom){blendT=Math.min(1,blendT+dt/.6);shown=lerpObj(blendFrom,target,ease(blendT));}else shown=target;
    render(shown);
  }
  requestAnimationFrame(frame);
}
function sync(){
  document.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===mode)));
  document.querySelectorAll('.var').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===vari)));
  try{localStorage.setItem(EX.key,mode+'-'+vari)}catch(e){}
}
function choose(m,v){if(m===mode&&v===vari)return;blendFrom=shown;blendT=0;mode=m;vari=v;phaseT=0;sync();}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>choose(b.dataset.m,vari));
document.querySelectorAll('.var').forEach(b=>b.onclick=()=>choose(mode,+b.dataset.v));
document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
(function init(){
  if(EX.modes){if(!EX.modes.includes(mode))mode=EX.modes[0];
    document.querySelectorAll('.mode').forEach(b=>{if(!EX.modes.includes(b.dataset.m))b.hidden=true;});}
  let s=null;try{s=localStorage.getItem(EX.key)}catch(e){}
  const h=location.hash.match(/^#(iso|dyn)-(\d)$/);if(h)s=h[1]+'-'+h[2];
  if(s){const[m,v]=s.split('-');if((m==='iso'||m==='dyn')&&(!EX.modes||EX.modes.includes(m))&&document.querySelector('.var[data-v="'+v+'"]')){mode=m;vari=+v;}}
  sync();
})();
/* testhaak: één moment tekenen */
window.__render=(m,v,ph)=>{window.__freeze=true;mode=m;vari=v;render(EX.state(m,v,ph));};
requestAnimationFrame(frame);

<\/script>

</body></html>

<script>
/* ===== Gedeelde helpers (zelfde maten en spierprofielen als Plank hold / Bird dog) ===== */
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();ctx.fill();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
function curveLimb(a,c,b,rA,rB,front,back){
  const N=36,prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,cc,w]of bs)r+=m*Math.exp(-(((t-cc)/w)**2));return r};
  const pt=t=>P((1-t)*(1-t)*a.x+2*(1-t)*t*c.x+t*t*b.x,(1-t)*(1-t)*a.y+2*(1-t)*t*c.y+t*t*b.y);
  const tg=t=>{const x=2*(1-t)*(c.x-a.x)+2*t*(b.x-c.x),y=2*(1-t)*(c.y-a.y)+2*t*(b.y-c.y),l=Math.hypot(x,y)||1;return P(x/l,y/l)};
  const L=[],Rr=[];
  for(let i=0;i<=N;i++){const t=i/N,p=pt(t),u=tg(t),nx=-u.y*F,ny=u.x*F,rf=prof(t,front),rb=prof(t,back);
    L.push(P(p.x+nx*rf,p.y+ny*rf));Rr.push(P(p.x-nx*rb,p.y-ny*rb));}
  ctx.beginPath();L.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
  for(let i=N;i>=0;i--)ctx.lineTo(Rr[i].x,Rr[i].y);ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
  return {pt,tg};
}
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
const P=(x,y)=>({x,y});
const ell=(c,rx,ry,a)=>{ctx.beginPath();ctx.ellipse(c.x,c.y,rx,ry,a||0,0,Math.PI*2);ctx.fill();};

function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-4,W.y-9);
  ctx.quadraticCurveTo(W.x+14,W.y-10,W.x+28,W.y-3);
  ctx.quadraticCurveTo(W.x+40,W.y+1,W.x+40,W.y+5);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+16,W.y+8);
  ctx.lineTo(W.x-6,W.y+8);
  ctx.closePath();ctx.fill();
}
/* vlakke hand gedraaid; ang 0 = vingers naar voren plat op de vloer */
function rotHand(W,ang,flip){ctx.save();ctx.translate(W.x,W.y);ctx.rotate(ang);if(flip)ctx.scale(1,-1);hand(P(0,0));ctx.restore();}
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
function edgeHand(W,T){const dx=T.x-W.x,dy=T.y-W.y,L=Math.hypot(dx,dy);if(L<1){dot(W,8);return;}const a=Math.atan2(dy,dx),h=Math.min(1,L/16);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(2+17*h,0,6+15*h,9,0,0,Math.PI*2);ctx.fill();ctx.restore();}

const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];
const L_TORSO=155,L_THIGH=148,L_SHIN=132,L_UA=104,L_FA=81;

const ease=t=>.5-.5*Math.cos(Math.PI*Math.max(0,Math.min(1,t)));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const DEG=Math.PI/180,lerp=(a,b,t)=>a+(b-a)*t;
const add=(a,b)=>P(a.x+b.x,a.y+b.y),sub=(a,b)=>P(a.x-b.x,a.y-b.y),mul=(a,k)=>P(a.x*k,a.y*k);
const len=a=>Math.hypot(a.x,a.y),nrm=a=>{const l=len(a)||1;return P(a.x/l,a.y/l)};
const dirA=a=>P(Math.cos(a),Math.sin(a));
const along=(a,b,t)=>P(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t);
/* 2D-IK: gewricht tussen A en B, aan de kant van richting pref */
function ik(A,B,l1,l2,pref){
  const d0=len(sub(B,A)),d=Math.min(Math.max(d0,Math.abs(l1-l2)+.01),l1+l2-.01);

  const d=Math.min(len(sub(B,A)),ra+rb-.01),u=nrm(sub(B,A)),a=(ra*ra-rb*rb+d*d)/(2*d),h=Math.sqrt(Math.max(0,ra*ra-a*a));

/* v: 0 onderarmen, 1 handen, 2 halve frog (nabij been wijd, ver been knie onder de heup); hx = heup naar voren (+) of achteren (-) */

  if(v===2){
    KF=V(-62,-14.5,-24);
    /* bekken schuift opzij zodat beide dijen 148 lang blijven */
    const yAt=s=>-14.5-Math.sqrt(Math.max(1,148*148-(hx-KF.x)**2-(KF.z-(s-FR_HZ))**2));
    let lo=-60,hi=60;
    for(let i=0;i<40;i++){const s=(lo+hi)/2,yy=yAt(s),d=Math.hypot(hx-KN.x,yy-KN.y,(s+FR_HZ)-KN.z);(d>148)?lo=s:hi=s;}
    sz=(lo+hi)/2;y=yAt(sz);

    KF=V(0,-14.5,-FR_KZ);
    y=-14.5-Math.sqrt(148*148-(FR_KZ-FR_HZ)**2-hx*hx);
  }
  y+=b||0;
  const hipN=V(hx,y,sz+FR_HZ),hipF=V(hx,y,sz-FR_HZ),M=P(hx,y);
  /* vaste steunpunten (bepaald in de achterste stand) */
  const hands=v===1;
  const ref=frogRef(v);
  let S,E,W;
  if(hands){W=ref.W;S=circ2(M,L_TORSO,W,178);E=ik(S,W,L_UA,L_FA,P(-1,0));}
  else{E=ref.E;W=ref.W;S=circ2(M,L_TORSO,E,L_UA);}
  const AN=V(KN.x-130,-12,KN.z),AF=v===2?V(KF.x-132,-12,KF.z):V(KF.x-130,-12,KF.z);

const FR_REF={};
function frogRef(v){
  if(FR_REF[v])return FR_REF[v];
  const hx=-38,y=v===2?-96:-14.5-Math.sqrt(148*148-(FR_KZ-FR_HZ)**2-hx*hx);
  const M=P(hx,y);
  let r;
  if(v===1){const Sy=-190,S=P(hx+Math.sqrt(155*155-(y-Sy)**2),Sy);r={W:P(S.x+6,-10)};}
  else{const Sy=-115,S=P(hx+Math.sqrt(155*155-(y-Sy)**2),Sy);r={E:P(S.x,-11),W:P(S.x+81,-10)};}
  return FR_REF[v]=r;

const EX={

    const hx=m==='iso'?-38:lerp(-38,12,osc(t));

let mode='iso',vari=0,playing=true,slow=false,phaseT=0,last=performance.now();
let shown=null,blendFrom=null,blendT=1;
function lerpObj(a,b,k){
  if(typeof b==='number')return typeof a==='number'?a+(b-a)*k:b;
  if(Array.isArray(b))return b.map((v,i)=>lerpObj(a&&a[i],v,k));
  if(b&&typeof b==='object'){const o={};for(const key in b)o[key]=lerpObj(a?a[key]:undefined,b[key],k);return o;}
  return b;
}
function render(s){
  const k=cv.width/EX.VW;
  ctx.setTransform(k,0,0,k,0,0);
  COL={stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),muted:tok('--muted'),band:tok('--band'),post:tok('--post')};
  ctx.fillStyle=COL.stage;ctx.fillRect(0,0,EX.VW,EX.VH);
  EX.draw(s,COL);
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!window.__freeze){
    if(playing&&!reduce)phaseT+=dt*(slow?.5:1);
    const per=EX.period(mode,vari);if(phaseT>=per)phaseT%=per;
    const target=EX.state(mode,vari,reduce?EX.still(mode,vari):phaseT);
    if(blendT<1&&blendFrom){blendT=Math.min(1,blendT+dt/.6);shown=lerpObj(blendFrom,target,ease(blendT));}else shown=target;
    render(shown);
  }
  requestAnimationFrame(frame);
}
function sync(){
  document.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===mode)));
  document.querySelectorAll('.var').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===vari)));

}
function choose(m,v){if(m===mode&&v===vari)return;blendFrom=shown;blendT=0;mode=m;vari=v;phaseT=0;sync();}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>choose(b.dataset.m,vari));

(function init(){

    document.querySelectorAll('.mode').forEach(b=>{if(!EX.modes.includes(b.dataset.m))b.hidden=true;});}
  let s=null;try{s=localStorage.getItem(EX.key)}catch(e){}
  const h=location.hash.match(/^#(iso|dyn)-(\d)$/);if(h)s=h[1]+'-'+h[2];

window.__render=(m,v,ph)=>{window.__freeze=true;mode=m;vari=v;render(EX.state(m,v,ph));};
