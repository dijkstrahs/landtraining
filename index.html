button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button[aria-pressed="true"]{background:var(--ink);color:var(--stage);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--muscle);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:15px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muscle)}
.dot.soft{opacity:.55}
@media (max-width:560px){.seg.play{margin-left:0}}
</style>

<main>
  <header>
    <h1>Ontspannen ademhaling</h1>
    <p class="sub">Op de hielen · middenrif en tussenribspieren</p>
  </header>

  <section class="stage">
    <canvas id="c" width="1200" height="825" aria-label="Animatie van box breathing en de 4-7-8 ademhaling, zittend op de hielen, met een ademvorm die de fasen aangeeft"></canvas>
    <div class="bar">
      <div id="opts"></div>
      <div class="seg play">
        <button id="play" type="button" aria-pressed="false">Pauze</button>
        <button id="slow" type="button" aria-pressed="false">Langzaam</button>
      </div>
    </div>
  </section>

  <div class="legend">
    <span><i class="dot"></i>Middenrif (primair)</span>
    <span><i class="dot soft"></i>Tussenribspieren (secundair)</span>
  </div>
</main>

<script>
/* ---------- shared drawing helpers (vaste maten en spierprofielen) ---------- */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let VX=0,VY=0,VW=640,VH=440;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
const P=(x,y)=>({x,y});
const DEG=Math.PI/180,lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>.5-.5*Math.cos(Math.PI*clamp(t,0,1));
const lerpP=(a,b,t)=>P(lerp(a.x,b.x,t),lerp(a.y,b.y,t));
const dist=(a,b)=>Math.hypot(b.x-a.x,b.y-a.y);
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();ctx.fill();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
function curveLimb(a,c,b,rA,rB,front,back){
  const N=36,prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,cc,w]of bs)r+=m*Math.exp(-(((t-cc)/w)**2));return r};
  const pt=t=>P((1-t)*(1-t)*a.x+2*(1-t)*t*c.x+t*t*b.x,(1-t)*(1-t)*a.y+2*(1-t)*t*c.y+t*t*b.y);
  const tg=t=>{const x=2*(1-t)*(c.x-a.x)+2*t*(b.x-c.x),y=2*(1-t)*(c.y-a.y)+2*t*(b.y-c.y),l=Math.hypot(x,y)||1;return P(x/l,y/l)};
  const L=[],Rr=[];
  for(let i=0;i<=N;i++){const t=i/N,p=pt(t),u=tg(t),nx=-u.y*F,ny=u.x*F,rf=prof(t,front),rb=prof(t,back);
    L.push(P(p.x+nx*rf,p.y+ny*rf));Rr.push(P(p.x-nx*rb,p.y-ny*rb));}
  ctx.beginPath();L.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
  for(let i=N;i>=0;i--)ctx.lineTo(Rr[i].x,Rr[i].y);ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
  return {pt,tg};
}
/* vlakke hand plat op de vloer: handpalm onder op W.y+8, dikke handrug bij de pols, dunne vingers naar +x */
function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-6,W.y+8);
  ctx.lineTo(W.x+29,W.y+8);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+33.5,W.y+5);
  ctx.quadraticCurveTo(W.x+32,W.y+2,W.x+26,W.y+2);
  ctx.lineTo(W.x+18,W.y+1.5);
  ctx.quadraticCurveTo(W.x+15,W.y-1.5,W.x+10,W.y-1);
  ctx.quadraticCurveTo(W.x+3,W.y-3,W.x-1,W.y-4);
  ctx.quadraticCurveTo(W.x-9,W.y-4,W.x-9,W.y+3);
  ctx.quadraticCurveTo(W.x-9,W.y+8,W.x-6,W.y+8);
  ctx.closePath();ctx.fill();
}
/* hand in de richting van de onderarm gedraaid (hand(W) geroteerd om de pols) */
function handAt(W,ang,flip){ctx.save();ctx.translate(W.x,W.y);ctx.rotate(ang);if(flip)ctx.scale(1,-1);hand(P(0,0));ctx.restore();}
const unit=(a,b)=>{const d=dist(a,b)||1;return P((b.x-a.x)/d,(b.y-a.y)/d);};
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
const fistC=(W,E)=>{const u=unit(E,W);return P(W.x+u.x*9,W.y+u.y*9);};
function edgeHand(W,T,wd=9){const dx=T.x-W.x,dy=T.y-W.y,L=Math.hypot(dx,dy);if(L<1){dot(W,8);return;}const a=Math.atan2(dy,dx),h=Math.min(1,L/16);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(2+17*h,0,6+15*h,wd,0,0,Math.PI*2);ctx.fill();ctx.restore();}
/* twee-segment IK: pick(c1,c2) geeft true als c1 de goede kant is */
function ik(a,b,l1,l2,pick){
  const dx=b.x-a.x,dy=b.y-a.y;let d=Math.hypot(dx,dy);
  d=clamp(d,Math.abs(l1-l2)+.5,l1+l2-.01);
  const ang=Math.atan2(dy,dx),al=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));
  const c1=P(a.x+l1*Math.cos(ang+al),a.y+l1*Math.sin(ang+al)),c2=P(a.x+l1*Math.cos(ang-al),a.y+l1*Math.sin(ang-al));
  return pick(c1,c2)?c1:c2;
}
/* 3D */
const V3=(x,y,z)=>({x,y,z}),add3=(a,b)=>V3(a.x+b.x,a.y+b.y,a.z+b.z),sub3=(a,b)=>V3(a.x-b.x,a.y-b.y,a.z-b.z),
  mul3=(a,k)=>V3(a.x*k,a.y*k,a.z*k),len3=a=>Math.hypot(a.x,a.y,a.z),nrm3=a=>mul3(a,1/(len3(a)||1)),dot3=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,
  lerp3=(a,b,t)=>V3(lerp(a.x,b.x,t),lerp(a.y,b.y,t),lerp(a.z,b.z,t));
/* 3D-IK: pole = richting waar het middengewricht heen wijst */
function ik3(S,W,l1,l2,pole){
  const d0=len3(sub3(W,S))||1,d=clamp(d0,Math.abs(l1-l2)+.5,l1+l2-.01);
  const u=mul3(sub3(W,S),1/d0);
  let v=sub3(pole,mul3(u,dot3(pole,u)));v=nrm3(v);
  const ca=clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1),sa=Math.sqrt(1-ca*ca);
  return add3(S,add3(mul3(u,l1*ca),mul3(v,l1*sa)));
}
/* teken een vorm als dun randje in de achtergrondkleur (eerst stroken, dan vullen) */
function outlined(fn,col){
  const f0=ctx.fill;ctx.save();ctx.strokeStyle=col||tok('--stage');ctx.lineWidth=5;ctx.lineJoin='round';
  ctx.fill=function(){ctx.stroke();};fn();ctx.fill=f0;ctx.restore();fn();
}
function label(c,t,x,y,align='center'){ctx.fillStyle=c.muted;ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign=align;ctx.fillText(t,x,y);}
function mat(c,x0,w,y=0,h=10){ctx.fillStyle=c.mat;ctx.beginPath();ctx.roundRect(x0,y,w,h,h/2);ctx.fill();}
const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];
/* vooraanzicht-romp (zoals pass-through/horse stance): schouders op Sy, heup op Hy */
function frontTorso(Sy,Hy){
  const s=(Hy-Sy)/126;
  ctx.save();ctx.translate(0,Hy);ctx.scale(1,s);ctx.translate(0,172);
  ctx.beginPath();ctx.moveTo(-15,-314);
  ctx.quadraticCurveTo(-28,-306,-44,-300);ctx.quadraticCurveTo(-54,-280,-49,-258);
  ctx.quadraticCurveTo(-42,-232,-37,-208);ctx.quadraticCurveTo(-46,-190,-45,-172);
  ctx.lineTo(45,-172);ctx.quadraticCurveTo(46,-190,37,-208);ctx.quadraticCurveTo(42,-232,49,-258);
  ctx.quadraticCurveTo(54,-280,44,-300);ctx.quadraticCurveTo(28,-306,15,-314);
  ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.ellipse(0,-172,48,16,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function frontHead(Sy,dx=0){capsule(P(dx*.5,Sy-12),13,P(dx*.8,Sy-30),11);ctx.beginPath();ctx.ellipse(dx,Sy-56,25,29,0,0,Math.PI*2);ctx.fill();}
/* lichte trilling bij vasthouden, 0..1 */
const trem=T=>.5+.5*Math.sin(T*Math.PI*2*5.3)*Math.sin(T*Math.PI*2*.9+1);
const breath=T=>Math.sin(T*Math.PI*2/4);

/* Ademhalingsoefeningen: zittend op de hielen (zijaanzicht), buik en borst bewegen mee met het longvolume v.
   Rechts de ademvorm: een punt loopt met constante snelheid langs zijden die even lang zijn als de fasen. */
const PAGE={key:'adem-state',modes:false,
  groups:[{id:'v',label:'Methode',opts:[['box','Box breathing 5-5-5-5'],['478','4-7-8']]}]};
VX=0;VY=0;VW=640;VH=440;
const METH={
  box:{ph:[['in',5],['hold',5],['out',5],['hold',5]]},
  '478':{ph:[['in',4],['hold',7],['out',8]]}
};
const PH_LABEL={in:'IN',hold:'VASTHOUDEN',out:'UIT'};
PAGE.period=st=>METH[st.v].ph.reduce((a,p)=>a+p[1],0);
PAGE.still=st=>METH[st.v].ph[0][1]+1;
function phaseAt(st,T){
  const ph=METH[st.v].ph;let t=T,i=0;
  while(i<ph.length-1&&t>=ph[i][1]){t-=ph[i][1];i++;}
  const [kind,dur]=ph[i],prev=i?ph[i-1][0]:ph[ph.length-1][0];
  let v;
  if(kind==='in')v=ease(t/dur);else if(kind==='out')v=1-ease(t/dur);else v=(prev==='in')?1:0;
  return {i,kind,dur,t,v};
}
/* ademvorm: vierkant voor box breathing, driehoek met zijden 4:7:8 voor 4-7-8 */
function shapePts(st){
  if(st.v==='box'){const k=30,s=5*k;return [P(-s/2,s/2),P(-s/2,-s/2),P(s/2,-s/2),P(s/2,s/2)];}
  const k=33,x0=1/14,y0=Math.sqrt(16-x0*x0);
  const raw=[P(x0*k,y0*k),P(0,0),P(7*k,0)];
  const cx=(raw[0].x+raw[1].x+raw[2].x)/3,cy=(raw[0].y+raw[1].y+raw[2].y)/3;
  return raw.map(p=>P(p.x-raw[2].x/2,p.y-y0*k/2));
}
function drawShape(st,T,c,ox,oy){
  const pts=shapePts(st),ph=METH[st.v].ph,n=pts.length,cur=phaseAt(st,T);
  ctx.save();ctx.translate(ox,oy);
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle=c.mat;ctx.lineWidth=12;
  ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.stroke();
  /* afgelegde deel van de huidige ronde */
  ctx.strokeStyle=c.band;ctx.lineWidth=12;
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=0;i<cur.i;i++){const b=pts[(i+1)%n];ctx.lineTo(b.x,b.y);}
  const a=pts[cur.i],b=pts[(cur.i+1)%n],f=clamp(cur.t/cur.dur,0,1),pd=lerpP(a,b,f);
  ctx.lineTo(pd.x,pd.y);ctx.stroke();
  ctx.fillStyle=c.stage;dot(pd,13);ctx.fillStyle=c.band;dot(pd,9);
  /* korte labels per zijde */
  ctx.font='500 15px "Barlow Condensed", sans-serif';
  for(let i=0;i<n;i++){
    const p=pts[i],q=pts[(i+1)%n],m=lerpP(p,q,.5),u=unit(p,q);
    let nx=u.y,ny=-u.x;            /* normaal naar buiten (vorm loopt met de klok mee) */
    const lab=(ph[i][0]==='hold'?'VAST':PH_LABEL[ph[i][0]])+' '+ph[i][1];
    ctx.fillStyle=i===cur.i?c.ink:c.muted;
    ctx.textAlign=Math.abs(nx)<.3?'center':(nx>0?'left':'right');
    ctx.textBaseline=Math.abs(ny)<.3?'middle':(ny>0?'top':'bottom');
    ctx.fillText(lab,m.x+nx*16,m.y+ny*16);
  }
  /* aftellen in het midden */
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.fillStyle=c.ink;ctx.font='700 54px "Barlow Condensed", sans-serif';
  ctx.fillText(String(Math.max(1,Math.ceil(cur.dur-cur.t-1e-6))),0,184);
  ctx.fillStyle=c.muted;ctx.font='500 16px "Barlow Condensed", sans-serif';
  ctx.fillText(PH_LABEL[cur.kind],0,208);
  ctx.restore();
  return cur;
}
function sideKneel(c,v){
  F=-1;
  const lift=3*v;
  const K=P(70,-14),A=P(-62,-12),H=P(-74,-46),S=P(-66,-201-lift),Sj=P(S.x+2,S.y+4);
  /* handen rusten op de dijen, vingers richting de knie */
  const thA=Math.atan2(K.y-H.y,K.x-H.x);
  const onThigh=(t,dx,dy)=>{const p=lerpP(H,K,t);return P(p.x+Math.sin(thA)*24+dx,p.y-Math.cos(thA)*24+dy-4);};
  const arm=(dx,dy)=>{
    const s0=P(Sj.x+dx,Sj.y+dy),W=onThigh(.55,dx,dy);
    const E=ik(s0,W,104,81,(a,b)=>a.x<b.x);
    limb(s0,E,16,11,UA_F,UA_B);dot(E,11);
    limb(E,W,11.5,6.5,FA_F,FA_B);handAt(W,thA);
  };
  const leg=(dx,dy)=>{
    const h=P(H.x+dx,H.y+dy),k=P(K.x+dx,K.y+dy),a=P(A.x+dx,A.y);
    limb(h,k,24,15,THIGH_F,THIGH_B);dot(k,14.5);
    limb(k,a,14.5,9,SHIN_F,SHIN_B);
    capsule(a,9,P(a.x-34,a.y+6),6);
  };
  ctx.fillStyle=c.far;leg(-8,-3);arm(-10,-3);
  ctx.fillStyle=c.body;
  /* romp: borst en buik zetten uit met het longvolume */
  const TF=T_FRONT.map(b=>b.slice());TF[0][0]+=2.5*v;TF.push([10*v,.7,.13]);
  limb(S,H,27,24,TF,T_BACK);
  ctx.beginPath();ctx.ellipse(H.x-9,H.y+3,22,27,.25,0,Math.PI*2);ctx.fill();
  leg(0,0);
  capsule(P(S.x+2,S.y-14),12,P(S.x+3,S.y-30),11);
  ctx.beginPath();ctx.ellipse(S.x+6,S.y-56,25,29,0,0,Math.PI*2);ctx.fill();
  dot(P(Sj.x+2,Sj.y-2),21);
  /* middenrif/buik (primair), tussenribspieren (secundair) */
  ctx.save();ctx.fillStyle=c.mus;
  const tp=t=>lerpP(S,H,t);
  ctx.globalAlpha=.3+.7*v;const b=tp(.66);ctx.beginPath();ctx.ellipse(b.x+24+6*v,b.y,8+3*v,20,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=.55*(.3+.7*v);const r=tp(.4);ctx.beginPath();ctx.ellipse(r.x+8,r.y,14,20,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.fillStyle=c.body;outlined(()=>arm(0,0));
}
PAGE.draw=(st,T,c)=>{
  const cur=phaseAt(st,T);
  ctx.save();ctx.translate(176,372);ctx.scale(.95,.95);
  mat(c,-180,330);
  sideKneel(c,cur.v);
  ctx.restore();
  label(c,'ZIJAANZICHT',176,412);
  drawShape(st,T,c,462,170);
};
/* gongtonen: bij elke nieuwe fase één zachte, lage gong (in hoogst, vasthouden midden, uit laagst).
   Browsers spelen pas geluid af na een klik, dus het geluid gaat aan met de knop Geluid. */
(function(){
  let ac=null,on=false,lastI=-1,lastSec=-1;
  const btn=document.createElement('button');btn.type='button';btn.id='sound';btn.textContent='Geluid';btn.setAttribute('aria-pressed','false');
  document.querySelector('.seg.play').prepend(btn);
  btn.onclick=()=>{
    on=!on;btn.setAttribute('aria-pressed',String(on));
    if(on){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume();}catch(e){on=false;btn.setAttribute('aria-pressed','false');}lastI=-1;lastSec=-1;}
  };
  const PITCH={in:294,hold:220,out:165};
  /* korte, doffe gong: grondtoon met zwakke boventonen, laagdoorlaatfilter, ongeveer een seconde uitklank */
  function gong(f){
    if(!ac)return;const t=ac.currentTime,out=ac.createGain(),lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;lp.Q.value=.5;out.gain.value=.55;out.connect(lp);lp.connect(ac.destination);
    for(const [r,v,d] of [[1,.34,1.1],[1.48,.05,.55],[2.02,.025,.35]]){
      const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f*r;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.05);
    }
  }
  const draw0=PAGE.draw;
  PAGE.draw=(st,T,c,dt)=>{
    draw0(st,T,c,dt);
    if(window.__T!=null)return;
    const cur=phaseAt(st,T),sec=Math.floor(cur.t);
    if(on&&cur.i!==lastI)gong(PITCH[cur.kind]);
    lastI=cur.i;lastSec=sec;
  };
})();


/* ---------- knoppen, toestand en afspeellus ---------- */
(function(){
  const MODES=PAGE.modes===false?[]:[['iso','Isometrisch'],['dyn','Dynamisch']];
  const groups=PAGE.groups;
  const st={mode:PAGE.defMode||'iso'};groups.forEach(g=>st[g.id]=g.def||g.opts[0][0]);
  let playing=true,slow=false,phaseT=0,last=performance.now();
  const bar=document.getElementById('opts');
  const mk=(key,list,cls,aria)=>{if(!list.length)return;const box=document.createElement('div');box.className='seg '+cls;box.setAttribute('role','group');box.setAttribute('aria-label',aria);box.dataset.g=key;
    list.forEach(([id,lab])=>{const b=document.createElement('button');b.type='button';b.id=key+'-'+id;b.textContent=lab;b.dataset.v=id;b.onclick=()=>set(key,id);box.appendChild(b);});bar.appendChild(box);};
  mk('mode',MODES,'modes','Uitvoering');
  groups.forEach(g=>mk(g.id,g.opts,'vars',g.label));
  function sync(){
    bar.querySelectorAll('.seg').forEach(box=>{const k=box.dataset.g;box.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===st[k])));});
    document.querySelectorAll('.legend [data-when]').forEach(el=>{const [g,vals]=el.dataset.when.split(':');el.hidden=!vals.split(',').includes(st[g]);});
    if(PAGE.onChange)PAGE.onChange(st);
  }
  function set(k,v){st[k]=v;phaseT=0;sync();try{localStorage.setItem(PAGE.key,JSON.stringify(st))}catch(e){}}
  try{const s=JSON.parse(localStorage.getItem(PAGE.key)||'null');if(s){if(MODES.some(m=>m[0]===s.mode))st.mode=s.mode;groups.forEach(g=>{if(g.opts.some(o=>o[0]===s[g.id]))st[g.id]=s[g.id];});}}catch(e){}
  sync();
  window.__set=o=>{Object.assign(st,o);sync();};
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(playing&&!reduce)phaseT+=dt*(slow?.5:1);
    const per=PAGE.period(st);if(per)phaseT%=per;
    const T=window.__T!=null?window.__T:(reduce?PAGE.still(st):phaseT);
    const k=cv.width/VW;
    ctx.setTransform(k,0,0,k,-VX*k,-VY*k);
    const c={stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),muted:tok('--muted'),post:tok('--post'),band:tok('--band'),bandfar:tok('--bandfar'),ink:tok('--ink')};
    ctx.fillStyle=c.stage;ctx.fillRect(VX,VY,VW,VH);
    PAGE.draw(st,T,c,dt);
    requestAnimationFrame(frame);
  }
  document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
  document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
  requestAnimationFrame(frame);
})();

<\/script>

</body></html>
</script>
<script type="text/plain" id="src-runtime" data-run="1">
/* ===== Landtraining runtime: animaties, timer, speler en export =====
   Gedeeld door de app (bouwer) en elk geëxporteerd trainingsbestand. */
(function(){
const $=(s,r=document)=>r.querySelector(s);
const h=(tag,attrs={},...kids)=>{const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){if(v==null||v===false)continue;
    if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='html')e.innerHTML=v;else e.setAttribute(k,v===true?'':v);}
  for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)));}
  return e;};
const CAT=JSON.parse($('#catalog').textContent);
const byId={};CAT.exercises.forEach(e=>byId[e.id]=e);
const tok=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- animatie: de originele oefenpagina (artifact), ongewijzigd, in een iframe ----------
   De app leest de knoppen van de pagina zelf uit en bedient ze. Zo werkt elke animatie precies
   zoals gemaakt met de skill fitness-oefening-animatie, hoe de pagina intern ook is opgebouwd. */
const EMBED_CSS='<style id="lt-embed">html,body{margin:0!important;padding:0!important;background:transparent!important;overflow:hidden!important}'
 +'main{display:block!important;max-width:none!important;margin:0!important;padding:0!important}main>header,.bar,.legend{display:none!important}'
 +'.stage{border:0!important;border-radius:0!important;margin:0!important}canvas{display:block!important;width:100%!important;height:auto!important}</style>';
function pageSrc(id){return $(`script[data-ex="${id}"]`).textContent.replace(/<\\\/script/gi,'</'+'script');}
function Anim(box,exId,pairs,onReady){
  const ex=byId[exId];
  const fr=h('iframe',{class:'anim',title:'Animatie '+ex.naam,style:`aspect-ratio:${ex.w}/${ex.h}`,tabindex:'-1'});
  let doc=null,win=null;
  const a={ex,
    /* knopgroepen van de pagina: [{label,hidden,isMode,opts:[{text,pressed,hidden,btn}]}] */
    groups(){
      if(!doc)return [];
      const bar=doc.querySelector('.bar')||doc.body,map=new Map(),out=[];
      for(const b of bar.querySelectorAll('button')){
        if(['play','slow','sound'].includes(b.id)||b.closest('.seg.play'))continue;
        const g=b.closest('[role=group]')||b.parentElement;
        if(!map.has(g)){const o={label:g.getAttribute('aria-label')||'Variatie',hidden:!!g.closest('[hidden]'),opts:[]};map.set(g,o);out.push(o);}
        map.get(g).opts.push({text:b.textContent.trim(),pressed:b.getAttribute('aria-pressed')==='true',hidden:!!b.hidden,btn:b});
      }
      out.forEach(g=>{g.isMode=g.opts.some(o=>/^(isometrisch|dynamisch)$/i.test(o.text));});
      return out;
    },
    select(label,text){const g=a.groups().find(g=>g.label===label&&!g.hidden);if(!g)return false;
      const o=g.opts.find(o=>o.text===text);if(!o||o.hidden)return false;if(!o.pressed)o.btn.click();return true;},
    pairs(){return a.groups().filter(g=>!g.hidden).map(g=>[g.label,(g.opts.find(o=>o.pressed)||g.opts[0]).text]);},
    mode(){if(ex.ritme)return null;const g=a.groups().find(g=>g.isMode&&!g.hidden),p=g&&g.opts.find(o=>o.pressed);
      return p&&/^iso/i.test(p.text)?'iso':'dyn';},
    labels(){return a.groups().filter(g=>!g.hidden&&g.opts.filter(o=>!o.hidden).length>1).map(g=>(g.opts.find(o=>o.pressed)||{}).text).filter(Boolean);},
    legend(){const l=doc&&doc.querySelector('.legend');if(!l)return ex.legend||'';const c=l.cloneNode(true);c.querySelectorAll('[hidden]').forEach(x=>x.remove());return c.innerHTML;},
    /* ademritme (uit de catalogus): fasen van de gekozen methode */
    ritme(){if(!ex.ritme)return null;for(const [,t] of a.pairs())if(ex.ritme[t])return ex.ritme[t];return Object.values(ex.ritme)[0];},
    period(){const r=a.ritme();return r?r.reduce((s,p)=>s+p[1],0):0;},
    phase(t){const r=a.ritme();if(!r)return null;let i=0;while(i<r.length-1&&t>=r[i][1]){t-=r[i][1];i++;}return {i,kind:r[i][0]};},
    /* tijd van de animatie vastzetten (pagina's lezen window.__T of window.__ph) */
    setT(t){if(win){win.__T=t;win.__ph=t;}},
    clearT(){if(win){win.__T=null;win.__ph=null;}},
    destroy(){fr.remove();}
  };
  a.ready=new Promise(res=>{
    fr.addEventListener('load',()=>{
      try{win=fr.contentWindow;doc=fr.contentDocument;}catch(e){win=doc=null;}
      if(doc&&Array.isArray(pairs))for(let k=0;k<2;k++)pairs.forEach(([l,t])=>a.select(l,t));
      res(a);onReady&&onReady(a);
    },{once:true});
  });
  fr.srcdoc=pageSrc(exId).replace(/<link[^>]*fonts\.(googleapis|gstatic)[^>]*>/gi,'').replace(/<\/body>/i,EMBED_CSS+'</body>');
  box.append(fr);
  return a;
}

/* ---------- voorschrift van een onderdeel in de training ---------- */
const timed=it=>it.mode==='iso'||(byId[it.ex]&&byId[it.ex].tijd);
const workSec=it=>it.mode==='iso'?it.hold:it.work;
function fmtDur(s){s=Math.round(s);return s>=60?(Math.floor(s/60)+' min'+(s%60?' '+s%60+' s':'')):s+' s';}
function presc(it){
  const ex=byId[it.ex];
  if(ex&&ex.ritme)return `${it.rounds} rondes · ca. ${fmtDur(it.rounds*(it.period||20))}`;
  if(it.mode==='iso')return `${it.sets} × ${it.hold} s vasthouden · ${it.rest} s rust`;
  if(ex&&ex.tijd)return `${it.sets} × ${it.work} s · ${it.rest} s rust`;
  return `${it.sets} × ${it.reps} herhalingen · ${it.rest} s rust`;
}
function itemDur(it){ /* schatting in seconden */
  const ex=byId[it.ex];
  if(ex&&ex.ritme)return it.rounds*(it.period||20)+5;
  const work=timed(it)?workSec(it):it.reps*2.5;
  return 5+it.sets*work+(it.sets-1)*it.rest;
}
function fmtMin(s){const m=Math.round(s/60);return m<1?'< 1 min':m+' min';}

/* ---------- geluid: piepjes en gong (Web Audio, geen bestanden nodig) ---------- */
const Sound={ac:null,on:true,
  unlock(){try{this.ac=this.ac||new (window.AudioContext||window.webkitAudioContext)();if(this.ac.state==='suspended')this.ac.resume();
    const o=this.ac.createOscillator(),g=this.ac.createGain();g.gain.value=0;o.connect(g);g.connect(this.ac.destination);o.start();o.stop(this.ac.currentTime+.01);}catch(e){}},
  beep(f=880,d=.12,vol=.35){if(!this.on||!this.ac)return;const t=this.ac.currentTime,o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.setValueAtTime(vol,t+d-.03);g.gain.linearRampToValueAtTime(0,t+d);
    o.connect(g);g.connect(this.ac.destination);o.start(t);o.stop(t+d+.02);},
  tick(){this.beep(880,.12);},
  go(){this.beep(1320,.45,.4);},
  rest(){this.beep(660,.45,.4);},
  done(){this.beep(1320,.15);setTimeout(()=>this.beep(1320,.15),220);setTimeout(()=>this.beep(1760,.4),440);},
  gong(f){if(!this.on||!this.ac)return;const ac=this.ac,t=ac.currentTime,out=ac.createGain(),lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;out.gain.value=.7;out.connect(lp);lp.connect(ac.destination);
    for(const [r,v,d] of [[1,.34,1.1],[1.48,.05,.55],[2.02,.025,.35]]){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f*r;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.05);}}
};
let wake=null;
async function keepAwake(on){try{if(on&&!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null);}
  else if(!on&&wake){await wake.release();wake=null;}}catch(e){}}

/* ---------- timer voor één onderdeel ----------
   iso:  klaarmaken 5 s → vasthouden → rust → … (sets)
   dyn:  set uitvoeren (knop "Set klaar") → rust → …
   ritme: klaarmaken 5 s → ademritme gedurende rondes × periode, gong bij elke fase */
const PREP=5;
function Timer(it,anim,ui){
  const ex=byId[it.ex];
  const s={phase:'ready',set:1,end:0,start:0,left:0,paused:false,lastSec:null,lastPh:-1};
  const now=()=>performance.now()/1000;
  function enter(ph,dur){s.phase=ph;s.start=now();s.end=dur!=null?s.start+dur:0;s.lastSec=null;s.lastPh=-1;
    if(ph==='hold'||ph==='work'||ph==='breath')Sound.go();else if(ph==='rest')Sound.rest();
    if(ph!=='breath'&&ex.ritme)anim.clearT();
    ui();}
  function next(){
    if(s.phase==='prep'){enter(ex.ritme?'breath':timed(it)?'hold':'work',ex.ritme?it.rounds*anim.period():timed(it)?workSec(it):null);return;}
    if(s.phase==='breath'){finish();return;}
    if(s.phase==='hold'||s.phase==='work'){if(s.set>=it.sets){finish();return;}enter('rest',it.rest);return;}
    if(s.phase==='rest'){s.set++;enter(timed(it)?'hold':'work',timed(it)?workSec(it):null);return;}
  }
  function finish(){s.phase='done';Sound.done();if(ex.ritme)anim.clearT();keepAwake(false);ui();}
  const t={s,
    start(){Sound.unlock();keepAwake(true);
      if(s.phase==='ready'||s.phase==='done'){s.set=1;if(!ex.ritme&&!timed(it))enter('work',null);else enter('prep',PREP);}},
    pause(){if(s.paused||!s.end&&s.phase!=='work')return;s.paused=true;s.left=s.end?s.end-now():0;s.frozen=now()-s.start;s.pausedAt=now();ui();},
    resume(){if(!s.paused)return;const d=now()-s.pausedAt;s.start+=d;if(s.end)s.end+=d;s.paused=false;ui();},
    skip(){if(s.phase==='ready'||s.phase==='done')return;s.paused=false;next();},
    setDone(){if(s.phase==='work')next();},
    reset(){s.phase='ready';s.set=1;s.paused=false;if(ex.ritme)anim.clearT();keepAwake(false);ui();},
    remaining(){if(!s.end)return null;return Math.max(0,(s.paused?s.left:s.end-now()));},
    elapsed(){return s.paused?s.frozen:now()-s.start;},
    tick(){
      if(s.paused||s.phase==='ready'||s.phase==='done')return;
      if(s.phase==='breath'){const p=anim.phase(t.elapsed()%anim.period());
        if(p&&p.i!==s.lastPh){if(s.lastPh!==-1)Sound.gong({in:294,hold:220,out:165}[p.kind]||220);s.lastPh=p.i;}}
      if(!s.end)return;
      const r=s.end-now(),sec=Math.ceil(r);
      if(r<=0){next();return;}
      if(sec<=3&&sec!==s.lastSec&&s.phase!=='breath'){s.lastSec=sec;Sound.tick();}
      else if(s.phase==='breath'&&sec<=3&&sec!==s.lastSec){s.lastSec=sec;}
    }
  };
  return t;
}

/* ---------- speler: één oefening per scherm, pijltjes links/rechts ---------- */
function Player(root,session,opts={}){
  const items=session.items;
  let idx=-1,anim=null,timer=null,iv=0,raf=0;
  root.innerHTML='';
  const wrap=h('div',{class:'player'});root.append(wrap);
  const top=h('div',{class:'ptop'}),main=h('main'),nav=h('div',{class:'pnav'});
  wrap.append(top,main);
  const prev=h('button',{class:'arrow',type:'button','aria-label':'Vorige oefening',onclick:()=>go(idx-1)},'‹ Terug');
  const nxt=h('button',{class:'arrow',type:'button','aria-label':'Volgende oefening',onclick:()=>{Sound.unlock();go(idx+1);}},'Volgende ›');
  const count=h('div',{class:'count'});
  nav.append(prev,count,nxt);
  /* vegen naar links/rechts */
  let tx=null,ty=null;
  main.addEventListener('touchstart',e=>{const p=e.touches[0];tx=p.clientX;ty=p.clientY;},{passive:true});
  main.addEventListener('touchend',e=>{if(tx==null)return;const p=e.changedTouches[0],dx=p.clientX-tx,dy=p.clientY-ty;tx=null;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)go(idx+(dx<0?1:-1));},{passive:true});
  document.addEventListener('keydown',onKey);
  function onKey(e){if(e.target.closest&&e.target.closest('input,textarea,select'))return;
    if(e.key==='ArrowRight')go(idx+1);else if(e.key==='ArrowLeft')go(idx-1);}
  function cleanup(){if(anim)anim.destroy();anim=null;clearInterval(iv);cancelAnimationFrame(raf);keepAwake(false);}
  function header(){
    top.innerHTML='';
    if(opts.onClose)top.append(h('button',{type:'button',class:'ghost','aria-label':'Sluiten',onclick:()=>{cleanup();document.removeEventListener('keydown',onKey);opts.onClose();}},'✕'));
    const dots=h('div',{class:'dots'},items.map((_,i)=>h('i',{class:i===idx?'on':i<idx?'done':''})));
    top.append(h('div',{class:'grow'},h('div',{class:'title'},session.name||'Landtraining'),dots));
    const snd=h('button',{type:'button','aria-pressed':String(Sound.on),onclick:()=>{Sound.on=!Sound.on;snd.setAttribute('aria-pressed',String(Sound.on));snd.textContent=Sound.on?'🔔':'🔕';if(Sound.on)Sound.unlock();}},Sound.on?'🔔':'🔕');
    snd.setAttribute('aria-label','Geluid');
    top.append(snd);
  }
  function go(i){
    if(i<-1||i>=items.length)return;
    cleanup();idx=i;header();main.innerHTML='';main.scrollTop=0;
    prev.disabled=idx<=-1;nxt.disabled=idx>=items.length-1;
    count.textContent=idx<0?`0 / ${items.length}`:`${idx+1} / ${items.length}`;
    if(idx<0)return cover();
    const it=items[idx],ex=byId[it.ex];
    const stage=h('div',{class:'stage'}),legend=h('div',{class:'legend'});
    const head=h('div',{},h('h2',{class:'exname'},ex.naam),h('div',{class:'muted small'},(it.labels||[]).join(' · ')));
    anim=Anim(stage,it.ex,it.opts,a=>{legend.innerHTML=a.legend();if(ex.ritme)it.period=a.period();render();});
    const ph=h('div',{class:'phase'}),big=h('div',{class:'big'}),sets=h('div',{class:'sets'}),btns=h('div',{class:'row'});
    const box=h('div',{class:'timer'},h('div',{class:'presc'},presc(it)),ph,big,sets,btns);
    /* één kolom op elk scherm: figuur, timer en navigatie even breed onder elkaar */
    main.append(...[head,stage,box,nav,
      it.note?h('div',{class:'card small'},it.note):null,
      legend,
      h('div',{class:'muted small'},ex.houding)].filter(Boolean));
    timer=Timer(it,anim,render);
    function btn(lab,fn,cls){return h('button',{type:'button',class:cls||'',onclick:fn},lab);}
    function render(){
      const s=timer.s;btns.innerHTML='';ph.className='phase';
      const total=ex.ritme?'':`Set ${Math.min(s.set,it.sets)} van ${it.sets}`;
      sets.textContent=total;
      if(s.phase==='ready'){ph.textContent='Klaar om te starten';big.textContent=ex.ritme?fmtDur(it.rounds*(anim.period()||it.period||20)):timed(it)?workSec(it)+' s':it.reps+'×';
        btns.append(btn('Start',()=>timer.start(),'primary'));}
      else if(s.phase==='done'){ph.textContent='Klaar!';big.textContent='✓';sets.textContent=ex.ritme?'':`${it.sets} sets gedaan`;
        btns.append(btn('Opnieuw',()=>timer.reset()));if(idx<items.length-1)btns.append(btn('Volgende ›',()=>go(idx+1),'primary'));}
      else{
        const lab={prep:'Klaarmaken',hold:it.mode==='iso'?'Vasthouden':'Gaan!',work:`${it.reps} herhalingen`,rest:'Rust',breath:'Ademen'}[s.phase];
        ph.textContent=lab+(s.paused?' · pauze':'');ph.classList.add(s.phase==='rest'||s.phase==='prep'?'rest':'go');
        if(s.phase==='work')btns.append(btn('Set klaar',()=>timer.setDone(),'primary'));
        else btns.append(s.paused?btn('Hervat',()=>timer.resume(),'primary'):btn('Pauze',()=>timer.pause()));
        btns.append(btn('Overslaan',()=>timer.skip()));
      }
    }
    render();
    iv=setInterval(()=>timer.tick(),100);
    const draw=()=>{const s=timer.s;
      if(s.phase==='breath'){const per=anim.period();if(per)anim.setT(timer.elapsed()%per);}
      if(s.phase!=='ready'&&s.phase!=='done'){
        const r=timer.remaining();
        if(s.phase==='work')big.textContent=Math.floor(timer.elapsed())+' s';
        else if(r!=null)big.textContent=Math.ceil(r)+(r>=60?'':' s');
        if(r!=null&&r>=60){const m=Math.floor(Math.ceil(r)/60),ss=Math.ceil(r)%60;big.textContent=m+':'+String(ss).padStart(2,'0');}
      }
      raf=requestAnimationFrame(draw);};
    raf=requestAnimationFrame(draw);
  }
  function cover(){
    const tot=items.reduce((a,it)=>a+itemDur(it),0);
    main.append(h('div',{class:'cover full'},
      h('h1',{},session.name||'Landtraining'),
      h('div',{class:'muted'},[session.date?session.date.split('-').reverse().join('-'):'',session.trainer,`${items.length} oefeningen`,`ca. ${fmtMin(tot)}`].filter(Boolean).join(' · ')),
      session.note?h('div',{class:'card'},session.note):null,
      h('ol',{},items.map((it,i)=>h('li',{},h('a',{href:'#',onclick:e=>{e.preventDefault();go(i);}},byId[it.ex].naam),h('span',{class:'muted small'},' — '+[...(it.labels||[]),presc(it)].join(' · '))))),
      nav,
      opts.onEdit?h('button',{type:'button',onclick:()=>{cleanup();document.removeEventListener('keydown',onKey);opts.onEdit();}},'Aanpassen of bewaren (voor trainers)'):null,
      h('div',{class:'muted small'},`Tip: zet het geluid van je telefoon aan voor de piepjes. Druk op Volgende om te beginnen, of veeg naar links. · app v${session.appVersion||CAT.version}`)));
  }
  go(opts.start!=null?opts.start:-1);
  return {destroy(){cleanup();document.removeEventListener('keydown',onKey);}};
}

/* ---------- export: los HTML-bestand met alleen de gekozen oefeningen ---------- */
function exportHTML(session){
  const used=[...new Set(session.items.map(i=>i.ex))];
  const cat={...CAT,exercises:CAT.exercises.filter(e=>used.includes(e.id))};
  const esc=t=>t.replace(/<\/script/gi,'<\\/script');
  const blk=(type,text,attr)=>`<script type="${type}" ${attr}>\n${esc(text)}\n<\/script>\n`;
  const sess={...session,appVersion:CAT.version,exported:new Date().toISOString()};
  const title=(session.name||'Landtraining').replace(/[<&>]/g,'');
  return `<!doctype html>\n<html lang="nl"><head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n<title>${title}</title>\n<style id="app-css">\n${$('#app-css').textContent}\n</style>\n</head><body>\n<div id="app"></div>\n`
    +blk('application/json',JSON.stringify(cat),'id="catalog"')
    +blk('application/json',JSON.stringify(sess),'id="session"')
    +used.map(id=>blk('text/plain',$(`script[data-ex="${id}"]`).textContent,`data-ex="${id}"`)).join('')
    +blk('text/plain',$('#src-runtime').textContent,'id="src-runtime" data-run="1"')
    +`<script id="loader">\n${$('#loader').textContent}\n<\/script>\n</body></html>\n`;
}
function fileName(session){
  const n=(session.name||'training').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
  return `Landtraining-${session.date||new Date().toISOString().slice(0,10)}-${n||'training'}.html`;
}
/* sessie terughalen uit een geëxporteerd bestand of uit JSON */
function readSession(text){
  const m=text.match(/<script type="application\/json" id="session">\s*([\s\S]*?)\s*<\/script>/);
  const j=JSON.parse(m?m[1]:text);
  if(!j||!Array.isArray(j.items))throw new Error('Geen training gevonden in dit bestand');
  return j;
}

/* ---------- training in een link: compacte JSON, gecomprimeerd, base64url ---------- */
const b64u={enc(bytes){let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');},
  dec(str){const s=atob(str.replace(/-/g,'+').replace(/_/g,'/'));const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b;}};
async function pipe(bytes,stream){const r=new Response(new Blob([bytes]).stream().pipeThrough(stream));return new Uint8Array(await r.arrayBuffer());}
/* v2 (korte link): teksten van knoppen worden nummers uit CAT.codes (src/groups.json, vaste volgorde).
   [2,naam,dag,trainer,notitie,[oefening,modus,keuzes,labelmasker,sets,waarde,rust,periode,notitie],…]
   oefening = nummer in CAT.codes; modus 0 iso,1 dyn,2 ritme; waarde = vasthouden/duur/herhalingen/rondes. */
const CODE_IDS=Object.keys(CAT.codes||{});
const D0=Date.UTC(2000,0,1),DAY=864e5;
const toDay=d=>{const t=Date.parse(d+'T00:00:00Z');return isNaN(t)?d||'':Math.round((t-D0)/DAY);};
const fromDay=n=>typeof n==='number'?new Date(D0+n*DAY).toISOString().slice(0,10):n;
const trimEnd=a=>{while(a.length&&(a[a.length-1]===''||a[a.length-1]==null))a.pop();return a;};
function packItem(it){
  const tab=CAT.codes[it.ex]||[],ex=byId[it.ex],code=t=>{const i=tab.indexOf(t);return i<0?t:i;};
  const pairs=it.opts||[],labels=it.labels||[];
  let mask=0,k=0;pairs.forEach(([,t],i)=>{if(labels[k]===t){mask|=1<<i;k++;}});
  const m=ex.ritme?2:it.mode==='iso'?0:1;
  const v=m===2?it.rounds:m===0?it.hold:ex.tijd?it.work:it.reps;
  return trimEnd([CODE_IDS.indexOf(it.ex),m,pairs.flat().map(code),k===labels.length?mask:labels,it.sets,v,it.rest,m===2?it.period||0:0,(it.note||'').trim()]);
}
function unpackItem(a){
  const [e,m,codes=[],mask=0,sets,v,rest,period,note]=a,id=CODE_IDS[e],ex=byId[id];if(!ex)return null;
  const tab=CAT.codes[id],txt=x=>typeof x==='number'?tab[x]:x,opts=[];
  for(let i=0;i+1<codes.length;i+=2)opts.push([txt(codes[i]),txt(codes[i+1])]);
  const labels=Array.isArray(mask)?mask:opts.filter((p,i)=>mask&(1<<i)).map(p=>p[1]);
  const it={ex:id,mode:m===2?null:m===0?'iso':'dyn',opts,labels,sets,rest};
  if(m===2){it.rounds=v;if(period)it.period=period;}else if(m===0)it.hold=v;else if(ex.tijd)it.work=v;else it.reps=v;
  if(note)it.note=note;
  return it;
}
async function encodeSession(s){
  const t=x=>(x||'').trim();
  const raw=new TextEncoder().encode(JSON.stringify([2,t(s.name),toDay(s.date),t(s.trainer),t(s.note),...s.items.map(packItem)]));
  let best='x'+b64u.enc(raw);
  try{if(window.CompressionStream){const z='y'+b64u.enc(await pipe(raw,new CompressionStream('deflate-raw')));if(z.length<best.length)best=z;}}catch(e){}
  return best;
}
async function decodeSession(str){
  let bytes=b64u.dec(str.slice(1));
  if(str[0]==='z'||str[0]==='y')bytes=await pipe(bytes,new DecompressionStream('deflate-raw'));
  const j=JSON.parse(new TextDecoder().decode(bytes));
  let s;
  if(Array.isArray(j)){const [,name,day,trainer,note,...items]=j;
    s={v:2,name,date:fromDay(day),trainer:trainer||'',note:note||'',items:items.map(unpackItem).filter(Boolean)};}
  else{s=j;s.appVersion=s.app;}  /* v1: lange links van vóór 1.1.0 blijven werken */
  s.items=(s.items||[]).filter(i=>byId[i.ex]);
  return s;
}
const isWeb=/^https?:$/.test(location.protocol);
function appURL(){return location.origin+location.pathname;}
async function shareLink(s){return appURL()+'#t='+await encodeSession(s);}

window.APP={CAT,byId,h,$,Anim,presc,timed,fmtDur,itemDur,fmtMin,Sound,Player,exportHTML,fileName,readSession,encodeSession,decodeSession,shareLink,isWeb,
  async start(){
    document.documentElement.lang='nl';
    const s=JSON.parse($('#session').textContent);
    if(s){document.title=s.name||'Landtraining';Player($('#app'),s);return;}
    const m=location.hash.match(/[#&]t=([^&]+)/);
    if(m){
      try{const t=await decodeSession(m[1]);document.title=t.name||'Landtraining';
        Player($('#app'),t,APP.Builder?{onEdit:()=>{history.replaceState(null,'',appURL());APP.Builder($('#app'),{open:t});}}:{});return;}
      catch(e){console.error(e);alert('Deze trainingslink is niet compleet. Vraag je trainer om de link opnieuw te sturen.');history.replaceState(null,'',appURL());}
    }
    if(APP.Builder)APP.Builder($('#app'));
  }};
addEventListener('hashchange',()=>{if(/[#&]t=/.test(location.hash))location.reload();});
})();

<script type="text/plain" id="src-builder" data-run="1">
/* ===== Landtraining bouwer: training samenstellen, bewaren, exporteren ===== */

const today=()=>new Date().toISOString().slice(0,10);

function toast(msg){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=h('div',{class:'toast',role:'status'},msg);document.body.append(t);setTimeout(()=>t.remove(),2600);}
function sheet(title,build,{onClose}={}){
  const body=h('div',{class:'body'});
  const close=()=>{el.remove();document.removeEventListener('keydown',esc);onClose&&onClose();};
  const esc=e=>{if(e.key==='Escape')close();};
  const el=h('div',{class:'sheet',onclick:e=>{if(e.target===el)close();}},
    h('div',{class:'panel',role:'dialog','aria-modal':'true','aria-label':title},
      h('div',{class:'head'},h('h2',{},title),h('button',{type:'button',class:'ghost','aria-label':'Sluiten',onclick:close},'✕')),body));
  document.body.append(el);document.addEventListener('keydown',esc);
  build(body,close);

}
function stepper(label,val,min,max,step,onchange,unit=''){
  const inp=h('input',{type:'number',inputmode:'numeric',min,max,step,value:val,'aria-label':label});
  const setv=v=>{v=Math.max(min,Math.min(max,Math.round(v/step)*step||min));inp.value=v;onchange(v);};
  inp.addEventListener('change',()=>setv(+inp.value));
  return h('label',{class:'stepper'},h('span',{},label+(unit?` (${unit})`:'')),
    h('div',{},h('button',{type:'button','aria-label':label+' minder',onclick:()=>setv(+inp.value-step)},'−'),inp,
      h('button',{type:'button','aria-label':label+' meer',onclick:()=>setv(+inp.value+step)},'+')));
}

APP.Builder=function(root,startOpts={}){

        h('label',{class:'f'},'Datum',h('input',{type:'date',value:S.date,oninput:e=>{S.date=e.target.value;save();}})),

    });

      h('div',{class:'grow',style:'min-width:0'},h('div',{class:'muted small'},'Laatst bewerkt'),h('b',{},resume.name||'Zonder naam')),
      h('button',{type:'button',onclick:()=>{S=JSON.parse(JSON.stringify(resume));resume=null;save();render();}},'Verder'),
      h('button',{type:'button',class:'ghost','aria-label':'Melding sluiten',onclick:()=>{resume=null;render();}},'✕')):null;
    const body=h('div',{class:'wrap stack'},...[banner,meta].filter(Boolean),

  /* ---------- oefening kiezen met filters uit de Oefenbibliotheek ---------- */
  const F=store.get('lt-filter',{type:'',hoofd:'',spier:'',groep:''});
  function picker(){

      const out=h('div',{class:'pick'});

        const row=h('div',{class:'chips',role:'group','aria-label':label});
        const mk=(v,lab)=>{const n=CAT.exercises.filter(e=>match(e,{...F,[key]:v})).length;
          return h('button',{type:'button','aria-pressed':String(F[key]===v),onclick:()=>{F[key]=v;store.set('lt-filter',F);draw();}},lab+(v?` ${n}`:''));};
        row.append(mk('','Alle'),...vals.map(v=>mk(v,v)));
        return row;
      };
      const sel=(key,vals,label)=>{const s=h('select',{'aria-label':label,onchange:e=>{F[key]=e.target.value;store.set('lt-filter',F);draw();}},
        h('option',{value:''},label+': alle'),...vals.map(v=>h('option',{value:v,selected:F[key]===v},v)));return s;};
      const filters=h('div',{class:'stack'});
      body.append(filters,out);
      function draw(){
        filters.innerHTML='';
        filters.append(
          h('div',{class:'muted small'},'Type'),chipRow('type',L.types,'Type'),
          h('div',{class:'muted small'},'Hoofdgroep'),chipRow('hoofd',L.hoofdgroepen,'Hoofdgroep'),
          h('div',{class:'two'},h('div',{},sel('spier',L.spiergroepen,'Spiergroep')),h('div',{},sel('groep',L.groepen,'Categorie'))));
        out.innerHTML='';
        const res=CAT.exercises.filter(e=>match(e,F));
        if(!res.length)out.append(h('div',{class:'empty'},'Geen oefeningen met deze filters.'));
        res.forEach(e=>out.append(h('button',{type:'button',onclick:()=>{close();configure(e.id);}},
          h('b',{},e.naam),
          h('span',{class:'muted small'},e.sub||e.spiergroepen.join(', ')),
          h('span',{},h('span',{class:'tag'},e.type),h('span',{class:'tag'},e.hoofdgroep),e.groep!==e.type?h('span',{class:'tag'},e.groep):null))));

  function match(e,f){return(!f.type||e.type===f.type)&&(!f.hoofd||e.hoofdgroep===f.hoofd)&&(!f.spier||e.spiergroepen.includes(f.spier))&&(!f.groep||e.groep===f.groep);}

  /* ---------- keuzes en aantallen voor één oefening ---------- */
  function configure(exId,existing,index){

    const defFor=m=>m==='iso'?DEF.iso:ex.tijd?DEF.tijd:DEF.dyn;

      const stage=h('div',{class:'stage loading'}),legend=h('div',{class:'legend'});
      const desc=h('div',{class:'muted small'}),nums=h('div',{class:'steppers'}),segs=h('div',{class:'stack'});
      const saveBtn=h('button',{type:'button',class:'primary',disabled:true,onclick:()=>{
        it.opts=anim.pairs();it.mode=anim.mode();it.labels=anim.labels();
        if(ex.ritme)it.period=anim.period();
        if(existing)S.items[index]=it;else S.items.push(it);
        save();close();render();if(!existing)toast(ex.naam+' toegevoegd');}},existing?'Opslaan':'Toevoegen aan training');
      /* modus volgen: bij wisselen iso <-> dyn de standaardaantallen nemen, sets behouden */
      function syncMode(){
        const m=anim.mode();
        if(m!==it.mode){const sets=it.sets;it.mode=m;if(m)Object.assign(it,defFor(m),sets?{sets}:{});}
        else if(m&&it.sets==null)Object.assign(it,defFor(m));
        if(m&&ex.tijd&&it.work==null)it.work=DEF.tijd.work;
        if(m==='dyn'&&!ex.tijd&&it.reps==null)it.reps=DEF.dyn.reps;
        if(m==='iso'&&it.hold==null)it.hold=DEF.iso.hold;
      }
      function drawSegs(){
        segs.innerHTML='';
        for(const g of anim.groups()){
          if(g.hidden)continue;
          const opts=g.opts;if(opts.length<2&&!g.isMode)continue;

            opts.map(o=>h('button',{type:'button','aria-pressed':String(o.pressed),disabled:o.hidden,
              onclick:()=>{anim.select(g.label,o.text);refresh();}},o.text))));

      function syncDesc(){

  function doShare(s){if(isWeb)return shareWeb(s);return shareFile(s);}
  /* webversie: training als link, direct naar WhatsApp */
  async function shareWeb(s){

      body.append(...[
        h('div',{},h('b',{},s.name),h('div',{class:'muted small'},`${s.items.length} ${s.items.length===1?'oefening':'oefeningen'} · de hele training zit in de link`)),
        h('button',{type:'button',class:'primary',onclick:()=>{markShared(s);location.href='https://wa.me/?text='+encodeURIComponent(msg);}},'Delen via WhatsApp'),
        h('div',{class:'muted small'},'WhatsApp opent met het bericht klaar; kies de groep en verstuur. Zwemmers tikken op de link en zien de training met animaties en timer.'),
        navigator.share?h('button',{type:'button',onclick:async()=>{try{await navigator.share({title:s.name,text:msg});markShared(s);close();}catch(e){}}},'Ander deelmenu …'):null,
        h('button',{type:'button',onclick:async()=>{try{await navigator.clipboard.writeText(link);toast('Link gekopieerd');markShared(s);}catch(e){prompt('Kopieer de link:',link);}}},'Link kopiëren'),

  function shareFile(s){

    let file=null;try{file=new File([blob],name,{type:'text/html'});}catch(e){}

    const text=summary(s);
    sheet('Delen',(body,close)=>{
      body.append(...[
        h('div',{},h('b',{},s.name),h('div',{class:'muted small'},`${s.items.length} oefeningen · bestand ${Math.round(blob.size/1024)} kB, werkt zonder internet`)),
        h('button',{type:'button',class:'primary',onclick:async()=>{
          if(canFile){try{await navigator.share({files:[file],text:`${s.name} – open het bestand voor de animaties en de timer`});markShared(s);close();return;}
            catch(e){if(e.name==='AbortError')return;}}
          /* geen bestand-delen in deze browser: bestand opslaan en WhatsApp openen */
          download(blob,name);markShared(s);
          toast('Bestand opgeslagen – voeg het in WhatsApp toe via Bijlage → Document');
          setTimeout(()=>{location.href='https://wa.me/?text='+encodeURIComponent(`${s.name}: training staat in de bijlage (${name})`);},900);
        }},'Delen via WhatsApp'),
        h('div',{class:'muted small'},canFile?'Kies WhatsApp in het deelmenu en daarna de groep.':'Deze browser kan geen bestanden direct delen. Het bestand wordt opgeslagen en WhatsApp gaat open; voeg het daar toe via Bijlage → Document.'),
        h('button',{type:'button',onclick:()=>{markShared(s);location.href='https://wa.me/?text='+encodeURIComponent(text);}},'Alleen tekst naar WhatsApp'),
        h('div',{class:'muted small'},'Een kort overzicht (oefeningen, sets, tijden) als bericht, zonder animaties.'),
        h('button',{type:'button',onclick:()=>{download(blob,name);markShared(s);toast('Bestand opgeslagen');}},'Opslaan als bestand')].filter(Boolean));
    });
  }

  /* ---------- historie: alle trainingen op dit toestel ---------- */
  function hist(){return store.get('lt-saved',[]);}
  function remember(s){
    const all=hist(),i=all.findIndex(x=>x.id===s.id);
    const copy={...JSON.parse(JSON.stringify(s)),updated:new Date().toISOString()};
    if(i>=0)all[i]=copy;else all.push(copy);
    return store.set('lt-saved',all);
  }
  function forget(id){store.set('lt-saved',hist().filter(x=>x.id!==id));}
  const fmtD=iso=>{if(!iso)return '';const d=iso.slice(0,10).split('-');return `${d[2]}-${d[1]}-${d[0]}`;};
  function history(){
    sheet('Mijn trainingen',(body,close)=>{
      const q=h('input',{type:'search',placeholder:'Zoek op naam, trainer of oefening'});
      const list=h('div',{class:'list'});
      const tools=h('div',{class:'two'},
        h('button',{type:'button',class:'primary',onclick:()=>{close();S=newSession();save();render();}},'+ Nieuwe'),
        h('button',{type:'button',onclick:()=>{close();openFile();}},'Openen uit bestand'));
      const backup=h('div',{class:'two'},
        h('button',{type:'button',onclick:makeBackup},'Back-up maken'),
        h('button',{type:'button',onclick:()=>{close();openFile();}},'Back-up terugzetten'));
      body.append(tools,q,list,h('h3',{},'Back-up'),
        h('div',{class:'muted small'},'De historie staat alleen op dit toestel, in deze browser. Maak af en toe een back-up (één bestand met alle trainingen) en bewaar die, of zet hem over naar een andere telefoon.'),backup);
      q.addEventListener('input',draw);
      function draw(){
        const term=q.value.trim().toLowerCase();
        const all=hist().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.updated||'').localeCompare(a.updated||''));
        const res=all.filter(s=>!term||[s.name,s.trainer,s.note,...s.items.map(i=>byId[i.ex]?byId[i.ex].naam:'')].join(' ').toLowerCase().includes(term));
        list.innerHTML='';
        if(!res.length){list.append(h('div',{class:'empty'},all.length?'Geen trainingen gevonden.':'Nog geen trainingen. Een training komt hier vanzelf zodra je er een oefening aan toevoegt.'));return;}
        let month='';
        res.forEach(s=>{
          const m=(s.date||'').slice(0,7);
          if(m!==month){month=m;const [y,mm]=m.split('-');list.append(h('div',{class:'muted small',style:'margin-top:6px;text-transform:capitalize'},m?new Date(+y,+mm-1,1).toLocaleDateString('nl-NL',{month:'long',year:'numeric'}):'Zonder datum'));}
          const tot=s.items.reduce((a,it)=>a+itemDur(it),0);
          const open=()=>{S=JSON.parse(JSON.stringify(s));save();close();render();};
          list.append(h('div',{class:'card hist'+(s.id===S.id?' current':'')},
            h('div',{onclick:open,style:'cursor:pointer'},
              h('div',{class:'t'},s.name||'Zonder naam',s.id===S.id?h('span',{class:'tag'},'nu open'):null),
              h('div',{class:'d'},[fmtD(s.date),s.trainer,`${s.items.length} ${s.items.length===1?'oefening':'oefeningen'}`,`ca. ${fmtMin(tot)}`].filter(Boolean).join(' · ')),
              s.shared?h('div',{class:'d'},'Gedeeld op '+fmtD(s.shared)):null),
            h('div',{class:'hacts'},
              h('button',{type:'button',onclick:open},'Openen'),
              h('button',{type:'button',onclick:()=>{const c={...JSON.parse(JSON.stringify(s)),id:uid(),name:(s.name||'Training')+' (kopie)',date:today()};delete c.shared;S=c;save();close();render();toast('Kopie gemaakt – pas hem aan');}},'Kopie'),
              h('button',{type:'button',onclick:()=>doShare(s)},'Delen'),
              h('button',{type:'button','aria-label':'Verwijderen',onclick:()=>{if(!confirm(`"${s.name||'Zonder naam'}" verwijderen?`))return;forget(s.id);if(s.id===S.id){S=newSession();store.set('lt-draft',S);render();}draw();}},'🗑'))));
        });
      }
      draw();
    });
  }
  function makeBackup(){
    const data={app:'landtraining',type:'backup',appVersion:CAT.version,created:new Date().toISOString(),trainings:hist()};
    const name=`Landtraining-backup-${today()}.json`,blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
    let file=null;try{file=new File([blob],name,{type:'application/json'});}catch(e){}
    let can=false;try{can=!!(file&&navigator.canShare&&navigator.canShare({files:[file]}));}catch(e){}
    if(can)navigator.share({files:[file]}).catch(()=>download(blob,name));else download(blob,name);
    toast(`Back-up met ${data.trainings.length} trainingen gemaakt`);
  }
  function openFile(){
    const inp=h('input',{type:'file',accept:'.html,.htm,.json,text/html,application/json'});
    inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
      const text=await f.text();
      try{const j=JSON.parse(text);if(j&&j.type==='backup'&&Array.isArray(j.trainings)){
          const all=hist();let n=0;
          j.trainings.forEach(s=>{const i=all.findIndex(x=>x.id===s.id);if(i<0){all.push(s);n++;}else if((s.updated||'')>(all[i].updated||'')){all[i]=s;n++;}});
          store.set('lt-saved',all);toast(`Back-up teruggezet: ${n} trainingen toegevoegd of bijgewerkt`);history();return;}}catch(e){}
      try{const s=readSession(text);const missing=s.items.filter(i=>!byId[i.ex]);
        s.items=s.items.filter(i=>byId[i.ex]);s.id=s.id||uid();S=s;save();render();
        toast(missing.length?`Geopend; ${missing.length} oefening(en) niet in deze app-versie`:'Training geopend');}
      catch(e){toast('Dit bestand bevat geen training of back-up');}};
    inp.click();
  }
  function menu(){
    sheet('Menu',(body,close)=>{
      body.append(
        h('div',{class:'stack'},
          h('button',{type:'button',onclick:()=>{close();history();}},'Mijn trainingen'),
          h('button',{type:'button',onclick:()=>{close();S=newSession();save();render();}},'Nieuwe training'),
          h('button',{type:'button',onclick:()=>{close();openFile();}},'Training of back-up openen …'),
          h('button',{type:'button',disabled:!S.items.length,onclick:()=>{S={...JSON.parse(JSON.stringify(S)),id:uid(),name:(S.name||'Training')+' (kopie)',date:today()};delete S.shared;save();close();render();toast('Kopie gemaakt');}},'Kopie maken van deze training')),
        h('div',{class:'muted small'},`Landtraining app v${CAT.version} · ${CAT.exercises.length} oefeningen. Alles werkt offline; alleen de WhatsApp-knoppen openen WhatsApp. Trainingen worden automatisch bewaard onder Mijn trainingen.`));
    });
  }
  render();
};
})();

</script>
<script id="loader">
for(const s of document.querySelectorAll('script[data-run]'))(0,eval)(s.textContent);
APP.start();
</script>
<script>if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body></html>
