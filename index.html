const hFlat=W=>hand(W);
const hAlong=(W,E)=>rotHand(W,Math.atan2(W.y-E.y,W.x-E.x));
/* nabije arm met dun randje in de achtergrondkleur */
function outlined(fn,c,col){const f0=ctx.fill;ctx.strokeStyle=c.stage;ctx.lineWidth=5;ctx.lineJoin='round';ctx.fill=function(){ctx.stroke();};fn();ctx.fill=f0;ctx.fillStyle=col||c.body;fn();}
function glow(alpha,fn){ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,alpha));ctx.fillStyle=COL.mus;fn();ctx.restore();}
/* spier langs een segment, naar de voorkant (+1) of achterkant (-1) */
function muscleOn(a,b,t0,t1,off,r0,r1){const u=nrm(sub(b,a)),n=P(u.y,-u.x);const p0=add(along(a,b,t0),mul(n,off)),p1=add(along(a,b,t1),mul(n,off));capsule(p0,r0,p1,r1);}

function mat(x,y,w){ctx.fillStyle=COL.mat;ctx.beginPath();ctx.roundRect(x,y,w,10,5);ctx.fill();}
let COL={};

/* ===== Extra helpers voor groep 6 ===== */
const hBack=W=>rotHand(W,Math.PI,true);           /* vlakke hand op de vloer, vingers naar achteren */
const rotV=(v,a)=>P(v.x*Math.cos(a)-v.y*Math.sin(a),v.x*Math.sin(a)+v.y*Math.cos(a));
/* staande voet; fa = hiel omhoog (rad), de bal blijft op de grond */
function footRise(A,fa){
  fa=fa||0;const r=v=>add(A,rotV(v,fa));
  const ball=r(P(27,6));capsule(r(P(-6,3)),9,ball,6.5);
  const toe=fa<.05?r(P(37,6.5)):P(ball.x+10,ball.y+.3);capsule(ball,6.5,toe,5);
}
const ankleOnBall=(ball,fa)=>add(ball,rotV(P(-27,-6),fa||0));
const FLAT_ANK=-13;                 /* hoogte van de enkel bij een platte voet */
/* arm met hoeken: a = schouderhoek vanaf recht omlaag (+ naar voren), b = elleboog (+ buigt naar voren) */
const dirD=a=>P(Math.sin(a),Math.cos(a));
function armFK(S,a,b){const E=add(S,mul(dirD(a),L_UA)),W=add(E,mul(dirD(a+(b||0)),L_FA));return {E,W};}
function legFK(H,a,b){const K=add(H,mul(dirD(a),L_THIGH)),A=add(K,mul(dirD(a-(b||0)),L_SHIN));return {K,A};}
/* tijdelijke laag met doorzichtigheid (voor in- en uitfaden zonder overlap te zien) */
const OFF=document.createElement('canvas');
function layer(alpha,fn){
  if(alpha>=.999){fn();return;}if(alpha<=.001)return;
  OFF.width=cv.width;OFF.height=cv.height;const o=OFF.getContext('2d');o.setTransform(ctx.getTransform());
  const m=ctx;ctx=o;try{fn();}finally{ctx=m;}
  m.save();m.setTransform(1,0,0,1,0,0);m.globalAlpha=alpha;m.drawImage(OFF,0,0);m.restore();
}
/* hoofdrichting: rompas (heup naar schouder) gedraaid met tilt (+ = kin naar de borst) */
function headDir(S,H,tilt){const u=nrm(sub(S,H)),n=P(-u.y,u.x),t=tilt||0;return P(u.x*Math.cos(t)+n.x*Math.sin(t),u.y*Math.cos(t)+n.y*Math.sin(t));}
/*
 Algemeen zijaanzicht, figuur kijkt naar rechts (+x), grond y=0.
 q: {H,S,C?(controlepunt ronde rug),tilt|hd,seat,
     legs:[ver,nabij] {H?,K,A,foot(A,K)}, arms:[ver,nabij] {Sj?,E,W,hand(W,E)}}
 hk: haken mus (spieren na het nabije been), far (na de verre ledematen), after
*/
function figSide(q,c,hk){
  hk=hk||{};F=-1;
  const fo=q.farOff||P(-11,-3),ao=q.farArmOff||P(-12,-4);
  const hd=q.hd||headDir(q.S,q.H,q.tilt);
  const L=(l,o)=>{ctx.save();ctx.translate(o.x,o.y);leg(l.H||q.H,l.K,l.A,l.foot);ctx.restore();};
  const A=(a,o)=>{ctx.save();ctx.translate(o.x,o.y);arm(a.Sj||q.S,a.E,a.W,a.hand);ctx.restore();};
  ctx.fillStyle=c.far;
  if(q.arms&&q.arms[0])A(q.arms[0],ao);
  if(q.legs&&q.legs[0])L(q.legs[0],fo);
  if(hk.far){ctx.save();hk.far();ctx.restore();}
  ctx.fillStyle=c.body;
  if(q.C)curveLimb(q.S,q.C,q.H,27,24,T_FRONT,T_BACK);else torso(q.S,q.H);
  (q.seat?bilSeated:bil)(q.C||q.S,q.H);
  if(q.legs&&q.legs[1]){if(q.legOutline)outlined(()=>L(q.legs[1],P(0,0)),c);else L(q.legs[1],P(0,0));}
  if(hk.mus){ctx.save();hk.mus();ctx.restore();}
  ctx.fillStyle=c.body;
  if(!q.noHead)head(q.S,hd);
  if(hk.beforeArm){ctx.save();hk.beforeArm();ctx.restore();ctx.fillStyle=c.body;}
  if(q.arms&&q.arms[1]){if(q.armPlain)A(q.arms[1],P(0,0));else outlined(()=>A(q.arms[1],P(0,0)),c);}
  if(hk.after){ctx.save();hk.after();ctx.restore();}
}
/* oplossen: rompkanteling zodat de schouder op afstand d van punt W ligt (bisectie) */
function leanFor(H,W,d,lo,hi){
  const f=l=>len(sub(add(H,P(L_TORSO*Math.sin(l),-L_TORSO*Math.cos(l))),W))-d;
  let a=lo,b=hi;for(let i=0;i<40;i++){const m=(a+b)/2;(f(a)*f(m)<=0)?b=m:a=m;}return (a+b)/2;
}
const shoulderAt=(H,lean)=>add(H,P(L_TORSO*Math.sin(lean),-L_TORSO*Math.cos(lean)));
const trem=t=>.5+.5*Math.sin(t*Math.PI*2*5.3)*Math.sin(t*Math.PI*2*.9+1);
const lerpP=(a,b,t)=>P(lerp(a.x,b.x,t),lerp(a.y,b.y,t));

/* hand plat op de vloer van bovenaf (handpalm naar beneden): palm + vingers ca. 22 voorbij de pols, duim aan de binnenkant.
   W = pols, d = richting van de onderarm (eenheid), inner = punt aan de lichaamskant */
function topHand(W,d,inner){
  const a=Math.atan2(d.y,d.x),ly=P(-d.y,d.x),s=((inner.x-W.x)*ly.x+(inner.y-W.y)*ly.y)>=0?1:-1;
  ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);
  ctx.beginPath();ctx.roundRect(-3,-8.5,25,17,[5,8,8,5]);ctx.fill();
  ctx.beginPath();ctx.ellipse(5,s*9.5,7.5,4.2,s*.55,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

/* ===== Startsprong: startpositie, ver springen en zacht landen ===== */
const SJ_XS=-200,SJ_XL=165,SJ_FLY=88;
/* hoeken van een arm uit schouder, elleboog en pols */
const armAngles=(S,E,W)=>{const a=Math.atan2(E.x-S.x,E.y-S.y),b=Math.atan2(W.x-E.x,W.y-E.y)-a;return {a,b};};
/* startpositie: voorover, handen bij de tenen; track = verre voet achter, stream = armen in stroomlijn */
function sjStart(track,stream){
  const An=P(SJ_XS,FLAT_ANK);
  const K=add(An,P(132*Math.sin(22*DEG),-132*Math.cos(22*DEG)));
  let H=add(K,P(-148*Math.sin(40*DEG),-148*Math.cos(40*DEG)));
  if(track)H=add(H,P(10,4));
  const W=P(SJ_XS+38,-52);
  const lean=leanFor(H,W,176,80*DEG,150*DEG);
  const S=shoulderAt(H,lean);
  let aN,aF;
  if(stream){const a=Math.PI-lean;aN={a,b:0};aF={a:a-.03,b:0};}
  else{const E=ik(S,W,L_UA,L_FA,P(-.4,-1));aN=armAngles(S,E,W);aF={a:aN.a-.04,b:aN.b};}
  const Af=track?ankleOnBall(P(SJ_XS-100,-6.5),.8):An;
  return {H,lean,tilt:stream?.12:.55,An,Af,faN:0,faF:track?.8:0,gN:1,gF:1,aN,aF,g:.8};
}
/* landingshouding: dij-hoek th vanaf verticaal, lean romp */
function sjLand(th,lean,armA){
  const An=P(SJ_XL,FLAT_ANK);
  const sh=18+th*.32;
  const K=add(An,P(132*Math.sin(sh*DEG),-132*Math.cos(sh*DEG)));
  const H=add(K,P(-148*Math.sin(th*DEG),-148*Math.cos(th*DEG)));
  return {H,lean:lean*DEG,tilt:.1,An,Af:An,faN:0,faF:0,gN:1,gF:1,aN:{a:armA*DEG,b:.15},aF:{a:armA*DEG-.05,b:.15},g:.9};
}
function sjKeys(v){
  const track=v===1,stream=v===2;
  const k0=sjStart(track,stream);
  const k2=JSON.parse(JSON.stringify(k0));
  k2.H=add(k0.H,P(-8,16));k2.lean=k0.lean-.04;k2.tilt=stream?.1:.35;k2.g=.75;
  if(!stream){k2.aN={a:-55*DEG,b:.15};k2.aF={a:-58*DEG,b:.15};}
  else{k2.aN={a:Math.PI-k2.lean,b:0};k2.aF={a:Math.PI-k2.lean-.03,b:0};}
  /* afzet: lichaam gestrekt onder ~42 graden, op de bal van de voet */
  const fa=.95,ball=P(SJ_XS+27,-6.5),A3=ankleOnBall(ball,fa);
  const H3=add(A3,P(276*Math.sin(44*DEG),-276*Math.cos(44*DEG)));
  const lean3=46*DEG;
  const arm3=stream?{a:Math.PI-lean3,b:0}:{a:150*DEG,b:.05};
  const k3={H:H3,lean:lean3,tilt:-.1,An:A3,Af:track?add(A3,P(-30,-14)):A3,faN:fa,faF:fa,gN:1,gF:track?0:1,aN:arm3,aF:{a:arm3.a-.03,b:arm3.b},g:1};
  /* vlucht: benen komen naar voren, armen naar voren */
  const k5=sjLand(32,38,stream?150:100);
  if(stream){k5.aN={a:110*DEG,b:.1};k5.aF={a:108*DEG,b:.1};}
  const k4={H:lerpP(H3,k5.H,.5),lean:44*DEG,tilt:-.05,
    An:add(lerpP(H3,k5.H,.5),legFK(P(0,0),28*DEG,70*DEG).A),Af:add(lerpP(H3,k5.H,.5),legFK(P(0,0),20*DEG,66*DEG).A),
    faN:.7,faF:.7,gN:0,gF:0,aN:stream?{a:Math.PI-44*DEG,b:0}:{a:135*DEG,b:.05},aF:stream?{a:Math.PI-46*DEG,b:0}:{a:132*DEG,b:.05},g:.35};
  const k6=sjLand(68,52,92);k6.g=1;
  const k7=sjLand(42,30,80);k7.g=.6;k7.aN={a:35*DEG,b:.35};k7.aF={a:32*DEG,b:.35};
  return [[0,k0],[.5,k0],[.95,k2],[1.28,k3],[1.58,k4],[1.88,k5],[2.2,k6],[2.85,k7],[3.25,k7]];
}
const lerpA=(a,b,t)=>({a:lerp(a.a,b.a,t),b:lerp(a.b,b.b,t)});
function sjMix(ka,kb,u,ta,tb,flight){
  const e=flight?u:ease(u);
  const o={};
  if(flight){
    o.H=P(lerp(flight.H0.x,flight.H1.x,flight.u),lerp(flight.H0.y,flight.H1.y,flight.u)-4*SJ_FLY*flight.u*(1-flight.u));
  }else o.H=lerpP(ka.H,kb.H,e);
  for(const k of ['lean','tilt','faN','faF','g'])o[k]=lerp(ka[k],kb[k],e);
  o.aN=lerpA(ka.aN,kb.aN,e);o.aF=lerpA(ka.aF,kb.aF,e);
  for(const [A,g] of [['An','gN'],['Af','gF']]){
    if(ka[g]&&kb[g]&&!flight)o[A]=lerpP(ka[A],kb[A],e);
    else{
      const ra=sub(ka[A],ka.H),rb=sub(kb[A],kb.H);
      o[A]=add(o.H,lerpP(ra,rb,e));
      if(!flight&&!(ka[g]&&kb[g]))o[A].y-=34*Math.sin(Math.PI*e);
    }
  }
  return o;
}
function sjPose(v,t){
  const K=sjKeys(v);
  if(t>=3.25){
    /* uitfaden in de landing, infaden in de startpositie */
    if(t<3.6){const o=sjMix(K[8][1],K[8][1],0);o.alpha=1-ease((t-3.25)/.35);return o;}
    const o=sjMix(K[0][1],K[0][1],0);o.alpha=ease((t-3.6)/.3);return o;
  }
  let i=0;while(i<K.length-2&&t>K[i+1][0])i++;
  const [ta,ka]=K[i],[tb,kb]=K[i+1],u=clamp((t-ta)/(tb-ta),0,1);
  let flight=null;
  if(i===3||i===4){const T0=K[3][0],T1=K[5][0];flight={H0:K[3][1].H,H1:K[5][1].H,u:(t-T0)/(T1-T0)};}
  const o=sjMix(ka,kb,u,ta,tb,flight);o.alpha=1;
  return o;
}
function sjBuild(o,b){
  const H=P(o.H.x,o.H.y+(b||0)),S=shoulderAt(H,o.lean);
  const kn=(A)=>ik(H,A,L_THIGH,L_SHIN,P(1,-.2));
  const KN=kn(o.An),KF=kn(o.Af);
  const aN=armFK(S,o.aN.a,o.aN.b),aF=armFK(S,o.aF.a,o.aF.b);
  return {H,S,tilt:o.tilt,KN,KF,An:o.An,Af:o.Af,faN:o.faN,faF:o.faF,aN,aF,g:o.g,alpha:o.alpha==null?1:o.alpha};
}
const EX={
  key:'startsprong',VW:640,VH:410,modes:['dyn'],modes:['dyn'],
  period:m=>m==='iso'?4:3.9,
  still:m=>m==='iso'?0:1.28,
  state(m,v,t){
    if(m==='iso'){
      const k=sjStart(v===1,v===2),b=Math.sin(t*Math.PI*2/4)*1.4;
      const q=sjBuild(k,b);q.g=.82+.18*trem(t*.6);q.iso=1;q.alpha=1;return q;
    }
    return sjBuild(sjPose(v,t),0);
  },
  draw(q,c){
    const air=Math.max(0,Math.min(q.An.y,q.Af.y)<-20?1:0);
    ctx.save();
    if(q.iso){ctx.translate(410,372);ctx.scale(.86,.86);mat(-390,0,580);}
    else{ctx.translate(326,372);ctx.scale(.55,.55);mat(-470,0,900);}
    /* schaduw op de mat tijdens de vlucht */
    const lift=-Math.max(q.An.y,q.Af.y)-13;
    if(lift>4){ctx.save();ctx.globalAlpha=.16*Math.max(.3,1-lift/180);ctx.fillStyle=c.far;ell(P(q.H.x+20,4),80-lift*.15,6);ctx.restore();}
    layer(q.alpha,()=>sjFigure(q,c));
    ctx.restore();
    label('ZIJAANZICHT',24,400);
  }
};
function sjFigure(q,c){
  const hand=(W,E)=>hAlong(W,E);
  figSide({H:q.H,S:q.S,tilt:q.tilt,
    legs:[{K:q.KF,A:q.Af,foot:A=>footRise(A,q.faF)},{K:q.KN,A:q.An,foot:A=>footRise(A,q.faN)}],
    arms:[{E:q.aF.E,W:q.aF.W,hand},{E:q.aN.E,W:q.aN.W,hand}]},c,{
    mus(){
      const g=q.g;
      glow(g,()=>{muscleOn(q.H,q.KN,.2,.86,12,12,8);});
      glow(g,()=>{const u=nrm(sub(q.H,q.S));ell(P(q.H.x-u.y*19,q.H.y+u.x*19),17,22,Math.atan2(u.y,u.x));});
      glow(g*.55*(q.iso?1:clamp(.4+q.faN,0,1)),()=>{muscleOn(q.KN,q.An,.1,.45,-12,9,6.5);});
    }
  });
}

/* ===== Afspelen, modus- en variatieknoppen ===== */
let mode='iso',vari=0,playing=true,slow=false,phaseT=0,last=performance.now();
let shown=null,blendFrom=null,blendT=1;
function lerpObj(a,b,k){
  if(typeof b==='number')return typeof a==='number'?a+(b-a)*k:b;
  if(Array.isArray(b))return b.map((v,i)=>lerpObj(a&&a[i],v,k));
  if(b&&typeof b==='object'){const o={};for(const key in b)o[key]=lerpObj(a?a[key]:undefined,b[key],k);return o;}
  return b;
}
function render(s){
  const k=cv.width/EX.VW;
  ctx.setTransform(k,0,0,k,0,0);
  COL={stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),muted:tok('--muted'),band:tok('--band'),post:tok('--post')};
  ctx.fillStyle=COL.stage;ctx.fillRect(0,0,EX.VW,EX.VH);
  EX.draw(s,COL);
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!window.__freeze){
    if(playing&&!reduce)phaseT+=dt*(slow?.5:1);
    const per=EX.period(mode,vari);if(phaseT>=per)phaseT%=per;
    const target=EX.state(mode,vari,reduce?EX.still(mode,vari):phaseT);
    if(blendT<1&&blendFrom){blendT=Math.min(1,blendT+dt/.6);shown=lerpObj(blendFrom,target,ease(blendT));}else shown=target;
    render(shown);
  }
  requestAnimationFrame(frame);
}
function sync(){
  document.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===mode)));
  document.querySelectorAll('.var').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===vari)));
  try{localStorage.setItem(EX.key,mode+'-'+vari)}catch(e){}
}
function choose(m,v){if(m===mode&&v===vari)return;blendFrom=shown;blendT=0;mode=m;vari=v;phaseT=0;sync();}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>choose(b.dataset.m,vari));
document.querySelectorAll('.var').forEach(b=>b.onclick=()=>choose(mode,+b.dataset.v));
document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
(function init(){
  if(EX.modes){if(!EX.modes.includes(mode))mode=EX.modes[0];
    document.querySelectorAll('.mode').forEach(b=>{if(!EX.modes.includes(b.dataset.m))b.hidden=true;});}
  let s=null;try{s=localStorage.getItem(EX.key)}catch(e){}
  const h=location.hash.match(/^#(iso|dyn)-(\d)$/);if(h)s=h[1]+'-'+h[2];
  if(s){const[m,v]=s.split('-');if((m==='iso'||m==='dyn')&&(!EX.modes||EX.modes.includes(m))&&document.querySelector('.var[data-v="'+v+'"]')){mode=m;vari=+v;}}
  sync();
})();
/* testhaak: één moment tekenen */
window.__render=(m,v,ph)=>{window.__freeze=true;mode=m;vari=v;render(EX.state(m,v,ph));};
requestAnimationFrame(frame);

<\/script>

</body></html>
</script>
<script type="text/plain" data-ex="lunge">
<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lunge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one stage card with the animation, mode/variation/playback controls and a muscle legend */
:root{
  --bg:#EDF0EE; --stage:#F8FAF9; --ink:#1E2426; --muted:#5E686A; --body:#2A3134; --far:#7C8689;
  --muscle:#E0452B; --mat:#D6DCD9; --line:#D3D9D6; --band:#2C8C7E; --bandfar:#8CC2B9; --post:#B9C1BE;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --text:"Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --muscle:#FF5B3E; --mat:#2A3133; --line:#2C3335; --band:#4DBDAC; --bandfar:#2F6E66; --post:#3A4345; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121617; --stage:#1A1F20; --ink:#E8ECEA; --muted:#98A3A0; --body:#D9E0DD; --far:#7F8A87;
  --muscle:#FF5B3E; --mat:#2A3133; --line:#2C3335; --band:#4DBDAC; --bandfar:#2F6E66; --post:#3A4345; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
main{max-width:860px;margin:0 auto;display:grid;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,7vw,52px);line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;height:auto}
.bar{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;border-top:1px solid var(--line)}

</style>

<main>
  <header>
    <h1>Lunge</h1>
    <p class="sub">Bovenbenen, bilspieren en heupen</p>
  </header>

  <section class="stage">
    <canvas id="c" width="1200" height="900" aria-label="Animatie van een lunge, van opzij of van voren"></canvas>
    <div class="bar">
      <div class="seg" role="group" aria-label="Uitvoering">
        <button class="mode" data-mode="iso" aria-pressed="false">Isometrisch</button>
        <button class="mode" data-mode="dyn" aria-pressed="true">Dynamisch</button>
      </div>

      </div>

  <div class="legend">
    <span><i class="dot "></i>Quadriceps en bilspieren voorste been (primair)</span>
    <span><i class="dot soft"></i>Heupbuiger achterste been (secundair)</span>
  </div>
</main>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let playing=true,slow=false,phaseT=0,last=performance.now();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

/* paint: fill normally, stroke when drawing the background-coloured edge of an overlapping limb */
let OUT=false;
const paint=()=>{OUT?ctx.stroke():ctx.fill()};
function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();paint();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();paint();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);paint();};

}
const cycle=()=>mode==='iso'?8:REP*2;
function render(q,t){
  const c=cv.width/VW;ctx.setTransform(c,0,0,c,0,0);
  const col=colors();
  ctx.fillStyle=col.stage;ctx.fillRect(0,0,VW,VH);
  const glow=mode==='iso'?.78+.22*(.5+.5*Math.sin(t*Math.PI)):.35+.65*q.d;
  if(q.lat){
    view(VW/2,GY,SC,560,()=>{
      frontFigure(q,col,{legMus:f=>{
        ctx.fillStyle=col.mus;
        const i=f.bent,sd=i?1:-1,L=f.legs[i],a=P(f.hx+sd*38,f.hy-4),bb=P(lerp(a.x,L.K.x,.85),lerp(a.y,L.K.y,.85)-4);
        ctx.globalAlpha=glow;if(Math.hypot(bb.x-a.x,bb.y-a.y)>6)capsule(a,12,bb,9);

        ctx.globalAlpha=glow*.55;capsule(h2,10,P(lerp(h2.x,L2.K.x,.8)+sd*8,lerp(h2.y,L2.K.y,.8)),7);
      }});
    });
    label('VOORAANZICHT',VW/2,GY+24);
    return;
  }
  view(VW/2+95,GY,SC,560,()=>{
    sideFigure(q,col,{
      farMus:(q)=>{ if(!q.frontNear){ctx.save();ctx.fillStyle=col.mus;ctx.globalAlpha=glow*.85;
        strip(add(q.H,FAR_OFF),add(q.lf.K,FAR_OFF),.22,.86,1,12,8,12,8);ctx.restore();} },
      mus:(q,T)=>{
        ctx.fillStyle=col.mus;
        const fr=q.frontNear?q.ln:null,bk=q.frontNear?q.lf:q.ln;
        if(fr){ctx.globalAlpha=glow;strip(q.H,fr.K,.22,.86,1,12,8,12,8);}
        else{ctx.globalAlpha=glow*.55;strip(q.H,bk.K,.12,.55,1,11,9,10,8);}
        ctx.globalAlpha=glow;
        const g=add(q.H,T.n,-21);ell(g.x,g.y+4,15,18,q.lean);
      }
    });
  },-430);
  label('ZIJAANZICHT',VW/2,GY+24);
}
bindUI('lunge-state');
run(cycle,pose,render);

<\/script>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let playing=true,slow=false,phaseT=0,last=performance.now();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

/* paint: fill normally, stroke when drawing the background-coloured edge of an overlapping limb */
let OUT=false;
const paint=()=>{OUT?ctx.stroke():ctx.fill()};
function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();paint();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();paint();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);paint();};
const ell=(x,y,rx,ry,rot)=>{ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);paint();};
const P=(x,y)=>({x,y});
const add=(a,b,k=1)=>P(a.x+b.x*k,a.y+b.y*k);
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>.5-.5*Math.cos(Math.PI*Math.max(0,Math.min(1,t)));
const rot=(v,a)=>P(v.x*Math.cos(a)-v.y*Math.sin(a),v.x*Math.sin(a)+v.y*Math.cos(a));
/* angle measured from straight down, positive toward the front (+x): 0 hangs, PI/2 forward, PI overhead */
const dirA=a=>P(Math.sin(a),Math.cos(a));

/* shared body standard: torso 155, thigh 148, shin 132, upper arm 104, forearm 81 */
const L_T=155,L_TH=148,L_SH=132,L_UA=104,L_FA=81;
const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];

/* two-bone IK; dir +1 bends toward the front side of a->b (knee), -1 toward the back (elbow) */
function ik(a,b,l1,l2,dir){
  const dx=b.x-a.x,dy=b.y-a.y;let d=Math.hypot(dx,dy)||1;
  const ux=dx/d,uy=dy/d;d=Math.max(Math.abs(l1-l2)+.01,Math.min(d,l1+l2-.01));
  const base=Math.atan2(uy,ux),off=Math.acos(Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d))));
  const c1=P(a.x+l1*Math.cos(base+off),a.y+l1*Math.sin(base+off)),c2=P(a.x+l1*Math.cos(base-off),a.y+l1*Math.sin(base-off));
  const nx=uy,ny=-ux,s1=(c1.x-a.x)*nx+(c1.y-a.y)*ny;
  return (s1*dir>0)?c1:c2;
}
function armFK(S,a,b){const E=add(S,dirA(a),L_UA),W=add(E,dirA(a+b),L_FA);return {E,W};}
/* torso frame from hip + lean (0 upright, + forward) */
function torso(H,lean){const u=P(Math.sin(lean),-Math.cos(lean)),n=P(Math.cos(lean),Math.sin(lean));return {u,n,S:add(H,u,L_T)};}

/* hands */
function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-4,W.y-9);
  ctx.quadraticCurveTo(W.x+14,W.y-10,W.x+28,W.y-3);
  ctx.quadraticCurveTo(W.x+40,W.y+1,W.x+40,W.y+5);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+16,W.y+8);
  ctx.lineTo(W.x-6,W.y+8);
  ctx.closePath();paint();
}
/* the same flat hand turned with the forearm (fingers continue the forearm line) */
function handAlong(W,E,flip){
  const a=Math.atan2(W.y-E.y,W.x-E.x);
  ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);if(flip)ctx.scale(1,-1);hand(P(0,0));ctx.restore();
}
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);paint();ctx.restore();}
const fistC=(W,E)=>{const d=Math.hypot(W.x-E.x,W.y-E.y)||1;return P(W.x+(W.x-E.x)/d*9,W.y+(W.y-E.y)/d*9);};

/* foot: heel to toe capsule, fa = plantar flexion (heel up, + clockwise) */
function foot(A,fa,air){
  if(air||fa<.08){capsule(add(A,rot(P(-6,2),fa)),10,add(A,rot(P(38,6),fa)),6);return;}
  /* on the toes: heel-to-ball part tilts, the toes stay flat on the ground */
  const ball=add(A,rot(P(30,6),fa));
  capsule(add(A,rot(P(-6,2),fa)),10,ball,6.5);
  capsule(ball,6.5,P(ball.x+11,ball.y+.5),5.5);
}

/* muscle strip along a limb a->b; side +1 front, -1 back */
function strip(a,b,t0,t1,side,o0,o1,r0,r1){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,nx=dy/L,ny=-dx/L;
  capsule(P(a.x+dx*t0+nx*side*o0,a.y+dy*t0+ny*side*o0),r0,P(a.x+dx*t1+nx*side*o1,a.y+dy*t1+ny*side*o1),r1);
}

/* recursive blend of two poses (numbers mix, everything else from the target) */
function mixPose(a,b,t){
  if(typeof b==='number'&&typeof a==='number')return a+(b-a)*t;
  if(b&&typeof b==='object'&&a&&typeof a==='object'&&!Array.isArray(b)){const o={};for(const k in b)o[k]=(k in a)?mixPose(a[k],b[k],t):b[k];return o;}
  if(Array.isArray(b)&&Array.isArray(a)&&a.length===b.length)return b.map((v,i)=>mixPose(a[i],v,t));
  return b;
}

/*
 Side view figure, facing +x, ground at y=0.
 q = {H, lean, tilt, ln:{K,A,fa}, lf:{K,A,fa,lift}, an:{E,W,h}, af:{E,W,h}}
 h = 'flat' | 'fist' | 'none'
*/
const FAR_OFF=P(-11,-3);
function legPaint(H,L,off,offA){
  const h=add(H,off),k=add(L.K,off),a=add(L.A,offA);
  limb(h,k,24,15,THIGH_F,THIGH_B);dot(k,14.5);
  limb(k,a,14.5,9,SHIN_F,SHIN_B);
  foot(a,L.fa||0,L.lift);
}
function armPaint(S,A,off){
  const s=add(S,off),e=add(A.E,off),w=add(A.W,off);
  limb(s,e,16,11,UA_F,UA_B);dot(e,11);
  limb(e,w,11.5,6.5,FA_F,FA_B);
  if(A.h==='fist')fist(w,e);
  else if(A.h==='flatR')handAlong(w,e,true);
  else if(A.h!=='none')handAlong(w,e,false);
}
function headPaint(q,T){
  const tilt=q.tilt||0,uh=P(Math.sin(q.lean-tilt),-Math.cos(q.lean-tilt)),nh=P(Math.cos(q.lean-tilt),Math.sin(q.lean-tilt));
  const nb=add(T.S,T.u,14);
  capsule(nb,12,add(nb,uh,16),11);
  const c=add(add(nb,uh,42),nh,5);
  ell(c.x,c.y,25,29,q.lean-tilt);
}
function sideFigure(q,col,hooks){
  hooks=hooks||{};F=-1;
  const T=torso(q.H,q.lean);q.S=T.S;q.u=T.u;q.n=T.n;
  const offA=P(FAR_OFF.x,q.lf.lift?FAR_OFF.y:0);
  ctx.fillStyle=col.far;
  if(q.af)armPaint(T.S,q.af,P(-12,-4));
  legPaint(q.H,q.lf,FAR_OFF,offA);
  if(hooks.farMus)hooks.farMus(q,T);
  ctx.fillStyle=col.body;
  limb(T.S,q.H,27,24,T_FRONT,T_BACK);
  dot(q.H,27);
  const b=add(q.H,T.n,-15);ell(b.x,b.y,23,31,q.lean);
  legPaint(q.H,q.ln,P(0,0),P(0,0));
  if(hooks.mus){ctx.save();hooks.mus(q,T);ctx.restore();ctx.fillStyle=col.body;}
  headPaint(q,T);
  if(hooks.beforeArm)hooks.beforeArm(q,T);
  ctx.fillStyle=col.body;
  if(q.an){
    OUT=true;ctx.strokeStyle=col.stage;ctx.lineWidth=5;ctx.lineJoin='round';armPaint(T.S,q.an,P(0,0));OUT=false;
    armPaint(T.S,q.an,P(0,0));
  }
  dot(add(T.S,P(1,-2)),21);
  if(hooks.after)hooks.after(q,T);
}
/* standing leg from hip and ankle */
const legIK=(H,A,fa,lift)=>({K:ik(H,A,L_TH,L_SH,1),A,fa:fa||0,lift:!!lift});
const ANK=-12;

/*
 Front view figure (camera in front), ground y=0, hip centre at (hx,hy).
 f = {hx,hy,lean,sh (shoulder tilt), legs:[{K,A},{K,A}] for s=-1,+1, arms:'forward'|'up'|'hips'}
*/
function frontFigure(f,col,hooks){
  hooks=hooks||{};
  const body=col.body,edge=col.stage;
  const sy=.12+.88*Math.cos(f.lean);
  ctx.fillStyle=body;
  const thighShort=Math.abs(f.legs[0].K.y-f.hy)<75;
  const legs=()=>{ctx.fillStyle=body;[-1,1].forEach((s,i)=>{
    const L=f.legs[i],Hp=P(f.hx+s*24,f.hy);
    limb(Hp,L.K,24,16,[[5,.45,.28]],[[4,.4,.3]]);dot(L.K,15);
    limb(L.K,L.A,15,9,[[3,.28,.18]],[[3,.28,.18]]);
    const fx=L.A.x+s*(L.out||0);
    ell(fx,L.A.y+2,13,10,0);ell(fx+s*(L.out?3:1),L.A.y+5,16,6,s*(L.out?.25:0));
  });
  if(hooks.legMus){ctx.save();hooks.legMus(f);ctx.restore();ctx.fillStyle=body;}};
  if(!thighShort)legs();
  ctx.save();ctx.translate(f.hx,f.hy);ctx.scale(1,sy);
  const y=0;
  const path=()=>{ctx.beginPath();ctx.moveTo(-15,-144);
    ctx.quadraticCurveTo(-28,-136,-44,-130);ctx.quadraticCurveTo(-54,-110,-49,-88);
    ctx.quadraticCurveTo(-42,-62,-37,-38);ctx.quadraticCurveTo(-46,-20,-45,-2);
    ctx.lineTo(45,-2);ctx.quadraticCurveTo(46,-20,37,-38);ctx.quadraticCurveTo(42,-62,49,-88);
    ctx.quadraticCurveTo(54,-110,44,-130);ctx.quadraticCurveTo(28,-136,15,-144);ctx.closePath();};
  path();ctx.fill();
  ell(0,0,46,15,0);
  capsule(P(0,-132),13,P(0,-148),11);
  ctx.restore();
  /* head stays round (not squashed by lean) */
  const hy=f.hy-148*sy-28;
  ell(f.hx,hy,24,30,0);
  const Sy=f.hy-120*sy;
  [-1,1].forEach(s=>{
    const S=P(f.hx+s*50,Sy);
    if(f.arms==='forward'){
      dot(S,16);
      ctx.beginPath();ctx.moveTo(S.x-s*14,S.y-2);ctx.lineTo(S.x+s*14,S.y-2);ctx.lineTo(S.x+s*6,S.y+24);ctx.lineTo(S.x-s*12,S.y+24);ctx.closePath();ctx.fill();
      ell(S.x-s*4,S.y+26,13,12,0);
      ctx.strokeStyle=edge;ctx.lineWidth=2;ctx.stroke();
    }else if(f.arms==='up'){
      const W=P(f.hx+s*9,Sy-178*(.25+.75*Math.cos(f.lean))),E=P(S.x+(W.x-S.x)*.56-s*3,S.y+(W.y-S.y)*.56);
      ctx.save();OUT=true;ctx.strokeStyle=edge;ctx.lineWidth=4;
      capsule(S,16,E,11);capsule(E,11,W,7);OUT=false;ctx.restore();
      capsule(S,16,E,11);dot(E,11);capsule(E,11,W,7);
      ell(W.x-s*3,W.y-16,9,19,s*.08);
      dot(S,18);
    }else{
      dot(S,16);
      const E=P(f.hx+s*70,Sy+52),W=P(f.hx+s*40,f.hy-12);
      capsule(S,15,E,11);dot(E,11);capsule(E,11,W,7);ell(W.x+s*2,W.y+4,10,12,0);
    }
  });
  if(thighShort){
    /* thighs come toward the camera: knees in front of the pelvis, with a thin edge */
    ctx.save();OUT=true;ctx.strokeStyle=edge;ctx.lineWidth=4;
    [-1,1].forEach((s,i)=>{const L=f.legs[i];dot(L.K,16);capsule(P(f.hx+s*24,f.hy),24,L.K,16);});
    OUT=false;ctx.restore();legs();
  }
  if(hooks.after)hooks.after(f);
}

function label(txt,x,y,align){
  ctx.fillStyle=tok('--muted');ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign=align||'center';
  ctx.fillText(txt,x,y);
}
function colors(){return {body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),stage:tok('--stage'),post:tok('--post'),band:tok('--band'),bandfar:tok('--bandfar')};}
/* view: translate to ground point, scale; draw mat */
function view(cx,gy,sc,matW,fn,matX){
  ctx.save();ctx.translate(cx,gy);ctx.scale(sc,sc);
  ctx.fillStyle=tok('--mat');ctx.beginPath();ctx.roundRect(matX!=null?matX:-matW/2,0,matW,10,5);ctx.fill();

function wallRect(x0,top,w){ctx.fillStyle=tok('--post');ctx.beginPath();ctx.roundRect(x0,top,w,-top,4);ctx.fill();}

/* ui state */
let mode='dyn',variant=null,prevPose=null,blendT=1,curPose=null;

function bindUI(key,onChange){

  if(h){const [m,v]=h.split('.');if((m==='iso'||m==='dyn')&&document.querySelector('[data-mode="'+m+'"]'))mode=m;if(v&&document.querySelector('[data-var="'+v+'"]'))variant=v;}

/* main loop: page supplies pose(t) for the current mode/variant and render(q,glow) */
function run(cycle,poseFn,render){

    if(playing&&!reduce){phaseT+=dt*(slow?.5:1);}

const VW=640,VH=480,GY=452,SC=.78;
variant='twee';
/* heel raise around the ball of the foot */
const BALL=P(30,ANK+6);
function ankleAt(fa){return add(BALL,rot(P(-30,-6),fa));}
const TOP=.62;
function rise(t){
  if(t<.8)return ease(t/.8);
  if(t<1.2)return 1;
  if(t<2.2)return 1-ease((t-1.2)/1);

}
let WALL=null;
function calfPose(r,v,b,tr){
  const fa=TOP*r+(tr||0);
  const A=ankleAt(fa);
  const knee=v==='knie';
  const phi=knee?.3:.02,psi=knee?.26:-.02;
  const K=add(A,P(Math.sin(phi),-Math.cos(phi)),L_SH);
  const H=add(K,P(-Math.sin(psi),-Math.cos(psi)),L_TH);
  H.y+=b||0;
  const lean=knee?.12:.03;
  const T=torso(H,lean);
  if(WALL==null){const A0=ankleAt(0),K0=add(A0,P(Math.sin(.02),-Math.cos(.02)),L_SH),H0=add(K0,P(Math.sin(.02),-Math.cos(.02)),L_TH);WALL=torso(H0,.03).S.x+208;}
  /* fingertips on the wall, a little below shoulder height */
  const arm=(dy,dx)=>{const tip=P(WALL-1+dx,T.S.y+30+dy);const d=P(.97,-.24),W=add(tip,d,-40);const E=ik(T.S,W,L_UA,L_FA,-1);return {E,W,h:'flat'};};

  const ln={K,A,fa};
  let lf=ln;
  if(v==='een'){
    /* free leg: thigh just in front of vertical, shin folded back, foot relaxed */
    const Kf=add(H,dirA(.18),L_TH),Af=add(Kf,dirA(.18-1.45),L_SH);
    lf={K:Kf,A:Af,fa:.35,lift:true};
  }else lf={K:add(K,P(0,0)),A,fa};
  return {H,lean,tilt:0,ln,lf,an,af,r,v};
}
function pose(t){
  if(mode==='iso'){const b=Math.sin(t*Math.PI*2/4)*1.2,tr=Math.sin(t*37)*.012;return calfPose(1,variant,b,tr);}
  return calfPose(rise(t),variant,0,0);
}
const cycle=()=>mode==='iso'?8:2.4;
function render(q,t){
  const c=cv.width/VW;ctx.setTransform(c,0,0,c,0,0);
  const col=colors();
  ctx.fillStyle=col.stage;ctx.fillRect(0,0,VW,VH);
  const glow=mode==='iso'?.8+.2*(.5+.5*Math.sin(t*Math.PI)):.3+.7*q.r;
  view(250,GY,SC,470,()=>{
    wallRect(WALL,-600,26);
    sideFigure(q,col,{
      mus:(q,T)=>{
        const k=q.v==='knie';
        ctx.fillStyle=col.mus;
        ctx.globalAlpha=glow*(k?.55:1);strip(q.ln.K,q.ln.A,.1,.42,-1,12,8,9,6.5);
        ctx.globalAlpha=glow*(k?1:.55);strip(q.ln.K,q.ln.A,.44,.74,-1,7,4.5,6.5,4.5);
      }
    });
  },-200);
  label('ZIJAANZICHT',250+60,GY+24);
}
bindUI('calf-state');
run(cycle,pose,render);

<\/script>

<script>
/* ---------- shared drawing helpers (vaste maten en spierprofielen) ---------- */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let VX=120,VY=80,VW=640,VH=290;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
const P=(x,y)=>({x,y});
const DEG=Math.PI/180,lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>.5-.5*Math.cos(Math.PI*clamp(t,0,1));

const dist=(a,b)=>Math.hypot(b.x-a.x,b.y-a.y);
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));

  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();ctx.fill();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
function curveLimb(a,c,b,rA,rB,front,back){
  const N=36,prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,cc,w]of bs)r+=m*Math.exp(-(((t-cc)/w)**2));return r};
  const pt=t=>P((1-t)*(1-t)*a.x+2*(1-t)*t*c.x+t*t*b.x,(1-t)*(1-t)*a.y+2*(1-t)*t*c.y+t*t*b.y);
  const tg=t=>{const x=2*(1-t)*(c.x-a.x)+2*t*(b.x-c.x),y=2*(1-t)*(c.y-a.y)+2*t*(b.y-c.y),l=Math.hypot(x,y)||1;return P(x/l,y/l)};
  const L=[],Rr=[];
  for(let i=0;i<=N;i++){const t=i/N,p=pt(t),u=tg(t),nx=-u.y*F,ny=u.x*F,rf=prof(t,front),rb=prof(t,back);
    L.push(P(p.x+nx*rf,p.y+ny*rf));Rr.push(P(p.x-nx*rb,p.y-ny*rb));}
  ctx.beginPath();L.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
  for(let i=N;i>=0;i--)ctx.lineTo(Rr[i].x,Rr[i].y);ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
  return {pt,tg};
}
/* vlakke hand plat op de vloer: handpalm onder op W.y+8, dikke handrug bij de pols, dunne vingers naar +x */
function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-6,W.y+8);
  ctx.lineTo(W.x+29,W.y+8);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+33.5,W.y+5);
  ctx.quadraticCurveTo(W.x+32,W.y+2,W.x+26,W.y+2);
  ctx.lineTo(W.x+18,W.y+1.5);
  ctx.quadraticCurveTo(W.x+15,W.y-1.5,W.x+10,W.y-1);
  ctx.quadraticCurveTo(W.x+3,W.y-3,W.x-1,W.y-4);
  ctx.quadraticCurveTo(W.x-9,W.y-4,W.x-9,W.y+3);
  ctx.quadraticCurveTo(W.x-9,W.y+8,W.x-6,W.y+8);
  ctx.closePath();ctx.fill();
}
const unit=(a,b)=>{const d=dist(a,b)||1;return P((b.x-a.x)/d,(b.y-a.y)/d);};
/* gestrekte voet in richting u (wreef naar de vloer, hiel aan de bovenkant): bij knielen en bij een gestrekt been */
function flatFoot(A,u){
  let n=P(u.y,-u.x);if(n.y>0)n=P(-n.x,-n.y);
  const m=P(A.x+u.x*22-n.x*1.5,A.y+u.y*22-n.y*1.5),t=P(A.x+u.x*36-n.x*2,A.y+u.y*36-n.y*2);
  capsule(P(A.x+n.x*4.5-u.x*3,A.y+n.y*4.5-u.y*3),8,m,6);
  capsule(A,9,m,6.5);capsule(m,6.5,t,4.5);
}
/* knielvoet: wreef plat achter de enkel, in het verlengde van het scheenbeen, iets naar de vloer */
function kneelFoot(K,A,ground=332){const sx=Math.sign(A.x-K.x)||-1,tip=P(A.x+sx*35,ground-4.5);flatFoot(A,unit(A,tip));}
/* voet op de tenen (plank): bal van de voet onder de enkel, hiel omhoog, tenen plat naar het hoofd (+x).
   u = richting knie -> enkel; ground = bovenkant van de mat (laat weg bij een opgetild been) */
function toeFoot(A,u,ground,toeDir){
  const p=P(-u.y,u.x).y>0?P(-u.y,u.x):P(u.y,-u.x);
  let L=24;if(ground!=null)L=clamp((ground-6.5-A.y)/p.y,16,30);
  const B=P(A.x+p.x*L,A.y+p.y*L),heel=P(A.x-p.x*5+u.x*3,A.y-p.y*5+u.y*3);

/* 3D-IK voor een vooraanzicht: punten {x,y,z}, pole = richting waar de elleboog heen wijst */
function ik3(S,W,l1,l2,pole){
  const d0=Math.hypot(W.x-S.x,W.y-S.y,W.z-S.z)||1,d=clamp(d0,Math.abs(l1-l2)+.5,l1+l2-.01);

  const pd=pole.x*u.x+pole.y*u.y+pole.z*u.z;
  let v={x:pole.x-pd*u.x,y:pole.y-pd*u.y,z:pole.z-pd*u.z};const vl=Math.hypot(v.x,v.y,v.z)||1;v={x:v.x/vl,y:v.y/vl,z:v.z/vl};
  const ca=clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1),sa=Math.sqrt(1-ca*ca);

}
/* vlakke hand die meedraait met de onderarm; plat zodra de onderarm verticaal staat */
function turnHand(W,E){
  const aa=Math.atan2(W.y-E.y,W.x-E.x),sm=clamp((aa-45*DEG)/(45*DEG),0,1);
  ctx.save();ctx.translate(W.x,W.y);ctx.rotate(aa*(1-sm));hand(P(0,0));ctx.restore();
}
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
function edgeHand(W,T,wd=9){const dx=T.x-W.x,dy=T.y-W.y,L=Math.hypot(dx,dy);if(L<1){dot(W,8);return;}const a=Math.atan2(dy,dx),h=Math.min(1,L/16);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(2+17*h,0,6+15*h,wd,0,0,Math.PI*2);ctx.fill();ctx.restore();}
/* twee-segment IK: kies het gewricht aan de kant 'pick' (functie die de beste van twee kandidaten kiest) */
function ik(a,b,l1,l2,pick){
  const dx=b.x-a.x,dy=b.y-a.y;let d=Math.hypot(dx,dy);
  d=clamp(d,Math.abs(l1-l2)+.5,l1+l2-.01);
  const ang=Math.atan2(dy,dx),al=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));
  const c1=P(a.x+l1*Math.cos(ang+al),a.y+l1*Math.sin(ang+al)),c2=P(a.x+l1*Math.cos(ang-al),a.y+l1*Math.sin(ang-al));

/* teken een vorm als dun randje in de achtergrondkleur (eerst stroken, dan vullen) */
function outlined(fn,col){

const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];

const trem=T=>.5+.5*Math.sin(T*Math.PI*2*5.3)*Math.sin(T*Math.PI*2*.9+1);

PAGE.period=m=>m==='dyn'?3.6:8;
PAGE.still=m=>m==='dyn'?1.5:2;
function pose(p,v){
  if(v==='knie'){
    const W=P(486,322),S=P(486,137),T=P(S.x-3,S.y+24*(1-p)-4),K=P(334,318),H=P(334,170);
    const tl=dist(T,H),ux=(H.x-T.x)/tl,uy=(H.y-T.y)/tl;
    let dnx=-uy,dny=ux;if(dny<0){dnx=-dnx;dny=-dny;}
    return {v,W,S,T,K,H,ux,uy,dnx,dny,A:P(K.x-131,313)};
  }
  /* plank: polsen onder de schouders, lichaam in één lijn naar de enkels; tenen op een vast punt */
  const S=P(600,137),W=P(600,322),A=P(188,303),Td=P(S.x-3,S.y+24*(1-p)-4);
  const d=dist(A,Td),vx=(Td.x-A.x)/d,vy=(Td.y-A.y)/d;
  const T=P(A.x+vx*435,A.y+vy*435),ux=-vx,uy=-vy;
  const H=P(T.x+ux*155,T.y+uy*155),K=P(H.x+ux*148,H.y+uy*148);
  let dnx=-uy,dny=ux;if(dny<0){dnx=-dnx;dny=-dny;}
  return {v,W,S,T,K,H,A,ux,uy,dnx,dny};
}
function arm(S,W,dx,dy=0){
  const S0=P(S.x+dx,S.y+dy),W0=P(W.x+dx,W.y+dy),E=P(S0.x+(W0.x-S0.x)*.56,S0.y+(W0.y-S0.y)*.56);
  limb(S0,E,16,11,UA_F,UA_B);dot(E,11);
  limb(E,W0,11.5,6.5,FA_F,FA_B);
  hand(W0);
  dot(P(S0.x+3,S0.y-2),21);
}
function leg(q,dx,dy){
  const H=P(q.H.x+dx,q.H.y+dy),K=P(q.K.x+dx,q.K.y+dy),A=P(q.A.x+dx,q.A.y+(q.v==='knie'?0:dy));
  limb(H,K,24,15,THIGH_F,THIGH_B);dot(K,14.5);
  limb(K,A,14.5,9,SHIN_F,SHIN_B);
  if(q.v==='knie')kneelFoot(K,A);
  else toeFoot(A,unit(K,A),332);
}
function blade(cx,cy,side,p){
  const sp=8+20*p,rot=side*(.05+.22*p);
  ctx.save();ctx.translate(cx+side*sp,cy-30);ctx.rotate(rot);
  ctx.beginPath();
  ctx.moveTo(0,0);ctx.lineTo(side*40,-4);ctx.quadraticCurveTo(side*44,6,side*32,18);
  ctx.lineTo(side*6,56);ctx.quadraticCurveTo(side*-2,58,0,48);ctx.closePath();ctx.fill();
  ctx.restore();
}
/* bovenaanzicht van de bovenrug met de schouderbladen, getekend rond (0,0) */
function inset(p,glow,c){
  const cx=0,cy=0;
  ctx.fillStyle=c.body;
  ctx.beginPath();
  ctx.moveTo(cx-70,cy-40);ctx.quadraticCurveTo(cx-78,cy-58,cx-52,cy-62);
  ctx.lineTo(cx+52,cy-62);ctx.quadraticCurveTo(cx+78,cy-58,cx+70,cy-40);
  ctx.quadraticCurveTo(cx+56,cy+20,cx+42,cy+62);ctx.lineTo(cx-42,cy+62);
  ctx.quadraticCurveTo(cx-56,cy+20,cx-70,cy-40);ctx.fill();
  capsule(P(cx,cy-60),14,P(cx,cy-74),13);
  ctx.beginPath();ctx.ellipse(cx,cy-96,22,26,0,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.globalAlpha=glow*(.25+.75*(1-p));ctx.fillStyle=c.mus;
  ctx.beginPath();ctx.roundRect(cx-8-20*p+2,cy-34,2*(8+20*p)-4,54,4);ctx.fill();ctx.restore();
  ctx.fillStyle=c.far;blade(cx,cy,-1,p);blade(cx,cy,1,p);
  ctx.strokeStyle=c.far;ctx.lineWidth=2;ctx.setLineDash([3,4]);
  ctx.beginPath();ctx.moveTo(cx,cy-56);ctx.lineTo(cx,cy+58);ctx.stroke();ctx.setLineDash([]);
}
PAGE.draw=(m,v,T,c)=>{
  let p,glow=1;
  if(m==='dyn')p=prot(T);
  else{p=.035*trem(T);glow=.85+.15*trem(T*1.3);}
  ctx.fillStyle=c.mat;ctx.beginPath();ctx.roundRect(150,332,600,10,5);ctx.fill();
  const q=pose(p,v);
  F=-1;
  ctx.fillStyle=c.far;leg(q,-10,-3);arm(q.S,q.W,-14);
  ctx.fillStyle=c.body;
  limb(q.T,q.H,27,24,T_FRONT,T_BACK);
  ctx.beginPath();ctx.ellipse(q.H.x-q.dnx*15,q.H.y-q.dny*15,31,23,Math.atan2(q.uy,q.ux),0,Math.PI*2);ctx.fill();
  capsule(P(q.T.x-q.ux*14,q.T.y-q.uy*14),12,P(q.T.x-q.ux*30,q.T.y-q.uy*30+3),11);
  ctx.beginPath();ctx.ellipse(q.T.x-q.ux*56+q.dnx*5,q.T.y-q.uy*56+q.dny*5,29,25,Math.atan2(q.uy,q.ux),0,Math.PI*2);ctx.fill();
  leg(q,0,0);
  ctx.save();ctx.fillStyle=c.mus;ctx.globalAlpha=glow*(.25+.75*p);
  ctx.beginPath();ctx.ellipse(q.T.x+q.ux*58+q.dnx*12,q.T.y+q.uy*58+q.dny*12,28,10,Math.atan2(q.uy,q.ux),0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.fillStyle=c.body;arm(q.S,q.W,0);
  const [ix,iy,is]=v==='knie'?[672,212,1]:[236,148,.58];
  ctx.save();ctx.translate(ix,iy);ctx.scale(is,is);inset(p,glow,c);ctx.restore();
  label(c,'BOVENAANZICHT',ix,iy+(v==='knie'?88:56),'center');
};

/* ---------- knoppen, toestand en afspeellus ---------- */
(function(){
  const MODES=[['iso','Isometrisch'],['dyn','Dynamisch']];
  const st={mode:'iso',variant:PAGE.def||PAGE.variants[0][0]};
  let playing=true,slow=false,phaseT=0,last=performance.now();
  const mBox=document.getElementById('modes'),vBox=document.getElementById('vars');
  const mk=(box,list,key)=>list.forEach(([id,lab])=>{const b=document.createElement('button');b.type='button';b.id=key+'-'+id;b.textContent=lab;b.dataset.v=id;b.onclick=()=>set(key,id);box.appendChild(b);});
  mk(mBox,MODES,'mode');mk(vBox,PAGE.variants,'variant');
  function sync(){
    mBox.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===st.mode)));
    vBox.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===st.variant)));
    if(PAGE.onChange)PAGE.onChange(st);
  }
  function set(k,v){st[k]=v;phaseT=0;sync();try{localStorage.setItem(PAGE.key,JSON.stringify(st))}catch(e){}}
  try{const s=JSON.parse(localStorage.getItem(PAGE.key)||'null');if(s){if(MODES.some(m=>m[0]===s.mode))st.mode=s.mode;if(PAGE.variants.some(v=>v[0]===s.variant))st.variant=s.variant;}}catch(e){}
  const h=location.hash.slice(1).split('-');
  if(MODES.some(m=>m[0]===h[0]))st.mode=h[0];
  if(h[1]&&PAGE.variants.some(v=>v[0]===h[1]))st.variant=h[1];
  sync();
  window.__set=(m,v)=>{st.mode=m;st.variant=v;sync();};
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(playing&&!reduce)phaseT+=dt*(slow?.5:1);
    const per=PAGE.period(st.mode,st.variant);if(per)phaseT%=per;
    const T=window.__T!=null?window.__T:(reduce?PAGE.still(st.mode,st.variant):phaseT);
    const k=cv.width/VW;
    ctx.setTransform(k,0,0,k,-VX*k,-VY*k);
    const c={stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),muted:tok('--muted'),post:tok('--post')};
    ctx.fillStyle=c.stage;ctx.fillRect(VX,VY,VW,VH);
    PAGE.draw(st.mode,st.variant,T,c,dt);
    requestAnimationFrame(frame);
  }
  document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
  document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
  requestAnimationFrame(frame);
})();
<\/script>

</body></html>

<script type="text/plain" data-ex="catcow">
<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>

<main>

<script>
/* ---------- shared drawing helpers (vaste maten en spierprofielen) ---------- */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let VX=120,VY=80,VW=640,VH=290;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
const P=(x,y)=>({x,y});
const DEG=Math.PI/180,lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>.5-.5*Math.cos(Math.PI*clamp(t,0,1));
const lerpP=(a,b,t)=>P(lerp(a.x,b.x,t),lerp(a.y,b.y,t));
const dist=(a,b)=>Math.hypot(b.x-a.x,b.y-a.y);
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();ctx.fill();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
function curveLimb(a,c,b,rA,rB,front,back){
  const N=36,prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,cc,w]of bs)r+=m*Math.exp(-(((t-cc)/w)**2));return r};
  const pt=t=>P((1-t)*(1-t)*a.x+2*(1-t)*t*c.x+t*t*b.x,(1-t)*(1-t)*a.y+2*(1-t)*t*c.y+t*t*b.y);
  const tg=t=>{const x=2*(1-t)*(c.x-a.x)+2*t*(b.x-c.x),y=2*(1-t)*(c.y-a.y)+2*t*(b.y-c.y),l=Math.hypot(x,y)||1;return P(x/l,y/l)};
  const L=[],Rr=[];
  for(let i=0;i<=N;i++){const t=i/N,p=pt(t),u=tg(t),nx=-u.y*F,ny=u.x*F,rf=prof(t,front),rb=prof(t,back);
    L.push(P(p.x+nx*rf,p.y+ny*rf));Rr.push(P(p.x-nx*rb,p.y-ny*rb));}
  ctx.beginPath();L.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
  for(let i=N;i>=0;i--)ctx.lineTo(Rr[i].x,Rr[i].y);ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
  return {pt,tg};
}
/* vlakke hand plat op de vloer: handpalm onder op W.y+8, dikke handrug bij de pols, dunne vingers naar +x */
function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-6,W.y+8);
  ctx.lineTo(W.x+29,W.y+8);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+33.5,W.y+5);
  ctx.quadraticCurveTo(W.x+32,W.y+2,W.x+26,W.y+2);
  ctx.lineTo(W.x+18,W.y+1.5);
  ctx.quadraticCurveTo(W.x+15,W.y-1.5,W.x+10,W.y-1);
  ctx.quadraticCurveTo(W.x+3,W.y-3,W.x-1,W.y-4);
  ctx.quadraticCurveTo(W.x-9,W.y-4,W.x-9,W.y+3);
  ctx.quadraticCurveTo(W.x-9,W.y+8,W.x-6,W.y+8);
  ctx.closePath();ctx.fill();
}
const unit=(a,b)=>{const d=dist(a,b)||1;return P((b.x-a.x)/d,(b.y-a.y)/d);};
/* gestrekte voet in richting u (wreef naar de vloer, hiel aan de bovenkant): bij knielen en bij een gestrekt been */
function flatFoot(A,u){
  let n=P(u.y,-u.x);if(n.y>0)n=P(-n.x,-n.y);
  const m=P(A.x+u.x*22-n.x*1.5,A.y+u.y*22-n.y*1.5),t=P(A.x+u.x*36-n.x*2,A.y+u.y*36-n.y*2);
  capsule(P(A.x+n.x*4.5-u.x*3,A.y+n.y*4.5-u.y*3),8,m,6);
  capsule(A,9,m,6.5);capsule(m,6.5,t,4.5);
}
/* knielvoet: wreef plat achter de enkel, in het verlengde van het scheenbeen, iets naar de vloer */
function kneelFoot(K,A,ground=332){const sx=Math.sign(A.x-K.x)||-1,tip=P(A.x+sx*35,ground-4.5);flatFoot(A,unit(A,tip));}
/* voet op de tenen (plank): bal van de voet onder de enkel, hiel omhoog, tenen plat naar het hoofd (+x).
   u = richting knie -> enkel; ground = bovenkant van de mat (laat weg bij een opgetild been) */
function toeFoot(A,u,ground,toeDir){
  const p=P(-u.y,u.x).y>0?P(-u.y,u.x):P(u.y,-u.x);
  let L=24;if(ground!=null)L=clamp((ground-6.5-A.y)/p.y,16,30);
  const B=P(A.x+p.x*L,A.y+p.y*L),heel=P(A.x-p.x*5+u.x*3,A.y-p.y*5+u.y*3);
  const td=ground!=null?P(1,0):(toeDir||P(1,0));
  capsule(heel,8.5,B,6.5);
  capsule(B,6.5,P(B.x+td.x*14,B.y+td.y*14+(ground!=null?2.5:0)),4);
}
/* 3D-IK voor een vooraanzicht: punten {x,y,z}, pole = richting waar de elleboog heen wijst */
function ik3(S,W,l1,l2,pole){
  const d0=Math.hypot(W.x-S.x,W.y-S.y,W.z-S.z)||1,d=clamp(d0,Math.abs(l1-l2)+.5,l1+l2-.01);
  const u={x:(W.x-S.x)/d0,y:(W.y-S.y)/d0,z:(W.z-S.z)/d0};
  const pd=pole.x*u.x+pole.y*u.y+pole.z*u.z;
  let v={x:pole.x-pd*u.x,y:pole.y-pd*u.y,z:pole.z-pd*u.z};const vl=Math.hypot(v.x,v.y,v.z)||1;v={x:v.x/vl,y:v.y/vl,z:v.z/vl};
  const ca=clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1),sa=Math.sqrt(1-ca*ca);
  return {x:S.x+l1*(ca*u.x+sa*v.x),y:S.y+l1*(ca*u.y+sa*v.y),z:S.z+l1*(ca*u.z+sa*v.z)};
}
/* vlakke hand die meedraait met de onderarm; plat zodra de onderarm verticaal staat */
function turnHand(W,E){
  const aa=Math.atan2(W.y-E.y,W.x-E.x),sm=clamp((aa-45*DEG)/(45*DEG),0,1);
  ctx.save();ctx.translate(W.x,W.y);ctx.rotate(aa*(1-sm));hand(P(0,0));ctx.restore();
}
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
function edgeHand(W,T,wd=9){const dx=T.x-W.x,dy=T.y-W.y,L=Math.hypot(dx,dy);if(L<1){dot(W,8);return;}const a=Math.atan2(dy,dx),h=Math.min(1,L/16);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(2+17*h,0,6+15*h,wd,0,0,Math.PI*2);ctx.fill();ctx.restore();}
/* twee-segment IK: kies het gewricht aan de kant 'pick' (functie die de beste van twee kandidaten kiest) */
function ik(a,b,l1,l2,pick){
  const dx=b.x-a.x,dy=b.y-a.y;let d=Math.hypot(dx,dy);
  d=clamp(d,Math.abs(l1-l2)+.5,l1+l2-.01);

  const c1=P(a.x+l1*Math.cos(ang+al),a.y+l1*Math.sin(ang+al)),c2=P(a.x+l1*Math.cos(ang-al),a.y+l1*Math.sin(ang-al));

/* teken een vorm als dun randje in de achtergrondkleur (eerst stroken, dan vullen) */
function outlined(fn,col){
  const f0=ctx.fill;ctx.strokeStyle=col;ctx.lineWidth=5;ctx.lineJoin='round';
  ctx.fill=function(){ctx.stroke();};fn();ctx.fill=f0;fn();

function label(c,t,x,y,align='left'){ctx.fillStyle=c.muted;ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign=align;ctx.fillText(t,x,y);}
const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];
/* lichte trilling bij vasthouden, 0..1 */
const trem=T=>.5+.5*Math.sin(T*Math.PI*2*5.3)*Math.sin(T*Math.PI*2*.9+1);
const breath=T=>Math.sin(T*Math.PI*2/4);

/* Cat-cow: v = 1 cat (rug bol), v = -1 cow (rug hol). Variant 'bekken': alleen het bekken kantelt (lage rug), borst en hoofd blijven neutraal */
const PAGE={key:'catcow-state',variants:[['volledig','Volledig'],['bekken','Alleen het bekken kantelen']]};
PAGE.period=m=>m==='dyn'?6:17;
PAGE.still=m=>m==='iso'?3:0;
function iso(T){
  /* cat 7 s vasthouden, 1,5 s wisselen, cow 7 s vasthouden, 1,5 s terug */
  let v;
  if(T<7)v=1;else if(T<8.5)v=1-2*ease((T-7)/1.5);else if(T<15.5)v=-1;else v=-1+2*ease((T-15.5)/1.5);
  return v*(.97+.03*Math.sin(T*Math.PI*2/4));

function arm(S,W,dx){
  const S0=P(S.x+dx,S.y),W0=P(W.x+dx,W.y),E=P(S0.x+(W0.x-S0.x)*.56,S0.y+(W0.y-S0.y)*.56);
  limb(S0,E,16,11,UA_F,UA_B);dot(E,11);
  limb(E,W0,11.5,6.5,FA_F,FA_B);

}
function leg(H,K,A,dx,dy){
  const h=P(H.x+dx,H.y+dy),k=P(K.x+dx,K.y+dy),a=P(A.x+dx,A.y);
  limb(h,k,24,15,THIGH_F,THIGH_B);dot(k,14.5);
  limb(k,a,14.5,9,SHIN_F,SHIN_B);
  kneelFoot(k,a);
}
PAGE.draw=(m,v0,T,c)=>{
  const v=m==='dyn'?(()=>{const r=Math.sin(T*Math.PI*2/6);return Math.sign(r)*Math.min(1,Math.abs(r)*1.25)})():iso(T);
  const full=v0==='volledig';

  const cat=Math.max(0,v),cow=Math.max(0,-v);
  const W=P(486,322),S=P(486,137),K=P(334,318),A=P(203,313);
  const H=full?P(334-6*cat+4*cow,170-4*cat+2*cow):P(334-7*cat+5*cow,170-5*cat+3*cow);
  const T0=full?P(S.x-3,S.y-4-6*cat+8*cow):P(S.x-3,S.y-4);

  ctx.fillStyle=c.body;

  const gdx=Math.sin(glA),gdy=-Math.cos(glA);

  const u0=sp.tg(0);
  const hA=full?Math.atan2(-u0.y,-u0.x)*(1-cow)-.32*cow+.35*cat:Math.atan2(-u0.y,-u0.x);
  const hx=Math.cos(hA),hy=Math.sin(hA);

  ctx.beginPath();ctx.ellipse(T0.x+hx*56,T0.y+hy*56-4,29,25,hA,0,Math.PI*2);ctx.fill();

  const [t0,t1]=full?[.18,.8]:[.5,.86];

  for(const [amt,side] of [[cow,-1],[cat,1]]){
    if(amt<.02)continue;
    ctx.globalAlpha=glow*amt;
    for(let i=0;i<=20;i++){const t=t0+(t1-t0)*i/20,p=sp.pt(t),u=sp.tg(t);
      const nx=-u.y*F,ny=u.x*F,r=side>0?25:19;
      ctx.beginPath();ctx.arc(p.x+nx*r*side,p.y+ny*r*side,side>0?9:8,0,Math.PI*2);ctx.fill();}
  }
  ctx.restore();
  ctx.fillStyle=c.body;arm(S,W,0);
};

/* ---------- knoppen, toestand en afspeellus ---------- */
(function(){
  const MODES=[['iso','Isometrisch'],['dyn','Dynamisch']];
  const st={mode:'iso',variant:PAGE.def||PAGE.variants[0][0]};
  let playing=true,slow=false,phaseT=0,last=performance.now();
  const mBox=document.getElementById('modes'),vBox=document.getElementById('vars');
  const mk=(box,list,key)=>list.forEach(([id,lab])=>{const b=document.createElement('button');b.type='button';b.id=key+'-'+id;b.textContent=lab;b.dataset.v=id;b.onclick=()=>set(key,id);box.appendChild(b);});
  mk(mBox,MODES,'mode');mk(vBox,PAGE.variants,'variant');
  function sync(){
    mBox.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===st.mode)));
    vBox.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===st.variant)));
    if(PAGE.onChange)PAGE.onChange(st);
  }
  function set(k,v){st[k]=v;phaseT=0;sync();try{localStorage.setItem(PAGE.key,JSON.stringify(st))}catch(e){}}
  try{const s=JSON.parse(localStorage.getItem(PAGE.key)||'null');if(s){if(MODES.some(m=>m[0]===s.mode))st.mode=s.mode;if(PAGE.variants.some(v=>v[0]===s.variant))st.variant=s.variant;}}catch(e){}
  const h=location.hash.slice(1).split('-');
  if(MODES.some(m=>m[0]===h[0]))st.mode=h[0];
  if(h[1]&&PAGE.variants.some(v=>v[0]===h[1]))st.variant=h[1];
  sync();
  window.__set=(m,v)=>{st.mode=m;st.variant=v;sync();};
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(playing&&!reduce)phaseT+=dt*(slow?.5:1);
    const per=PAGE.period(st.mode,st.variant);if(per)phaseT%=per;
    const T=window.__T!=null?window.__T:(reduce?PAGE.still(st.mode,st.variant):phaseT);
    const k=cv.width/VW;
    ctx.setTransform(k,0,0,k,-VX*k,-VY*k);
    const c={stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),muted:tok('--muted'),post:tok('--post')};
    ctx.fillStyle=c.stage;ctx.fillRect(VX,VY,VW,VH);

    requestAnimationFrame(frame);
  }
  document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
  document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
  requestAnimationFrame(frame);
})();
<\/script>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));

  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);

}
let F=1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;

  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
/* gebogen ledemaat/romp langs een kwadratische curve a-c-b, zelfde profielen als limb */
function curveLimb(a,c,b,rA,rB,front,back){
  const N=36,prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,cc,w]of bs)r+=m*Math.exp(-(((t-cc)/w)**2));return r};
  const pt=t=>P((1-t)*(1-t)*a.x+2*(1-t)*t*c.x+t*t*b.x,(1-t)*(1-t)*a.y+2*(1-t)*t*c.y+t*t*b.y);
  const tg=t=>{const x=2*(1-t)*(c.x-a.x)+2*t*(b.x-c.x),y=2*(1-t)*(c.y-a.y)+2*t*(b.y-c.y),l=Math.hypot(x,y)||1;return P(x/l,y/l)};
  const L=[],Rr=[];
  for(let i=0;i<=N;i++){const t=i/N,p=pt(t),u=tg(t),nx=-u.y*F,ny=u.x*F,rf=prof(t,front),rb=prof(t,back);
    L.push(P(p.x+nx*rf,p.y+ny*rf));Rr.push(P(p.x-nx*rb,p.y-ny*rb));}
  ctx.beginPath();L.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));

}
/* voet in zijaanzicht: ca. 40 lang (enkel r9, teen r6) */
function footSide(A,ang){capsule(A,9,P(A.x+Math.cos(ang)*25,A.y+Math.sin(ang)*25),6);}
const ell=(c,rx,ry,rot)=>{ctx.beginPath();ctx.ellipse(c.x,c.y,rx,ry,rot||0,0,Math.PI*2);ctx.fill();};
const P=(x,y)=>({x,y});
const add=(a,b)=>P(a.x+b.x,a.y+b.y),sub=(a,b)=>P(a.x-b.x,a.y-b.y),mul=(a,k)=>P(a.x*k,a.y*k);
const dirA=a=>P(Math.cos(a),Math.sin(a)),angOf=v=>Math.atan2(v.y,v.x);
const along=(a,ang,len)=>P(a.x+Math.cos(ang)*len,a.y+Math.sin(ang)*len);
const ease=t=>.5-.5*Math.cos(Math.PI*Math.max(0,Math.min(1,t)));
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),DEG=Math.PI/180;
const lerpP=(a,b,t)=>P(lerp(a.x,b.x,t),lerp(a.y,b.y,t));

/* shared body standard: torso 155, thigh 148, shin 132, upper arm 104, forearm 81 */
const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];
const profR=(rA,rB,bs,t)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};

/* flat hand, fingers along +x, back of the hand on the -y side */
function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-4,W.y-9);
  ctx.quadraticCurveTo(W.x+14,W.y-10,W.x+28,W.y-3);
  ctx.quadraticCurveTo(W.x+40,W.y+1,W.x+40,W.y+5);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+16,W.y+8);
  ctx.lineTo(W.x-6,W.y+8);
  ctx.closePath();ctx.fill();
}
function handAt(W,ang,flip){ctx.save();ctx.translate(W.x,W.y);ctx.rotate(ang);if(flip)ctx.scale(1,-1);hand(P(0,0));ctx.restore();}
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
const fistC=(W,E)=>{const d=sub(W,E),l=Math.hypot(d.x,d.y)||1;return P(W.x+d.x/l*9,W.y+d.y/l*9)};
function edgeHand(W,T){const dx=T.x-W.x,dy=T.y-W.y,L=Math.hypot(dx,dy);if(L<1){dot(W,8);return;}const a=Math.atan2(dy,dx),h=Math.min(1,L/16);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(2+17*h,0,6+15*h,9,0,0,Math.PI*2);ctx.fill();ctx.restore();}
/* flat hand seen from the palm or the back (top / front views): wrist 13 wide, hand 18 wide, ca. 37 beyond the wrist, with thumb.
   ang = finger direction on screen, k = foreshortening (1 = full length), th = thumb side (+1/-1 in local y) */
function palmHand(W,ang,k,th){
  const kk=Math.max(.38,k==null?1:k),t=th||1;
  ctx.save();ctx.translate(W.x,W.y);ctx.rotate(ang);ctx.scale(kk,1);
  ctx.beginPath();
  ctx.moveTo(-3,-6.2);ctx.quadraticCurveTo(5,-9.2,14,-8.8);ctx.lineTo(28,-7.4);
  ctx.quadraticCurveTo(37,-6.4,37,0);ctx.quadraticCurveTo(37,6.4,28,7.4);
  ctx.lineTo(14,8.8);ctx.quadraticCurveTo(5,9.2,-3,6.2);ctx.closePath();ctx.fill();
  capsule(P(7,t*6),4.3,P(15.5,t*11.5),3.4);
  ctx.restore();
}
/* side-view flat hand that follows the forearm (skill: same flat hand turning with the forearm) */
function sideHand(W,E,flip){handAt(W,Math.atan2(W.y-E.y,W.x-E.x),flip);}
/* foot in side view, ca. 40 long; ang = direction heel->toes */
function footSide(A,ang,sole){const m=along(A,ang,18),t=along(A,ang,27);capsule(A,9,m,7);capsule(m,7,t,4.5);if(sole)dot(add(along(A,ang,-2),mul(dirA(ang+sole*Math.PI/2),4.5)),8.5);}
/* flat foot on the floor in side view, sole on the floor; dir = +1 toes right, -1 toes left */
function footFlat(A,dir){capsule(P(A.x-dir*3,A.y+1),9,P(A.x+dir*23,A.y+5),5.5);}
/* foot seen from above: narrower ankle, wider toes; k = foreshortening */
function footTop(A,ang,k){capsule(A,6,along(A,ang,3+23*k),9.5);}
/* foot seen from the front (standing): 19 wide, low */
function footFront(A,s){ell(P(A.x,A.y),10,7);ell(P(A.x+s*2,A.y+3),10.5,5);}
function curveLimb(a,c,b,rA,rB,front,back){
  const N=36,pt=t=>P((1-t)*(1-t)*a.x+2*(1-t)*t*c.x+t*t*b.x,(1-t)*(1-t)*a.y+2*(1-t)*t*c.y+t*t*b.y);
  const tg=t=>{const x=2*(1-t)*(c.x-a.x)+2*t*(b.x-c.x),y=2*(1-t)*(c.y-a.y)+2*t*(b.y-c.y),l=Math.hypot(x,y)||1;return P(x/l,y/l)};
  const L=[],R=[];
  for(let i=0;i<=N;i++){const t=i/N,p=pt(t),u=tg(t),nx=-u.y*F,ny=u.x*F,rf=profR(rA,rB,front,t),rb=profR(rA,rB,back,t);
    L.push(P(p.x+nx*rf,p.y+ny*rf));R.push(P(p.x-nx*rb,p.y-ny*rb));}
  ctx.beginPath();L.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
  for(let i=N;i>=0;i--)ctx.lineTo(R[i].x,R[i].y);ctx.closePath();ctx.fill();
  dot(a,(profR(rA,rB,front,0)+profR(rA,rB,back,0))/2);dot(b,(profR(rA,rB,front,1)+profR(rA,rB,back,1))/2);
  return {pt,tg};
}
function ik(S,T,l1,l2,bend){
  const dx=T.x-S.x,dy=T.y-S.y,d=clamp(Math.hypot(dx,dy),1,l1+l2-.01);
  const base=Math.atan2(dy,dx),off=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));
  return along(S,base+bend*off,l1);
}
/* draw fn twice: first a thin outline in the stage colour, then filled */
function outlined(fn,stage,w){
  const f0=ctx.fill;ctx.strokeStyle=stage;ctx.lineWidth=w||5;ctx.lineJoin='round';
  ctx.fill=function(){ctx.stroke();};fn();ctx.fill=f0;fn();
}
/* torso seen from the front, back or above: body frame x from hip (0) to shoulder (155), z sideways */
const TK=[[-24,0],[-15,26],[0,34],[33,32],[64,28],[105,38],[138,47],[157,44],[172,18],[178,13]];
const wAt=x=>{if(x<=TK[0][0])return TK[0][1];for(let i=1;i<TK.length;i++){if(x<=TK[i][0]){const[x0,w0]=TK[i-1],[x1,w1]=TK[i],u=ease((x-x0)/(x1-x0));return w0+(w1-w0)*u}}return 13};
function frontTorso(ws){
  ws=ws||1;ctx.beginPath();
  for(let x=-24;x<=178;x+=4){const w=wAt(x)*(x>150?1:ws);x>-24?ctx.lineTo(x,w):ctx.moveTo(x,w);}
  for(let x=178;x>=-24;x-=4)ctx.lineTo(x,-wAt(x)*(x>150?1:ws));
  ctx.closePath();ctx.fill();
}
function label(t,x,y,al){ctx.fillStyle=tok('--muted');ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign=al||'left';ctx.fillText(t,x,y);}
function mat(x,y,w){ctx.fillStyle=C.mat;ctx.beginPath();ctx.roundRect(x,y,w,10,5);ctx.fill();}

let mode='iso',vari=null,playing=true,slow=false,phaseT=0,last=performance.now(),C={};
function colors(){return {stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),muted:tok('--muted'),band:tok('--band'),bandfar:tok('--bandfar'),post:tok('--post')}}
function setMode(m){mode=m;phaseT=0;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));try{localStorage.setItem(KEY+'-mode',m)}catch(e){}}
function setVar(v){vari=v;phaseT=0;document.querySelectorAll('[data-var]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.var===v)));try{localStorage.setItem(KEY+'-var',v)}catch(e){}}
function boot(){
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
  document.querySelectorAll('[data-var]').forEach(b=>b.onclick=()=>setVar(b.dataset.var));
  const vs=[...document.querySelectorAll('[data-var]')].map(b=>b.dataset.var);
  setVar(DEFAULT_VAR);setMode('iso');
  try{const m=localStorage.getItem(KEY+'-mode'),v=localStorage.getItem(KEY+'-var');if(m==='iso'||m==='dyn')setMode(m);if(vs.includes(v))setVar(v);}catch(e){}
  document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
  document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
  requestAnimationFrame(frame);
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing&&!reduce)phaseT+=dt*(slow?.5:1);
  const cyc=EX.cycle(mode,vari);
  const ph=window.__ph!=null?window.__ph:(reduce?EX.rest(mode,vari):phaseT%cyc);
  const k=cv.width/VW;
  ctx.setTransform(k,0,0,k,0,0);
  C=colors();
  ctx.fillStyle=C.stage;ctx.fillRect(0,0,VW,VH);
  EX.draw(ph,mode,vari);
  requestAnimationFrame(frame);
}

const VW=640,VH=420,KEY='openbook',DEFAULT_VAR='gestrekt';
const RMAX=34*DEG,P0=P(0,-200),PIV=P(-44,-200);
function openT(ph){if(ph<1.8)return ease(ph/1.8);if(ph<2.6)return 1;if(ph<4.4)return 1-ease((ph-2.6)/1.8);return 0}
const EX={
  cycle:(m,v)=>m==='dyn'?4.8:4,
  rest:(m)=>m==='dyn'?2.2:0,
  draw(ph,m,v){
    const br=Math.sin(ph/4*Math.PI*2);
    const t=m==='iso'?.975+.025*br:openT(ph);
    const glow=m==='iso'?.8+.2*(.5+.5*br):.3+.7*t;
    const Q=pose(t,v);
    ctx.save();ctx.translate(222,372);ctx.scale(.78,.78);
    mat(-250,0,500);front(Q,v,glow);ctx.restore();
    label('VOORAANZICHT',222,404,'center');
    ctx.save();ctx.translate(500,372);ctx.scale(.44,.44);
    mat(-200,0,430);side(Q,v,glow);ctx.restore();
    label('ZIJAANZICHT',530,404,'center');
  }
};
const rotA=(p,a)=>P(p.x*Math.cos(a)-p.y*Math.sin(a),p.x*Math.sin(a)+p.y*Math.cos(a));
const chest=(p,R)=>add(PIV,rotA(add(p,P(44,0)),-R));   /* chest frame turns around the support shoulder (hand stays on the floor) */
function pose(t,v){
  const R=RMAX*t;
  const Sm=chest(P(44,0),R),Ss=chest(P(-44,0),R);
  /* moving (left) arm: from under the chest (on the floor) out and up to the ceiling */
  const al=v==='hoofd'?lerp(112,-78,t)*DEG:lerp(102,-90,t)*DEG;
  return {t,R,Sm,Ss,al};
}
/* ---------- front view: camera at the head end ---------- */
function frontArmSeg(S,E,W){limb(S,E,16,11,[[4,.5,.22]],[[4,.5,.22]]);dot(E,11);limb(E,W,11.5,6.5,[[3,.25,.2]],[[3,.25,.2]]);}
function floorHandFront(W,s){                    /* flat hand, fingers toward the camera: low and wide, thumb inward */
  ell(P(W.x,W.y+4),10.5,6);capsule(P(W.x-s*6,W.y+5),3.6,P(W.x-s*13,W.y+7),3);
}
function front(Q,v,glow){
  F=1;ctx.fillStyle=C.far;
  /* thighs and pelvis are further away: far colour */
  for(const s of [-1,1]){limb(P(s*20,-150),P(s*21,-15),23,15,[[4,.4,.3]],[[4,.4,.3]]);dot(P(s*21,-15),14.5);}
  /* support arm (right arm, screen left): hand stays on the floor under the shoulder */
  const Wsup=P(-44,-12),Esup=ik(Q.Ss,Wsup,104,81,1);
  /* torso seen end-on: pelvis stays, chest rotates with the arm */
  ell(P(0,-160),36,25,0);
  ctx.fillStyle=C.body;
  ell(chest(P(0,26),Q.R*.5),32,22,-Q.R*.5);
  ell(chest(P(0,4),Q.R),44,28,-Q.R);
  ell(chest(P(0,-18),Q.R),30,15,-Q.R);
  outlined(()=>{frontArmSeg(Q.Ss,Esup,Wsup);floorHandFront(Wsup,-1);dot(Q.Ss,18);},C.stage,3);
  ctx.fillStyle=C.body;dot(Q.Sm,18);
  ctx.save();ctx.fillStyle=C.mus;
  ctx.globalAlpha=glow*(.25+.75*Q.t);ell(chest(P(24,16),Q.R),17,10,-Q.R);
  ctx.globalAlpha=glow*.55;ell(chest(P(16,-20),Q.R),18,8,-Q.R);
  ctx.restore();
  ctx.fillStyle=C.body;
  /* head looks down, follows the chest */
  const hc=chest(P(0,14),Q.R*.7);
  const headF=()=>outlined(()=>{capsule(chest(P(0,-4),Q.R*.7),12,hc,12);ell(hc,24,27,-Q.R*.7);},C.stage,3);
  const a=Q.al,u=P(Math.cos(a),Math.sin(a));
  if(v==='hoofd'){
    headF();
    const E=add(Q.Sm,mul(u,104)),tgt=add(hc,rotA(P(4,-24),-Q.R*.7)),dw=sub(tgt,E),lw=Math.hypot(dw.x,dw.y)||1;
    const W=add(E,mul(dw,Math.min(81,lw)/lw));
    outlined(()=>{frontArmSeg(Q.Sm,E,W);palmHand(W,angOf(dw),.7,-1);dot(Q.Sm,18);},C.stage,3);
  }else{
    headF();
    const E=add(Q.Sm,mul(u,104)),W=add(Q.Sm,mul(u,185));
    const k=clamp((102*DEG-a)/(70*DEG),.4,1);
    outlined(()=>{frontArmSeg(Q.Sm,E,W);palmHand(W,a,k,-1);dot(Q.Sm,18);},C.stage,3);
  }
}
/* ---------- side view (left side toward the camera), standard tabletop ---------- */
const H0=P(0,-162),S0=P(151,-195);
function sLeg(dx,dy){
  const H=P(H0.x+dx,H0.y+dy),K=P(dx,-14.5+dy),A=P(-132+dx,-12+dy);
  limb(H,K,24,15,THIGH_F,THIGH_B);dot(K,14.5);
  limb(K,A,14.5,9,SHIN_F,SHIN_B);
  footSide(A,Math.PI+6*DEG,1);
}
function side(Q,v,glow){
  F=-1;
  const sy=Q.Sm.y+5;                              /* moving shoulder rises with the rotation */
  ctx.fillStyle=C.far;
  sLeg(-10,-3);
  {const S=P(S0.x-12,S0.y-3),W=P(S0.x-12,-12),E=P(S.x,S.y+104);limb(S,E,16,11,UA_F,UA_B);dot(E,11);limb(E,W,11.5,6.5,FA_F,FA_B);hand(W);}
  ctx.fillStyle=C.body;
  limb(S0,H0,27,24,T_FRONT,T_BACK);
  const L=Math.hypot(H0.x-S0.x,H0.y-S0.y),ux=(H0.x-S0.x)/L,uy=(H0.y-S0.y)/L;
  let dnx=-uy,dny=ux;if(dny<0){dnx=-dnx;dny=-dny;}
  const ga=Math.atan2(uy,ux);
  ell(P(H0.x-dnx*15,H0.y-dny*15),31,23,ga);
  sLeg(0,0);
  capsule(P(S0.x-ux*14,S0.y-uy*14-4),12,P(S0.x-ux*30,S0.y-uy*30-6),11);
  const hc=P(S0.x-ux*56+dnx*4,S0.y-uy*56+dny*4-4);
  ell(hc,29,25,ga);
  ctx.save();ctx.fillStyle=C.mus;ctx.globalAlpha=glow*(.25+.75*Q.t);
  ell(P(S0.x-14,S0.y+20),20,10,ga);ctx.restore();
  ctx.fillStyle=C.body;
  const S=P(S0.x,sy),sa=Math.sin(Q.al);
  if(v==='hoofd'){
    const E=P(S.x+6,S.y+104*sa),tgt=P(hc.x-10,hc.y-22),dw=sub(tgt,E),lw=Math.hypot(dw.x,dw.y)||1;
    const W=add(E,mul(dw,Math.min(81,lw)/lw));
    outlined(()=>{const seg=(a,b,rA,rB,bm)=>Math.hypot(b.x-a.x,b.y-a.y)>10?limb(a,b,rA,rB,bm,bm):dot(a,rA);
      seg(S,E,16,11,UA_F);dot(E,11);seg(E,W,11.5,6.5,FA_F);palmHand(W,angOf(dw),.6,1);dot(S,21);},C.stage);
  }else{
    const E=P(S.x+2,S.y+104*sa),W=P(S.x+3,S.y+185*sa);
    outlined(()=>{const seg=(a,b,rA,rB,bm)=>Math.hypot(b.x-a.x,b.y-a.y)>10?limb(a,b,rA,rB,bm,bm):dot(a,rA);
      seg(S,E,16,11,UA_F);dot(E,11);seg(E,W,11.5,6.5,FA_F);
      ctx.save();ctx.translate(W.x,W.y);ctx.rotate(sa>0?0:-Math.PI/2);ctx.scale(Math.max(Math.abs(sa),.3),1);hand(P(0,0));ctx.restore();

  }
}
boot();
<\/script>

<style>

<main>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let playing=true,slow=false,phaseT=0,last=performance.now();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
const ease=t=>.5-.5*Math.cos(Math.PI*t);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const P=(x,y)=>({x,y});
const DEG=Math.PI/180;

function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();ctx.fill();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
/* two-bone IK: returns the joint; pick(a,b) chooses between the two solutions */
function ik(S,T,l1,l2,pick){
  const dx=T.x-S.x,dy=T.y-S.y,d=Math.max(1,Math.min(Math.hypot(dx,dy),l1+l2-.5));
  const base=Math.atan2(dy,dx),off=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));
  const a=P(S.x+l1*Math.cos(base+off),S.y+l1*Math.sin(base+off));
  const b=P(S.x+l1*Math.cos(base-off),S.y+l1*Math.sin(base-off));
  return pick(a,b);
}
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
/* draw everything an outline function draws as a stroke in the stage colour (gap where a limb crosses the body) */
function outlined(fn){
  const f0=ctx.fill;ctx.save();ctx.strokeStyle=tok('--stage');ctx.lineWidth=5;ctx.lineJoin='round';
  ctx.fill=function(){ctx.stroke();};fn();ctx.fill=f0;ctx.restore();fn();
}
