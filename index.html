<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Push-up</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one stage card with the animation, mode + variation buttons and playback controls, then a muscle legend */
:root{
  --bg:#EDF0EE; --stage:#F8FAF9; --ink:#1E2426; --muted:#5E686A; --body:#2A3134; --far:#7C8689;
  --muscle:#E0452B; --mat:#D6DCD9; --line:#D3D9D6; --band:#2C8C7E; --bandfar:#8CC2B9; --post:#B9C1BE;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --text:"Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121617; --stage:#1A1F20; --ink:#E8ECEA; --muted:#98A3A0; --body:#D9E0DD; --far:#7F8A87;
  --muscle:#FF5B3E; --mat:#2A3133; --line:#2C3335; --band:#4DBDAC; --bandfar:#2F6E66; --post:#3A4345; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121617; --stage:#1A1F20; --ink:#E8ECEA; --muted:#98A3A0; --body:#D9E0DD; --far:#7F8A87;
  --muscle:#FF5B3E; --mat:#2A3133; --line:#2C3335; --band:#4DBDAC; --bandfar:#2F6E66; --post:#3A4345; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
main{max-width:860px;margin:0 auto;display:grid;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,7vw,52px);line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;height:auto;margin:0 auto}
.bar{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:12px 16px;border-top:1px solid var(--line)}
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button[aria-pressed="true"]{background:var(--ink);color:var(--stage);border-color:var(--ink)}
.opt{font-family:var(--display);font-weight:500;font-size:18px;letter-spacing:.03em;padding:4px 12px}
.seg.main .opt{font-weight:700;text-transform:uppercase;letter-spacing:.05em}
button:focus-visible{outline:2px solid var(--muscle);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:15px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muscle)}
.dot.soft{opacity:.55}

</style>

<main>
  <header>
    <h1>Push-up</h1>
    <p class="sub">Borst, triceps en voorkant schouders</p>
  </header>

  <section class="stage">
    <canvas id="c" width="1200" height="619" aria-label="Animatie van een push-up, van opzij gezien"></canvas>
    <div class="bar">
      <div class="opts">
        <div class="seg main" data-g="mode" role="group" aria-label="Uitvoering">
          <button class="opt" data-v="iso" aria-pressed="false">Isometrisch</button>
          <button class="opt" data-v="dyn" aria-pressed="true">Dynamisch</button>
        </div>
        <div class="seg" data-g="v" role="group" aria-label="Variatie">
          <button class="opt" data-v="knees" aria-pressed="false">Op de knieën</button>
          <button class="opt" data-v="straight" aria-pressed="true">Gestrekt</button>
          <button class="opt" data-v="plus" aria-pressed="false">Push-up plus</button>
        </div>
        <div class="seg" data-g="hold" role="group" aria-label="Stand bij vasthouden" id="hold" hidden>
          <button class="opt" data-v="high" aria-pressed="true">Hoog</button>
          <button class="opt" data-v="low" aria-pressed="false">Laag</button>
        </div>
      </div>
      <div class="seg">
        <button id="play" aria-pressed="false">Pauze</button>
        <button id="slow" aria-pressed="false">Langzaam</button>
      </div>
    </div>
  </section>

  <div class="legend">
    <span><i class="dot"></i>Borstspieren (primair)</span>
    <span><i class="dot soft"></i>Triceps en voorkant schouders (secundair)</span>
    <span data-when="v:plus"><i class="dot"></i>Serratus anterior (plus: schouderbladen uitduwen)</span>
  </div>
</main>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let playing=true,slow=false,phaseT=0,last=performance.now();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
const ease=t=>.5-.5*Math.cos(Math.PI*t);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const P=(x,y)=>({x,y});
const DEG=Math.PI/180;

function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();ctx.fill();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
/* two-bone IK: returns the joint; pick(a,b) chooses between the two solutions */
function ik(S,T,l1,l2,pick){
  const dx=T.x-S.x,dy=T.y-S.y,d=Math.max(1,Math.min(Math.hypot(dx,dy),l1+l2-.5));
  const base=Math.atan2(dy,dx),off=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));
  const a=P(S.x+l1*Math.cos(base+off),S.y+l1*Math.sin(base+off));
  const b=P(S.x+l1*Math.cos(base-off),S.y+l1*Math.sin(base-off));
  return pick(a,b);
}
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
/* draw everything an outline function draws as a stroke in the stage colour (gap where a limb crosses the body) */
function outlined(fn){
  const f0=ctx.fill;ctx.save();ctx.strokeStyle=tok('--stage');ctx.lineWidth=5;ctx.lineJoin='round';
  ctx.fill=function(){ctx.stroke();};fn();ctx.fill=f0;ctx.restore();fn();
}
const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];

/* UI: Isometrisch / Dynamisch + variation groups */
const ui={mode:'dyn'};
function bindSeg(g,cb){
  const bs=[...document.querySelectorAll('.seg[data-g="'+g+'"] button')];
  const sel=v=>{bs.forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===v)));ui[g]=v;phaseT=0;cb&&cb(v);legend();};
  bs.forEach(b=>b.onclick=()=>sel(b.dataset.v));
  const on=bs.find(b=>b.getAttribute('aria-pressed')==='true')||bs[0];ui[g]=on.dataset.v;
  return sel;
}
function legend(){
  document.querySelectorAll('.legend [data-when]').forEach(el=>{
    const [g,vals]=el.dataset.when.split(':');el.hidden=!vals.split(',').includes(ui[g]);
  });
}
function startLoop(period,render){
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(playing&&!reduce){phaseT+=dt*(slow?.5:1);}
    const ph=window.__ph!=null?window.__ph:(reduce?null:phaseT%period(ui));
    render(ph,ui);
    requestAnimationFrame(frame);
  }
  document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
  document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
  legend();
  requestAnimationFrame(frame);
}
/* isometric hold: light breathing between .97 and 1 */
const breath=ph=>ph==null?0:.5+.5*Math.sin(ph*Math.PI*2/4);

const VX=120,VY=40,VW=640,VH=330;
const W0=P(616,322),FEET=P(204,312),KNEE=P(330,318);
const backElbow=(a,b)=>a.x<b.x?a:b;

/* depth 0 = arms straight, 1 = chest just above the floor; r = extra protraction (push-up plus) */
function pose(depth,r,v){
  const knees=v==='knees';
  const piv=knees?KNEE:FEET,R=knees?303:Math.hypot(604-FEET.x,142-FEET.y);
  /* top: shoulder where the straight arm and the straight body line meet */
  let Stop;
  if(knees){
    const d=Math.hypot(W0.x-piv.x,W0.y-piv.y),la=184,a=(R*R-la*la+d*d)/(2*d),h=Math.sqrt(Math.max(0,R*R-a*a));
    const ex=(W0.x-piv.x)/d,ey=(W0.y-piv.y)/d,m=P(piv.x+ex*a,piv.y+ey*a);
    const s1=P(m.x+ey*h,m.y-ex*h),s2=P(m.x-ey*h,m.y+ex*h);Stop=s1.y<s2.y?s1:s2;
  }else Stop=P(604,142);
  const sy=lerp(Stop.y,246,depth);
  const S=P(piv.x+Math.sqrt(R*R-(piv.y-sy)**2),sy);
  const ul=Math.hypot(piv.x-S.x,piv.y-S.y),ux=(piv.x-S.x)/ul,uy=(piv.y-S.y)/ul;
  let dnx=-uy,dny=ux;if(dny<0){dnx=-dnx;dny=-dny;}
  const T=P(S.x+dnx*(5*depth-16*r),S.y+dny*(5*depth-16*r));
  const tl=Math.hypot(piv.x-T.x,piv.y-T.y),tx=(piv.x-T.x)/tl,ty=(piv.y-T.y)/tl;
  const H=P(T.x+tx*155,T.y+ty*155);
  const K=knees?KNEE:P(H.x+tx*148,H.y+ty*148);
  const A=knees?P(KNEE.x-132,320):FEET;
  const E=ik(S,W0,104,81,backElbow);
  return {S,T,H,K,A,E,W:W0,ux:tx,uy:ty,dnx,dny,knees};
}
function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-4,W.y-8);
  ctx.quadraticCurveTo(W.x+14,W.y-10,W.x+28,W.y-3);
  ctx.quadraticCurveTo(W.x+40,W.y+1,W.x+40,W.y+5);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+16,W.y+8);
  ctx.lineTo(W.x-6,W.y+8);
  ctx.closePath();ctx.fill();
}
function toeFoot(A){
  capsule(P(A.x-6,A.y+2),9,P(A.x+12,A.y+15),6);
  capsule(P(A.x+12,A.y+15),6,P(A.x+22,A.y+16),4);
}
function arm(q,dx,dy){
  const S=P(q.S.x+dx,q.S.y+dy),E=P(q.E.x+dx,q.E.y+dy*.5),W=P(q.W.x+dx,q.W.y+dy);
  limb(S,E,16,11,UA_F,UA_B);dot(E,11);
  limb(E,W,11.5,7,FA_F,FA_B);
  dot(P(S.x+3,S.y-2),21);
  hand(W);
  return {S,E,W};
}
function leg(q,dx,dy){
  const H=P(q.H.x+dx,q.H.y+dy),K=P(q.K.x+dx,q.K.y+(q.knees?0:dy)),A=P(q.A.x+dx,q.A.y);
  limb(H,K,24,15,THIGH_F,THIGH_B);dot(K,14.5);
  limb(K,A,14.5,9,SHIN_F,SHIN_B);
  if(q.knees)capsule(A,9,P(A.x-30,A.y+4),6);else toeFoot(A);
}
function blade(cx,cy,side,p){
  const sp=8+20*p,rot=side*(.05+.22*p);
  ctx.save();ctx.translate(cx+side*sp,cy-30);ctx.rotate(rot);
  ctx.beginPath();
  ctx.moveTo(0,0);ctx.lineTo(side*40,-4);ctx.quadraticCurveTo(side*44,6,side*32,18);
  ctx.lineTo(side*6,56);ctx.quadraticCurveTo(side*-2,58,0,48);ctx.closePath();ctx.fill();
  ctx.restore();
}
function inset(p,glow,c){
  const cx=208,cy=164;
  ctx.fillStyle=c.body;
  ctx.beginPath();
  ctx.moveTo(cx-70,cy-40);ctx.quadraticCurveTo(cx-78,cy-58,cx-52,cy-62);
  ctx.lineTo(cx+52,cy-62);ctx.quadraticCurveTo(cx+78,cy-58,cx+70,cy-40);
  ctx.quadraticCurveTo(cx+56,cy+20,cx+42,cy+62);ctx.lineTo(cx-42,cy+62);
  ctx.quadraticCurveTo(cx-56,cy+20,cx-70,cy-40);ctx.fill();
  capsule(P(cx,cy-60),14,P(cx,cy-74),13);
  ctx.beginPath();ctx.ellipse(cx,cy-96,22,26,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=c.far;blade(cx,cy,-1,p);blade(cx,cy,1,p);
  ctx.save();ctx.fillStyle=c.mus;ctx.globalAlpha=glow*p;
  for(const s of [-1,1]){ctx.beginPath();ctx.ellipse(cx+s*(52+12*p),cy+8,9,24,s*.25,0,Math.PI*2);ctx.fill();}
  ctx.restore();
  ctx.strokeStyle=c.far;ctx.lineWidth=2;ctx.setLineDash([3,4]);
  ctx.beginPath();ctx.moveTo(cx,cy-56);ctx.lineTo(cx,cy+58);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=c.muted;ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign='center';
  ctx.fillText('BOVENAANZICHT',cx,cy+88);
}
function motion(ph,u){
  const plus=u.v==='plus',b=breath(ph);
  if(ph==null)return plus?{d:0,r:1}:{d:.5,r:0};
  if(u.mode==='iso'){if(u.hold==='low')return {d:.97+.03*b,r:0};return plus?{d:0,r:.94+.06*b}:{d:.48+.04*b,r:0};}
  const q=ph;
  let d;
  if(q<1.2)d=ease(q/1.2);else if(q<1.4)d=1;else if(q<2.4)d=1-ease((q-1.4)/1.0);else d=0;
  let r=0;
  if(plus&&q>=2.5&&q<3.9){const x=(q-2.5)/1.4;r=x<.4?ease(x/.4):x<.6?1:1-ease((x-.6)/.4);}
  return {d,r};
}
function draw(ph,u){
  const k=cv.width/VW;
  ctx.setTransform(k,0,0,k,-VX*k,-VY*k);
  const c={stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),muted:tok('--muted')};
  ctx.fillStyle=c.stage;ctx.fillRect(VX,VY,VW,VH);
  ctx.fillStyle=c.mat;ctx.beginPath();ctx.roundRect(150,332,600,10,5);ctx.fill();
  const m=motion(ph,u),q=pose(m.d,m.r,u.v);
  const glow=.4+.6*Math.max(m.d,u.mode==='iso'?.85:0);
  F=-1;
  ctx.fillStyle=c.far;leg(q,-14,-3);arm(q,-14,-3);
  ctx.fillStyle=c.body;
  limb(P(q.T.x-4,q.T.y),q.H,27,24,T_FRONT,T_BACK);
  ctx.beginPath();ctx.arc(q.H.x,q.H.y,27,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(q.H.x-q.dnx*15-q.ux*2,q.H.y-q.dny*15-q.uy*2,31,23,Math.atan2(q.uy,q.ux),0,Math.PI*2);ctx.fill();
  capsule(P(q.T.x-q.ux*14,q.T.y-q.uy*14-4),12,P(q.T.x-q.ux*30,q.T.y-q.uy*30-6),11);
  ctx.beginPath();ctx.ellipse(q.T.x-q.ux*56,q.T.y-q.uy*56-7,29,25,Math.atan2(q.uy,q.ux),0,Math.PI*2);ctx.fill();
  leg(q,0,0);

  const ang=Math.atan2(q.uy,q.ux);
  ctx.save();ctx.fillStyle=c.mus;
  ctx.globalAlpha=glow;
  ctx.beginPath();ctx.ellipse(q.T.x+q.ux*30+q.dnx*16,q.T.y+q.uy*30+q.dny*16,26,11,ang,0,Math.PI*2);ctx.fill();
  if(u.v==='plus'){
    ctx.globalAlpha=.25+.75*m.r;
    ctx.beginPath();ctx.ellipse(q.T.x+q.ux*58+q.dnx*12,q.T.y+q.uy*58+q.dny*12,28,10,ang,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();

  ctx.fillStyle=c.body;
  let ar;outlined(()=>{ar=arm(q,0,0);});
  ctx.save();ctx.fillStyle=c.mus;ctx.globalAlpha=glow*.55;
  const ex=ar.E.x-ar.S.x,ey=ar.E.y-ar.S.y,el=Math.hypot(ex,ey);
  let ox=-ey/el,oy=ex/el;if(oy>0){ox=-ox;oy=-oy;}
  const tri=P(ar.S.x+ex*.55+ox*9,ar.S.y+ey*.55+oy*9);
  ctx.beginPath();ctx.ellipse(tri.x,tri.y,24,7,Math.atan2(ey,ex),0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(ar.S.x+6,ar.S.y+6,12,15,-.3,0,Math.PI*2);ctx.fill();
  ctx.restore();
  if(u.v==='plus'&&!(u.mode==='iso'&&u.hold==='low')){const pr=clamp(.5-.5*m.d+.5*m.r,0,1);inset(pr,1,c);}
}
bindSeg('mode',m=>{document.getElementById('hold').hidden=m!=='iso';});bindSeg('v');bindSeg('hold');
startLoop(u=>u.v==='plus'?4:2.8,draw);
<\/script>

</body></html>
</script>

<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Prone raises</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one stage card with the animation, mode/variation/playback controls and a muscle legend */
:root{
  --bg:#EDF0EE; --stage:#F8FAF9; --ink:#1E2426; --muted:#5E686A; --body:#2A3134; --far:#7C8689;
  --muscle:#E0452B; --mat:#D6DCD9; --line:#D3D9D6; --post:#C9D0CD; --band:#2C8C7E;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --text:"Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --muscle:#FF5B3E; --mat:#2A3133; --line:#2C3335; --post:#323A3C; --band:#4DBDAC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121617; --stage:#1A1F20; --ink:#E8ECEA; --muted:#98A3A0; --body:#D9E0DD; --far:#7F8A87;
  --muscle:#FF5B3E; --mat:#2A3133; --line:#2C3335; --post:#323A3C; --band:#4DBDAC; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
main{max-width:860px;margin:0 auto;display:grid;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,7vw,52px);line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;height:auto}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 16px;border-top:1px solid var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.seg.play{margin-left:auto}
.seg.modes button{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase;padding:5px 12px}
button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button[aria-pressed="true"]{background:var(--ink);color:var(--stage);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--muscle);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:15px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muscle)}
.dot.soft{opacity:.55}
@media (max-width:560px){.seg.play{margin-left:0}}
</style>

<main>
  <header>
    <h1>Prone raises</h1>
    <p class="sub">Bovenrug, schouders en onderrug</p>
  </header>

  <section class="stage">
    <canvas id="c" width="1200" height="825" aria-label="Animatie van prone raises van bovenaf, met een zijaanzicht als inzet"></canvas>
    <div class="bar">
      <div class="seg modes" role="group" aria-label="Uitvoering" id="modes"></div>
      <div class="seg vars" role="group" aria-label="Variatie" id="vars"></div>
      <div class="seg play">
        <button id="play" type="button" aria-pressed="false">Pauze</button>
        <button id="slow" type="button" aria-pressed="false">Langzaam</button>
      </div>
    </div>
  </section>

  <div class="legend">
    <span><i class="dot"></i>Trapezius en rhomboïden (primair)</span>
    <span><i class="dot soft"></i>Rugstrekkers en bilspieren (secundair)</span>
  </div>
</main>

<script>
/* ---------- shared drawing helpers (vaste maten en spierprofielen) ---------- */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let VX=120,VY=80,VW=640,VH=290;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
const P=(x,y)=>({x,y});
const DEG=Math.PI/180,lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>.5-.5*Math.cos(Math.PI*clamp(t,0,1));
const lerpP=(a,b,t)=>P(lerp(a.x,b.x,t),lerp(a.y,b.y,t));
const dist=(a,b)=>Math.hypot(b.x-a.x,b.y-a.y);
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();ctx.fill();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
function curveLimb(a,c,b,rA,rB,front,back){
  const N=36,prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,cc,w]of bs)r+=m*Math.exp(-(((t-cc)/w)**2));return r};
  const pt=t=>P((1-t)*(1-t)*a.x+2*(1-t)*t*c.x+t*t*b.x,(1-t)*(1-t)*a.y+2*(1-t)*t*c.y+t*t*b.y);
  const tg=t=>{const x=2*(1-t)*(c.x-a.x)+2*t*(b.x-c.x),y=2*(1-t)*(c.y-a.y)+2*t*(b.y-c.y),l=Math.hypot(x,y)||1;return P(x/l,y/l)};
  const L=[],Rr=[];
  for(let i=0;i<=N;i++){const t=i/N,p=pt(t),u=tg(t),nx=-u.y*F,ny=u.x*F,rf=prof(t,front),rb=prof(t,back);
    L.push(P(p.x+nx*rf,p.y+ny*rf));Rr.push(P(p.x-nx*rb,p.y-ny*rb));}
  ctx.beginPath();L.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
  for(let i=N;i>=0;i--)ctx.lineTo(Rr[i].x,Rr[i].y);ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
  return {pt,tg};
}
/* vlakke hand plat op de vloer: handpalm onder op W.y+8, dikke handrug bij de pols, dunne vingers naar +x */
function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-6,W.y+8);
  ctx.lineTo(W.x+29,W.y+8);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+33.5,W.y+5);
  ctx.quadraticCurveTo(W.x+32,W.y+2,W.x+26,W.y+2);
  ctx.lineTo(W.x+18,W.y+1.5);
  ctx.quadraticCurveTo(W.x+15,W.y-1.5,W.x+10,W.y-1);
  ctx.quadraticCurveTo(W.x+3,W.y-3,W.x-1,W.y-4);
  ctx.quadraticCurveTo(W.x-9,W.y-4,W.x-9,W.y+3);
  ctx.quadraticCurveTo(W.x-9,W.y+8,W.x-6,W.y+8);
  ctx.closePath();ctx.fill();
}
const unit=(a,b)=>{const d=dist(a,b)||1;return P((b.x-a.x)/d,(b.y-a.y)/d);};
/* gestrekte voet in richting u (wreef naar de vloer, hiel aan de bovenkant): bij knielen en bij een gestrekt been */
function flatFoot(A,u){
  let n=P(u.y,-u.x);if(n.y>0)n=P(-n.x,-n.y);
  const m=P(A.x+u.x*22-n.x*1.5,A.y+u.y*22-n.y*1.5),t=P(A.x+u.x*36-n.x*2,A.y+u.y*36-n.y*2);
  capsule(P(A.x+n.x*4.5-u.x*3,A.y+n.y*4.5-u.y*3),8,m,6);
  capsule(A,9,m,6.5);capsule(m,6.5,t,4.5);
}
/* knielvoet: wreef plat achter de enkel, in het verlengde van het scheenbeen, iets naar de vloer */
function kneelFoot(K,A,ground=332){const sx=Math.sign(A.x-K.x)||-1,tip=P(A.x+sx*35,ground-4.5);flatFoot(A,unit(A,tip));}
/* voet op de tenen (plank): bal van de voet onder de enkel, hiel omhoog, tenen plat naar het hoofd (+x).
   u = richting knie -> enkel; ground = bovenkant van de mat (laat weg bij een opgetild been) */
function toeFoot(A,u,ground,toeDir){
  const p=P(-u.y,u.x).y>0?P(-u.y,u.x):P(u.y,-u.x);
  let L=24;if(ground!=null)L=clamp((ground-6.5-A.y)/p.y,16,30);
  const B=P(A.x+p.x*L,A.y+p.y*L),heel=P(A.x-p.x*5+u.x*3,A.y-p.y*5+u.y*3);
  const td=ground!=null?P(1,0):(toeDir||P(1,0));
  capsule(heel,8.5,B,6.5);
  capsule(B,6.5,P(B.x+td.x*14,B.y+td.y*14+(ground!=null?2.5:0)),4);
}
/* 3D-IK voor een vooraanzicht: punten {x,y,z}, pole = richting waar de elleboog heen wijst */
function ik3(S,W,l1,l2,pole){
  const d0=Math.hypot(W.x-S.x,W.y-S.y,W.z-S.z)||1,d=clamp(d0,Math.abs(l1-l2)+.5,l1+l2-.01);
  const u={x:(W.x-S.x)/d0,y:(W.y-S.y)/d0,z:(W.z-S.z)/d0};
  const pd=pole.x*u.x+pole.y*u.y+pole.z*u.z;
  let v={x:pole.x-pd*u.x,y:pole.y-pd*u.y,z:pole.z-pd*u.z};const vl=Math.hypot(v.x,v.y,v.z)||1;v={x:v.x/vl,y:v.y/vl,z:v.z/vl};
  const ca=clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1),sa=Math.sqrt(1-ca*ca);
  return {x:S.x+l1*(ca*u.x+sa*v.x),y:S.y+l1*(ca*u.y+sa*v.y),z:S.z+l1*(ca*u.z+sa*v.z)};
}
/* vlakke hand die meedraait met de onderarm; plat zodra de onderarm verticaal staat */
function turnHand(W,E){
  const aa=Math.atan2(W.y-E.y,W.x-E.x),sm=clamp((aa-45*DEG)/(45*DEG),0,1);
  ctx.save();ctx.translate(W.x,W.y);ctx.rotate(aa*(1-sm));hand(P(0,0));ctx.restore();
}
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
function edgeHand(W,T,wd=9){const dx=T.x-W.x,dy=T.y-W.y,L=Math.hypot(dx,dy);if(L<1){dot(W,8);return;}const a=Math.atan2(dy,dx),h=Math.min(1,L/16);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(2+17*h,0,6+15*h,wd,0,0,Math.PI*2);ctx.fill();ctx.restore();}
/* twee-segment IK: kies het gewricht aan de kant 'pick' (functie die de beste van twee kandidaten kiest) */
function ik(a,b,l1,l2,pick){
  const dx=b.x-a.x,dy=b.y-a.y;let d=Math.hypot(dx,dy);
  d=clamp(d,Math.abs(l1-l2)+.5,l1+l2-.01);
  const ang=Math.atan2(dy,dx),al=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));
  const c1=P(a.x+l1*Math.cos(ang+al),a.y+l1*Math.sin(ang+al)),c2=P(a.x+l1*Math.cos(ang-al),a.y+l1*Math.sin(ang-al));
  return pick(c1,c2)?c1:c2;
}
/* teken een vorm als dun randje in de achtergrondkleur (eerst stroken, dan vullen) */
function outlined(fn,col){
  const f0=ctx.fill;ctx.strokeStyle=col;ctx.lineWidth=5;ctx.lineJoin='round';
  ctx.fill=function(){ctx.stroke();};fn();ctx.fill=f0;fn();
}
function label(c,t,x,y,align='left'){ctx.fillStyle=c.muted;ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign=align;ctx.fillText(t,x,y);}
const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];
/* lichte trilling bij vasthouden, 0..1 */
const trem=T=>.5+.5*Math.sin(T*Math.PI*2*5.3)*Math.sin(T*Math.PI*2*.9+1);
const breath=T=>Math.sin(T*Math.PI*2/4);

/* Prone raises: bovenaanzicht + zijaanzicht van één 3D-model. t = heffen 0..1 */
const PAGE={key:'prone-state2',variants:[['I','I'],['Y','Y'],['T','T'],['W','W'],['flutter','Flutter kicks'],['swimmers','Swimmers']]};
VX=0;VY=0;VW=640;VH=440;
/* I = stroomlijn: armen gestrekt langs de oren, handen bijna tegen elkaar. W = ellebogen dicht bij het lichaam */
PAGE.dynOnly=['swimmers'];
const ARMS={I:[-.165,-.165],Y:[.72,.72],T:[1.57,1.57],W:[2.78,.5],flutter:[-.165,-.165],swimmers:[-.165,-.165]};
let cur=[...ARMS.I],lastV='I';
PAGE.onChange=s=>{};
const DUR={dyn:{flutter:5.6,swimmers:5.6},iso:15.4};
PAGE.period=(m,v)=>m==='iso'?15.4:(DUR.dyn[v]||4);
PAGE.still=m=>m==='iso'?6:1.6;
/* heffen in de tijd: [omhoog, boven, omlaag, rust] */
function liftCurve(ph,up,top,down){
  if(ph<up)return ease(ph/up);ph-=up;
  if(ph<top)return 1;ph-=top;
  if(ph<down)return 1-ease(ph/down);
  return 0;
}
function motion(m,v,T){
  let t,top0=0,topT;
  if(m==='iso'){t=liftCurve(T,1.2,12,1.2);topT=T-1.2;if(t>.99)t-=.025*trem(T);}
  else if(v==='flutter'||v==='swimmers'){t=liftCurve(T,1,3,1);topT=T-1;}
  else{t=liftCurve(T,1.2,1,1.2);topT=T-1.2;}
  let kick=0,sweep=0;
  const on=clamp((t-.6)/.4,0,1);
  if(v==='flutter')kick=Math.sin(Math.max(0,topT)*Math.PI*2*1.6)*on;
  if(v==='swimmers'){const per=3;sweep=on*(topT>0?.5-.5*Math.cos(Math.min(topT,m==='iso'?99:3)*Math.PI*2/per):0);}
  return {t,kick,sweep};
}
function model(t,v,kick,sweep){
  const sm=v==='superman';
  const a=(sm?.25:.2)*t,ca=Math.cos(a),sa=Math.sin(a),PV=95;
  const tor=(x,z,h0)=>x<=PV?{x,z,h:h0}:{x:PV+(x-PV)*ca,z,h:h0+(x-PV)*sa};
  const bL=[-1,1].map((s,k)=>Math.max(0,(sm?.16:.11)*t+.07*kick*(k?1:-1)));
  const leg=(d,z,h0,k)=>{const b=bL[k];return {x:-d*Math.cos(b),z,h:h0+d*Math.sin(b)}};
  const S=tor(155,0,14),M={};
  M.head=tor(205,0,24+8*t);M.neck=tor(176,0,16+3*t);
  M.sh=[-1,1].map(s=>tor(155,s*42,14));
  M.hip=[-1,1].map((s,k)=>leg(0,s*18,26,k));
  M.knee=[-1,1].map((s,k)=>leg(148,s*21,16,k));
  M.ank=[-1,1].map((s,k)=>leg(280,s*23,12,k));
  M.toe=[-1,1].map((s,k)=>leg(304,s*24,10,k));
  const e=.08+.2*t,ce=Math.cos(e),se=Math.sin(e);
  M.elb=[];M.wr=[];M.hand=[];
  let [tu,tf]=cur;
  if(v==='swimmers'){const sw=sweep*(Math.PI-.36);tu=Math.max(cur[0],sw);tf=Math.max(cur[1],sw);}
  [-1,1].forEach((s,k)=>{
    const o=M.sh[k];
    const du={x:Math.cos(tu)*ce,z:s*Math.sin(tu)*ce,h:se};
    const df={x:Math.cos(tf)*ce,z:s*Math.sin(tf)*ce,h:se};
    const E={x:o.x+du.x*104,z:o.z+du.z*104,h:o.h+du.h*104};
    const W={x:E.x+df.x*81,z:E.z+df.z*81,h:E.h+df.h*81};
    M.elb.push(E);M.wr.push(W);M.hand.push({x:W.x+df.x*18,z:W.z+df.z*18,h:W.h+df.h*18});
  });
  M.a=a;M.S=S;M.tor=tor;M.Wst=tor(PV,0,12);M.flat=sm;
  return M;
}
function torsoOutline(M,pr){
  const keys=[[-24,0],[-15,26],[0,34],[33,32],[64,28],[105,38],[138,47],[157,44],[172,18],[178,13]];
  const wAt=x=>{for(let i=1;i<keys.length;i++){if(x<=keys[i][0]){const[x0,w0]=keys[i-1],[x1,w1]=keys[i],u=ease((x-x0)/(x1-x0));return w0+(w1-w0)*u}}return 13};
  const pts=[];
  for(let x=-24;x<=178;x+=4)pts.push(pr(M.tor(x,wAt(x),12)));
  for(let x=178;x>=-24;x-=4)pts.push(pr(M.tor(x,-wAt(x),12)));
  ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fill();
}
function drawTop(M,c,glow,kickGlow){
  const ox=278,oy=212,sc=.85;
  const pr=p=>({x:ox+p.x*sc,y:oy+p.z*sc});
  const prs=p=>({x:ox+(p.x+p.h*.22+3)*sc,y:oy+(p.z+p.h*.3+3)*sc});
  F=1;
  for(const [pj,col] of [[prs,c.mat],[pr,c.body]]){
    ctx.fillStyle=col;
    for(let k=0;k<2;k++){
      limb(pj(M.hip[k]),pj(M.knee[k]),23,15,[[5,.45,.28]],[[5,.45,.28]]);dot(pj(M.knee[k]),14);
      limb(pj(M.knee[k]),pj(M.ank[k]),14,8.5,[[6,.27,.18]],[[6,.27,.18]]);
      capsule(pj(M.ank[k]),9,pj(M.toe[k]),8);
    }
    torsoOutline(M,pj);
    for(let k=0;k<2;k++){
      dot(pj(M.sh[k]),17);
      limb(pj(M.sh[k]),pj(M.elb[k]),15,11,[[3,.5,.22]],[[3,.5,.22]]);dot(pj(M.elb[k]),11);
      limb(pj(M.elb[k]),pj(M.wr[k]),11,6.5,[[3,.22,.2]],[[3,.22,.2]]);
      edgeHand(pj(M.wr[k]),pj(M.hand[k]),M.flat?13:9);
    }
    const hd=pj(M.head);ctx.beginPath();ctx.ellipse(hd.x,hd.y,26,22,0,0,Math.PI*2);ctx.fill();
    capsule(pj(M.neck),13,pj(M.S),14);
  }
  ctx.save();ctx.fillStyle=c.mus;
  const p=pr,S=M.S;
  ctx.globalAlpha=glow;
  for(const sd of [-1,1]){
    const c1=p({x:S.x-6,z:sd*20});ctx.beginPath();ctx.ellipse(c1.x,c1.y,28,15,sd*.12,0,Math.PI*2);ctx.fill();
    const c2=p({x:S.x-36,z:sd*11});ctx.beginPath();ctx.ellipse(c2.x,c2.y,28,11,-sd*.28,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=glow*.5;
  for(const s of [-1,1]){
    capsule(p({x:S.x-80,z:s*9}),6,p({x:20,z:s*9}),7);
  }
  ctx.globalAlpha=glow*Math.min(1,.5+kickGlow);
  for(const s of [-1,1]){const g=p({x:-6,z:s*16});ctx.beginPath();ctx.ellipse(g.x,g.y,18,15,0,0,Math.PI*2);ctx.fill();}
  ctx.restore();
  ctx.fillStyle=c.body;
  for(let k=0;k<2;k++)dot(pr(M.sh[k]),17);
}
function drawSide(M,c){
  const ox=172,oy=420,sc=.45;
  ctx.fillStyle=c.mat;ctx.beginPath();ctx.roundRect(ox-148,oy+2,330,5,2.5);ctx.fill();
  ctx.save();ctx.translate(ox,oy);ctx.scale(sc,sc);ctx.translate(-ox,-oy);
  const P2=p=>({x:ox+p.x,y:oy-p.h});
  F=-1;
  const legS=k=>{
    const H=P2(M.hip[k]),K=P2(M.knee[k]),A=P2(M.ank[k]),Tt=P2(M.toe[k]);
    limb(H,K,24,15,THIGH_F,THIGH_B);dot(K,14.5);
    limb(K,A,14.5,9,SHIN_F,SHIN_B);
    const d=Math.hypot(Tt.x-A.x,Tt.y-A.y)||1;
    capsule(A,9,{x:A.x+(Tt.x-A.x)/d*30,y:A.y+(Tt.y-A.y)/d*30+8},6);
  };
  const armS=k=>{
    const Sh=P2(M.sh[k]),E=P2(M.elb[k]),W=P2(M.wr[k]),Hd=P2(M.hand[k]);
    limb(Sh,E,15,11,UA_F,UA_B);dot(E,11);
    limb(E,W,11,6.5,FA_F,FA_B);
    if(M.flat){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);hand(P(0,0));ctx.restore();}
    else{fist(W,E);const Fc={x:W.x+(Hd.x-W.x)*.5,y:W.y+(Hd.y-W.y)*.5};capsule(Fc,6,{x:Fc.x,y:Fc.y-17},5);}
  };
  ctx.fillStyle=c.far;legS(0);armS(0);
  ctx.fillStyle=c.body;

/* ---------- knoppen, toestand en afspeellus ---------- */
(function(){
  const MODES=[['iso','Isometrisch'],['dyn','Dynamisch']];
  const st={mode:'iso',variant:PAGE.def||PAGE.variants[0][0]};
  let playing=true,slow=false,phaseT=0,last=performance.now();
  const mBox=document.getElementById('modes'),vBox=document.getElementById('vars');
  const mk=(box,list,key)=>list.forEach(([id,lab])=>{const b=document.createElement('button');b.type='button';b.id=key+'-'+id;b.textContent=lab;b.dataset.v=id;b.onclick=()=>set(key,id);box.appendChild(b);});
  mk(mBox,MODES,'mode');mk(vBox,PAGE.variants,'variant');

    /* variaties zonder isometrische stand (PAGE.dynOnly): alleen Dynamisch tonen */
    const only=!!(PAGE.dynOnly&&PAGE.dynOnly.includes(st.variant));
    if(only)st.mode='dyn';
    document.getElementById('mode-iso').hidden=only;
    mBox.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===st.mode)));

  }
  function set(k,v){st[k]=v;phaseT=0;sync();try{localStorage.setItem(PAGE.key,JSON.stringify(st))}catch(e){}}
  try{const s=JSON.parse(localStorage.getItem(PAGE.key)||'null');if(s){if(MODES.some(m=>m[0]===s.mode))st.mode=s.mode;if(PAGE.variants.some(v=>v[0]===s.variant))st.variant=s.variant;}}catch(e){}

  if(MODES.some(m=>m[0]===h[0]))st.mode=h[0];
  if(h[1]&&PAGE.variants.some(v=>v[0]===h[1]))st.variant=h[1];
  sync();
  window.__set=(m,v)=>{st.mode=m;st.variant=v;sync();};
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;

    const per=PAGE.period(st.mode,st.variant);if(per)phaseT%=per;
    const T=window.__T!=null?window.__T:(reduce?PAGE.still(st.mode,st.variant):phaseT);

    ctx.fillStyle=c.stage;ctx.fillRect(VX,VY,VW,VH);

  document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
  requestAnimationFrame(frame);
})();
<\/script>

<script>

  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);

  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;

/* vlakke hand plat op de vloer: handpalm onder op W.y+8, dikke handrug bij de pols, dunne vingers naar +x */
function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-6,W.y+8);
  ctx.lineTo(W.x+29,W.y+8);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+33.5,W.y+5);
  ctx.quadraticCurveTo(W.x+32,W.y+2,W.x+26,W.y+2);
  ctx.lineTo(W.x+18,W.y+1.5);
  ctx.quadraticCurveTo(W.x+15,W.y-1.5,W.x+10,W.y-1);
  ctx.quadraticCurveTo(W.x+3,W.y-3,W.x-1,W.y-4);
  ctx.quadraticCurveTo(W.x-9,W.y-4,W.x-9,W.y+3);

const unit=(a,b)=>{const d=dist(a,b)||1;return P((b.x-a.x)/d,(b.y-a.y)/d);};

function flatFoot(A,u){
  let n=P(u.y,-u.x);if(n.y>0)n=P(-n.x,-n.y);
  const m=P(A.x+u.x*22-n.x*1.5,A.y+u.y*22-n.y*1.5),t=P(A.x+u.x*36-n.x*2,A.y+u.y*36-n.y*2);

/* knielvoet: wreef plat achter de enkel, in het verlengde van het scheenbeen, iets naar de vloer */
function kneelFoot(K,A,ground=332){const sx=Math.sign(A.x-K.x)||-1,tip=P(A.x+sx*35,ground-4.5);flatFoot(A,unit(A,tip));}
/* voet op de tenen (plank): bal van de voet onder de enkel, hiel omhoog, tenen plat naar het hoofd (+x).
   u = richting knie -> enkel; ground = bovenkant van de mat (laat weg bij een opgetild been) */
function toeFoot(A,u,ground,toeDir){
  const p=P(-u.y,u.x).y>0?P(-u.y,u.x):P(u.y,-u.x);

/* vlakke hand die meedraait met de onderarm; plat zodra de onderarm verticaal staat */
function turnHand(W,E){
  const aa=Math.atan2(W.y-E.y,W.x-E.x),sm=clamp((aa-45*DEG)/(45*DEG),0,1);

function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
function edgeHand(W,T,wd=9){const dx=T.x-W.x,dy=T.y-W.y,L=Math.hypot(dx,dy);if(L<1){dot(W,8);return;}const a=Math.atan2(dy,dx),h=Math.min(1,L/16);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(2+17*h,0,6+15*h,wd,0,0,Math.PI*2);ctx.fill();ctx.restore();}

function ik(a,b,l1,l2,pick){

const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];

const trem=T=>.5+.5*Math.sin(T*Math.PI*2*5.3)*Math.sin(T*Math.PI*2*.9+1);

/* Bird dog: per kant e = strekken (0..1) en c = elleboog naar knie (0..1) */
const PAGE={key:'birddog-state',variants:[['klassiek','Klassiek'],['crunch','Elleboog naar knie']]};
VX=120;VY=80;VW=640;VH=420;
const S0=P(151,-195);

/* één kant: lijst van [duur, e-doel, c-doel] stappen */
function seq(steps,u){

const STEPS={

       crunch:[[1.4,1,0],[.5,1,0],[1.7,1,1],[.5,1,1],[1.7,1,0],[.4,1,0],[1.4,0,0],[.4,0,0]]},
  iso:{klassiek:[[1.2,1,0],[7,1,0],[1.2,0,0],[.6,0,0]],

  const E=P(S0.x+Math.cos(ua)*104,S0.y+Math.sin(ua)*104);
  const W=P(E.x+Math.cos(fa)*81,E.y+Math.sin(fa)*81);

function hip(hv){return P(0,-162-12*hv);}
function legPose(e,c,hv){
  const H=hip(hv);
  const bC=Math.atan2(KT.y-H.y,KT.x-H.x)/DEG;
  const b=lerp(lerp(90,180,e),bC,c);
  const flex=lerp(93,0,e)+150*ease(Math.min(1,c*1.8));

function drawArm(p,dx,dy){

  limb(s,e,16,11,UA_F,UA_B);dot(e,11);
  limb(e,w,11.5,6.5,FA_F,FA_B);

}
function drawLeg(p,dx,dy){
  const h=P(p.H.x+dx,p.H.y+dy),k=P(p.K.x+dx,p.K.y+dy),a=P(p.A.x+dx,p.A.y+dy),t=P(p.T.x+dx,p.T.y+dy);
  limb(h,k,24,15,THIGH_F,THIGH_B);dot(k,14.5);
  limb(k,a,14.5,9,SHIN_F,SHIN_B);

}
function sideView(s,hv,c,glow){
  F=-1;
  const H0=hip(hv);
  const aN=armPose(s.eN,s.cN),aF=armPose(s.eF,s.cF),lN=legPose(s.eF,s.cF,hv),lF=legPose(s.eN,s.cN,hv);
  ctx.fillStyle=c.far;drawLeg(lF,-10,-3);drawArm(aF,-12,-3);
  ctx.fillStyle=c.body;
  limb(S0,H0,27,24,T_FRONT,T_BACK);
  const L=dist(S0,H0),ux=(H0.x-S0.x)/L,uy=(H0.y-S0.y)/L;
  let dnx=-uy,dny=ux;if(dny<0){dnx=-dnx;dny=-dny;}
  const ga=Math.atan2(uy,ux);
  ctx.beginPath();ctx.ellipse(H0.x-dnx*15,H0.y-dny*15,31,23,ga,0,Math.PI*2);ctx.fill();
  drawLeg(lN,0,0);
  capsule(P(S0.x-ux*14,S0.y-uy*14-4),12,P(S0.x-ux*30,S0.y-uy*30-6),11);
  ctx.beginPath();ctx.ellipse(S0.x-ux*56+dnx*4,S0.y-uy*56+dny*4-4,29,25,ga,0,Math.PI*2);ctx.fill();
  const g=Math.max(s.eN,s.eF),cr=Math.max(s.cN,s.cF);
  ctx.save();ctx.fillStyle=c.mus;
  ctx.globalAlpha=glow*(.3+.7*g)*(1-.4*cr);
  ctx.beginPath();ctx.ellipse(H0.x-dnx*17,H0.y-dny*17,22,15,ga,0,Math.PI*2);ctx.fill();
  for(let i=0;i<=16;i++){const t=.25+.5*i/16;dot(P(S0.x+(H0.x-S0.x)*t-dnx*20,S0.y+(H0.y-S0.y)*t-dny*20),7);}
  ctx.globalAlpha=glow*Math.max(.55*(.3+.7*g),cr);
  for(let i=0;i<=14;i++){const t=.42+.4*i/14;dot(P(S0.x+(H0.x-S0.x)*t+dnx*22,S0.y+(H0.y-S0.y)*t+dny*22),6);}
  ctx.restore();

}
function topView(s,hv,c,glow){
  F=1;
  ctx.fillStyle=c.body;
  for(const z of [-1,1]){
    const l=z>0?legPose(s.eF,s.cF,hv):legPose(s.eN,s.cN,hv),a=z>0?armPose(s.eN,s.cN):armPose(s.eF,s.cF);
    const zk=z*lerp(21,8,l.c),zh=z*19,za=z*40,zw=lerp(1,.25,a.c);
    const h=P(l.H.x,zh),k=P(l.K.x,zk),an=P(l.A.x,z*lerp(23,12,l.c)),t=P(l.T.x,z*lerp(24,12,l.c));
    if(Math.abs(k.x-h.x)>4)limb(h,k,23,15,[[5,.45,.28]],[[5,.45,.28]]);dot(k,14);
    if(Math.abs(an.x-k.x)>4)limb(k,an,14,8.5,[[6,.27,.18]],[[6,.27,.18]]);
    capsule(an,9,t,8);
    const sh=P(a.S.x,za),el=P(a.E.x,za*lerp(.95,.55,a.c)),w=P(a.W.x,za*lerp(.9,.3,a.c)*zw/zw);
    if(Math.abs(el.x-sh.x)>4)limb(sh,el,15,11,[[3,.5,.22]],[[3,.5,.22]]);dot(el,11);
    if(Math.abs(w.x-el.x)>4)limb(el,w,11,6.5,[[3,.22,.2]],[[3,.22,.2]]);
    const hl=Math.max(.15,Math.abs(a.d.x)),dir=Math.sign(a.d.x)||1;

  }
  const keys=[[-24,0],[-15,26],[0,34],[33,32],[64,28],[105,38],[138,47],[157,44],[172,18],[178,13]];
  const wAt=x=>{for(let i=1;i<keys.length;i++){if(x<=keys[i][0]){const[x0,w0]=keys[i-1],[x1,w1]=keys[i],u=ease((x-x0)/(x1-x0));return w0+(w1-w0)*u}}return 13};

  const g=Math.max(s.eN,s.eF);

PAGE.draw=(m,v,T,c)=>{

};

/* ---------- knoppen, toestand en afspeellus ---------- */
(function(){
  const MODES=[['iso','Isometrisch'],['dyn','Dynamisch']];
  const st={mode:'iso',variant:PAGE.def||PAGE.variants[0][0]};
  let playing=true,slow=false,phaseT=0,last=performance.now();
  const mBox=document.getElementById('modes'),vBox=document.getElementById('vars');
  const mk=(box,list,key)=>list.forEach(([id,lab])=>{const b=document.createElement('button');b.type='button';b.id=key+'-'+id;b.textContent=lab;b.dataset.v=id;b.onclick=()=>set(key,id);box.appendChild(b);});

    mBox.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===st.mode)));
    vBox.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===st.variant)));

  }
  function set(k,v){st[k]=v;phaseT=0;sync();try{localStorage.setItem(PAGE.key,JSON.stringify(st))}catch(e){}}
  try{const s=JSON.parse(localStorage.getItem(PAGE.key)||'null');if(s){if(MODES.some(m=>m[0]===s.mode))st.mode=s.mode;if(PAGE.variants.some(v=>v[0]===s.variant))st.variant=s.variant;}}catch(e){}

  if(MODES.some(m=>m[0]===h[0]))st.mode=h[0];

<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Glute bridge</title>

<style>

<main>
  <header>
    <h1>Glute bridge</h1>
    <p class="sub">Bilspieren en hamstrings</p>
  </header>

  <section class="stage">
    <canvas id="c" width="1200" height="660" aria-label="Animatie van een figuur die op de rug ligt en de heupen optilt"></canvas>
    <div class="bar">
      <div class="opts">

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let playing=true,slow=false,phaseT=0,last=performance.now();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
const ease=t=>.5-.5*Math.cos(Math.PI*t);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const P=(x,y)=>({x,y});
const DEG=Math.PI/180;

function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));

}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);

const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
/* two-bone IK: returns the joint; pick(a,b) chooses between the two solutions */
function ik(S,T,l1,l2,pick){
  const dx=T.x-S.x,dy=T.y-S.y,d=Math.max(1,Math.min(Math.hypot(dx,dy),l1+l2-.5));
  const base=Math.atan2(dy,dx),off=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));
  const a=P(S.x+l1*Math.cos(base+off),S.y+l1*Math.sin(base+off));
  const b=P(S.x+l1*Math.cos(base-off),S.y+l1*Math.sin(base-off));
  return pick(a,b);
}
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
/* draw everything an outline function draws as a stroke in the stage colour (gap where a limb crosses the body) */
function outlined(fn){
  const f0=ctx.fill;ctx.save();ctx.strokeStyle=tok('--stage');ctx.lineWidth=5;ctx.lineJoin='round';
  ctx.fill=function(){ctx.stroke();};fn();ctx.fill=f0;ctx.restore();fn();
}
const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];

/* UI: Isometrisch / Dynamisch + variation groups */
const ui={mode:'dyn'};
function bindSeg(g,cb){
  const bs=[...document.querySelectorAll('.seg[data-g="'+g+'"] button')];
  const sel=v=>{bs.forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===v)));ui[g]=v;phaseT=0;cb&&cb(v);legend();};
  bs.forEach(b=>b.onclick=()=>sel(b.dataset.v));
  const on=bs.find(b=>b.getAttribute('aria-pressed')==='true')||bs[0];ui[g]=on.dataset.v;
  return sel;
}
function legend(){
  document.querySelectorAll('.legend [data-when]').forEach(el=>{
    const [g,vals]=el.dataset.when.split(':');el.hidden=!vals.split(',').includes(ui[g]);
  });
}
function startLoop(period,render){
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(playing&&!reduce){phaseT+=dt*(slow?.5:1);}
    const ph=window.__ph!=null?window.__ph:(reduce?null:phaseT%period(ui));
    render(ph,ui);
    requestAnimationFrame(frame);
  }
  document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
  document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
  legend();
  requestAnimationFrame(frame);
}
/* isometric hold: light breathing between .97 and 1 */
const breath=ph=>ph==null?0:.5+.5*Math.sin(ph*Math.PI*2/4);

const VX=100,VY=40,VW=640,VH=352;
F=1;
const S0=P(560,300),A0=P(252,316);

function hipAngle(t){return lerp(Math.atan2(5,-160),Math.atan2(-74,-142)+Math.PI*2,t);}
function supportLeg(H,A){return ik(H,A,148,132,(a,b)=>a.y<b.y?a:b);}

function foot(A){
  const x=A.x,y=A.y;
  ctx.beginPath();
  ctx.moveTo(x+7,y-6);
  ctx.quadraticCurveTo(x+14,y+3,x+10,y+11);
  ctx.quadraticCurveTo(x+6,y+14,x-3,y+14);
  ctx.lineTo(x-29,y+14);
  ctx.quadraticCurveTo(x-37,y+13,x-36,y+8);
  ctx.quadraticCurveTo(x-33,y+4,x-25,y+2);
  ctx.quadraticCurveTo(x-12,y-3,x-7,y-8);
  ctx.closePath();ctx.fill();
}
/* foot of a leg in the air: toes towards the ceiling, perpendicular to the shin */
function airFoot(K,A){
  const dx=A.x-K.x,dy=A.y-K.y,l=Math.hypot(dx,dy)||1;let px=-dy/l,py=dx/l;if(py>0){px=-px;py=-py;}
  capsule(P(A.x-dx/l*4,A.y-dy/l*4),9.5,P(A.x+px*30+dx/l*4,A.y+py*30+dy/l*4),6);
}
function arm(S,dx,dy){
  const E={x:S.x-104+dx,y:318+dy},W={x:S.x-186+dx,y:322+dy};
  const s0={x:S.x+dx,y:S.y+2+dy};
  limb(s0,E,16,11,UA_F,UA_B);dot(E,11);
  limb(E,W,11.5,7,FA_F,FA_B);
  dot({x:s0.x-2,y:s0.y-2},21);
  ctx.beginPath();
  ctx.moveTo(W.x+2,W.y-8);
  ctx.quadraticCurveTo(W.x-14,W.y-11,W.x-28,W.y-5);
  ctx.quadraticCurveTo(W.x-40,W.y,W.x-41,W.y+4);
  ctx.quadraticCurveTo(W.x-36,W.y+7,W.x-18,W.y+7);
  ctx.lineTo(W.x+2,W.y+8);
  ctx.closePath();ctx.fill();
}
/* a leg: lift 0 = foot on the floor, 1 = tabletop (thigh vertical, shin horizontal); ext 1 = straight leg in line with the support thigh */
function legPose(H,A,lift,ext,supAng){
  const Ks=supportLeg(H,A);
  if(ext>0){
    const d=P(Math.cos(supAng),Math.sin(supAng));
    const K=P(H.x+d.x*148,H.y+d.y*148),Ae=P(H.x+d.x*280,H.y+d.y*280);
    return {H,K:P(lerp(Ks.x,K.x,ext),lerp(Ks.y,K.y,ext)),A:P(lerp(A.x,Ae.x,ext),lerp(A.y,Ae.y,ext)),air:ext>.02};
  }
  if(lift<=0)return {H,K:Ks,A,air:false};
  const th0=Math.atan2(Ks.y-H.y,Ks.x-H.x),sh0=Math.atan2(A.y-Ks.y,A.x-Ks.x);
  const th=lerp(th0,-Math.PI/2,lift),sh=lerp(sh0,Math.PI,lift);
  const K=P(H.x+148*Math.cos(th),H.y+148*Math.sin(th));
  return {H,K,A:P(K.x+132*Math.cos(sh),K.y+132*Math.sin(sh)),air:lift>.02};
}
function drawLeg(L){
  limb(L.H,L.K,24,15,THIGH_F,THIGH_B);dot(L.K,14.5);
  limb(L.K,L.A,14.5,9,SHIN_F,SHIN_B);
  L.air?airFoot(L.K,L.A):foot(L.A);
}
function bandRing(L,col){
  const tx=L.K.x-L.H.x,ty=L.K.y-L.H.y,l=Math.hypot(tx,ty),nx=-ty/l,ny=tx/l;
  const c=P(L.H.x+tx*.8,L.H.y+ty*.8);
  ctx.strokeStyle=col;ctx.lineWidth=7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(c.x+nx*19,c.y+ny*19);ctx.lineTo(c.x-nx*19,c.y-ny*19);ctx.stroke();
}
/* top view inset for the band variant: knees pushed out against the band */
function bandInset(push,glow,c){
  const cx=650,cy=128;
  ctx.fillStyle=c.body;F=-1;
  const hips=[-1,1].map(s=>P(cx+40,cy+s*18)),knees=[-1,1].map(s=>P(cx-46,cy+s*(26+14*push))),ank=[-1,1].map(s=>P(cx-60,cy+s*(22+6*push)));
  for(let i=0;i<2;i++){
    limb(hips[i],knees[i],19,12,[[4,.45,.28]],[[4,.45,.28]]);dot(knees[i],12);
    capsule(knees[i],11,ank[i],8);
  }
  ctx.beginPath();ctx.ellipse(cx+46,cy,20,36,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.roundRect(cx+46,cy-36,40,72,[0,14,14,0]);ctx.fill();
  ctx.save();ctx.fillStyle=c.mus;ctx.globalAlpha=glow*.55;
  for(const s of [-1,1]){ctx.beginPath();ctx.ellipse(cx+44,cy+s*27,13,8,0,0,Math.PI*2);ctx.fill();}
  ctx.restore();
  const k=.8,b0=P(lerp(hips[0].x,knees[0].x,k),lerp(hips[0].y,knees[0].y,k)),b1=P(lerp(hips[1].x,knees[1].x,k),lerp(hips[1].y,knees[1].y,k));
  ctx.strokeStyle=c.band;ctx.lineCap='round';ctx.lineWidth=7-2.5*push;
  ctx.beginPath();ctx.moveTo(b0.x,b0.y-13);ctx.lineTo(b1.x,b1.y+13);ctx.stroke();
  ctx.fillStyle=c.muted;ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign='center';
  ctx.fillText('BOVENAANZICHT',cx+10,cy+88);
  F=1;
}

/* state per phase: t = hip height (0 down, 1 up), lift/ext for far (index 0) and near (index 1) leg */
function state(ph,u){
  const iso=u.mode==='iso',b=breath(ph);
  if(u.v==='march'){
    if(iso||ph==null)return {t:.97+.03*b,lift:[1,0]};
    const q=ph%4,up=x=>x<.5?ease(x/.5):x<1.5?1:x<2?1-ease((x-1.5)/.5):0;
    return {t:1,lift:[up(q),up((q+2)%4)]};
  }
  let t;
  if(iso||ph==null)t=.97+.03*b;
  else{const q=ph%4;t=q<1.4?ease(q/1.4):q<2.2?1:q<3.6?1-ease((q-2.2)/1.4):0;}
  return {t,lift:[0,0],ext:u.v==='one'?1:0,push:u.v==='band'?(iso?1:.55+.45*t):0};
}
function draw(ph,u){
  const k=cv.width/VW;
  ctx.setTransform(k,0,0,k,-VX*k,-VY*k);
  const c={stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),band:tok('--band'),bandF:tok('--bandfar'),muted:tok('--muted')};
  ctx.fillStyle=c.stage;ctx.fillRect(VX,VY,VW,VH);
  ctx.fillStyle=c.mat;ctx.beginPath();ctx.roundRect(120,332,610,10,5);ctx.fill();
  const st=state(ph,u),S=S0,a=hipAngle(st.t);
  const H=P(S.x+155*Math.cos(a),S.y+155*Math.sin(a));
  const nearSup=supportLeg(H,A0),supAng=Math.atan2(nearSup.y-H.y,nearSup.x-H.x);
  const Hf=P(H.x-14,H.y),Af=P(A0.x-14,A0.y);
  const Lf=legPose(Hf,Af,st.lift[0],st.ext||0,supAng);
  const Ln=legPose(H,A0,st.lift[1],0,supAng);

  ctx.fillStyle=c.far;
  drawLeg(Lf);
  if(st.push)bandRing(Lf,c.bandF);
  arm(S,-10,-4);

  ctx.fillStyle=c.body;
  limb({x:S.x+6,y:S.y-2},H,27,24,T_FRONT,T_BACK);
  ctx.beginPath();ctx.arc(H.x,H.y,28,0,Math.PI*2);ctx.fill();
  capsule({x:S.x+14,y:S.y},12,{x:S.x+30,y:S.y+1},11);
  ctx.beginPath();ctx.ellipse(S.x+56,S.y+3,29,25,0,0,Math.PI*2);ctx.fill();
  const bx=Math.sin(a),by=-Math.cos(a),gk=Math.atan2(nearSup.y-H.y,nearSup.x-H.x);
  ctx.beginPath();ctx.ellipse(H.x+bx*13+Math.cos(gk)*7,H.y+by*13+Math.sin(gk)*7,31,23,(a+gk)/2+Math.PI/2,0,Math.PI*2);ctx.fill();
  const lifted=st.lift[1]>.02;
  drawLeg(Ln);
  if(st.push)bandRing(Ln,c.band);

  const act=.35+.65*st.t;
  let nx=-Math.sin(a),ny=Math.cos(a);if(ny<0){nx=-nx;ny=-ny;}
  const sup=lifted?Lf:Ln;
  const ga=Math.atan2(nearSup.y-H.y,nearSup.x-H.x);
  ctx.save();
  ctx.globalAlpha=act;ctx.fillStyle=c.mus;
  ctx.beginPath();
  ctx.ellipse(H.x+nx*14+Math.cos(ga)*7,H.y+ny*14+Math.sin(ga)*7,24,17,(a+ga)/2+Math.PI/2,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=act*.55;
  if(!lifted){
    const tx=Ln.K.x-Ln.H.x,ty=Ln.K.y-Ln.H.y,tl=Math.hypot(tx,ty),ox=-ty/tl,oy=tx/tl,sg=oy>0?1:-1;
    capsule({x:H.x+tx*.25+ox*12*sg,y:H.y+ty*.25+oy*12*sg},11,{x:H.x+tx*.85+ox*8*sg,y:H.y+ty*.85+oy*8*sg},6);
  }
  ctx.restore();

  ctx.fillStyle=c.body;
  arm(S,0,0);
  if(st.push)bandInset(st.push,act,c);
}
bindSeg('mode');bindSeg('v');
startLoop(()=>4,draw);
<\/script>

</body></html>
</script>
<script type="text/plain" data-ex="rdl">
<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Single-leg RDL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one stage card with the animation, mode/variation/playback controls and a muscle legend */
:root{
  --bg:#EDF0EE; --stage:#F8FAF9; --ink:#1E2426; --muted:#5E686A; --body:#2A3134; --far:#7C8689;
  --muscle:#E0452B; --mat:#D6DCD9; --line:#D3D9D6; --band:#2C8C7E; --bandfar:#8CC2B9; --post:#B9C1BE;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --text:"Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121617; --stage:#1A1F20; --ink:#E8ECEA; --muted:#98A3A0; --body:#D9E0DD; --far:#7F8A87;
  --muscle:#FF5B3E; --mat:#2A3133; --line:#2C3335; --band:#4DBDAC; --bandfar:#2F6E66; --post:#3A4345; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121617; --stage:#1A1F20; --ink:#E8ECEA; --muted:#98A3A0; --body:#D9E0DD; --far:#7F8A87;
  --muscle:#FF5B3E; --mat:#2A3133; --line:#2C3335; --band:#4DBDAC; --bandfar:#2F6E66; --post:#3A4345; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
main{max-width:860px;margin:0 auto;display:grid;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,7vw,52px);line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;height:auto}
.bar{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;border-top:1px solid var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:6px}

button[aria-pressed="true"]{background:var(--ink);color:var(--stage);border-color:var(--ink)}
.mode{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.03em;text-transform:uppercase;padding:4px 12px}
button:focus-visible{outline:2px solid var(--muscle);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:15px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muscle);flex:none}
.dot.soft{opacity:.55}
</style>

<main>
  <header>
    <h1>Single-leg RDL</h1>
    <p class="sub">Hamstrings, bilspieren en rugstrekkers</p>
  </header>

  <section class="stage">
    <canvas id="c" width="1200" height="900" aria-label="Animatie van een single-leg Romanian deadlift, van opzij"></canvas>
    <div class="bar">
      <div class="seg" role="group" aria-label="Uitvoering">
        <button class="mode" data-mode="iso" aria-pressed="false">Isometrisch</button>
        <button class="mode" data-mode="dyn" aria-pressed="true">Dynamisch</button>
      </div>
      <div class="seg" role="group" aria-label="Variatie">
        <button data-var="heup" aria-pressed="true">Handen op de heupen</button>
        <button data-var="stroom" aria-pressed="false">Stroomlijn</button>
        <button data-var="band" aria-pressed="false">Met elastiek</button>
      </div>
      <div class="seg">
        <button id="play" aria-pressed="false">Pauze</button>
        <button id="slow" aria-pressed="false">Langzaam</button>
      </div>
    </div>
  </section>

  <div class="legend">
    <span><i class="dot "></i>Hamstrings en bilspieren standbeen (primair)</span>
    <span><i class="dot soft"></i>Rugstrekkers (secundair)</span>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let playing=true,slow=false,phaseT=0,last=performance.now();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

/* paint: fill normally, stroke when drawing the background-coloured edge of an overlapping limb */
let OUT=false;
const paint=()=>{OUT?ctx.stroke():ctx.fill()};
function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();paint();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();paint();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);paint();};
const ell=(x,y,rx,ry,rot)=>{ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);paint();};
const P=(x,y)=>({x,y});
const add=(a,b,k=1)=>P(a.x+b.x*k,a.y+b.y*k);
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>.5-.5*Math.cos(Math.PI*Math.max(0,Math.min(1,t)));
const rot=(v,a)=>P(v.x*Math.cos(a)-v.y*Math.sin(a),v.x*Math.sin(a)+v.y*Math.cos(a));
/* angle measured from straight down, positive toward the front (+x): 0 hangs, PI/2 forward, PI overhead */
const dirA=a=>P(Math.sin(a),Math.cos(a));

/* shared body standard: torso 155, thigh 148, shin 132, upper arm 104, forearm 81 */
const L_T=155,L_TH=148,L_SH=132,L_UA=104,L_FA=81;
const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];

/* two-bone IK; dir +1 bends toward the front side of a->b (knee), -1 toward the back (elbow) */
function ik(a,b,l1,l2,dir){
  const dx=b.x-a.x,dy=b.y-a.y;let d=Math.hypot(dx,dy)||1;
  const ux=dx/d,uy=dy/d;d=Math.max(Math.abs(l1-l2)+.01,Math.min(d,l1+l2-.01));
  const base=Math.atan2(uy,ux),off=Math.acos(Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d))));
  const c1=P(a.x+l1*Math.cos(base+off),a.y+l1*Math.sin(base+off)),c2=P(a.x+l1*Math.cos(base-off),a.y+l1*Math.sin(base-off));
  const nx=uy,ny=-ux,s1=(c1.x-a.x)*nx+(c1.y-a.y)*ny;
  return (s1*dir>0)?c1:c2;
}
function armFK(S,a,b){const E=add(S,dirA(a),L_UA),W=add(E,dirA(a+b),L_FA);return {E,W};}
/* torso frame from hip + lean (0 upright, + forward) */
function torso(H,lean){const u=P(Math.sin(lean),-Math.cos(lean)),n=P(Math.cos(lean),Math.sin(lean));return {u,n,S:add(H,u,L_T)};}

/* hands */
function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-4,W.y-9);
  ctx.quadraticCurveTo(W.x+14,W.y-10,W.x+28,W.y-3);
  ctx.quadraticCurveTo(W.x+40,W.y+1,W.x+40,W.y+5);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+16,W.y+8);
  ctx.lineTo(W.x-6,W.y+8);
  ctx.closePath();paint();
}
/* the same flat hand turned with the forearm (fingers continue the forearm line) */
function handAlong(W,E,flip){
  const a=Math.atan2(W.y-E.y,W.x-E.x);
  ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);if(flip)ctx.scale(1,-1);hand(P(0,0));ctx.restore();
}
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);paint();ctx.restore();}
const fistC=(W,E)=>{const d=Math.hypot(W.x-E.x,W.y-E.y)||1;return P(W.x+(W.x-E.x)/d*9,W.y+(W.y-E.y)/d*9);};

/* foot: heel to toe capsule, fa = plantar flexion (heel up, + clockwise) */
function foot(A,fa,air){
  if(air||fa<.08){capsule(add(A,rot(P(-6,2),fa)),10,add(A,rot(P(38,6),fa)),6);return;}
  /* on the toes: heel-to-ball part tilts, the toes stay flat on the ground */
  const ball=add(A,rot(P(30,6),fa));
  capsule(add(A,rot(P(-6,2),fa)),10,ball,6.5);
  capsule(ball,6.5,P(ball.x+11,ball.y+.5),5.5);
}

/* muscle strip along a limb a->b; side +1 front, -1 back */
function strip(a,b,t0,t1,side,o0,o1,r0,r1){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,nx=dy/L,ny=-dx/L;
  capsule(P(a.x+dx*t0+nx*side*o0,a.y+dy*t0+ny*side*o0),r0,P(a.x+dx*t1+nx*side*o1,a.y+dy*t1+ny*side*o1),r1);
}

/* recursive blend of two poses (numbers mix, everything else from the target) */
function mixPose(a,b,t){
  if(typeof b==='number'&&typeof a==='number')return a+(b-a)*t;
  if(b&&typeof b==='object'&&a&&typeof a==='object'&&!Array.isArray(b)){const o={};for(const k in b)o[k]=(k in a)?mixPose(a[k],b[k],t):b[k];return o;}
  if(Array.isArray(b)&&Array.isArray(a)&&a.length===b.length)return b.map((v,i)=>mixPose(a[i],v,t));
  return b;
}

/*
 Side view figure, facing +x, ground at y=0.
 q = {H, lean, tilt, ln:{K,A,fa}, lf:{K,A,fa,lift}, an:{E,W,h}, af:{E,W,h}}
 h = 'flat' | 'fist' | 'none'
*/
const FAR_OFF=P(-11,-3);
function legPaint(H,L,off,offA){
  const h=add(H,off),k=add(L.K,off),a=add(L.A,offA);
  limb(h,k,24,15,THIGH_F,THIGH_B);dot(k,14.5);
  limb(k,a,14.5,9,SHIN_F,SHIN_B);
  foot(a,L.fa||0,L.lift);
}
function armPaint(S,A,off){
  const s=add(S,off),e=add(A.E,off),w=add(A.W,off);
  limb(s,e,16,11,UA_F,UA_B);dot(e,11);
  limb(e,w,11.5,6.5,FA_F,FA_B);
  if(A.h==='fist')fist(w,e);

function headPaint(q,T){
  const tilt=q.tilt||0,uh=P(Math.sin(q.lean-tilt),-Math.cos(q.lean-tilt)),nh=P(Math.cos(q.lean-tilt),Math.sin(q.lean-tilt));

function sideFigure(q,col,hooks){
  hooks=hooks||{};F=-1;
  const T=torso(q.H,q.lean);q.S=T.S;q.u=T.u;q.n=T.n;
  const offA=P(FAR_OFF.x,q.lf.lift?FAR_OFF.y:0);
  ctx.fillStyle=col.far;

  const b=add(q.H,T.n,-15);ell(b.x,b.y,23,31,q.lean);

/* standing leg from hip and ankle */

const ANK=-12;

/*

*/
function frontFigure(f,col,hooks){
  hooks=hooks||{};

  const sy=.12+.88*Math.cos(f.lean);

  const legs=()=>{ctx.fillStyle=body;[-1,1].forEach((s,i)=>{
    const L=f.legs[i],Hp=P(f.hx+s*24,f.hy);
    limb(Hp,L.K,24,16,[[5,.45,.28]],[[4,.4,.3]]);dot(L.K,15);
    limb(L.K,L.A,15,9,[[3,.28,.18]],[[3,.28,.18]]);
    const fx=L.A.x+s*(L.out||0);
    ell(fx,L.A.y+2,13,10,0);ell(fx+s*(L.out?3:1),L.A.y+5,16,6,s*(L.out?.25:0));
  });

  if(!thighShort)legs();
  ctx.save();ctx.translate(f.hx,f.hy);ctx.scale(1,sy);
  const y=0;
  const path=()=>{ctx.beginPath();ctx.moveTo(-15,-144);
    ctx.quadraticCurveTo(-28,-136,-44,-130);ctx.quadraticCurveTo(-54,-110,-49,-88);
    ctx.quadraticCurveTo(-42,-62,-37,-38);ctx.quadraticCurveTo(-46,-20,-45,-2);
    ctx.lineTo(45,-2);ctx.quadraticCurveTo(46,-20,37,-38);ctx.quadraticCurveTo(42,-62,49,-88);
    ctx.quadraticCurveTo(54,-110,44,-130);ctx.quadraticCurveTo(28,-136,15,-144);ctx.closePath();};
  path();ctx.fill();
  ell(0,0,46,15,0);
  capsule(P(0,-132),13,P(0,-148),11);
  ctx.restore();
  /* head stays round (not squashed by lean) */
  const hy=f.hy-148*sy-28;
  ell(f.hx,hy,24,30,0);
  const Sy=f.hy-120*sy;
  [-1,1].forEach(s=>{
    const S=P(f.hx+s*50,Sy);
    if(f.arms==='forward'){
      dot(S,16);
      ctx.beginPath();ctx.moveTo(S.x-s*14,S.y-2);ctx.lineTo(S.x+s*14,S.y-2);ctx.lineTo(S.x+s*6,S.y+24);ctx.lineTo(S.x-s*12,S.y+24);ctx.closePath();ctx.fill();

    ctx.save();OUT=true;ctx.strokeStyle=edge;ctx.lineWidth=4;

}

function label(txt,x,y,align){
  ctx.fillStyle=tok('--muted');ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign=align||'center';
  ctx.fillText(txt,x,y);
}
function colors(){return {body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),stage:tok('--stage'),post:tok('--post'),band:tok('--band'),bandfar:tok('--bandfar')};}
/* view: translate to ground point, scale; draw mat */
function view(cx,gy,sc,matW,fn,matX){
  ctx.save();ctx.translate(cx,gy);ctx.scale(sc,sc);
  ctx.fillStyle=tok('--mat');ctx.beginPath();ctx.roundRect(matX!=null?matX:-matW/2,0,matW,10,5);ctx.fill();

}
function wallRect(x0,top,w){ctx.fillStyle=tok('--post');ctx.beginPath();ctx.roundRect(x0,top,w,-top,4);ctx.fill();}

/* ui state */
let mode='dyn',variant=null,prevPose=null,blendT=1,curPose=null;

function bindUI(key,onChange){

  try{const s=JSON.parse(localStorage.getItem(key)||'null');if(s){if(s.mode&&document.querySelector('[data-mode="'+s.mode+'"]'))mode=s.mode;if(s.variant&&document.querySelector('[data-var="'+s.variant+'"]'))variant=s.variant;}}catch(e){}

/* main loop: page supplies pose(t) for the current mode/variant and render(q,glow) */
function run(cycle,poseFn,render){

const VW=640,VH=480,GY=452,SC=.63;
variant='heup';
function hinge(t){
  if(t<1.4)return ease(t/1.4);

function rdl(h,v,b,iso){

const cycle=()=>mode==='iso'?8:3.6;

}
bindUI('rdl-state');

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));

  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();ctx.fill();
}
let F=1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
/* gebogen ledemaat/romp langs een kwadratische curve a-c-b, zelfde profielen als limb */
function curveLimb(a,c,b,rA,rB,front,back){
  const N=36,prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,cc,w]of bs)r+=m*Math.exp(-(((t-cc)/w)**2));return r};
  const pt=t=>P((1-t)*(1-t)*a.x+2*(1-t)*t*c.x+t*t*b.x,(1-t)*(1-t)*a.y+2*(1-t)*t*c.y+t*t*b.y);
  const tg=t=>{const x=2*(1-t)*(c.x-a.x)+2*t*(b.x-c.x),y=2*(1-t)*(c.y-a.y)+2*t*(b.y-c.y),l=Math.hypot(x,y)||1;return P(x/l,y/l)};
  const L=[],Rr=[];
  for(let i=0;i<=N;i++){const t=i/N,p=pt(t),u=tg(t),nx=-u.y*F,ny=u.x*F,rf=prof(t,front),rb=prof(t,back);
    L.push(P(p.x+nx*rf,p.y+ny*rf));Rr.push(P(p.x-nx*rb,p.y-ny*rb));}
  ctx.beginPath();L.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
  for(let i=N;i>=0;i--)ctx.lineTo(Rr[i].x,Rr[i].y);ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
  return {pt,tg};
}
/* voet in zijaanzicht: ca. 40 lang (enkel r9, teen r6) */
function footSide(A,ang){capsule(A,9,P(A.x+Math.cos(ang)*25,A.y+Math.sin(ang)*25),6);}
const ell=(c,rx,ry,rot)=>{ctx.beginPath();ctx.ellipse(c.x,c.y,rx,ry,rot||0,0,Math.PI*2);ctx.fill();};
const P=(x,y)=>({x,y});
const add=(a,b)=>P(a.x+b.x,a.y+b.y),sub=(a,b)=>P(a.x-b.x,a.y-b.y),mul=(a,k)=>P(a.x*k,a.y*k);
const dirA=a=>P(Math.cos(a),Math.sin(a)),angOf=v=>Math.atan2(v.y,v.x);
const along=(a,ang,len)=>P(a.x+Math.cos(ang)*len,a.y+Math.sin(ang)*len);
const ease=t=>.5-.5*Math.cos(Math.PI*Math.max(0,Math.min(1,t)));
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),DEG=Math.PI/180;
const lerpP=(a,b,t)=>P(lerp(a.x,b.x,t),lerp(a.y,b.y,t));

/* shared body standard: torso 155, thigh 148, shin 132, upper arm 104, forearm 81 */
const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];
const profR=(rA,rB,bs,t)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};

/* flat hand, fingers along +x, back of the hand on the -y side */
function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-4,W.y-9);
  ctx.quadraticCurveTo(W.x+14,W.y-10,W.x+28,W.y-3);
  ctx.quadraticCurveTo(W.x+40,W.y+1,W.x+40,W.y+5);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+16,W.y+8);
  ctx.lineTo(W.x-6,W.y+8);
  ctx.closePath();ctx.fill();
}
function handAt(W,ang,flip){ctx.save();ctx.translate(W.x,W.y);ctx.rotate(ang);if(flip)ctx.scale(1,-1);hand(P(0,0));ctx.restore();}
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
const fistC=(W,E)=>{const d=sub(W,E),l=Math.hypot(d.x,d.y)||1;return P(W.x+d.x/l*9,W.y+d.y/l*9)};
function edgeHand(W,T){const dx=T.x-W.x,dy=T.y-W.y,L=Math.hypot(dx,dy);if(L<1){dot(W,8);return;}const a=Math.atan2(dy,dx),h=Math.min(1,L/16);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(2+17*h,0,6+15*h,9,0,0,Math.PI*2);ctx.fill();ctx.restore();}
/* flat hand seen from the palm or the back (top / front views): wrist 13 wide, hand 18 wide, ca. 37 beyond the wrist, with thumb.
   ang = finger direction on screen, k = foreshortening (1 = full length), th = thumb side (+1/-1 in local y) */
function palmHand(W,ang,k,th){
  const kk=Math.max(.38,k==null?1:k),t=th||1;
  ctx.save();ctx.translate(W.x,W.y);ctx.rotate(ang);ctx.scale(kk,1);
  ctx.beginPath();
  ctx.moveTo(-3,-6.2);ctx.quadraticCurveTo(5,-9.2,14,-8.8);ctx.lineTo(28,-7.4);
  ctx.quadraticCurveTo(37,-6.4,37,0);ctx.quadraticCurveTo(37,6.4,28,7.4);
  ctx.lineTo(14,8.8);ctx.quadraticCurveTo(5,9.2,-3,6.2);ctx.closePath();ctx.fill();
  capsule(P(7,t*6),4.3,P(15.5,t*11.5),3.4);
  ctx.restore();
}
/* side-view flat hand that follows the forearm (skill: same flat hand turning with the forearm) */
function sideHand(W,E,flip){handAt(W,Math.atan2(W.y-E.y,W.x-E.x),flip);}
/* foot in side view, ca. 40 long; ang = direction heel->toes */
function footSide(A,ang,sole){const m=along(A,ang,18),t=along(A,ang,27);capsule(A,9,m,7);capsule(m,7,t,4.5);if(sole)dot(add(along(A,ang,-2),mul(dirA(ang+sole*Math.PI/2),4.5)),8.5);}
/* flat foot on the floor in side view, sole on the floor; dir = +1 toes right, -1 toes left */
function footFlat(A,dir){capsule(P(A.x-dir*3,A.y+1),9,P(A.x+dir*23,A.y+5),5.5);}
/* foot seen from above: narrower ankle, wider toes; k = foreshortening */
function footTop(A,ang,k){capsule(A,6,along(A,ang,3+23*k),9.5);}
/* foot seen from the front (standing): 19 wide, low */
function footFront(A,s){ell(P(A.x,A.y),10,7);ell(P(A.x+s*2,A.y+3),10.5,5);}
function curveLimb(a,c,b,rA,rB,front,back){
  const N=36,pt=t=>P((1-t)*(1-t)*a.x+2*(1-t)*t*c.x+t*t*b.x,(1-t)*(1-t)*a.y+2*(1-t)*t*c.y+t*t*b.y);
  const tg=t=>{const x=2*(1-t)*(c.x-a.x)+2*t*(b.x-c.x),y=2*(1-t)*(c.y-a.y)+2*t*(b.y-c.y),l=Math.hypot(x,y)||1;return P(x/l,y/l)};
  const L=[],R=[];
  for(let i=0;i<=N;i++){const t=i/N,p=pt(t),u=tg(t),nx=-u.y*F,ny=u.x*F,rf=profR(rA,rB,front,t),rb=profR(rA,rB,back,t);
    L.push(P(p.x+nx*rf,p.y+ny*rf));R.push(P(p.x-nx*rb,p.y-ny*rb));}
  ctx.beginPath();L.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
  for(let i=N;i>=0;i--)ctx.lineTo(R[i].x,R[i].y);ctx.closePath();ctx.fill();
  dot(a,(profR(rA,rB,front,0)+profR(rA,rB,back,0))/2);dot(b,(profR(rA,rB,front,1)+profR(rA,rB,back,1))/2);
  return {pt,tg};
}
function ik(S,T,l1,l2,bend){
  const dx=T.x-S.x,dy=T.y-S.y,d=clamp(Math.hypot(dx,dy),1,l1+l2-.01);
  const base=Math.atan2(dy,dx),off=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));

}
/* draw fn twice: first a thin outline in the stage colour, then filled */
function outlined(fn,stage,w){
  const f0=ctx.fill;ctx.strokeStyle=stage;ctx.lineWidth=w||5;ctx.lineJoin='round';
  ctx.fill=function(){ctx.stroke();};fn();ctx.fill=f0;fn();
}
/* torso seen from the front, back or above: body frame x from hip (0) to shoulder (155), z sideways */
const TK=[[-24,0],[-15,26],[0,34],[33,32],[64,28],[105,38],[138,47],[157,44],[172,18],[178,13]];
const wAt=x=>{if(x<=TK[0][0])return TK[0][1];for(let i=1;i<TK.length;i++){if(x<=TK[i][0]){const[x0,w0]=TK[i-1],[x1,w1]=TK[i],u=ease((x-x0)/(x1-x0));return w0+(w1-w0)*u}}return 13};
function frontTorso(ws){
  ws=ws||1;ctx.beginPath();
  for(let x=-24;x<=178;x+=4){const w=wAt(x)*(x>150?1:ws);x>-24?ctx.lineTo(x,w):ctx.moveTo(x,w);}
  for(let x=178;x>=-24;x-=4)ctx.lineTo(x,-wAt(x)*(x>150?1:ws));
  ctx.closePath();ctx.fill();
}
function label(t,x,y,al){ctx.fillStyle=tok('--muted');ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign=al||'left';ctx.fillText(t,x,y);}
function mat(x,y,w){ctx.fillStyle=C.mat;ctx.beginPath();ctx.roundRect(x,y,w,10,5);ctx.fill();}

let mode='iso',vari=null,playing=true,slow=false,phaseT=0,last=performance.now(),C={};
function colors(){return {stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),muted:tok('--muted'),band:tok('--band'),bandfar:tok('--bandfar'),post:tok('--post')}}
function setMode(m){mode=m;phaseT=0;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));try{localStorage.setItem(KEY+'-mode',m)}catch(e){}}
function setVar(v){vari=v;phaseT=0;document.querySelectorAll('[data-var]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.var===v)));try{localStorage.setItem(KEY+'-var',v)}catch(e){}}
function boot(){
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
  document.querySelectorAll('[data-var]').forEach(b=>b.onclick=()=>setVar(b.dataset.var));
  const vs=[...document.querySelectorAll('[data-var]')].map(b=>b.dataset.var);
  setVar(DEFAULT_VAR);setMode('iso');
  try{const m=localStorage.getItem(KEY+'-mode'),v=localStorage.getItem(KEY+'-var');if(m==='iso'||m==='dyn')setMode(m);if(vs.includes(v))setVar(v);}catch(e){}
  document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
  document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
  requestAnimationFrame(frame);
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing&&!reduce)phaseT+=dt*(slow?.5:1);
  const cyc=EX.cycle(mode,vari);
  const ph=window.__ph!=null?window.__ph:(reduce?EX.rest(mode,vari):phaseT%cyc);
  const k=cv.width/VW;
  ctx.setTransform(k,0,0,k,0,0);
  C=colors();
  ctx.fillStyle=C.stage;ctx.fillRect(0,0,VW,VH);
  EX.draw(ph,mode,vari);
  requestAnimationFrame(frame);
}

const VW=640,VH=300,KEY='hollow',DEFAULT_VAR='stroom';
const SC=.8,OX=300,FY=232;
/* lower back stays on the floor: no lumbar hollow in the back profile */
const T_BACK_FLAT=[[3,.12,.18]];
function liftT(ph){if(ph<1.1)return ease(ph/1.1);if(ph<1.6)return 1;if(ph<2.7)return 1-ease((ph-1.6)/1.1);return 0}
const EX={
  cycle:(m,v)=>v==='flutter'?(m==='dyn'?1.2:.8):(m==='dyn'?3:4),
  rest:(m)=>m==='dyn'?1.3:0,
  draw(ph,m,v){
    const cyc=this.cycle(m,v),w=Math.sin(ph/cyc*Math.PI*2);
    let u=1,kick=0;
    if(v==='flutter')kick=w*(m==='dyn'?6:3);
    else if(m==='dyn')u=liftT(ph);
    else u=.97+.03*w;
    const J=pose(v,u,kick);
    const glow=m==='dyn'&&v!=='flutter'?.35+.65*u:.82+.18*Math.abs(w);
    ctx.save();ctx.translate(OX,FY);ctx.scale(SC,SC);
    mat(-372,0,760);
    drawFig(J,glow);
    ctx.restore();
    label('ZIJAANZICHT',24,34);
  }
};
/* shoulder S on a curve whose lower half (lumbar) lies along the floor */
function torsoCurve(rise){
  const H=P(0,-25),C=P(78,-25);
  const len=Sx=>{let L=0;const S=P(Sx,-25-rise);let p=S;for(let i=1;i<=40;i++){const t=i/40,q=P((1-t)*(1-t)*S.x+2*(1-t)*t*C.x+t*t*H.x,(1-t)*(1-t)*S.y+2*(1-t)*t*C.y+t*t*H.y);L+=Math.hypot(q.x-p.x,q.y-p.y);p=q;}return L};
  let lo=80,hi=200;for(let i=0;i<40;i++){const m=(lo+hi)/2;if(len(m)<155)lo=m;else hi=m;}
  return {H,C,S:P((lo+hi)/2,-25-rise)};
}
function pose(v,u,kick){
  const {H,C,S}=torsoCurve(30*u);
  const tS=angOf(sub(S,C));                  /* torso direction at the shoulder */
  const angH=tS-4*DEG,hd=along(S,angH,56);
  const legAng=b=>Math.PI+b*DEG;
  const b=lerp(-.5,11,u);
  const leg=bb=>{const a=legAng(bb),K=along(H,a,148),A=along(K,a,132);return {H,K,A,ang:a}};
  let armAng,flip=false;
  if(v==='langs'){armAng=Math.PI-lerp(1.5,6,u)*DEG;flip=true;}
  else armAng=lerp(-3*DEG,angH+3*DEG,u);
  const E=along(S,armAng,104),W=along(S,armAng,185);
  return {H,C,S,angH,hd,legN:leg(b+kick),legF:leg(b-kick),E,W,armAng,flip};
}
function legDraw(L,dx,dy){
  const H=P(L.H.x+dx,L.H.y+dy),K=P(L.K.x+dx,L.K.y+dy),A=P(L.A.x+dx,L.A.y+dy);
  limb(H,K,24,15,THIGH_F,THIGH_B);dot(K,14.5);
  limb(K,A,14.5,9,SHIN_F,SHIN_B);
  footSide(A,L.ang-4*DEG,-1);     /* toes pointed in line with the leg */
}
function armDraw(J,dx,dy){
  const S=P(J.S.x+dx,J.S.y+dy),E=P(J.E.x+dx,J.E.y+dy),W=P(J.W.x+dx,J.W.y+dy);
  limb(S,E,16,11,UA_F,UA_B);dot(E,11);
  limb(E,W,11.5,6.5,FA_F,FA_B);
  handAt(W,J.armAng,J.flip);
  dot(S,21);
}
function drawFig(J,glow){
  F=1;
  ctx.fillStyle=C.far;legDraw(J.legF,-12,-3);armDraw(J,-10,-4);
  ctx.fillStyle=C.body;
  const cv=curveLimb(J.S,J.C,J.H,27,24,T_FRONT,T_BACK_FLAT);
  ell(P(J.H.x-4,J.H.y+8),30,19,0);           /* bil: long axis along the torso, pressed to the floor */
  const nb=P(-Math.sin(J.angH)*-1,Math.cos(J.angH)*1);
  capsule(add(along(J.S,J.angH,14),mul(nb,3)),12,add(along(J.S,J.angH,30),mul(nb,3)),11);
  ell(J.hd,29,25,J.angH);
  legDraw(J.legN,0,0);
  ctx.save();ctx.fillStyle=C.mus;ctx.globalAlpha=glow;
  for(let i=0;i<=40;i++){const t=.28+.55*i/40,p=cv.pt(t),g=cv.tg(t),n=P(-g.y,g.x);dot(add(p,mul(n,profR(27,24,T_FRONT,t)-11)),9);}
  ctx.globalAlpha=glow*.55;
  const L=J.legN,ld=dirA(L.ang),nl=P(-ld.y,ld.x);
  capsule(add(add(J.H,mul(ld,30)),mul(nl,11)),10,add(add(J.H,mul(ld,118)),mul(nl,7)),7);
  ctx.restore();
  ctx.fillStyle=C.body;
  outlined(()=>armDraw(J,0,0),C.stage);
}
boot();
<\/script>
