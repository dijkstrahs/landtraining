<style id="app-css">
/* Landtraining – mobiel eerst. Kleurtokens gelijk aan de animatiepagina's. */
:root{
  --bg:#EDF0EE; --stage:#F8FAF9; --ink:#1E2426; --muted:#5E686A; --body:#2A3134; --far:#7C8689;
  --muscle:#E0452B; --mat:#D6DCD9; --line:#D3D9D6; --post:#C9D0CD; --band:#2C8C7E; --bandfar:#8CC2B9;
  --card:#FFFFFF; --accent:#2C8C7E; --accent-ink:#FFFFFF;
  --display:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --text:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121617; --stage:#1A1F20; --ink:#E8ECEA; --muted:#98A3A0; --body:#D9E0DD; --far:#7F8A87;
  --muscle:#FF5B3E; --mat:#2A3133; --line:#2C3335; --post:#323A3C; --band:#4DBDAC; --bandfar:#2F6E66;
  --card:#1E2425; --accent:#4DBDAC; --accent-ink:#0E1314; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121617; --stage:#1A1F20; --ink:#E8ECEA; --muted:#98A3A0; --body:#D9E0DD; --far:#7F8A87;
  --muscle:#FF5B3E; --mat:#2A3133; --line:#2C3335; --post:#323A3C; --band:#4DBDAC; --bandfar:#2F6E66;
  --card:#1E2425; --accent:#4DBDAC; --accent-ink:#0E1314; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) max(0px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(0px,env(safe-area-inset-left))}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;min-height:42px;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--muscle);outline-offset:2px}
button[aria-pressed="true"]{background:var(--ink);color:var(--stage);border-color:var(--ink)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent;border-color:transparent}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px;width:100%}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;line-height:1.05}
h1{font-size:30px;text-transform:uppercase}
h2{font-size:24px;text-transform:uppercase}
h3{font-size:20px}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:14px}
.wrap{max-width:720px;margin:0 auto;padding:16px}

/* kop */
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
.top .brand{flex:1;min-width:0;display:grid;gap:2px;justify-items:start}
.top h1{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ver{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px;white-space:nowrap;line-height:18px}

/* kaarten en lijsten */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center}
.item .nr{font-family:var(--display);font-weight:700;font-size:22px;color:var(--muted);text-align:center}
.item .t{font-weight:600}
.item .d{font-size:14px;color:var(--muted)}
.item .acts{display:flex;gap:4px}
.item .acts button{min-height:38px;min-width:38px;padding:4px 8px}
.empty{text-align:center;padding:28px 12px;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grow{flex:1}
.stack{display:grid;gap:14px}
label.f{display:grid;gap:4px;font-size:14px;color:var(--muted);min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
input{min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;text-align:left;line-height:22px}
input[type=date]::-webkit-date-and-time-value{text-align:left}

/* chips (filters, keuzes) */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;min-height:36px;padding:6px 12px;border-radius:999px;font-size:15px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:38px;padding:6px 12px;font-size:15px}
.seg.modes button{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.seg.grid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:8px}
.seg.grid button{width:100%;min-height:46px;padding:6px 8px;text-align:center;line-height:1.2;white-space:normal}
.seg.grid.modes button{min-height:50px}
.hist{display:grid;gap:10px}
.hist.current{border-color:var(--accent)}
.hist .t{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hist .d{font-size:14px;color:var(--muted)}
.hacts{display:grid;grid-template-columns:1fr 1fr 1fr 48px;gap:6px}
.hacts button{min-height:40px;padding:4px 6px;font-size:15px}
.top button{min-height:40px;padding:6px 12px}
.resume{display:flex;align-items:center;gap:8px;padding:10px 12px;border-color:var(--accent)}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;background:var(--bg);border:1px solid var(--line);color:var(--muted);margin:2px 4px 0 0}

/* getallen kiezen */
.steppers{display:grid;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px}
.stepper{display:grid;grid-template-columns:minmax(0,1fr) 168px;align-items:center;gap:10px;padding:6px 0}
.stepper+.stepper{border-top:1px solid var(--line);padding-top:12px}
.stepper span{font-size:16px;color:var(--ink);font-weight:500}
.stepper div{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:6px}
.stepper input{text-align:center;font-family:var(--display);font-size:22px;font-weight:700;padding:4px;min-width:0}
.stepper button{padding:0;font-size:22px;font-weight:700}

/* animatie */
.stage{background:var(--stage);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stage canvas{display:block;width:100%;height:auto}
.stage iframe.anim{display:block;width:100%;height:auto;border:0;pointer-events:none;background:var(--stage)}
.stage.loading{min-height:180px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:11px;height:11px;border-radius:50%;background:var(--muscle);display:inline-block}
.legend .dot.soft{opacity:.55}

/* onderbalk en vensters */
.bottom{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:5}
.bottom button{flex:1}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);width:100%;max-width:720px;max-height:94vh;max-height:94dvh;overflow:auto;border-radius:18px 18px 0 0;padding:0 0 calc(16px + env(safe-area-inset-bottom))}
.sheet .head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line);z-index:2}
.sheet .head h2{flex:1}
.sheet .body{padding:14px 16px;display:grid;gap:14px}
.pick{display:grid;gap:8px}
.pick button{text-align:left;display:grid;gap:2px;padding:12px 14px}
.pick button b{font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--stage);padding:10px 16px;border-radius:999px;z-index:40;font-size:15px;max-width:90vw;text-align:center}

/* speler */
.player{min-height:100vh;min-height:100dvh;display:grid;grid-template-rows:auto 1fr}
.player .ptop{display:flex;align-items:center;gap:8px;padding:10px max(12px,calc((100% - 600px)/2 + 16px));border-bottom:1px solid var(--line)}
.player .ptop .grow{min-width:0}
.player .ptop .title{font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;margin-top:4px}
.dots i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots i.done{background:var(--muted)}
.player main{overflow:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom));display:grid;gap:12px;align-content:start;max-width:600px;width:100%;margin:0 auto}
.player .exname{font-size:30px;text-transform:uppercase}
.presc{font-size:17px;font-weight:600}
.timer{display:grid;justify-items:center;gap:6px;padding:16px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.timer .phase{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.timer .phase.go{color:var(--muscle)}
.timer .phase.rest{color:var(--accent)}
.timer .big{font-family:var(--display);font-weight:700;font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
.timer .sets{font-size:15px;color:var(--muted)}
.timer .row{justify-content:center}
.timer .row button{min-width:120px}
.pnav{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.pnav button.arrow{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.02em;text-transform:uppercase;min-height:52px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnav button.arrow:last-child{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pnav button.arrow:disabled{background:var(--card);color:var(--muted);border-color:var(--line)}
.pnav .count{text-align:center;font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);min-width:64px}
.cover{display:grid;gap:12px}
.cover ol{margin:0;padding-left:22px;display:grid;gap:6px}
.timer .presc{font-size:16px;text-align:center;color:var(--ink);padding-bottom:6px;margin-bottom:2px;border-bottom:1px solid var(--line);width:100%}

</style>

<script>
/* ---------- shared drawing helpers (vaste maten en spierprofielen) ---------- */

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
const P=(x,y)=>({x,y});
const DEG=Math.PI/180,lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>.5-.5*Math.cos(Math.PI*clamp(t,0,1));

const dist=(a,b)=>Math.hypot(b.x-a.x,b.y-a.y);
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));

  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();ctx.fill();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
function curveLimb(a,c,b,rA,rB,front,back){
  const N=36,prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,cc,w]of bs)r+=m*Math.exp(-(((t-cc)/w)**2));return r};
  const pt=t=>P((1-t)*(1-t)*a.x+2*(1-t)*t*c.x+t*t*b.x,(1-t)*(1-t)*a.y+2*(1-t)*t*c.y+t*t*b.y);
  const tg=t=>{const x=2*(1-t)*(c.x-a.x)+2*t*(b.x-c.x),y=2*(1-t)*(c.y-a.y)+2*t*(b.y-c.y),l=Math.hypot(x,y)||1;return P(x/l,y/l)};
  const L=[],Rr=[];
  for(let i=0;i<=N;i++){const t=i/N,p=pt(t),u=tg(t),nx=-u.y*F,ny=u.x*F,rf=prof(t,front),rb=prof(t,back);
    L.push(P(p.x+nx*rf,p.y+ny*rf));Rr.push(P(p.x-nx*rb,p.y-ny*rb));}
  ctx.beginPath();L.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
  for(let i=N;i>=0;i--)ctx.lineTo(Rr[i].x,Rr[i].y);ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
  return {pt,tg};
}
/* vlakke hand plat op de vloer: handpalm onder op W.y+8, dikke handrug bij de pols, dunne vingers naar +x */
function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-6,W.y+8);
  ctx.lineTo(W.x+29,W.y+8);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+33.5,W.y+5);
  ctx.quadraticCurveTo(W.x+32,W.y+2,W.x+26,W.y+2);
  ctx.lineTo(W.x+18,W.y+1.5);
  ctx.quadraticCurveTo(W.x+15,W.y-1.5,W.x+10,W.y-1);
  ctx.quadraticCurveTo(W.x+3,W.y-3,W.x-1,W.y-4);
  ctx.quadraticCurveTo(W.x-9,W.y-4,W.x-9,W.y+3);
  ctx.quadraticCurveTo(W.x-9,W.y+8,W.x-6,W.y+8);
  ctx.closePath();ctx.fill();
}
const unit=(a,b)=>{const d=dist(a,b)||1;return P((b.x-a.x)/d,(b.y-a.y)/d);};
/* gestrekte voet in richting u (wreef naar de vloer, hiel aan de bovenkant): bij knielen en bij een gestrekt been */
function flatFoot(A,u){
  let n=P(u.y,-u.x);if(n.y>0)n=P(-n.x,-n.y);
  const m=P(A.x+u.x*22-n.x*1.5,A.y+u.y*22-n.y*1.5),t=P(A.x+u.x*36-n.x*2,A.y+u.y*36-n.y*2);
  capsule(P(A.x+n.x*4.5-u.x*3,A.y+n.y*4.5-u.y*3),8,m,6);
  capsule(A,9,m,6.5);capsule(m,6.5,t,4.5);
}
/* knielvoet: wreef plat achter de enkel, in het verlengde van het scheenbeen, iets naar de vloer */
function kneelFoot(K,A,ground=332){const sx=Math.sign(A.x-K.x)||-1,tip=P(A.x+sx*35,ground-4.5);flatFoot(A,unit(A,tip));}
/* voet op de tenen (plank): bal van de voet onder de enkel, hiel omhoog, tenen plat naar het hoofd (+x).
   u = richting knie -> enkel; ground = bovenkant van de mat (laat weg bij een opgetild been) */
function toeFoot(A,u,ground,toeDir){
  const p=P(-u.y,u.x).y>0?P(-u.y,u.x):P(u.y,-u.x);
  let L=24.4;if(ground!=null)L=clamp((ground-6.5-A.y)/p.y,16,30);
  const B=P(A.x+p.x*L,A.y+p.y*L),heel=P(A.x-p.x*5+u.x*3,A.y-p.y*5+u.y*3);
  const td=ground!=null?P(1,0):(toeDir||P(1,0));
  capsule(heel,8.5,B,6.5);
  capsule(B,6.5,P(B.x+td.x*14-td.y*2.5,B.y+td.y*14+td.x*2.5),4);
}
/* 3D-IK voor een vooraanzicht: punten {x,y,z}, pole = richting waar de elleboog heen wijst */
function ik3(S,W,l1,l2,pole){
  const d0=Math.hypot(W.x-S.x,W.y-S.y,W.z-S.z)||1,d=clamp(d0,Math.abs(l1-l2)+.5,l1+l2-.01);
  const u={x:(W.x-S.x)/d0,y:(W.y-S.y)/d0,z:(W.z-S.z)/d0};
  const pd=pole.x*u.x+pole.y*u.y+pole.z*u.z;
  let v={x:pole.x-pd*u.x,y:pole.y-pd*u.y,z:pole.z-pd*u.z};const vl=Math.hypot(v.x,v.y,v.z)||1;v={x:v.x/vl,y:v.y/vl,z:v.z/vl};
  const ca=clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1),sa=Math.sqrt(1-ca*ca);
  return {x:S.x+l1*(ca*u.x+sa*v.x),y:S.y+l1*(ca*u.y+sa*v.y),z:S.z+l1*(ca*u.z+sa*v.z)};
}
/* vlakke hand die meedraait met de onderarm; plat zodra de onderarm verticaal staat */
function turnHand(W,E){
  const aa=Math.atan2(W.y-E.y,W.x-E.x),sm=clamp((aa-45*DEG)/(45*DEG),0,1);
  ctx.save();ctx.translate(W.x,W.y);ctx.rotate(aa*(1-sm));hand(P(0,0));ctx.restore();
}
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
function edgeHand(W,T,wd=9){const dx=T.x-W.x,dy=T.y-W.y,L=Math.hypot(dx,dy);if(L<1){dot(W,8);return;}const a=Math.atan2(dy,dx),h=Math.min(1,L/16);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(2+17*h,0,6+15*h,wd,0,0,Math.PI*2);ctx.fill();ctx.restore();}
/* twee-segment IK: kies het gewricht aan de kant 'pick' (functie die de beste van twee kandidaten kiest) */
function ik(a,b,l1,l2,pick){
  const dx=b.x-a.x,dy=b.y-a.y;let d=Math.hypot(dx,dy);
  d=clamp(d,Math.abs(l1-l2)+.5,l1+l2-.01);
  const ang=Math.atan2(dy,dx),al=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));
  const c1=P(a.x+l1*Math.cos(ang+al),a.y+l1*Math.sin(ang+al)),c2=P(a.x+l1*Math.cos(ang-al),a.y+l1*Math.sin(ang-al));
  return pick(c1,c2)?c1:c2;
}
/* teken een vorm als dun randje in de achtergrondkleur (eerst stroken, dan vullen) */
function outlined(fn,col){
  const f0=ctx.fill;ctx.strokeStyle=col;ctx.lineWidth=5;ctx.lineJoin='round';
  ctx.fill=function(){ctx.stroke();};fn();ctx.fill=f0;fn();
}
function label(c,t,x,y,align='left'){ctx.fillStyle=c.muted;ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign=align;ctx.fillText(t,x,y);}
const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];
/* lichte trilling bij vasthouden, 0..1 */
const trem=T=>.5+.5*Math.sin(T*Math.PI*2*5.3)*Math.sin(T*Math.PI*2*.9+1);
const breath=T=>Math.sin(T*Math.PI*2/4);

/* Plank: op de knieën, onderarmen, gestrekte armen, met beenlift, knie naar borst.
   Dynamisch: shoulder taps (knieën, gestrekt), body saw (onderarmen), afwisselend been heffen (beenlift),
   afwisselend knie naar de borst (alleen dynamisch). */
const PAGE={key:'plank-state',variants:[['knie','Op de knieën'],['onderarm','Onderarmen'],['gestrekt','Gestrekte armen'],['beenlift','Met beenlift'],['knieborst','Knie naar borst']],def:'gestrekt'};
PAGE.dynOnly=['knieborst'];
VY=62;
PAGE.period=(m,v)=>{
  if(m==='iso')return v==='beenlift'?17.2:8;
  if(v==='onderarm')return 4;
  if(v==='beenlift')return 3.8;
  if(v==='knieborst')return 5.2;
  return 2.8;
};
PAGE.still=(m,v)=>v==='knieborst'?1.15:m==='dyn'&&v!=='onderarm'?.7:3;
/* lichaamslijn van schouder naar enkel; knee = knie op de grond */
function bodyLine(S,end,kneel){
  const d=dist(S,end),ux=(end.x-S.x)/d,uy=(end.y-S.y)/d;
  const H=P(S.x+ux*155,S.y+uy*155);
  if(kneel){const K=P(S.x+ux*303,S.y+uy*303);return {S,H,K,A:P(K.x-131,313),ux,uy};}
  const K=P(H.x+ux*148,H.y+uy*148),A=P(K.x+ux*132,K.y+uy*132);
  return {S,H,K,A,ux,uy};
}
function torso(q,c){
  let dnx=-q.uy,dny=q.ux;if(dny<0){dnx=-dnx;dny=-dny;}
  ctx.fillStyle=c.body;
  limb(P(q.S.x-4,q.S.y),q.H,27,24,T_FRONT,T_BACK);
  dot(q.H,25);
  ctx.beginPath();ctx.ellipse(q.H.x-dnx*15-q.ux*2,q.H.y-dny*15-q.uy*2,31,23,Math.atan2(q.uy,q.ux),0,Math.PI*2);ctx.fill();
  capsule(P(q.S.x-q.ux*14,q.S.y-q.uy*14-4),12,P(q.S.x-q.ux*30,q.S.y-q.uy*30-6),11);
  ctx.beginPath();ctx.ellipse(q.S.x-q.ux*56,q.S.y-q.uy*56-7,29,25,Math.atan2(q.uy,q.ux),0,Math.PI*2);ctx.fill();
  return {dnx,dny};
}
/* been; lift = hoek (rad) waarmee het been vanuit de heup omhoog draait */
function leg(q,dx,lift,toe){
  const H=P(q.H.x+dx,q.H.y);
  const rot=p=>{const x=p.x-q.H.x,y=p.y-q.H.y,c=Math.cos(lift),s=Math.sin(lift);return P(q.H.x+dx+x*c-y*s,q.H.y+x*s+y*c);};
  const K=rot(q.K),A=lift?rot(q.A):P(q.A.x+dx,q.A.y);
  limb(H,K,24,15,THIGH_F,THIGH_B);dot(K,14.5);
  limb(K,A,14.5,9,SHIN_F,SHIN_B);
  if(q.kneel){kneelFoot(K,A);return;}
  toeFoot(A,unit(K,A),lift?null:332,P(Math.cos(lift),Math.sin(lift)));
}
/* arm met schouder S, elleboog E, pols W; vlakke hand draait mee */
function armSEW(S,E,W,dx,dy,flat){
  const s=P(S.x+dx,S.y+dy),e=P(E.x+dx,E.y+dy),w=P(W.x+dx,W.y+dy);
  const up=w.y<s.y+60;
  if(up)dot(P(s.x+3,s.y-2),21);
  limb(s,e,16,11,UA_F,UA_B);dot(e,11);
  limb(e,w,11.5,6.5,FA_F,FA_B);
  /* steunende hand plat op de vloer; een hand die loskomt draait geleidelijk mee met de onderarm */
  const r=flat?0:1-clamp((w.y-282)/40,0,1),aa=Math.atan2(w.y-e.y,w.x-e.x);
  ctx.save();ctx.translate(w.x,w.y);ctx.rotate(aa*r);hand(P(0,0));ctx.restore();
  if(!up)dot(P(s.x+3,s.y-2),21);
}
/* shoulder tap: pols van de vloer naar de andere schouder en terug; k 0..1 */
function tapArm(S,W0,k){
  const tg=P(S.x+14,S.y+34);
  const W=P(lerp(W0.x,tg.x,k)+Math.sin(Math.PI*k)*26,lerp(W0.y,tg.y,k));
  const E=ik(S,W,104,81,(a,b)=>a.y>b.y);
  return {E,W};
}
function tapCurve(T){ /* per kant 1,4 s: 0,45 op, 0,25 tik, 0,45 terug, 0,25 rust */
  const side=T<1.4?0:1,u=T%1.4;
  const k=u<.45?ease(u/.45):u<.7?1:u<1.15?1-ease((u-.7)/.45):0;
  return [side,k];
}
/* vooraanzicht (camera bij het hoofd): 3D-armen, x opzij, y omlaag, z naar de camera.
   De tikkende arm buigt in de elleboog; de elleboog wijst omlaag en iets naar achteren, zodat de bovenarm verkort in beeld komt. */
function frontView(c,side,k,glow){
  ctx.fillStyle=c.mat;ctx.beginPath();ctx.roundRect(-110,6,220,8,4);ctx.fill();
  const arms=[];
  for(const s of [-1,1]){
    const Sh={x:s*46,y:-190,z:0},W0={x:s*46,y:-9,z:0};
    const tapping=(s>0?0:1)===side&&k>0; /* zijde 0 (dichtbij) = rechts in beeld */
    let W=W0;
    if(tapping){const tg={x:-s*36,y:-178,z:16},h=Math.sin(Math.PI*k);
      W={x:lerp(W0.x,tg.x,k)+s*h*10,y:lerp(W0.y,tg.y,k),z:lerp(W0.z,tg.z,k)+h*24};}
    const E=tapping?ik3(Sh,W,104,81,{x:s*.15,y:.6,z:-1}):{x:s*46,y:-190+104,z:0};
    arms.push({Sh:P(Sh.x,Sh.y),E:P(E.x,E.y),W:P(W.x,W.y),W0:P(W0.x,W0.y),tapping,lifted:Math.hypot(W.x-W0.x,W.y-W0.y)>3});
  }
  const drawA=a=>{
    limb(a.Sh,a.E,16,11,[[4,.5,.22]],[[4,.5,.22]]);dot(a.E,11);
    limb(a.E,a.W,11.5,6.5,[[3,.22,.2]],[[3,.22,.2]]);
    if(a.lifted){const d=dist(a.E,a.W);edgeHand(a.W,P(a.W.x+(a.W.x-a.E.x)/d*18,a.W.y+(a.W.y-a.E.y)/d*18),10);}
    else{ /* platte hand van voren: breder dan de pols, vingers naar de camera */
      ctx.beginPath();ctx.roundRect(a.W.x-13,a.W.y-1,26,10,[5,5,3,3]);ctx.fill();}
  };
  ctx.fillStyle=c.body;
  ctx.beginPath();ctx.roundRect(-50,-212,100,56,24);ctx.fill();
  ctx.save();ctx.fillStyle=c.mus;ctx.globalAlpha=glow*.9;
  ctx.beginPath();ctx.ellipse(0,-170,24,9,0,0,Math.PI*2);ctx.fill();ctx.restore();
  ctx.fillStyle=c.body;
  for(const a of arms){if(!a.tapping){drawA(a);dot(a.Sh,21);}}
  for(const a of arms)if(a.tapping)dot(a.Sh,21);
  for(const a of arms)if(a.tapping)outlined(()=>drawA(a),c.stage);
  ctx.fillStyle=c.body;
  outlined(()=>{ctx.beginPath();ctx.ellipse(0,-200,24,27,0,0,Math.PI*2);ctx.fill();},c.stage);
}
/* knie naar borst: per kant 2,6 s (1,0 knie in, 0,3 vast, 1,0 terug, 0,3 rust).
   De heup komt iets omhoog zodat de knie vrij van de vloer onder het lichaam door kan; het steunbeen buigt mee via IK. */
function kneeCurve(T){
  const side=T<2.6?0:1,u=T%2.6;
  return [side,u<1?ease(u):u<1.3?1:u<2.3?1-ease(u-1.3):0];
}
function drawKneeChest(T,c){
  const [side,k]=kneeCurve(T);
  const S=P(604,142),A0=P(204,303);
  const base=bodyLine(S,A0,false),a0=Math.atan2(base.uy,base.ux);
  /* alle onderdelen vloeiend in k, zonder tussenstops: heup één boog omhoog, knie buigt geleidelijk */
  const rise=36*Math.sin(Math.PI*k)+16*k;
  const H=P(base.H.x+4*k,base.H.y-rise),tu=unit(S,H);
  const q={S,H,ux:tu.x,uy:tu.y};
  /* bewegend been: dij draait van de lichaamslijn naar onder de borst, knie buigt */
  const legMove=dx=>{
    /* start- en eindpunt = exact de stand van het steunbeen (zelfde IK), zodat er bij het neerzetten niets verspringt */
    const h=P(H.x+dx,H.y),Ar=P(A0.x+dx,A0.y),Kr=ik(h,Ar,148,132,(p1,p2)=>p1.y>p2.y);
    const tr=Math.atan2(Kr.y-h.y,Kr.x-h.x),r0=Math.atan2(Ar.y-Kr.y,Ar.x-Kr.x)-tr;
    const ta=lerp(tr,32*DEG,k),K=P(h.x+148*Math.cos(ta),h.y+148*Math.sin(ta));
    const sh=ta+lerp(r0,135*DEG,1-Math.pow(1-k,3)),A=P(K.x+132*Math.cos(sh),K.y+132*Math.sin(sh));
    limb(h,K,24,15,THIGH_F,THIGH_B);dot(K,14.5);
    limb(K,A,14.5,9,SHIN_F,SHIN_B);
    const rot=sh-(tr+r0);
    if(k<1e-3)toeFoot(A,unit(K,A),332);else toeFoot(A,unit(K,A),null,P(Math.cos(rot),Math.sin(rot)));
    return K;
  };
  /* steunbeen: enkel blijft op de vloer staan */
  const legStand=dx=>{
    const h=P(H.x+dx,H.y),A=P(A0.x+dx,A0.y),K=ik(h,A,148,132,(p1,p2)=>p1.y>p2.y);
    limb(h,K,24,15,THIGH_F,THIGH_B);dot(K,14.5);
    limb(K,A,14.5,9,SHIN_F,SHIN_B);toeFoot(A,unit(K,A),332);
  };
  const W0=P(S.x+42,322),E0=P(S.x+(W0.x-S.x)*.56,S.y+(W0.y-S.y)*.56);
  F=-1;
  ctx.fillStyle=c.far;
  if(side===1)legMove(-14);else legStand(-14);
  armSEW(P(S.x-14,S.y-3),P(E0.x-14,E0.y-3),P(W0.x-14,W0.y-3),0,0,true);
  const {dnx,dny}=torso(q,c);
  ctx.fillStyle=c.body;
  let Kn=null;
  if(side===0)Kn=legMove(0);else legStand(0);
  ctx.save();ctx.fillStyle=c.mus;
  ctx.globalAlpha=.6+.4*k;
  capsule(P(S.x+q.ux*45+dnx*15,S.y+q.uy*45+dny*15),12,P(H.x-q.ux*22+dnx*13,H.y-q.uy*22+dny*13),11);
  /* heupbuigers van het bewegende been (secundair) */
  ctx.globalAlpha=.55*k;
  if(Kn){const d=unit(H,Kn);capsule(P(H.x+d.x*30+dnx*6,H.y+d.y*30+dny*6),10,P(H.x+d.x*80+dnx*4,H.y+d.y*80+dny*4),7);}
  ctx.restore();
  ctx.fillStyle=c.body;
  armSEW(S,E0,W0,0,0,true);
  ctx.save();ctx.fillStyle=c.mus;ctx.globalAlpha=.5;
  ctx.beginPath();ctx.ellipse(S.x+8,S.y+8,13,19,-.3,0,Math.PI*2);ctx.fill();ctx.restore();
}
PAGE.draw=(m,v,T,c)=>{
  ctx.fillStyle=c.mat;ctx.beginPath();ctx.roundRect(150,332,600,10,5);ctx.fill();
  if(v==='knieborst'){drawKneeChest(T,c);return;}
  const b=m==='iso'?breath(T):0;
  let q,armN,armF,flat=false,liftN=0,liftF=0,tap=null;
  if(v==='onderarm'){
    const phi=m==='dyn'?-.12*Math.sin(T*Math.PI*2/4):0;
    const E=P(620,321),W=P(701,323);
    const S=P(E.x+104*Math.sin(phi),E.y-104*Math.cos(phi)+b*.6);
    q=bodyLine(S,P(196+104*Math.sin(phi),303+b*1.4),false);
    q.toe=P(218,328);
    armN={E,W};armF={E,W};flat=true;
  }else{
    const kneel=v==='knie';
    const S=kneel?P(560,142+b*.6):P(604,142+b*.6);
    q=bodyLine(S,kneel?P(313,318):P(204,303+b*1.6),kneel);q.kneel=kneel;
    q.toe=P(226,328);
    const W0=P(S.x+42,322),E0=P(S.x+(W0.x-S.x)*.56,S.y+(W0.y-S.y)*.56);
    armN={E:E0,W:W0};armF={E:E0,W:W0};
    if(m==='dyn'&&v!=='beenlift'){
      const [side,k]=tapCurve(T);tap={side,k};
      if(k>0){const a=tapArm(S,W0,k);if(side===0)armN=a;else armF=a;}
    }
    if(v==='beenlift'){
      let side,k;
      if(m==='iso'){const u=T%8.6;side=T<8.6?0:1;k=u<.8?ease(u/.8):u<7.8?1:1-ease((u-7.8)/.8);if(k>.99)k-=.02*trem(T);}
      else{const u=T%1.9;side=T<1.9?0:1;k=u<.7?ease(u/.7):u<1?1:u<1.7?1-ease((u-1)/.7):0;}
      const L=.26*k;if(side===0)liftN=L;else liftF=L;
    }
  }
  F=-1;
  ctx.fillStyle=c.far;
  leg(q,-14,liftF,q.toe);
  armSEW(P(q.S.x-14,q.S.y-3),P(armF.E.x-14,armF.E.y-3),P(armF.W.x-14,armF.W.y-3),0,0,flat);
  const {dnx,dny}=torso(q,c);
  ctx.fillStyle=c.body;leg(q,0,liftN,q.toe);
  const glow=m==='iso'?.75+.25*(.5+.5*Math.sin(T*Math.PI*2/2)):.9;
  ctx.save();ctx.fillStyle=c.mus;
  ctx.globalAlpha=glow;
  capsule(P(q.S.x+q.ux*45+dnx*15,q.S.y+q.uy*45+dny*15),12,P(q.H.x-q.ux*22+dnx*13,q.H.y-q.uy*22+dny*13),11);
  ctx.globalAlpha=glow*(liftN||liftF?.55+.45*Math.max(liftN,liftF)/.26:.55);
  ctx.beginPath();ctx.ellipse(q.H.x-dnx*18-q.ux*4,q.H.y-dny*18-q.uy*4,23,14,Math.atan2(q.uy,q.ux),0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.fillStyle=c.body;
  const drawNear=()=>armSEW(q.S,armN.E,armN.W,0,0,flat);
  if(tap&&tap.side===0&&tap.k>0)outlined(drawNear,c.stage);else drawNear();
  ctx.save();ctx.fillStyle=c.mus;ctx.globalAlpha=glow*.55;
  ctx.beginPath();ctx.ellipse(q.S.x+8,q.S.y+8,13,19,-.3,0,Math.PI*2);ctx.fill();
  ctx.restore();
  if(tap){
    ctx.save();ctx.translate(236,206);ctx.scale(.56,.56);frontView(c,tap.side,tap.k,glow);ctx.restore();
    label(c,'VOORAANZICHT',236,238,'center');
  }
};

/* ---------- knoppen, toestand en afspeellus ---------- */
(function(){
  const MODES=[['iso','Isometrisch'],['dyn','Dynamisch']];
  const st={mode:'iso',variant:PAGE.def||PAGE.variants[0][0]};
  let playing=true,slow=false,phaseT=0,last=performance.now();
  const mBox=document.getElementById('modes'),vBox=document.getElementById('vars');
  const mk=(box,list,key)=>list.forEach(([id,lab])=>{const b=document.createElement('button');b.type='button';b.id=key+'-'+id;b.textContent=lab;b.dataset.v=id;b.onclick=()=>set(key,id);box.appendChild(b);});
  mk(mBox,MODES,'mode');mk(vBox,PAGE.variants,'variant');
  function sync(){
    /* variaties zonder isometrische stand (PAGE.dynOnly): alleen Dynamisch tonen */
    const only=!!(PAGE.dynOnly&&PAGE.dynOnly.includes(st.variant));
    if(only)st.mode='dyn';
    document.getElementById('mode-iso').hidden=only;
    mBox.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===st.mode)));
    vBox.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===st.variant)));
    if(PAGE.onChange)PAGE.onChange(st);
  }
  function set(k,v){st[k]=v;phaseT=0;sync();try{localStorage.setItem(PAGE.key,JSON.stringify(st))}catch(e){}}
  try{const s=JSON.parse(localStorage.getItem(PAGE.key)||'null');if(s){if(MODES.some(m=>m[0]===s.mode))st.mode=s.mode;if(PAGE.variants.some(v=>v[0]===s.variant))st.variant=s.variant;}}catch(e){}
  const h=location.hash.slice(1).split('-');
  if(MODES.some(m=>m[0]===h[0]))st.mode=h[0];
  if(h[1]&&PAGE.variants.some(v=>v[0]===h[1]))st.variant=h[1];
  sync();
  window.__set=(m,v)=>{st.mode=m;st.variant=v;sync();};
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(playing&&!reduce)phaseT+=dt*(slow?.5:1);
    const per=PAGE.period(st.mode,st.variant);if(per)phaseT%=per;
    const T=window.__T!=null?window.__T:(reduce?PAGE.still(st.mode,st.variant):phaseT);
    const k=cv.width/VW;
    ctx.setTransform(k,0,0,k,-VX*k,-VY*k);
    const c={stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),muted:tok('--muted'),post:tok('--post')};
    ctx.fillStyle=c.stage;ctx.fillRect(VX,VY,VW,VH);
    PAGE.draw(st.mode,st.variant,T,c,dt);
    requestAnimationFrame(frame);
  }
  document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
  document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
  requestAnimationFrame(frame);
})();
<\/script>

</body></html>
</script>
<script type="text/plain" data-ex="sideplank">
<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Side plank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one stage card with the animation, mode and variation buttons, playback controls and a muscle legend */
:root{
  --bg:#EDF0EE; --stage:#F8FAF9; --ink:#1E2426; --muted:#5E686A; --body:#2A3134; --far:#7C8689;
  --muscle:#E0452B; --mat:#D6DCD9; --line:#D3D9D6; --band:#2C8C7E; --bandfar:#8CC2B9; --post:#B9C1BE;

}

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();ctx.fill();
}
let F=1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
/* gebogen ledemaat/romp langs een kwadratische curve a-c-b, zelfde profielen als limb */
function curveLimb(a,c,b,rA,rB,front,back){
  const N=36,prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,cc,w]of bs)r+=m*Math.exp(-(((t-cc)/w)**2));return r};
  const pt=t=>P((1-t)*(1-t)*a.x+2*(1-t)*t*c.x+t*t*b.x,(1-t)*(1-t)*a.y+2*(1-t)*t*c.y+t*t*b.y);
  const tg=t=>{const x=2*(1-t)*(c.x-a.x)+2*t*(b.x-c.x),y=2*(1-t)*(c.y-a.y)+2*t*(b.y-c.y),l=Math.hypot(x,y)||1;return P(x/l,y/l)};
  const L=[],Rr=[];
  for(let i=0;i<=N;i++){const t=i/N,p=pt(t),u=tg(t),nx=-u.y*F,ny=u.x*F,rf=prof(t,front),rb=prof(t,back);
    L.push(P(p.x+nx*rf,p.y+ny*rf));Rr.push(P(p.x-nx*rb,p.y-ny*rb));}
  ctx.beginPath();L.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
  for(let i=N;i>=0;i--)ctx.lineTo(Rr[i].x,Rr[i].y);ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
  return {pt,tg};
}
/* voet in zijaanzicht: ca. 40 lang (enkel r9, teen r6) */
function footSide(A,ang){capsule(A,9,P(A.x+Math.cos(ang)*25,A.y+Math.sin(ang)*25),6);}
const ell=(c,rx,ry,rot)=>{ctx.beginPath();ctx.ellipse(c.x,c.y,rx,ry,rot||0,0,Math.PI*2);ctx.fill();};
const P=(x,y)=>({x,y});
const add=(a,b)=>P(a.x+b.x,a.y+b.y),sub=(a,b)=>P(a.x-b.x,a.y-b.y),mul=(a,k)=>P(a.x*k,a.y*k);
const dirA=a=>P(Math.cos(a),Math.sin(a)),angOf=v=>Math.atan2(v.y,v.x);
const along=(a,ang,len)=>P(a.x+Math.cos(ang)*len,a.y+Math.sin(ang)*len);
const ease=t=>.5-.5*Math.cos(Math.PI*Math.max(0,Math.min(1,t)));
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),DEG=Math.PI/180;
const lerpP=(a,b,t)=>P(lerp(a.x,b.x,t),lerp(a.y,b.y,t));

/* shared body standard: torso 155, thigh 148, shin 132, upper arm 104, forearm 81 */
const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];
const profR=(rA,rB,bs,t)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};

/* flat hand, fingers along +x, back of the hand on the -y side */
function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-4,W.y-9);
  ctx.quadraticCurveTo(W.x+14,W.y-10,W.x+28,W.y-3);
  ctx.quadraticCurveTo(W.x+40,W.y+1,W.x+40,W.y+5);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+16,W.y+8);
  ctx.lineTo(W.x-6,W.y+8);
  ctx.closePath();ctx.fill();
}
function handAt(W,ang,flip){ctx.save();ctx.translate(W.x,W.y);ctx.rotate(ang);if(flip)ctx.scale(1,-1);hand(P(0,0));ctx.restore();}
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
const fistC=(W,E)=>{const d=sub(W,E),l=Math.hypot(d.x,d.y)||1;return P(W.x+d.x/l*9,W.y+d.y/l*9)};
function edgeHand(W,T){const dx=T.x-W.x,dy=T.y-W.y,L=Math.hypot(dx,dy);if(L<1){dot(W,8);return;}const a=Math.atan2(dy,dx),h=Math.min(1,L/16);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(2+17*h,0,6+15*h,9,0,0,Math.PI*2);ctx.fill();ctx.restore();}
/* flat hand seen from the palm or the back (top / front views): wrist 13 wide, hand 18 wide, ca. 37 beyond the wrist, with thumb.
   ang = finger direction on screen, k = foreshortening (1 = full length), th = thumb side (+1/-1 in local y) */
function palmHand(W,ang,k,th){
  const kk=Math.max(.38,k==null?1:k),t=th||1;
  ctx.save();ctx.translate(W.x,W.y);ctx.rotate(ang);ctx.scale(kk,1);
  ctx.beginPath();
  ctx.moveTo(-3,-6.2);ctx.quadraticCurveTo(5,-9.2,14,-8.8);ctx.lineTo(28,-7.4);
  ctx.quadraticCurveTo(37,-6.4,37,0);ctx.quadraticCurveTo(37,6.4,28,7.4);
  ctx.lineTo(14,8.8);ctx.quadraticCurveTo(5,9.2,-3,6.2);ctx.closePath();ctx.fill();
  capsule(P(7,t*6),4.3,P(15.5,t*11.5),3.4);
  ctx.restore();
}
/* side-view flat hand that follows the forearm (skill: same flat hand turning with the forearm) */
function sideHand(W,E,flip){handAt(W,Math.atan2(W.y-E.y,W.x-E.x),flip);}
/* foot in side view, ca. 40 long; ang = direction heel->toes */
function footSide(A,ang,sole){const m=along(A,ang,18),t=along(A,ang,27);capsule(A,9,m,7);capsule(m,7,t,4.5);if(sole)dot(add(along(A,ang,-2),mul(dirA(ang+sole*Math.PI/2),4.5)),8.5);}
/* flat foot on the floor in side view, sole on the floor; dir = +1 toes right, -1 toes left */
function footFlat(A,dir){capsule(P(A.x-dir*3,A.y+1),9,P(A.x+dir*23,A.y+5),5.5);}
/* foot seen from above: narrower ankle, wider toes; k = foreshortening */
function footTop(A,ang,k){capsule(A,6,along(A,ang,3+23*k),9.5);}
/* foot seen from the front (standing): 19 wide, low */
function footFront(A,s){ell(P(A.x,A.y),10,7);ell(P(A.x+s*2,A.y+3),10.5,5);}
function curveLimb(a,c,b,rA,rB,front,back){
  const N=36,pt=t=>P((1-t)*(1-t)*a.x+2*(1-t)*t*c.x+t*t*b.x,(1-t)*(1-t)*a.y+2*(1-t)*t*c.y+t*t*b.y);
  const tg=t=>{const x=2*(1-t)*(c.x-a.x)+2*t*(b.x-c.x),y=2*(1-t)*(c.y-a.y)+2*t*(b.y-c.y),l=Math.hypot(x,y)||1;return P(x/l,y/l)};
  const L=[],R=[];
  for(let i=0;i<=N;i++){const t=i/N,p=pt(t),u=tg(t),nx=-u.y*F,ny=u.x*F,rf=profR(rA,rB,front,t),rb=profR(rA,rB,back,t);
    L.push(P(p.x+nx*rf,p.y+ny*rf));R.push(P(p.x-nx*rb,p.y-ny*rb));}
  ctx.beginPath();L.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
  for(let i=N;i>=0;i--)ctx.lineTo(R[i].x,R[i].y);ctx.closePath();ctx.fill();
  dot(a,(profR(rA,rB,front,0)+profR(rA,rB,back,0))/2);dot(b,(profR(rA,rB,front,1)+profR(rA,rB,back,1))/2);
  return {pt,tg};
}
function ik(S,T,l1,l2,bend){
  const dx=T.x-S.x,dy=T.y-S.y,d=clamp(Math.hypot(dx,dy),1,l1+l2-.01);
  const base=Math.atan2(dy,dx),off=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));
  return along(S,base+bend*off,l1);
}
/* draw fn twice: first a thin outline in the stage colour, then filled */
function outlined(fn,stage,w){
  const f0=ctx.fill;ctx.strokeStyle=stage;ctx.lineWidth=w||5;ctx.lineJoin='round';
  ctx.fill=function(){ctx.stroke();};fn();ctx.fill=f0;fn();
}
/* torso seen from the front, back or above: body frame x from hip (0) to shoulder (155), z sideways */
const TK=[[-24,0],[-15,26],[0,34],[33,32],[64,28],[105,38],[138,47],[157,44],[172,18],[178,13]];
const wAt=x=>{if(x<=TK[0][0])return TK[0][1];for(let i=1;i<TK.length;i++){if(x<=TK[i][0]){const[x0,w0]=TK[i-1],[x1,w1]=TK[i],u=ease((x-x0)/(x1-x0));return w0+(w1-w0)*u}}return 13};
function frontTorso(ws){
  ws=ws||1;ctx.beginPath();
  for(let x=-24;x<=178;x+=4){const w=wAt(x)*(x>150?1:ws);x>-24?ctx.lineTo(x,w):ctx.moveTo(x,w);}
  for(let x=178;x>=-24;x-=4)ctx.lineTo(x,-wAt(x)*(x>150?1:ws));
  ctx.closePath();ctx.fill();
}
function label(t,x,y,al){ctx.fillStyle=tok('--muted');ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign=al||'left';ctx.fillText(t,x,y);}
function mat(x,y,w){ctx.fillStyle=C.mat;ctx.beginPath();ctx.roundRect(x,y,w,10,5);ctx.fill();}

let mode='iso',vari=null,playing=true,slow=false,phaseT=0,last=performance.now(),C={};
function colors(){return {stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),muted:tok('--muted'),band:tok('--band'),bandfar:tok('--bandfar'),post:tok('--post')}}
function setMode(m){mode=m;phaseT=0;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));try{localStorage.setItem(KEY+'-mode',m)}catch(e){}}
function setVar(v){vari=v;phaseT=0;document.querySelectorAll('[data-var]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.var===v)));try{localStorage.setItem(KEY+'-var',v)}catch(e){}}
function boot(){
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
  document.querySelectorAll('[data-var]').forEach(b=>b.onclick=()=>setVar(b.dataset.var));
  const vs=[...document.querySelectorAll('[data-var]')].map(b=>b.dataset.var);
  setVar(DEFAULT_VAR);setMode('iso');
  try{const m=localStorage.getItem(KEY+'-mode'),v=localStorage.getItem(KEY+'-var');if(m==='iso'||m==='dyn')setMode(m);if(vs.includes(v))setVar(v);}catch(e){}
  document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
  document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
  requestAnimationFrame(frame);
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing&&!reduce)phaseT+=dt*(slow?.5:1);
  const cyc=EX.cycle(mode,vari);
  const ph=window.__ph!=null?window.__ph:(reduce?EX.rest(mode,vari):phaseT%cyc);
  const k=cv.width/VW;
  ctx.setTransform(k,0,0,k,0,0);
  C=colors();
  ctx.fillStyle=C.stage;ctx.fillRect(0,0,VW,VH);
  EX.draw(ph,mode,vari);
  requestAnimationFrame(frame);
}

const VW=640,VH=420,KEY='sideplank',DEFAULT_VAR='gestrekt';
const EL=P(150,-11);
function dip(ph){if(ph<1.1)return ease(ph/1.1);if(ph<2.2)return 1-ease((ph-1.1)/1.1);return 0}
function sweep(ph){if(ph<1.7)return ease(ph/1.7);if(ph<2.2)return 1;if(ph<3.9)return 1-ease((ph-2.2)/1.7);return 0}
const EX={
  cycle:(m,v)=>m==='dyn'?(v==='rotatie'?4.3:2.6):4,
  rest:()=>0,
  draw(ph,m,v){
    const br=Math.sin(ph/4*Math.PI*2);
    let kap=0,om=null;
    if(v==='rotatie')om=(m==='iso'?1:sweep(ph))*140+(m==='iso'?2*br:0);
    else kap=m==='iso'?.6*br:30*dip(ph);
    const B=solve(v,kap*DEG);
    const glow=m==='iso'?.8+.2*(.5+.5*br):(v==='rotatie'?.6+.4*om/140:.85-.35*kap/30);
    ctx.save();ctx.translate(328,388);ctx.scale(.84,.84);
    mat(-370,0,740);
    drawPlank(B,v,om,glow);
    ctx.restore();
    label('VOORAANZICHT',24,34);
  }
};
const Rv=(b,x,z)=>P(x*Math.cos(b)+z*Math.sin(b),-x*Math.sin(b)+z*Math.cos(b));
function supp(v){return v==='knie'?{p:P(-148,12),y:-15}:{p:P(-280,9),y:-12}}
let XF={};
function frameFor(v,g,bU,kap){
  const Sj=P(EL.x+104*Math.sin(g),EL.y-104*Math.cos(g));
  const H=sub(Sj,Rv(bU,155,42));
  const s=supp(v),Ft=add(H,Rv(bU-kap,s.p.x,s.p.y));
  return {Sj,H,Ft,bU,bL:bU-kap};
}
function solve(v,kap){
  const s=supp(v);
  if(XF[v]==null){
    let lo=0,hi=1;for(let i=0;i<50;i++){const m=(lo+hi)/2,f=frameFor(v,0,m,0);if(f.Ft.y<s.y)lo=m;else hi=m;}
    XF[v]=frameFor(v,0,(lo+hi)/2,0).Ft.x;
  }
  let g=0,b=.3;
  for(let it=0;it<12;it++){
    const f0=frameFor(v,g,b,kap),e1=f0.Ft.x-XF[v],e2=f0.Ft.y-s.y;
    if(Math.abs(e1)+Math.abs(e2)<.01)break;
    const h=1e-4,fg=frameFor(v,g+h,b,kap),fb=frameFor(v,g,b+h,kap);
    const a=(fg.Ft.x-f0.Ft.x)/h,bb=(fb.Ft.x-f0.Ft.x)/h,c=(fg.Ft.y-f0.Ft.y)/h,d=(fb.Ft.y-f0.Ft.y)/h,det=a*d-bb*c;
    g-=(d*e1-bb*e2)/det;b-=(-c*e1+a*e2)/det;
  }
  return frameFor(v,g,b,kap);
}
function inFrame(H,b,fn){ctx.save();ctx.translate(H.x,H.y);ctx.rotate(-b);fn();ctx.restore();}
function legsLocal(v,which){
  const out=[];
  for(const s of [1,-1]){
    if(which!=null&&which!==s)continue;
    let H=P(0,s*18),K=P(-148,s*12),A=P(-280,s*9);
    if(v==='been'&&s<0){const a=26*DEG,d=P(-Math.cos(a),-Math.sin(a));K=add(H,mul(d,148));A=add(K,mul(d,132));}
    limb(H,K,23,15,[[5,.45,.28]],[[5,.45,.28]]);dot(K,14.5);
    if(v==='knie'){capsule(K,14.5,P(K.x-16,K.y+s*2),12);}
    else{limb(K,A,14,8.5,[[6,.27,.18]],[[6,.27,.18]]);const fd=v==='been'&&s<0?angOf(sub(A,K)):Math.PI;ell(along(A,fd,5),6.5,9.5,fd);}
  }
}
function drawPlank(B,v,om,glow){
  F=1;
  const ws=om==null?1:1-.26*clamp((om-60)/80,0,1);
  ctx.fillStyle=C.body;
  inFrame(B.H,B.bL,()=>{legsLocal(v,1);outlined(()=>legsLocal(v,-1),C.stage,4);});
  ctx.fillStyle=C.body;

<script>
/* ===== Gedeelde helpers (zelfde maten en spierprofielen als Plank hold / Bird dog) ===== */
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));

  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();ctx.fill();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
function curveLimb(a,c,b,rA,rB,front,back){
  const N=36,prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,cc,w]of bs)r+=m*Math.exp(-(((t-cc)/w)**2));return r};
  const pt=t=>P((1-t)*(1-t)*a.x+2*(1-t)*t*c.x+t*t*b.x,(1-t)*(1-t)*a.y+2*(1-t)*t*c.y+t*t*b.y);
  const tg=t=>{const x=2*(1-t)*(c.x-a.x)+2*t*(b.x-c.x),y=2*(1-t)*(c.y-a.y)+2*t*(b.y-c.y),l=Math.hypot(x,y)||1;return P(x/l,y/l)};
  const L=[],Rr=[];
  for(let i=0;i<=N;i++){const t=i/N,p=pt(t),u=tg(t),nx=-u.y*F,ny=u.x*F,rf=prof(t,front),rb=prof(t,back);
    L.push(P(p.x+nx*rf,p.y+ny*rf));Rr.push(P(p.x-nx*rb,p.y-ny*rb));}
  ctx.beginPath();L.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
  for(let i=N;i>=0;i--)ctx.lineTo(Rr[i].x,Rr[i].y);ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
  return {pt,tg};
}
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
const P=(x,y)=>({x,y});
const ell=(c,rx,ry,a)=>{ctx.beginPath();ctx.ellipse(c.x,c.y,rx,ry,a||0,0,Math.PI*2);ctx.fill();};

function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-4,W.y-9);
  ctx.quadraticCurveTo(W.x+14,W.y-10,W.x+28,W.y-3);
  ctx.quadraticCurveTo(W.x+40,W.y+1,W.x+40,W.y+5);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+16,W.y+8);
  ctx.lineTo(W.x-6,W.y+8);
  ctx.closePath();ctx.fill();
}
/* vlakke hand gedraaid; ang 0 = vingers naar voren plat op de vloer */
function rotHand(W,ang,flip){ctx.save();ctx.translate(W.x,W.y);ctx.rotate(ang);if(flip)ctx.scale(1,-1);hand(P(0,0));ctx.restore();}
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
function edgeHand(W,T){const dx=T.x-W.x,dy=T.y-W.y,L=Math.hypot(dx,dy);if(L<1){dot(W,8);return;}const a=Math.atan2(dy,dx),h=Math.min(1,L/16);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(2+17*h,0,6+15*h,9,0,0,Math.PI*2);ctx.fill();ctx.restore();}

const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];
const L_TORSO=155,L_THIGH=148,L_SHIN=132,L_UA=104,L_FA=81;

const ease=t=>.5-.5*Math.cos(Math.PI*Math.max(0,Math.min(1,t)));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const DEG=Math.PI/180,lerp=(a,b,t)=>a+(b-a)*t;
const add=(a,b)=>P(a.x+b.x,a.y+b.y),sub=(a,b)=>P(a.x-b.x,a.y-b.y),mul=(a,k)=>P(a.x*k,a.y*k);
const len=a=>Math.hypot(a.x,a.y),nrm=a=>{const l=len(a)||1;return P(a.x/l,a.y/l)};
const dirA=a=>P(Math.cos(a),Math.sin(a));
const along=(a,b,t)=>P(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t);
/* 2D-IK: gewricht tussen A en B, aan de kant van richting pref */
function ik(A,B,l1,l2,pref){
  const d0=len(sub(B,A)),d=Math.min(Math.max(d0,Math.abs(l1-l2)+.01),l1+l2-.01);
  const u=nrm(sub(B,A)),n=P(-u.y,u.x),a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  const s=(n.x*pref.x+n.y*pref.y)>=0?1:-1;
  return P(A.x+u.x*a+n.x*h*s,A.y+u.y*a+n.y*h*s);
}
/* 3D-punten {x,y,z}: x naar voren, y omlaag (scherm), z naar rechts van de persoon (naar de camera) */
const V=(x,y,z)=>({x,y,z:z||0});
const vadd=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z),vsub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z),vmul=(a,k)=>V(a.x*k,a.y*k,a.z*k);
const vdot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,vlen=a=>Math.sqrt(vdot(a,a)),vnrm=a=>vmul(a,1/(vlen(a)||1));
const vlerp=(a,b,t)=>V(lerp(a.x,b.x,t),lerp(a.y,b.y,t),lerp(a.z,b.z,t));
function ik3(A,B,l1,l2,pref){
  const AB=vsub(B,A),d0=vlen(AB),d=Math.min(Math.max(d0,Math.abs(l1-l2)+.01),l1+l2-.01),u=vnrm(AB);
  let n=vsub(pref,vmul(u,vdot(pref,u)));if(vlen(n)<1e-6)n=V(0,-1,0);n=vnrm(n);
  const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  return vadd(vadd(A,vmul(u,a)),vmul(n,h));
}
const sideP=p=>P(p.x,p.y),topP=p=>P(p.x,p.z);

/* ===== Onderdelen van het zijaanzicht (figuur kijkt naar rechts) ===== */
function torso(S,H){limb(S,H,27,24,T_FRONT,T_BACK);}
function bil(S,H){const u=nrm(sub(H,S)),a=Math.atan2(u.y,u.x);ell(P(H.x-u.y*15-u.x*2,H.y+u.x*15-u.y*2),31,23,a);}
function bilSeated(S,H){const u=nrm(sub(H,S)),a=Math.atan2(u.y,u.x);ell(P(H.x-u.y*9+u.x*3,H.y+u.x*9+u.y*3),27,22,a+.25);}
function head(S,hd){
  capsule(P(S.x+hd.x*14,S.y+hd.y*14),12,P(S.x+hd.x*30,S.y+hd.y*30),11);
  ell(P(S.x+hd.x*56,S.y+hd.y*56),29,25,Math.atan2(hd.y,hd.x));
}
function leg(H,K,A,footFn){limb(H,K,24,15,THIGH_F,THIGH_B);dot(K,14.5);limb(K,A,14.5,9,SHIN_F,SHIN_B);if(footFn)footFn(A,K);}
function arm(Sj,E,W,handFn){limb(Sj,E,16,11,UA_F,UA_B);dot(E,11);limb(E,W,11.5,6.5,FA_F,FA_B);if(handFn)handFn(W,E);dot(P(Sj.x+2,Sj.y-2),21);}
/* voeten */
const footStand=(A,rise)=>{rise=rise||0;const T=P(A.x+32,A.y+7),hl=P(A.x-6,A.y+3);
  if(!rise){capsule(hl,9,T,6);return;}const a=-rise,c=Math.cos(a),s=Math.sin(a),rot=p=>P(T.x+(p.x-T.x)*c-(p.y-T.y)*s,T.y+(p.x-T.x)*s+(p.y-T.y)*c);capsule(rot(hl),9,T,6);};
const footFlatBack=A=>capsule(A,9,P(A.x-34,A.y+6),6);
const footTucked=A=>{capsule(P(A.x-6,A.y+2),9,P(A.x+12,A.y+15),6);capsule(P(A.x+12,A.y+15),6,P(A.x+22,A.y+16),4);};
const footDir=(A,ang)=>{const d=dirA(ang);capsule(P(A.x-d.x*4,A.y-d.y*4),9,P(A.x+d.x*34,A.y+d.y*34),6);};

const hFlat=W=>hand(W);
const hAlong=(W,E)=>rotHand(W,Math.atan2(W.y-E.y,W.x-E.x));
/* nabije arm met dun randje in de achtergrondkleur */
function outlined(fn,c,col){const f0=ctx.fill;ctx.strokeStyle=c.stage;ctx.lineWidth=5;ctx.lineJoin='round';ctx.fill=function(){ctx.stroke();};fn();ctx.fill=f0;ctx.fillStyle=col||c.body;fn();}
function glow(alpha,fn){ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,alpha));ctx.fillStyle=COL.mus;fn();ctx.restore();}
/* spier langs een segment, naar de voorkant (+1) of achterkant (-1) */
function muscleOn(a,b,t0,t1,off,r0,r1){const u=nrm(sub(b,a)),n=P(u.y,-u.x);const p0=add(along(a,b,t0),mul(n,off)),p1=add(along(a,b,t1),mul(n,off));capsule(p0,r0,p1,r1);}

let COL={};

/* ===== Extra helpers voor groep 6 ===== */
const hBack=W=>rotHand(W,Math.PI,true);           /* vlakke hand op de vloer, vingers naar achteren */
const rotV=(v,a)=>P(v.x*Math.cos(a)-v.y*Math.sin(a),v.x*Math.sin(a)+v.y*Math.cos(a));
/* staande voet; fa = hiel omhoog (rad), de bal blijft op de grond */
function footRise(A,fa){
  fa=fa||0;const r=v=>add(A,rotV(v,fa));
  const ball=r(P(27,6));capsule(r(P(-6,3)),9,ball,6.5);
  const toe=fa<.05?r(P(37,6.5)):P(ball.x+10,ball.y+.3);capsule(ball,6.5,toe,5);
}
const ankleOnBall=(ball,fa)=>add(ball,rotV(P(-27,-6),fa||0));
const FLAT_ANK=-13;                 /* hoogte van de enkel bij een platte voet */
/* arm met hoeken: a = schouderhoek vanaf recht omlaag (+ naar voren), b = elleboog (+ buigt naar voren) */
const dirD=a=>P(Math.sin(a),Math.cos(a));
function armFK(S,a,b){const E=add(S,mul(dirD(a),L_UA)),W=add(E,mul(dirD(a+(b||0)),L_FA));return {E,W};}
function legFK(H,a,b){const K=add(H,mul(dirD(a),L_THIGH)),A=add(K,mul(dirD(a-(b||0)),L_SHIN));return {K,A};}
/* tijdelijke laag met doorzichtigheid (voor in- en uitfaden zonder overlap te zien) */
const OFF=document.createElement('canvas');
function layer(alpha,fn){
  if(alpha>=.999){fn();return;}if(alpha<=.001)return;
  OFF.width=cv.width;OFF.height=cv.height;const o=OFF.getContext('2d');o.setTransform(ctx.getTransform());
  const m=ctx;ctx=o;try{fn();}finally{ctx=m;}
  m.save();m.setTransform(1,0,0,1,0,0);m.globalAlpha=alpha;m.drawImage(OFF,0,0);m.restore();
}
/* hoofdrichting: rompas (heup naar schouder) gedraaid met tilt (+ = kin naar de borst) */
function headDir(S,H,tilt){const u=nrm(sub(S,H)),n=P(-u.y,u.x),t=tilt||0;return P(u.x*Math.cos(t)+n.x*Math.sin(t),u.y*Math.cos(t)+n.y*Math.sin(t));}
/*
 Algemeen zijaanzicht, figuur kijkt naar rechts (+x), grond y=0.
 q: {H,S,C?(controlepunt ronde rug),tilt|hd,seat,
     legs:[ver,nabij] {H?,K,A,foot(A,K)}, arms:[ver,nabij] {Sj?,E,W,hand(W,E)}}
 hk: haken mus (spieren na het nabije been), far (na de verre ledematen), after
*/
function figSide(q,c,hk){
  hk=hk||{};F=-1;
  const fo=q.farOff||P(-11,-3),ao=q.farArmOff||P(-12,-4);
  const hd=q.hd||headDir(q.S,q.H,q.tilt);
  const L=(l,o)=>{ctx.save();ctx.translate(o.x,o.y);leg(l.H||q.H,l.K,l.A,l.foot);ctx.restore();};
  const A=(a,o)=>{ctx.save();ctx.translate(o.x,o.y);arm(a.Sj||q.S,a.E,a.W,a.hand);ctx.restore();};
  ctx.fillStyle=c.far;
  if(q.arms&&q.arms[0])A(q.arms[0],ao);
  if(q.legs&&q.legs[0])L(q.legs[0],fo);
  if(hk.far){ctx.save();hk.far();ctx.restore();}
  ctx.fillStyle=c.body;
  if(q.C)curveLimb(q.S,q.C,q.H,27,24,T_FRONT,T_BACK);else torso(q.S,q.H);
  (q.seat?bilSeated:bil)(q.C||q.S,q.H);
  if(q.legs&&q.legs[1]){if(q.legOutline)outlined(()=>L(q.legs[1],P(0,0)),c);else L(q.legs[1],P(0,0));}
  if(hk.mus){ctx.save();hk.mus();ctx.restore();}
  ctx.fillStyle=c.body;
  if(!q.noHead)head(q.S,hd);
  if(hk.beforeArm){ctx.save();hk.beforeArm();ctx.restore();ctx.fillStyle=c.body;}
  if(q.arms&&q.arms[1]){if(q.armPlain)A(q.arms[1],P(0,0));else outlined(()=>A(q.arms[1],P(0,0)),c);}
  if(hk.after){ctx.save();hk.after();ctx.restore();}
}
/* oplossen: rompkanteling zodat de schouder op afstand d van punt W ligt (bisectie) */
function leanFor(H,W,d,lo,hi){
  const f=l=>len(sub(add(H,P(L_TORSO*Math.sin(l),-L_TORSO*Math.cos(l))),W))-d;
  let a=lo,b=hi;for(let i=0;i<40;i++){const m=(a+b)/2;(f(a)*f(m)<=0)?b=m:a=m;}return (a+b)/2;
}
const shoulderAt=(H,lean)=>add(H,P(L_TORSO*Math.sin(lean),-L_TORSO*Math.cos(lean)));
const trem=t=>.5+.5*Math.sin(t*Math.PI*2*5.3)*Math.sin(t*Math.PI*2*.9+1);
const lerpP=(a,b,t)=>P(lerp(a.x,b.x,t),lerp(a.y,b.y,t));

/* hand plat op de vloer van bovenaf (handpalm naar beneden): palm + vingers ca. 22 voorbij de pols, duim aan de binnenkant.
   W = pols, d = richting van de onderarm (eenheid), inner = punt aan de lichaamskant */
function topHand(W,d,inner){
  const a=Math.atan2(d.y,d.x),ly=P(-d.y,d.x),s=((inner.x-W.x)*ly.x+(inner.y-W.y)*ly.y)>=0?1:-1;
  ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);
  ctx.beginPath();ctx.roundRect(-3,-8.5,25,17,[5,8,8,5]);ctx.fill();
  ctx.beginPath();ctx.ellipse(5,s*9.5,7.5,4.2,s*.55,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

/* vlakke hand plat op de vloer (zelfde vorm als Scapular push-up / Cat-cow): handpalm onder op W.y+8,
   dikke handrug bij de pols, dunne vingers naar +x, ca. 33 voorbij de pols */
function handSlim(W){
  ctx.beginPath();
  ctx.moveTo(W.x-6,W.y+8);ctx.lineTo(W.x+29,W.y+8);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+33.5,W.y+5);ctx.quadraticCurveTo(W.x+32,W.y+2,W.x+26,W.y+2);
  ctx.lineTo(W.x+18,W.y+1.5);ctx.quadraticCurveTo(W.x+15,W.y-1.5,W.x+10,W.y-1);
  ctx.quadraticCurveTo(W.x+3,W.y-3,W.x-1,W.y-4);ctx.quadraticCurveTo(W.x-9,W.y-4,W.x-9,W.y+3);
  ctx.quadraticCurveTo(W.x-9,W.y+8,W.x-6,W.y+8);ctx.closePath();ctx.fill();
}
/* voet op de tenen: bal van de voet onder de enkel, hiel omhoog, tenen plat naar voren (+x).
   u = richting knie -> enkel; ground = hoogte van de vloer (weglaten bij een opgetild been) */
function toeFoot(A,u,ground){
  const p=P(-u.y,u.x).y>0?P(-u.y,u.x):P(u.y,-u.x);
  let L=24;if(ground!=null)L=clamp((ground-6.5-A.y)/p.y,16,30);
  const B=P(A.x+p.x*L,A.y+p.y*L),heel=P(A.x-p.x*5+u.x*3,A.y-p.y*5+u.y*3);
  capsule(heel,8.5,B,6.5);capsule(B,6.5,P(B.x+14,B.y+(ground!=null?2.5:0)),4);
}

/* ===== Bear crawl: handen plat en voeten op de tenen, knieën 3 cm boven de grond ===== */
/* hand volgens de skill: hand(W) uit Plank hold (handSlim, handpalm op W.y+8), vingers naar voren.
   Steunend plat op de vloer; een hand die loskomt draait geleidelijk mee met de onderarm (zoals Plank hold) */
const handTurn=(W,E)=>{
  const r=1-clamp((W.y+70)/40,0,1),aa=Math.atan2(W.y-E.y,W.x-E.x);
  ctx.save();ctx.translate(W.x,W.y);ctx.rotate(aa*r);handSlim(P(0,0));ctx.restore();};
const footRot=(A,d)=>{ctx.save();ctx.translate(A.x,A.y);ctx.rotate(d);footTucked(P(0,0));ctx.restore();};
const B_H=V(0,-172),B_S=V(154,-193),B_W=162,B_HOVER=-24,B_ANK=V(-130,-34);

function bearBase(dx,b){
  /* dx: lichaam naar voren (kruipen), b: ademhaling / trillen */
  const H=V(B_H.x+dx,B_H.y+b*1.4),S=V(B_S.x+dx,B_S.y+b*.6);
  return {H,S};
}
function bearModel(o){
  /* o: {dx, b, hands:[{x,lift}],feet:[{x,lift}], tap:[0..1], ext:[arm,leg] per kant} */
  const {H,S}=bearBase(o.dx,o.b),m={H,S,sh:[],el:[],wr:[],hip:[],kn:[],an:[],toe:[],fa:[]};
  for(let k=0;k<2;k++){
    const z=k?1:-1;
    const sh=V(S.x,S.y,z*42),hip=V(H.x,H.y,z*19);
    /* arm: steunen, tikken of strekken */
    const floorW=V(o.hands[k].x,-8-o.hands[k].lift,z*40);
    const tapW=V(S.x+12,S.y+12,-z*30);
    const extW=V(S.x+185*Math.cos(-6*DEG),S.y+185*Math.sin(-6*DEG),z*40);
    let W=vlerp(floorW,tapW,o.tap[k]);
    if(o.tap[k]>0&&o.tap[k]<1)W.y-=26*Math.sin(Math.PI*o.tap[k]);
    W=vlerp(W,extW,o.ext[k]);
    if(o.ext[k]>0&&o.ext[k]<1)W.y-=10*Math.sin(Math.PI*o.ext[k]);
    const pref=o.tap[k]>.02?V(-.7,.6,z*.8):V(-1,.1,0);
    const E=ik3(sh,W,104,81,pref);
    /* been: zweven of naar achteren strekken */
    const e=o.ext[1-k];
    const floorA=V(o.feet[k].x,B_ANK.y-o.feet[k].lift,z*23);
    const dirL=V(-Math.cos(4*DEG),Math.sin(4*DEG),0);
    const extA=vadd(hip,vmul(dirL,280));
    let A=vlerp(floorA,extA,ease(e));
    if(e>0&&e<1)A.y-=20*Math.sin(Math.PI*e);
    const K=ik3(hip,A,148,132,V(1,1.2,0));
    m.sh.push(sh);m.el.push(E);m.wr.push(W);m.hip.push(hip);m.kn.push(K);m.an.push(A);m.fa.push(e);
  }
  m.tap=o.tap;m.ext=o.ext;m.g=o.g;m.gObl=o.gObl||0;
  return m;
}
function crawl(t){
  /* 8 stappen van .6 s (4 vooruit, 4 achteruit), paar A = rechterhand + linkervoet */
  const L=34,st=.6,k=Math.min(7,Math.floor(t/st)),u=(t-k*st)/st;
  const off=[0,0],lift=[0,0];
  for(let i=0;i<=k;i++){const p=i%2,sgn=i<4?1:-1,amt=i<k?1:ease(u);off[p]+=sgn*L*amt;if(i===k)lift[p]=Math.sin(Math.PI*clamp(u,0,1));}
  return {off,lift};
}
const EX={
  key:'bear-plank',VW:640,VH:420,
  period:(m,v)=>m==='iso'?4:(v===0?5.4:v===1?3.2:5),
  still:(m,v)=>m==='iso'?1:(v===0?0:v===1?.75:1.6),
  state(m,v,t){
    const b=0;
    const o={dx:0,b,hands:[{x:B_S.x+8,lift:0},{x:B_S.x+8,lift:0}],feet:[{x:B_ANK.x,lift:0},{x:B_ANK.x,lift:0}],tap:[0,0],ext:[0,0],g:.9};
    if(m==='dyn'&&v===0){
      const c=crawl(Math.min(t,4.8)),A=c.off[0],B=c.off[1],la=c.lift[0]*16,lb=c.lift[1]*16;
      o.dx=(A+B)/2-34;
      o.hands=[{x:B_S.x+8+B-34,lift:lb},{x:B_S.x+8+A-34,lift:la}];
      o.feet=[{x:B_ANK.x+A-34,lift:la*.8},{x:B_ANK.x+B-34,lift:lb*.8}];
      o.g=.85;
    }
    if(v===1){
      if(m==='iso'){o.tap=[0,1];o.gObl=1;}
      else{
        const one=u=>u<.5?ease(u/.5):u<.8?1:u<1.3?1-ease((u-.8)/.5):0;
        o.tap=t<1.6?[0,one(t)]:[one(t-1.6),0];o.gObl=Math.max(o.tap[0],o.tap[1]);
      }
    }
    if(v===2){
      if(m==='iso'){o.ext=[0,1];}
      else{
        const one=u=>u<1?ease(u):u<1.5?1:u<2.5?1-ease(u-1.5):0;
        o.ext=t<2.5?[0,one(t)]:[one(t-2.5),0];
      }
      o.g=.6+.4*Math.max(o.ext[0],o.ext[1]);
    }
    const r=bearModel(o);r.v=v;return r;
  },
  draw(m,c){
    if(m.v===0){
      ctx.save();ctx.translate(300,345);ctx.scale(1.15,1.15);mat(-230,0,440);bearSide(m,c);ctx.restore();
      label('ZIJAANZICHT',20,400);return;
    }
    if(m.v===1){
      ctx.save();ctx.translate(232,330);ctx.scale(.9,.9);mat(-235,0,420);bearSide(m,c);ctx.restore();
      const side=m.tap[1]>0?0:1,k=Math.max(m.tap[0],m.tap[1]);
      ctx.save();ctx.translate(528,330);ctx.scale(.86,.86);bearFront(c,side,k,m.g);ctx.restore();
      label('ZIJAANZICHT',20,400);label('VOORAANZICHT',528,400,'center');
    }else{
      ctx.save();ctx.translate(310,255);ctx.scale(.8,.8);mat(-360,0,700);bearSide(m,c);ctx.restore();
      ctx.save();ctx.translate(320,350);ctx.scale(.52,.52);bearTop(m,c);ctx.restore();
      label('ZIJAANZICHT',20,290);label('BOVENAANZICHT',20,330);
    }
  }
};
/* vooraanzicht (zoals bij Plank hold): de tikkende hand gaat naar de andere schouder */
function bearFront(c,side,k,g){
  ctx.fillStyle=c.mat;ctx.beginPath();ctx.roundRect(-130,0,260,10,5);ctx.fill();
  ctx.fillStyle=c.body;
  ctx.beginPath();ctx.roundRect(-50,-222,100,56,24);ctx.fill();
  glow(g*.9,()=>{ell(P(0,-180),24,9);});
  const arms=[];
  for(const s of [-1,1]){
    const Sh=P(s*46,-200),W0=P(s*46,-14);
    const tapping=(s>0?0:1)===side&&k>0;
    let W=W0;
    if(tapping){const tg=P(-s*30,-196);W=P(lerp(W0.x,tg.x,k)+s*Math.sin(Math.PI*k)*34,lerp(W0.y,tg.y,k));}
    const E=ik(Sh,W,104,81,P(s,.3));
    arms.push({Sh,E,W,W0,tapping});
  }
  ctx.fillStyle=c.body;
  const drawA=a=>{
    limb(a.Sh,a.E,16,11,[[4,.5,.22]],[[4,.5,.22]]);dot(a.E,11);
    limb(a.E,a.W,11.5,6.5,[[3,.22,.2]],[[3,.22,.2]]);
    if(len(sub(a.W,a.W0))>3){const d=nrm(sub(a.W,a.E));edgeHand(a.W,add(a.W,mul(d,18)));}
    else ell(P(a.W.x,a.W.y+5),14,7);
  };
  for(const a of arms){if(!a.tapping){drawA(a);dot(a.Sh,21);}}
  for(const a of arms)if(a.tapping)dot(a.Sh,21);
  ell(P(0,-200),24,27);
  for(const a of arms)if(a.tapping)outlined(()=>drawA(a),c);
}
function bearSide(m,c){
  F=-1;
  const S=sideP(m.S),H=sideP(m.H);
  const drawArm=k=>arm(sideP(m.sh[k]),sideP(m.el[k]),sideP(m.wr[k]),handTurn);
  const drawLeg=k=>{const A=sideP(m.an[k]),K=sideP(m.kn[k]),onFloor=m.an[k].y>B_ANK.y-3;
    leg(sideP(m.hip[k]),K,A,a=>{if(m.fa[k]>.3)footRot(a,m.fa[k]*48*DEG);else toeFoot(a,nrm(sub(a,K)),onFloor?0:null);});};
  const farShift=fn=>{ctx.save();ctx.translate(-12,-3);fn();ctx.restore();};
  ctx.fillStyle=c.far;farShift(()=>{drawLeg(0);drawArm(0);});
  ctx.fillStyle=c.body;
  torso(S,H);bil(S,H);
  drawLeg(1);
  const hd=nrm(sub(S,H)),ca=Math.cos(10*DEG),sa=Math.sin(10*DEG);
  head(S,P(hd.x*ca-hd.y*sa,hd.x*sa+hd.y*ca));
  /* spieren: buik (primair), quadriceps (primair), schouder (secundair) */
  glow(m.g,()=>{muscleOn(S,H,.3,.78,19,11,10);});
  glow(m.g,()=>{const hp=sideP(m.hip[1]),kn=sideP(m.kn[1]);muscleOn(hp,kn,.18,.82,11,11,8);});
  if(m.gObl>0)glow(m.gObl*.55,()=>{muscleOn(S,H,.4,.75,8,9,9);});
  const ue=m.ext[0]+m.ext[1];
  if(ue>0)glow(.55*ue,()=>{const hp=sideP(m.hip[1]);ell(P(hp.x-6,hp.y-17),20,14,Math.atan2(H.y-S.y,H.x-S.x));});
  glow(m.g*.55,()=>{ell(P(S.x+6,S.y+8),13,18,-.3);});
  outlined(()=>drawArm(1),c);
}
function bearTop(m,c){
  F=1;
  ctx.fillStyle=c.body;
  const T=p=>topP(p);
  for(let k=0;k<2;k++){
    const h=T(m.hip[k]),kn=T(m.kn[k]),an=T(m.an[k]),A3=m.an[k];
    if(len(sub(kn,h))>4)limb(h,kn,23,15,[[5,.45,.28]],[[5,.45,.28]]);dot(kn,14);
    if(len(sub(an,kn))>4)limb(kn,an,14,8.5,[[6,.27,.18]],[[6,.27,.18]]);
    const e=m.fa[k],toe=P(an.x+lerp(22,-28,e),an.y+(k?1:-1)*1);
    capsule(an,9,toe,8);
  }
  for(let k=0;k<2;k++)if(m.tap[k]<.02)topArm(m,k);
  const keys=[[-24,0],[-15,26],[0,34],[33,32],[64,28],[105,38],[138,47],[157,44],[172,18],[178,13]];
  const wAt=x=>{for(let i=1;i<keys.length;i++){if(x<=keys[i][0]){const[x0,w0]=keys[i-1],[x1,w1]=keys[i],u=ease((x-x0)/(x1-x0));return w0+(w1-w0)*u}}return 13};
  const k=(m.S.x-m.H.x)/155,ox=m.H.x;
  ctx.beginPath();
  for(let x=-24;x<=178;x+=4){const p=P(ox+x*k,wAt(x));x>-24?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);}
  for(let x=178;x>=-24;x-=4)ctx.lineTo(ox+x*k,-wAt(x));
  ctx.closePath();ctx.fill();
  for(const z of [-1,1])dot(P(m.S.x,z*42),17);
  glow(m.gObl*.55,()=>{for(const z of [-1,1])capsule(P(m.H.x+40,z*30),9,P(m.H.x+95,z*33),9);});
  const ue=Math.max(m.ext[0],m.ext[1]);
  if(ue>0)glow(.55*ue,()=>{for(const z of [-1,1])ell(P(m.H.x-6,z*16),18,15);});
  ctx.fillStyle=c.body;
  for(let k=0;k<2;k++)if(m.tap[k]>=.02)topArm(m,k);
  ell(P(m.S.x+42,0),24,21);
}
function topArm(m,k){
  const s=topP(m.sh[k]),el=topP(m.el[k]),w=topP(m.wr[k]);
  if(len(sub(el,s))>4)limb(s,el,15,11,[[3,.5,.22]],[[3,.5,.22]]);dot(el,11);
  if(len(sub(w,el))>4)limb(el,w,11,6.5,[[3,.22,.2]],[[3,.22,.2]]);
  /* hand: plat op de vloer naar voren, anders in de richting van de onderarm */
  const fl=m.wr[k].y>-14;
  if(fl){topHand(w,P(1,0),P(w.x,0));return;}
  const d=nrm(sub(w,el)),hl=Math.max(.35,len(sub(w,el))/81);
  edgeHand(w,P(w.x+d.x*16*hl,w.y+d.y*16*hl));
}

/* ===== Afspelen, modus- en variatieknoppen ===== */
let mode='iso',vari=0,playing=true,slow=false,phaseT=0,last=performance.now();
let shown=null,blendFrom=null,blendT=1;
function lerpObj(a,b,k){
  if(typeof b==='number')return typeof a==='number'?a+(b-a)*k:b;
  if(Array.isArray(b))return b.map((v,i)=>lerpObj(a&&a[i],v,k));
  if(b&&typeof b==='object'){const o={};for(const key in b)o[key]=lerpObj(a?a[key]:undefined,b[key],k);return o;}
  return b;
}
function render(s){
  const k=cv.width/EX.VW;
  ctx.setTransform(k,0,0,k,0,0);
  COL={stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),muted:tok('--muted'),band:tok('--band'),post:tok('--post')};
  ctx.fillStyle=COL.stage;ctx.fillRect(0,0,EX.VW,EX.VH);
  EX.draw(s,COL);
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!window.__freeze){
    if(playing&&!reduce)phaseT+=dt*(slow?.5:1);
    const per=EX.period(mode,vari);if(phaseT>=per)phaseT%=per;
    const target=EX.state(mode,vari,reduce?EX.still(mode,vari):phaseT);
    if(blendT<1&&blendFrom){blendT=Math.min(1,blendT+dt/.6);shown=lerpObj(blendFrom,target,ease(blendT));}else shown=target;
    render(shown);
  }
  requestAnimationFrame(frame);
}
function sync(){
  document.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===mode)));
  document.querySelectorAll('.var').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===vari)));
  try{localStorage.setItem(EX.key,mode+'-'+vari)}catch(e){}
}
function choose(m,v){if(m===mode&&v===vari)return;blendFrom=shown;blendT=0;mode=m;vari=v;phaseT=0;sync();}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>choose(b.dataset.m,vari));
document.querySelectorAll('.var').forEach(b=>b.onclick=()=>choose(mode,+b.dataset.v));
document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
(function init(){
  if(EX.modes){if(!EX.modes.includes(mode))mode=EX.modes[0];
    document.querySelectorAll('.mode').forEach(b=>{if(!EX.modes.includes(b.dataset.m))b.hidden=true;});}
  let s=null;try{s=localStorage.getItem(EX.key)}catch(e){}
  const h=location.hash.match(/^#(iso|dyn)-(\d)$/);if(h)s=h[1]+'-'+h[2];
  if(s){const[m,v]=s.split('-');if((m==='iso'||m==='dyn')&&(!EX.modes||EX.modes.includes(m))&&document.querySelector('.var[data-v="'+v+'"]')){mode=m;vari=+v;}}
  sync();
})();
/* testhaak: één moment tekenen */
window.__render=(m,v,ph)=>{window.__freeze=true;mode=m;vari=v;render(EX.state(m,v,ph));};
requestAnimationFrame(frame);

<\/script>
