<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();ctx.fill();
}
let F=1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
/* gebogen ledemaat/romp langs een kwadratische curve a-c-b, zelfde profielen als limb */
function curveLimb(a,c,b,rA,rB,front,back){
  const N=36,prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,cc,w]of bs)r+=m*Math.exp(-(((t-cc)/w)**2));return r};

/* voet in zijaanzicht: ca. 40 lang (enkel r9, teen r6) */
function footSide(A,ang){capsule(A,9,P(A.x+Math.cos(ang)*25,A.y+Math.sin(ang)*25),6);}
const ell=(c,rx,ry,rot)=>{ctx.beginPath();ctx.ellipse(c.x,c.y,rx,ry,rot||0,0,Math.PI*2);ctx.fill();};
const P=(x,y)=>({x,y});
const add=(a,b)=>P(a.x+b.x,a.y+b.y),sub=(a,b)=>P(a.x-b.x,a.y-b.y),mul=(a,k)=>P(a.x*k,a.y*k);

const along=(a,ang,len)=>P(a.x+Math.cos(ang)*len,a.y+Math.sin(ang)*len);
const ease=t=>.5-.5*Math.cos(Math.PI*Math.max(0,Math.min(1,t)));
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),DEG=Math.PI/180;
const lerpP=(a,b,t)=>P(lerp(a.x,b.x,t),lerp(a.y,b.y,t));

/* shared body standard: torso 155, thigh 148, shin 132, upper arm 104, forearm 81 */
const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];
const profR=(rA,rB,bs,t)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};

/* flat hand, fingers along +x, back of the hand on the -y side */
function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-4,W.y-9);
  ctx.quadraticCurveTo(W.x+14,W.y-10,W.x+28,W.y-3);
  ctx.quadraticCurveTo(W.x+40,W.y+1,W.x+40,W.y+5);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+16,W.y+8);

}
function handAt(W,ang,flip){ctx.save();ctx.translate(W.x,W.y);ctx.rotate(ang);if(flip)ctx.scale(1,-1);hand(P(0,0));ctx.restore();}
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
const fistC=(W,E)=>{const d=sub(W,E),l=Math.hypot(d.x,d.y)||1;return P(W.x+d.x/l*9,W.y+d.y/l*9)};

/* flat hand seen from the palm or the back (top / front views): wrist 13 wide, hand 18 wide, ca. 37 beyond the wrist, with thumb.

function palmHand(W,ang,k,th){
  const kk=Math.max(.38,k==null?1:k),t=th||1;

  ctx.beginPath();
  ctx.moveTo(-3,-6.2);ctx.quadraticCurveTo(5,-9.2,14,-8.8);ctx.lineTo(28,-7.4);
  ctx.quadraticCurveTo(37,-6.4,37,0);ctx.quadraticCurveTo(37,6.4,28,7.4);
  ctx.lineTo(14,8.8);ctx.quadraticCurveTo(5,9.2,-3,6.2);ctx.closePath();ctx.fill();
  capsule(P(7,t*6),4.3,P(15.5,t*11.5),3.4);
  ctx.restore();
}
/* side-view flat hand that follows the forearm (skill: same flat hand turning with the forearm) */
function sideHand(W,E,flip){handAt(W,Math.atan2(W.y-E.y,W.x-E.x),flip);}
/* foot in side view, ca. 40 long; ang = direction heel->toes */
function footSide(A,ang,sole){const m=along(A,ang,18),t=along(A,ang,27);capsule(A,9,m,7);capsule(m,7,t,4.5);if(sole)dot(add(along(A,ang,-2),mul(dirA(ang+sole*Math.PI/2),4.5)),8.5);}
/* flat foot on the floor in side view, sole on the floor; dir = +1 toes right, -1 toes left */
function footFlat(A,dir){capsule(P(A.x-dir*3,A.y+1),9,P(A.x+dir*23,A.y+5),5.5);}
/* foot seen from above: narrower ankle, wider toes; k = foreshortening */
function footTop(A,ang,k){capsule(A,6,along(A,ang,3+23*k),9.5);}
/* foot seen from the front (standing): 19 wide, low */
function footFront(A,s){ell(P(A.x,A.y),10,7);ell(P(A.x+s*2,A.y+3),10.5,5);}
function curveLimb(a,c,b,rA,rB,front,back){
  const N=36,pt=t=>P((1-t)*(1-t)*a.x+2*(1-t)*t*c.x+t*t*b.x,(1-t)*(1-t)*a.y+2*(1-t)*t*c.y+t*t*b.y);
  const tg=t=>{const x=2*(1-t)*(c.x-a.x)+2*t*(b.x-c.x),y=2*(1-t)*(c.y-a.y)+2*t*(b.y-c.y),l=Math.hypot(x,y)||1;return P(x/l,y/l)};
  const L=[],R=[];
  for(let i=0;i<=N;i++){const t=i/N,p=pt(t),u=tg(t),nx=-u.y*F,ny=u.x*F,rf=profR(rA,rB,front,t),rb=profR(rA,rB,back,t);
    L.push(P(p.x+nx*rf,p.y+ny*rf));R.push(P(p.x-nx*rb,p.y-ny*rb));}
  ctx.beginPath();L.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
  for(let i=N;i>=0;i--)ctx.lineTo(R[i].x,R[i].y);ctx.closePath();ctx.fill();
  dot(a,(profR(rA,rB,front,0)+profR(rA,rB,back,0))/2);dot(b,(profR(rA,rB,front,1)+profR(rA,rB,back,1))/2);

}
function ik(S,T,l1,l2,bend){
  const dx=T.x-S.x,dy=T.y-S.y,d=clamp(Math.hypot(dx,dy),1,l1+l2-.01);

/* draw fn twice: first a thin outline in the stage colour, then filled */
function outlined(fn,stage,w){
  const f0=ctx.fill;ctx.strokeStyle=stage;ctx.lineWidth=w||5;ctx.lineJoin='round';
  ctx.fill=function(){ctx.stroke();};fn();ctx.fill=f0;fn();
}
/* torso seen from the front, back or above: body frame x from hip (0) to shoulder (155), z sideways */
const TK=[[-24,0],[-15,26],[0,34],[33,32],[64,28],[105,38],[138,47],[157,44],[172,18],[178,13]];

function frontTorso(ws){
  ws=ws||1;ctx.beginPath();
  for(let x=-24;x<=178;x+=4){const w=wAt(x)*(x>150?1:ws);x>-24?ctx.lineTo(x,w):ctx.moveTo(x,w);}
  for(let x=178;x>=-24;x-=4)ctx.lineTo(x,-wAt(x)*(x>150?1:ws));

function label(t,x,y,al){ctx.fillStyle=tok('--muted');ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign=al||'left';ctx.fillText(t,x,y);}
function mat(x,y,w){ctx.fillStyle=C.mat;ctx.beginPath();ctx.roundRect(x,y,w,10,5);ctx.fill();}

let mode='iso',vari=null,playing=true,slow=false,phaseT=0,last=performance.now(),C={};

function boot(){
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
  document.querySelectorAll('[data-var]').forEach(b=>b.onclick=()=>setVar(b.dataset.var));

  try{const m=localStorage.getItem(KEY+'-mode'),v=localStorage.getItem(KEY+'-var');if(m==='iso'||m==='dyn')setMode(m);if(vs.includes(v))setVar(v);}catch(e){}

function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing&&!reduce)phaseT+=dt*(slow?.5:1);
  const cyc=EX.cycle(mode,vari);
  const ph=window.__ph!=null?window.__ph:(reduce?EX.rest(mode,vari):phaseT%cyc);
  const k=cv.width/VW;
  ctx.setTransform(k,0,0,k,0,0);

  ctx.fillStyle=C.stage;ctx.fillRect(0,0,VW,VH);

const VW=640,VH=420,KEY='deadbug',DEFAULT_VAR='kruis';
const POSTX=346;
function one(u){return u<1?ease(u):u<1.7?1:u<2.7?1-ease(u-1.7):0}
const EX={
  cycle:(m,v)=>m==='dyn'?6:4,
  rest:()=>1.3,
  draw(ph,m,v){
    let aN=0,aF=0,lN=0,lF=0;
    if(m==='iso'){const b=.97+.03*Math.sin(ph/4*Math.PI*2);if(v==='kruis'){aN=b;lF=b;}else lN=b;}
    else{const p1=ph<3?one(ph):0,p2=ph>=3?one(ph-3):0;if(v==='kruis'){aN=p1;lF=p1;aF=p2;lN=p2;}else{lN=p1;lF=p2;}}

    if(band){aN=aF=0;}

    const g=Math.max(aN,aF,lN,lF),glow=m==='iso'?.85+.15*Math.sin(ph*Math.PI):.35+.65*g;
    ctx.save();ctx.translate(250,262);ctx.scale(.74,.74);
    mat(-330,0,700);
    if(band){ctx.fillStyle=C.post;ctx.beginPath();ctx.roundRect(POSTX,-250,16,250,4);ctx.fill();}
    side(M,glow,band);
    ctx.restore();
    ctx.save();ctx.translate(250,368);ctx.scale(.62,.62);topView(M,glow,band);ctx.restore();

  }
};
function model(aN,aF,lN,lF){
  const M={arm:[],leg:[]};
  [[-1,aF],[1,aN]].forEach(([s,e])=>{
    const a=lerp(90,8,e)*DEG,S={x:155,z:s*42,h:32};
    const p=(l,z)=>({x:S.x+Math.cos(a)*l,z:s*z,h:S.h+Math.sin(a)*l});
    M.arm.push({S,E:p(104,43),W:p(185,44),Hd:p(203,44),a});
  });
  [[-1,lF],[1,lN]].forEach(([s,e])=>{
    const th=lerp(90,175,e)*DEG,ps=lerp(180,177,e)*DEG,H={x:0,z:s*18,h:30};
    const K={x:H.x+148*Math.cos(th),z:s*21,h:H.h+148*Math.sin(th)};
    const A={x:K.x+132*Math.cos(ps),z:s*23,h:K.h+132*Math.sin(ps)};
    const fa=ps-lerp(70,4,e)*DEG,T={x:A.x+27*Math.cos(fa),z:s*23,h:A.h+27*Math.sin(fa)};

const sp=(p,dx,dy)=>P(p.x+(dx||0),-p.h+(dy||0));
function sLeg(L,dx,dy){
  const H=sp(L.H,dx,dy),K=sp(L.K,dx,dy),A=sp(L.A,dx,dy);
  limb(H,K,24,15,THIGH_F,THIGH_B);dot(K,14.5);

}
function sArm(Ar,dx,dy,band){
  const S=sp(Ar.S,dx,dy),E=sp(Ar.E,dx,dy),W=sp(Ar.W,dx,dy);
  limb(S,E,16,11,UA_F,UA_B);dot(E,11);

function anchor(dy){return P(POSTX,-58+(dy||0))}
function bandLine(from,to,col,w){
  ctx.strokeStyle=col;ctx.lineCap='round';ctx.lineWidth=w;
  const m=lerpP(from,to,.5);ctx.beginPath();ctx.moveTo(from.x,from.y);ctx.quadraticCurveTo(m.x,m.y+4,to.x,to.y);ctx.stroke();

const tp=p=>P(p.x,p.z);
/* voet van bovenaf: ca. 40 lang als hij plat ligt, korter (tot een ovaal) als hij naar de camera wijst */
function topFoot(L){

function tSeg(a,b,rA,rB,bump){const d=Math.hypot(b.x-a.x,b.y-a.y);if(d>6)limb(a,b,rA,rB,bump,bump);else dot(a,Math.max(rA,rB));}

boot();

<main>
  <header>

  </header>

  <section class="stage">
    <canvas id="c" width="1200" height="844" aria-label="Animatie van floor angels: armen van W naar Y over de grond, van bovenaf en van opzij, met varianten op de buik en staand tegen de muur"></canvas>
    <div class="bar">
      <div class="groups">
        <div class="seg" role="group" aria-label="Vorm">

          <button class="opt" data-var="buik" aria-pressed="false">Op de buik</button>

        </div>
      </div>

    <span><i class="dot soft"></i>Schouders en borst, rek (secundair)</span>
  </div>

</main>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();ctx.fill();
}
let F=1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
/* gebogen ledemaat/romp langs een kwadratische curve a-c-b, zelfde profielen als limb */
function curveLimb(a,c,b,rA,rB,front,back){
  const N=36,prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,cc,w]of bs)r+=m*Math.exp(-(((t-cc)/w)**2));return r};
  const pt=t=>P((1-t)*(1-t)*a.x+2*(1-t)*t*c.x+t*t*b.x,(1-t)*(1-t)*a.y+2*(1-t)*t*c.y+t*t*b.y);
  const tg=t=>{const x=2*(1-t)*(c.x-a.x)+2*t*(b.x-c.x),y=2*(1-t)*(c.y-a.y)+2*t*(b.y-c.y),l=Math.hypot(x,y)||1;return P(x/l,y/l)};
  const L=[],Rr=[];
  for(let i=0;i<=N;i++){const t=i/N,p=pt(t),u=tg(t),nx=-u.y*F,ny=u.x*F,rf=prof(t,front),rb=prof(t,back);
    L.push(P(p.x+nx*rf,p.y+ny*rf));Rr.push(P(p.x-nx*rb,p.y-ny*rb));}
  ctx.beginPath();L.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
  for(let i=N;i>=0;i--)ctx.lineTo(Rr[i].x,Rr[i].y);ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
  return {pt,tg};
}
/* voet in zijaanzicht: ca. 40 lang (enkel r9, teen r6) */
function footSide(A,ang){capsule(A,9,P(A.x+Math.cos(ang)*25,A.y+Math.sin(ang)*25),6);}
const ell=(c,rx,ry,rot)=>{ctx.beginPath();ctx.ellipse(c.x,c.y,rx,ry,rot||0,0,Math.PI*2);ctx.fill();};
const P=(x,y)=>({x,y});
const add=(a,b)=>P(a.x+b.x,a.y+b.y),sub=(a,b)=>P(a.x-b.x,a.y-b.y),mul=(a,k)=>P(a.x*k,a.y*k);
const dirA=a=>P(Math.cos(a),Math.sin(a)),angOf=v=>Math.atan2(v.y,v.x);
const along=(a,ang,len)=>P(a.x+Math.cos(ang)*len,a.y+Math.sin(ang)*len);
const ease=t=>.5-.5*Math.cos(Math.PI*Math.max(0,Math.min(1,t)));
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),DEG=Math.PI/180;
const lerpP=(a,b,t)=>P(lerp(a.x,b.x,t),lerp(a.y,b.y,t));

/* shared body standard: torso 155, thigh 148, shin 132, upper arm 104, forearm 81 */
const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];
const profR=(rA,rB,bs,t)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};

/* flat hand, fingers along +x, back of the hand on the -y side */
function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-4,W.y-9);
  ctx.quadraticCurveTo(W.x+14,W.y-10,W.x+28,W.y-3);
  ctx.quadraticCurveTo(W.x+40,W.y+1,W.x+40,W.y+5);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+16,W.y+8);
  ctx.lineTo(W.x-6,W.y+8);
  ctx.closePath();ctx.fill();
}
function handAt(W,ang,flip){ctx.save();ctx.translate(W.x,W.y);ctx.rotate(ang);if(flip)ctx.scale(1,-1);hand(P(0,0));ctx.restore();}
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
const fistC=(W,E)=>{const d=sub(W,E),l=Math.hypot(d.x,d.y)||1;return P(W.x+d.x/l*9,W.y+d.y/l*9)};
function edgeHand(W,T){const dx=T.x-W.x,dy=T.y-W.y,L=Math.hypot(dx,dy);if(L<1){dot(W,8);return;}const a=Math.atan2(dy,dx),h=Math.min(1,L/16);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(2+17*h,0,6+15*h,9,0,0,Math.PI*2);ctx.fill();ctx.restore();}
/* flat hand seen from the palm or the back (top / front views): wrist 13 wide, hand 18 wide, ca. 37 beyond the wrist, with thumb.
   ang = finger direction on screen, k = foreshortening (1 = full length), th = thumb side (+1/-1 in local y) */
function palmHand(W,ang,k,th){
  const kk=Math.max(.38,k==null?1:k),t=th||1;
  ctx.save();ctx.translate(W.x,W.y);ctx.rotate(ang);ctx.scale(kk,1);
  ctx.beginPath();
  ctx.moveTo(-3,-6.2);ctx.quadraticCurveTo(5,-9.2,14,-8.8);ctx.lineTo(28,-7.4);
  ctx.quadraticCurveTo(37,-6.4,37,0);ctx.quadraticCurveTo(37,6.4,28,7.4);
  ctx.lineTo(14,8.8);ctx.quadraticCurveTo(5,9.2,-3,6.2);ctx.closePath();ctx.fill();
  capsule(P(7,t*6),4.3,P(15.5,t*11.5),3.4);
  ctx.restore();
}
/* side-view flat hand that follows the forearm (skill: same flat hand turning with the forearm) */
function sideHand(W,E,flip){handAt(W,Math.atan2(W.y-E.y,W.x-E.x),flip);}
/* foot in side view, ca. 40 long; ang = direction heel->toes */
function footSide(A,ang,sole){const m=along(A,ang,18),t=along(A,ang,27);capsule(A,9,m,7);capsule(m,7,t,4.5);if(sole)dot(add(along(A,ang,-2),mul(dirA(ang+sole*Math.PI/2),4.5)),8.5);}
/* flat foot on the floor in side view, sole on the floor; dir = +1 toes right, -1 toes left */
function footFlat(A,dir){capsule(P(A.x-dir*3,A.y+1),9,P(A.x+dir*23,A.y+5),5.5);}
/* foot seen from above: narrower ankle, wider toes; k = foreshortening */
function footTop(A,ang,k){capsule(A,6,along(A,ang,3+23*k),9.5);}
/* foot seen from the front (standing): 19 wide, low */
function footFront(A,s){ell(P(A.x,A.y),10,7);ell(P(A.x+s*2,A.y+3),10.5,5);}
function curveLimb(a,c,b,rA,rB,front,back){
  const N=36,pt=t=>P((1-t)*(1-t)*a.x+2*(1-t)*t*c.x+t*t*b.x,(1-t)*(1-t)*a.y+2*(1-t)*t*c.y+t*t*b.y);
  const tg=t=>{const x=2*(1-t)*(c.x-a.x)+2*t*(b.x-c.x),y=2*(1-t)*(c.y-a.y)+2*t*(b.y-c.y),l=Math.hypot(x,y)||1;return P(x/l,y/l)};
  const L=[],R=[];
  for(let i=0;i<=N;i++){const t=i/N,p=pt(t),u=tg(t),nx=-u.y*F,ny=u.x*F,rf=profR(rA,rB,front,t),rb=profR(rA,rB,back,t);
    L.push(P(p.x+nx*rf,p.y+ny*rf));R.push(P(p.x-nx*rb,p.y-ny*rb));}
  ctx.beginPath();L.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
  for(let i=N;i>=0;i--)ctx.lineTo(R[i].x,R[i].y);ctx.closePath();ctx.fill();
  dot(a,(profR(rA,rB,front,0)+profR(rA,rB,back,0))/2);dot(b,(profR(rA,rB,front,1)+profR(rA,rB,back,1))/2);
  return {pt,tg};
}
function ik(S,T,l1,l2,bend){
  const dx=T.x-S.x,dy=T.y-S.y,d=clamp(Math.hypot(dx,dy),1,l1+l2-.01);
  const base=Math.atan2(dy,dx),off=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));
  return along(S,base+bend*off,l1);
}
/* draw fn twice: first a thin outline in the stage colour, then filled */
function outlined(fn,stage,w){
  const f0=ctx.fill;ctx.strokeStyle=stage;ctx.lineWidth=w||5;ctx.lineJoin='round';
  ctx.fill=function(){ctx.stroke();};fn();ctx.fill=f0;fn();
}
/* torso seen from the front, back or above: body frame x from hip (0) to shoulder (155), z sideways */
const TK=[[-24,0],[-15,26],[0,34],[33,32],[64,28],[105,38],[138,47],[157,44],[172,18],[178,13]];
const wAt=x=>{if(x<=TK[0][0])return TK[0][1];for(let i=1;i<TK.length;i++){if(x<=TK[i][0]){const[x0,w0]=TK[i-1],[x1,w1]=TK[i],u=ease((x-x0)/(x1-x0));return w0+(w1-w0)*u}}return 13};
function frontTorso(ws){
  ws=ws||1;ctx.beginPath();
  for(let x=-24;x<=178;x+=4){const w=wAt(x)*(x>150?1:ws);x>-24?ctx.lineTo(x,w):ctx.moveTo(x,w);}
  for(let x=178;x>=-24;x-=4)ctx.lineTo(x,-wAt(x)*(x>150?1:ws));
  ctx.closePath();ctx.fill();
}
function label(t,x,y,al){ctx.fillStyle=tok('--muted');ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign=al||'left';ctx.fillText(t,x,y);}
function mat(x,y,w){ctx.fillStyle=C.mat;ctx.beginPath();ctx.roundRect(x,y,w,10,5);ctx.fill();}

let mode='iso',vari=null,playing=true,slow=false,phaseT=0,last=performance.now(),C={};
function colors(){return {stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),muted:tok('--muted'),band:tok('--band'),bandfar:tok('--bandfar'),post:tok('--post')}}
function setMode(m){mode=m;phaseT=0;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));try{localStorage.setItem(KEY+'-mode',m)}catch(e){}}
function setVar(v){vari=v;phaseT=0;document.querySelectorAll('[data-var]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.var===v)));try{localStorage.setItem(KEY+'-var',v)}catch(e){}}
function boot(){
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
  document.querySelectorAll('[data-var]').forEach(b=>b.onclick=()=>setVar(b.dataset.var));
  const vs=[...document.querySelectorAll('[data-var]')].map(b=>b.dataset.var);
  setVar(DEFAULT_VAR);setMode('iso');
  try{const m=localStorage.getItem(KEY+'-mode'),v=localStorage.getItem(KEY+'-var');if(m==='iso'||m==='dyn')setMode(m);if(vs.includes(v))setVar(v);}catch(e){}
  document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
  document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
  requestAnimationFrame(frame);
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing&&!reduce)phaseT+=dt*(slow?.5:1);
  const cyc=EX.cycle(mode,vari);
  const ph=window.__ph!=null?window.__ph:(reduce?EX.rest(mode,vari):phaseT%cyc);
  const k=cv.width/VW;
  ctx.setTransform(k,0,0,k,0,0);
  C=colors();
  ctx.fillStyle=C.stage;ctx.fillRect(0,0,VW,VH);
  EX.draw(ph,mode,vari);
  requestAnimationFrame(frame);
}

const VW=640,VH=450,KEY='angels',DEFAULT_VAR='rug';
const ARM_W=[170*DEG,13*DEG],ARM_Y=[25*DEG,25*DEG];
function wy(ph){if(ph<1.4)return ease(ph/1.4);if(ph<1.9)return 1;if(ph<3.3)return 1-ease((ph-1.9)/1.4);return 0}
const EX={
  cycle:(m,v)=>m==='dyn'?3.9:4,
  rest:()=>1.6,
  draw(ph,m,v){
    const t=m==='iso'?1:wy(ph),br=m==='iso'?Math.sin(ph/4*Math.PI*2):0;
    const arms=[lerp(ARM_W[0],ARM_Y[0],t)+.02*br,lerp(ARM_W[1],ARM_Y[1],t)+.02*br];
    const glow=m==='iso'?.8+.2*(.5+.5*br):.4+.6*t;
    if(v==='muur'){
      ctx.save();ctx.globalAlpha=.45;ctx.fillStyle=C.post;ctx.beginPath();ctx.roundRect(40,24,352,392,8);ctx.fill();ctx.restore();
      mat(30,416,372);
      ctx.save();ctx.translate(216,244);ctx.scale(.58,.58);ctx.rotate(-Math.PI/2);
      frontal(arms,{legs:'stand',hands:'palm'},glow);ctx.restore();
      label('VOORAANZICHT',24,442);
      ctx.save();ctx.translate(470,416);ctx.scale(.5,.5);sideWall(arms,glow);ctx.restore();
      label('ZIJAANZICHT',530,442,'center');
    }else{
      ctx.save();ctx.translate(292,184);ctx.scale(.74,.74);
      frontal(arms,v==='rug'?{legs:'straight',hands:'palm'}:{legs:'straight',lift:18,prone:true,hands:'down'},glow);ctx.restore();
      label('BOVENAANZICHT',24,34);
      ctx.save();ctx.translate(462,404);ctx.scale(.38,.38);
      mat(-340,0,700);
      if(v==='rug')sideBack(arms,glow);else sideFront(arms,glow);
      ctx.restore();
      label('ZIJAANZICHT',318,404,'right');
    }
  }
};
function armPts(arms,s){
  const [tu,tf]=arms,S=P(155,s*42);
  const E=P(S.x+104*Math.cos(tu),S.y+s*104*Math.sin(tu));
  const W=P(E.x+81*Math.cos(tf),E.y+s*81*Math.sin(tf));
  const Hd=P(W.x+18*Math.cos(tf),W.y+s*18*Math.sin(tf));
  return {S,E,W,Hd};
}
function frontal(arms,o,glow){
  F=1;ctx.fillStyle=C.body;
  for(const s of [-1,1]){
    if(o.legs==='bent'){
      const Ks=ik(P(0,-30),P(-150,-14),148,132,1);
      const H=P(0,s*18),K=P(Ks.x,s*26),A=P(-150,s*24);
      limb(K,A,14,8.5,[[6,.27,.18]],[[6,.27,.18]]);ell(P(A.x-15,A.y),20,10.5);
      limb(H,K,23,15,[[5,.45,.28]],[[5,.45,.28]]);dot(K,14.5);
    }else{
      const H=P(0,s*18),K=P(-148,s*21),A=P(-280,s*23);
      limb(H,K,23,15,[[5,.45,.28]],[[5,.45,.28]]);dot(K,14);
      limb(K,A,14,6.5,[[6,.27,.18]],[[6,.27,.18]]);
      outlined(()=>{
        if(o.legs==='stand'){ell(P(A.x-3,A.y+s*2),6,10);}         /* voet van voren: 19 breed, laag */
        else if(o.prone)footTop(A,Math.PI,1);                     /* op de buik: voetzool naar boven, volle lengte */
        else footTop(A,Math.PI+s*.35,.45);                        /* op de rug: tenen omhoog, licht naar buiten */
      },C.stage,3);
    }
  }
  frontTorso(1);
  const A=[-1,1].map(s=>armPts(arms,s));
  if(o.lift){ctx.save();ctx.fillStyle=C.mat;ctx.translate(o.lift*.25+3,o.lift*.3+3);for(const a of A)drawArmF(a,o,true);ctx.restore();}
  ctx.fillStyle=C.body;
  capsule(P(176,0),13,P(155,0),14);ell(P(205,0),28,23);
  for(const s of [-1,1])dot(P(155,s*42),17);
  ctx.save();ctx.fillStyle=C.mus;
  if(o.prone){
    ctx.globalAlpha=glow;
    for(const s of [-1,1]){ell(P(149,s*20),28,15,s*.12);ell(P(119,s*12),28,11,-s*.28);}
    ctx.globalAlpha=glow*.55;for(const s of [-1,1])dot(P(152,s*44),13);
  }else{
    ctx.globalAlpha=glow*.55;
    for(const s of [-1,1]){ell(P(124,s*22),24,14,s*.15);dot(P(152,s*44),13);}
  }
  ctx.restore();
  ctx.fillStyle=C.body;
  for(const a of A)drawArmF(a,o);
}
function drawArmF(a,o,sh){
  const s=Math.sign(a.S.y),fa=angOf(sub(a.W,a.E));
  outlined(()=>{limb(a.S,a.E,15,11,[[3,.5,.22]],[[3,.5,.22]]);dot(a.S,17);},sh?C.mat:C.stage,3);
  outlined(()=>{dot(a.E,11);limb(a.E,a.W,11,6.5,[[3,.22,.2]],[[3,.22,.2]]);
    palmHand(a.W,fa,1,o.hands==='down'?-s:s);},sh?C.mat:C.stage,3);
}
/* side insets */
function sArmFloor(arms,S,hE,hW){
  const [tu,tf]=arms,E=P(S.x+104*Math.cos(tu)*.9,-hE),W=P(E.x+81*Math.cos(tf)*.9,-hW);
  limb(S,E,16,11,UA_F,UA_B);dot(E,11);limb(E,W,11.5,6.5,FA_F,FA_B);
  handAt(W,W.x<E.x-8?Math.PI:0,W.x<E.x-8);dot(S,21);
}
function headNeck(S,dirAng,nb,off){
  capsule(add(along(S,dirAng,14),mul(nb,off)),12,add(along(S,dirAng,30),mul(nb,off)),11);
  ell(add(along(S,dirAng,56),mul(nb,off+3)),29,25,dirAng);
}
function sideBack(arms,glow){
  F=1;const S=P(155,-32),H=P(0,-30),u=mul(sub(H,S),1/155),n=P(-u.y,u.x),nb=mul(n,-1);
  const K=P(-148,-25),A=P(-280,-13);
  const leg=(dx,dy)=>{const h=P(H.x+dx,H.y+dy),k=P(K.x+dx,K.y+dy),a=P(A.x+dx,A.y+dy);
    limb(h,k,24,15,THIGH_F,THIGH_B);dot(k,14.5);limb(k,a,14.5,9,SHIN_F,SHIN_B);
    footSide(a,-110*DEG);};
  ctx.fillStyle=C.far;leg(-12,-3);
  ctx.fillStyle=C.body;
  limb(S,H,27,24,T_FRONT,T_BACK);ell(add(H,mul(nb,12)),31,23,angOf(u));
  headNeck(S,angOf(sub(S,H)),nb,4);
  leg(0,0);
  ctx.save();ctx.fillStyle=C.mus;ctx.globalAlpha=glow;capsule(add(add(S,mul(u,18)),mul(nb,16)),9,add(add(S,mul(u,70)),mul(nb,15)),7);ctx.restore();
  ctx.fillStyle=C.body;outlined(()=>sArmFloor(arms,S,15,13),C.stage);
}
function sideFront(arms,glow){
  F=-1;const S=P(155,-30),H=P(0,-30),u=mul(sub(H,S),1/155),n=P(-u.y*F,u.x*F),nb=mul(n,-1);
  const leg=(dx,dy)=>{const h=P(H.x+dx,H.y+dy),k=P(-148+dx,-25+dy),a=P(-280+dx,-15+dy);
    limb(h,k,24,15,THIGH_F,THIGH_B);dot(k,14.5);limb(k,a,14.5,9,SHIN_F,SHIN_B);footSide(a,Math.PI-.25);};
  ctx.fillStyle=C.far;leg(-12,-3);
  ctx.fillStyle=C.body;
  limb(S,H,27,24,T_FRONT,T_BACK);ell(add(H,mul(nb,12)),31,23,0);
  headNeck(S,angOf(sub(S,H)),nb,-2);
  leg(0,0);
  ctx.save();ctx.fillStyle=C.mus;ctx.globalAlpha=glow;capsule(add(add(S,mul(u,14)),mul(nb,17)),10,add(add(S,mul(u,62)),mul(nb,15)),7);ctx.restore();
  ctx.fillStyle=C.body;outlined(()=>sArmFloor(arms,S,46,50),C.stage);
}
function sideWall(arms,glow){
  F=-1;const WX=-70;
  ctx.fillStyle=C.post;ctx.beginPath();ctx.roundRect(WX-16,-610,16,610,4);ctx.fill();
  mat(WX-16,0,260);
  const A=P(WX+50,-12),H=P(WX+38,-284),S=P(WX+31,-438),K=ik(H,A,148,132,-1);
  const leg=(dx,dy)=>{const h=P(H.x+dx,H.y+dy),k=P(K.x+dx,K.y+dy),a=P(A.x+dx,A.y);
    limb(h,k,24,16,THIGH_F,THIGH_B);dot(k,15);limb(k,a,15,9,SHIN_F,SHIN_B);footFlat(a,1);};
  ctx.fillStyle=C.far;leg(8,-3);
  ctx.fillStyle=C.body;
  limb(S,H,27,24,T_FRONT,T_BACK);dot(H,26);ell(P(H.x-15,H.y+2),23,31);
  leg(0,0);
  capsule(P(S.x+2,S.y-14),12,P(S.x+4,S.y-30),11);ell(P(S.x+8,S.y-56),25,29);
  ctx.save();ctx.fillStyle=C.mus;ctx.globalAlpha=glow;capsule(P(S.x-18,S.y+14),9,P(S.x-16,S.y+66),7);ctx.restore();
  const [tu,tf]=arms;
  const arm=()=>{const E=P(WX+14,S.y-104*Math.cos(tu)),W=P(WX+13,E.y-81*Math.cos(tf));
    limb(S,E,16,11,UA_F,UA_B);dot(E,11);limb(E,W,11.5,6.5,FA_F,FA_B);
    handAt(W,angOf(sub(W,E)),false);dot(S,21);};
  ctx.fillStyle=C.body;outlined(arm,C.stage);
}
boot();

<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>

  --bg:#EDF0EE; --stage:#F8FAF9; --ink:#1E2426; --muted:#5E686A; --body:#2A3134; --far:#7C8689;
  --muscle:#E0452B; --mat:#D6DCD9; --line:#D3D9D6; --band:#2C8C7E; --bandfar:#8CC2B9; --post:#B9C1BE;

<main>
  <header>
    <h1>Standing row</h1>
    <p class="sub">Met elastiek · bovenrug en achterkant schouders</p>
  </header>

  <section class="stage">
    <canvas id="c" width="1200" height="938" aria-label="Animatie van een staande row met elastiek, van opzij en van achteren"></canvas>
    <div class="bar">
      <div class="seg" role="group" aria-label="Uitvoering">
        <button class="mode" data-m="iso" aria-pressed="false">Isometrisch</button>
        <button class="mode" data-m="dyn" aria-pressed="true">Dynamisch</button>
      </div>
      <div class="seg" role="group" aria-label="Variatie">
        <button data-v="twee" aria-pressed="true">Twee armen</button>
        <button data-v="een" aria-pressed="false">Eén arm</button>
        <button data-v="face" aria-pressed="false">Face pull</button>
      </div>

  <div class="legend">

    <span data-when="twee,een"><i class="dot soft"></i>Latissimus en achterste schouder (secundair)</span>
    <span data-when="face" hidden><i class="dot"></i>Achterste schouder en rotator cuff (primair)</span>
    <span data-when="face" hidden><i class="dot soft"></i>Rhomboïden en middelste trapezius (secundair)</span>
  </div>

<script>
/* Standing row: staand, elastiek voor je vast. Roeien = handen naar de onderste ribben, ellebogen langs het lijf naar achteren.
   Face pull = anker hoog, handen naar het gezicht, ellebogen hoog en breed. Schouderbladen gaan mee naar elkaar toe. */
const YAW=-40*Math.PI/180;
const EX={key:'row',VW:640,VH:500,variants:['twee','een','face'],reduceT:1,
  layout(variant){return[
    {kind:'side',cx:150,cy:458,sc:.62,ly:488,matW:440,matX:150},
    /* face pull: back view turned a little, so the arms reaching to the high anchor keep their length in view */
    {kind:'back',cx:520,cy:458,sc:.62,ly:488,matW:240,yaw:variant==='face'?YAW:0,label:variant==='face'?'SCHUIN ACHTERAANZICHT':undefined}];},
  state(mode,variant,time){
    if(mode==='iso'){const t=isoT(time);return{t,glow:.85+.15*Math.sin(time*Math.PI*2*6.5)};}
    const t=cycle(time,1.2,.6,1.5,.4);return{t,glow:.3+.7*t};
  },
  scene(st,variant){
    const f=standing({Hc:V(0,282,-6),lean:4*DEG,feet:30}),t=st.t,g=st.glow;
    const face=variant==='face';
    const anchor=face?V(0,f.Sc.y+64,360):V(0,f.Hc.y+92,360);
    const work=variant==='een'?[0]:[0,1];
    for(let i=0;i<2;i++){const s=i?1:-1;
      /* schouderblad naar achteren en naar binnen bij het aantrekken */
      if(work.includes(i))f.sh[i]=sum(f.Sc,mul(f.lat,s*(50-5*t)),mul(f.fwd,-7*t));
      if(!work.includes(i)){armHang(f,i);continue;}
      const sh=f.sh[i];
      const w0=add(sh,mul(nrm(sub(add(anchor,V(s*20,0,0)),sh)),176));
      const w1=face?sum(f.Sc,mul(f.up,52),mul(f.lat,s*60),mul(f.fwd,20)):sum(f.Hc,mul(f.up,88),mul(f.lat,s*40),mul(f.fwd,26));
      const wr=add(lerp(w0,w1,t),V(0,face?0:-10*Math.sin(Math.PI*t),0));
      const pole=face?nrm(lerp(V(s*.4,-1,0),V(s,.5,-.8),t)):nrm(lerp(V(s*.3,-1,0),V(s*.25,-1,-1.2),t));
      armIK(f,i,wr,pole,'fist');
    }
    const bands=work.map(i=>{const Fc=fistC(f.arms[i]);return{a:Fc,b:anchor,k:clamp((len(sub(Fc,anchor))-170)/220),sag:12,w:7};});
    return{fig:f,bands,
      props(v,c){if(v.kind==='side'){postFlat(c,anchor.z+8,700);anchorClip(c,P(anchor.z+2,-anchor.y));}},
      onTorso(v,f,c){
        const r=torsoRot(v,f);
        if(v.kind==='back'){
          /* schouderbladen: van uit elkaar naar samengeknepen */
          const C=v.pr(sum(f.Sc,mul(f.up,-10))),p=1-t;
          ctx.save();ctx.globalAlpha=g;ctx.fillStyle=c.mus;
          ctx.beginPath();ctx.roundRect(C.x-6-12*p,C.y+4,2*(6+12*p),44,4);ctx.fill();ctx.restore();
          for(const side of [-1,1]){
            const sp=6+12*p;ctx.save();ctx.fillStyle=c.far;
            ctx.translate(C.x+side*sp,C.y);ctx.rotate(side*(.05+.18*p));ctx.scale(.78,.78);
            ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(side*40,-4);ctx.quadraticCurveTo(side*44,6,side*32,18);
            ctx.lineTo(side*6,56);ctx.quadraticCurveTo(side*-2,58,0,48);ctx.closePath();ctx.fill();ctx.restore();
          }
          for(const i of [0,1]){const s=i?1:-1;
            mus(v,c,sum(f.Sc,mul(f.up,-78),mul(f.lat,s*30),mul(f.fwd,-14)),mul(f.fwd,-1),10,26,-s*.15*(-1),g*.55*(work.includes(i)?1:.4));}
        }else{
          mus(v,c,sum(f.Sc,mul(f.up,-36),mul(f.fwd,-22)),V(-.6,0,-1),9,30,r,g);
          mus(v,c,sum(f.Sc,mul(f.up,-92),mul(f.fwd,-17)),V(-.6,0,-1),10,32,r,g*.55);
        }
      },
      onArm(v,f,c,i){
        if(!work.includes(i))return;
        const S=v.pr(f.arms[i].sh);
        ctx.save();ctx.globalAlpha=g*(face?.9:.55);ctx.fillStyle=c.mus;ctx.beginPath();ctx.ellipse(S.x,S.y,12,14,0,0,Math.PI*2);ctx.fill();ctx.restore();
      }};
  }
};

/* ===== Gedeelde engine groep 3 (staand met elastiek) =====
   Zelfde helpers en maten als plank / standing row / pass-through.
   Het figuur wordt als 3D-skelet opgebouwd (x = opzij, y = omhoog, z = naar voren)
   en per aanzicht geprojecteerd: voor, achter, zij (gezicht naar rechts) of boven. */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();ctx.fill();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
const P=(x,y)=>({x,y});
const ease=t=>.5-.5*Math.cos(Math.PI*t);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const DEG=Math.PI/180;

/* vaste spierprofielen */
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
/* voor-/achter-/bovenaanzicht: symmetrische varianten (zoals horse stance / pass-through) */
const S_UA=[[4,.5,.22]],S_FA=[[3,.25,.2]],S_TH_F=[[5,.45,.28]],S_TH_B=[[4,.4,.3]],S_SH=[[3,.28,.18]];
const L_TH=148,L_SH=132,L_UA=104,L_FA=81;

/* ---------- 3D ---------- */
const V=(x,y,z)=>({x,y,z});
const add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z),sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z);
const mul=(a,k)=>V(a.x*k,a.y*k,a.z*k),dt3=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const len=a=>Math.hypot(a.x,a.y,a.z),nrm=a=>mul(a,1/(len(a)||1));
const lerp=(a,b,t)=>V(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t,a.z+(b.z-a.z)*t);
const cross=(a,b)=>V(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x);
const sum=(...p)=>p.reduce(add);
function ik3(A,B,l1,l2,pole){
  let d=sub(B,A),L=len(d);const u=nrm(d);
  if(L>l1+l2-.01){L=l1+l2-.01;B=add(A,mul(u,L));}
  const a=(l1*l1-l2*l2+L*L)/(2*L),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  const p=nrm(sub(pole,mul(u,dt3(pole,u))));
  return [add(add(A,mul(u,a)),mul(p,h)),B];
}

/* ---------- figuur ---------- index 0 = kant x<0, index 1 = kant x>0 */
function body(Hc,Sc){
  const up=nrm(sub(Sc,Hc)),lat=V(1,0,0),fwd=nrm(cross(lat,up));
  const f={Hc,Sc,up,lat,fwd,arms:[null,null],legs:[null,null]};
  f.sh=[-1,1].map(s=>add(Sc,mul(lat,s*50)));
  f.hip=[-1,1].map(s=>sum(Hc,mul(lat,s*20),mul(up,-4)));
  f.head=sum(Sc,mul(up,56),mul(fwd,5));
  f.neck=[add(Sc,mul(up,14)),sum(Sc,mul(up,30),mul(fwd,2))];
  return f;
}
function leg(f,i,an,pole,foot){
  const [kn,a]=ik3(f.hip[i],an,L_TH,L_SH,pole);
  const fd=foot&&foot.dir?nrm(foot.dir):V(0,0,1);
  const heel=foot&&foot.heel?foot.heel:add(a,add(mul(fd,-6),V(0,-2,0)));
  const toe=foot&&foot.toe?foot.toe:add(a,add(mul(fd,38),V(0,-6,0)));
  f.legs[i]={hip:f.hip[i],kn,an:a,heel,toe,flatFront:!(foot&&foot.toe)};
}
function armDir(f,i,dUA,dFA,hand){
  const el=add(f.sh[i],mul(nrm(dUA),L_UA)),wr=add(el,mul(nrm(dFA),L_FA));
  f.arms[i]={sh:f.sh[i],el,wr,hand:hand||'fist'};
}
function armIK(f,i,wr,pole,hand){
  const [el,w]=ik3(f.sh[i],wr,L_UA,L_FA,pole);
  f.arms[i]={sh:f.sh[i],el,wr:w,hand:hand||'fist'};
}
/* ontspannen hangende arm langs het lichaam */
function armHang(f,i,swing=0){
  const s=i?1:-1;
  armDir(f,i,V(s*.08,-1,swing+f.up.z*.25),V(s*.04,-1,.12+swing+f.up.z*.25),'hang');
}
/* staande basishouding: voeten op heupbreedte, knieën heel licht gebogen */
function standing(o={}){
  const Hc=o.Hc||V(0,290,-4),lean=o.lean||0;
  const up=V(0,Math.cos(lean),Math.sin(lean));
  const f=body(Hc,add(Hc,mul(up,155)));
  for(let i=0;i<2;i++){const s=i?1:-1;
    const an=o.an?o.an[i]:V(s*(o.feet||24),12,0);
    leg(f,i,an,V(s*(o.kneeOut||0),0,1),o.foot?o.foot[i]:null);}
  return f;
}
const fistC=a=>add(a.wr,mul(nrm(sub(a.wr,a.el)),9));

/* ---------- aanzichten ---------- */
function mkView(kind,cx,cy,sc,label,yaw){
  const v={kind,cx,cy,sc,label};
  if(kind==='front'){const cs=Math.cos(yaw||0),sn=Math.sin(yaw||0);
    v.pr=p=>P(p.x*cs+p.z*sn,-p.y);v.dp=p=>-p.x*sn+p.z*cs;v.cam=V(-sn,0,cs);}
  else if(kind==='back'){const cs=Math.cos(yaw||0),sn=Math.sin(yaw||0);
    v.pr=p=>P(-(p.x*cs+p.z*sn),-p.y);v.dp=p=>p.x*sn-p.z*cs;v.cam=V(sn,0,-cs);}
  else if(kind==='side'){v.pr=p=>P(p.z,-p.y);v.dp=p=>-p.x;v.cam=V(-1,0,0);}
  else {v.pr=p=>P(p.x,p.z);v.dp=p=>p.y;v.cam=V(0,1,0);}
  return v;
}
const LABELS={front:'VOORAANZICHT',back:'ACHTERAANZICHT',side:'ZIJAANZICHT',top:'BOVENAANZICHT'};

function outlined(c,col,fn){
  const f0=ctx.fill;ctx.strokeStyle=c.stage;ctx.lineWidth=5;ctx.lineJoin='round';
  ctx.fill=function(){ctx.stroke();};fn(true);ctx.fill=f0;
  ctx.fillStyle=col;fn(false);
}
function offP(p,o){return o?P(p.x+o.x,p.y+o.y):p;}

function drawLeg(v,L,o){
  const pr=p=>offP(v.pr(p),o);
  const H=pr(L.hip),K=pr(L.kn),A=pr(L.an);
  const side=v.kind==='side';
  const thigh=()=>{side?limb(H,K,24,15,THIGH_F,THIGH_B):limb(H,K,24,16,S_TH_F,S_TH_B);dot(K,side?14.5:15);};
  const shin=()=>{side?limb(K,A,14.5,9,SHIN_F,SHIN_B):limb(K,A,15,9,S_SH,S_SH);foot();};
  const foot=()=>{
    if((v.kind==='front'||v.kind==='back')&&L.flatFront){
      ctx.beginPath();ctx.ellipse(A.x,A.y+4,13,10,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(A.x,A.y+7,16,6,0,0,Math.PI*2);ctx.fill();
    }else{
      const he=pr(L.heel),to=pr(L.toe);
      if(Math.hypot(to.x-he.x,to.y-he.y)<6){ctx.beginPath();ctx.ellipse(A.x,A.y+5,12,8,0,0,Math.PI*2);ctx.fill();}
      else capsule(he,v.kind==='top'?9:10,to,v.kind==='top'?8:6);
    }
  };
  const dT=v.dp(lerp(L.hip,L.kn,.5)),dS=v.dp(lerp(L.kn,L.an,.5));
  if(dS<dT-4){shin();thigh();}else{thigh();shin();}
}
function drawHand(v,a,o){
  const pr=p=>offP(v.pr(p),o);
  if(a.hand==='none')return;
  const d=nrm(sub(a.wr,a.el)),W=pr(a.wr);
  const off=a.hand==='hang'?11:9,C=pr(add(a.wr,mul(d,off)));
  const dx=C.x-W.x,dy=C.y-W.y,h=Math.hypot(dx,dy)/off;
  ctx.save();ctx.translate(C.x,C.y);ctx.rotate(Math.atan2(dy,dx));ctx.beginPath();
  if(a.hand==='hang')ctx.ellipse(0,0,Math.max(8.5,10.5*h),8.5,0,0,Math.PI*2);
  else ctx.ellipse(0,0,9.5+1.5*h,9.5,0,0,Math.PI*2);
  ctx.fill();ctx.restore();
}
function drawArm(v,a,o,hook){
  const pr=p=>offP(v.pr(p),o);
  const S=pr(a.sh),E=pr(a.el),W=pr(a.wr),side=v.kind==='side';
  const ua=()=>{side?limb(S,E,16,11,UA_F,UA_B):limb(S,E,16,11,S_UA,S_UA);dot(E,11);};
  const fa=()=>{side?limb(E,W,11.5,6.5,FA_F,FA_B):limb(E,W,11.5,6.5,S_FA,S_FA);drawHand(v,a,o);};
  const sh=()=>{if(side)dot(P(S.x+3,S.y-2),21);else dot(S,v.kind==='top'?18:17);if(hook)hook();};
  const dU=v.dp(lerp(a.sh,a.el,.5)),dF=v.dp(lerp(a.el,a.wr,.5));
  const parts=dF<dU-4?[fa,ua]:[ua,fa];
  /* arm die naar de camera wijst: schouderbol eerst, anders verdwijnt de vuist erachter */
  if(v.dp(a.el)>v.dp(a.sh)+8){sh();parts.forEach(p=>p());}
  else{parts.forEach(p=>p());sh();}
}
function drawTorso(v,f,c){
  const S=v.pr(f.Sc),H=v.pr(f.Hc);
  if(v.kind==='front'||v.kind==='back'){
    const k=Math.max(.55,(H.y-S.y)/155);
    ctx.save();ctx.translate(S.x,S.y);ctx.scale(1,k*155/128);ctx.translate(0,300);
    ctx.beginPath();ctx.moveTo(-15,-314);
    ctx.quadraticCurveTo(-28,-306,-44,-300);ctx.quadraticCurveTo(-54,-280,-49,-258);
    ctx.quadraticCurveTo(-42,-232,-37,-208);ctx.quadraticCurveTo(-46,-190,-45,-172);
    ctx.lineTo(45,-172);ctx.quadraticCurveTo(46,-190,37,-208);ctx.quadraticCurveTo(42,-232,49,-258);
    ctx.quadraticCurveTo(54,-280,44,-300);ctx.quadraticCurveTo(28,-306,15,-314);
    ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.ellipse(0,-172,48,16,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
    capsule(v.pr(f.neck[0]),13,v.pr(f.neck[1]),11);
    const hd=v.pr(f.head);ctx.beginPath();ctx.ellipse(hd.x,hd.y,25,29,0,0,Math.PI*2);ctx.fill();
  }else if(v.kind==='side'){
    F=-1;
    limb(S,H,27,24,T_FRONT,T_BACK);
    const rot=Math.atan2(S.x-H.x,-(S.y-H.y));
    const B=v.pr(sub(f.Hc,mul(f.fwd,15)));
    ctx.beginPath();ctx.ellipse(B.x,B.y,23,31,rot,0,Math.PI*2);ctx.fill();
    capsule(v.pr(f.neck[0]),12,v.pr(f.neck[1]),11);
    const hd=v.pr(f.head);ctx.beginPath();ctx.ellipse(hd.x,hd.y,25,29,rot*.6,0,Math.PI*2);ctx.fill();
  }else{
    const a=v.pr(f.Sc),b=v.pr(f.Hc);
    ctx.beginPath();ctx.moveTo(a.x-54,a.y);ctx.lineTo(b.x-42,b.y);ctx.lineTo(b.x+42,b.y);ctx.lineTo(a.x+54,a.y);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.ellipse(b.x,b.y,42,24,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(a.x,a.y,56,28,0,0,Math.PI*2);ctx.fill();
  }
}
function drawTopHead(v,f){
  const hd=v.pr(f.head);ctx.beginPath();ctx.ellipse(hd.x,hd.y,25,29,0,0,Math.PI*2);ctx.fill();
}
/* elastiek: a -> b, rek 0..1 maakt hem dunner en strakker; stub = alleen het eerste stuk vanaf a */
function drawBand(v,b,c){
  const A=v.pr(b.a),B0=v.pr(b.b),st=b.stub||1;
  const B=P(A.x+(B0.x-A.x)*st,A.y+(B0.y-A.y)*st);
  const sag=v.kind==='top'?0:(1-b.k)*(b.sag==null?14:b.sag)*st+1;
  ctx.strokeStyle=b.far?c.bandfar:c.band;ctx.lineCap='round';
  ctx.lineWidth=Math.max(2.6,(b.w||7)-3.6*b.k);
  ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.quadraticCurveTo((A.x+B.x)/2,(A.y+B.y)/2+sag,B.x,B.y);ctx.stroke();
}
/* spier op het lichaam: zichtbaarheid volgt de richting van het huidoppervlak t.o.v. de camera */
function mus(v,c,p3,n3,rx,ry,rot,alpha){
  const vis=clamp((dt3(nrm(n3),v.cam)+.35)/.6);
  if(vis<=0||alpha<=0)return;
  const p=v.pr(p3);
  ctx.save();ctx.globalAlpha=alpha*vis;ctx.fillStyle=c.mus;
  ctx.beginPath();ctx.ellipse(p.x,p.y,rx,ry,rot,0,Math.PI*2);ctx.fill();ctx.restore();
}
function torsoRot(v,f){const a=v.pr(f.Hc),b=v.pr(f.Sc);return Math.atan2(b.x-a.x,-(b.y-a.y));}
/* spier langs een ledemaatdeel */
function musLimb(v,c,p,q,t0,t1,r0,r1,alpha,n3){
  const vis=n3?clamp((dt3(nrm(n3),v.cam)+.35)/.6):1;if(vis<=0||alpha<=0)return;
  const a=v.pr(lerp(p,q,t0)),b=v.pr(lerp(p,q,t1));
  ctx.save();ctx.globalAlpha=alpha*vis;ctx.fillStyle=c.mus;capsule(a,r0,b,r1);ctx.restore();
}

function drawFigure(v,f,c,scene){
  const G=[],side=v.kind==='side',flat=v.kind==='front'||v.kind==='back';
  const td=v.dp(lerp(f.Hc,f.Sc,.5));
  const farOf=i=>side&&i===1;
  const col=i=>farOf(i)?c.far:c.body,off=i=>farOf(i)?P(-10,-3):null;
  for(let i=0;i<2;i++){const L=f.legs[i];if(!L)continue;
    let d=v.dp(lerp(L.hip,L.kn,.5));if(flat)d=td-40+d*.01;
    G.push({d,fn:()=>{ctx.fillStyle=v.kind==='top'?c.far:col(i);drawLeg(v,L,off(i));}});}
  G.push({d:td,fn:()=>{ctx.fillStyle=c.body;drawTorso(v,f,c);if(scene.onTorso)scene.onTorso(v,f,c);}});
  if(v.kind==='top')G.push({d:v.dp(f.head)-1,fn:()=>{outlined(c,c.body,()=>drawTopHead(v,f));if(scene.onHead)scene.onHead(v,f,c);}});
  for(let i=0;i<2;i++){const a=f.arms[i];if(!a)continue;
    let d=v.dp(lerp(a.el,a.wr,.5));
    if(flat&&d>td-25)d+=20;if(v.kind==='top')d+=5;
    const behind=d<td;
    const hook=scene.onArm?()=>scene.onArm(v,f,c,i):null;
    G.push({d,fn:()=>{
      if(behind||farOf(i)){ctx.fillStyle=col(i);drawArm(v,a,off(i),farOf(i)?null:hook);}
      else outlined(c,col(i),st=>drawArm(v,a,null,st?null:hook));}});}
  for(const b of scene.bands||[]){
    if(b.views&&!b.views.includes(v.kind))continue;
    const bb=Object.assign({},b);
    if(b.stubIn&&b.stubIn.includes(v.kind))bb.stub=b.stubLen||.18;
    let d=v.dp(lerp(b.a,b.b,bb.stub?bb.stub/2:.5))+(b.bias||0);
    if(b.depth&&b.depth[v.kind]!=null)d=b.depth[v.kind];
    bb.far=!b.near&&(d<td-10||b.forceFar);
    G.push({d,fn:()=>drawBand(v,bb,c)});
  }
  for(const x of scene.extras||[])if(!x.views||x.views.includes(v.kind))G.push({d:typeof x.d==='function'?x.d(v,td):x.d,fn:()=>x.fn(v,c)});
  G.sort((a,b)=>a.d-b.d).forEach(g=>g.fn());
  if(scene.onTop)scene.onTop(v,f,c);
}

/* paal of deurpost (token --post) */
function postFlat(c,x,top,bottom=0,w=16){ctx.fillStyle=c.post;ctx.beginPath();ctx.roundRect(x-w/2,-top,w,top-bottom,4);ctx.fill();}
function anchorClip(c,p){ctx.fillStyle=c.band;ctx.beginPath();ctx.roundRect(p.x-11,p.y-9,22,18,6);ctx.fill();}
function postTop(c,p){ctx.fillStyle=c.post;ctx.beginPath();ctx.roundRect(p.x-11,p.y-11,22,22,4);ctx.fill();}

/* ---------- pagina / afspelen ---------- */
let playing=true,slow=false,phaseT=0,last=performance.now();
let MODE='dyn',VAR=EX.variants[0];
function colors(){return{stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),
  muted:tok('--muted'),band:tok('--band'),bandfar:tok('--bandfar'),post:tok('--post')};}
function render(){
  const k=cv.width/EX.VW;ctx.setTransform(k,0,0,k,0,0);
  const c=colors();
  ctx.fillStyle=c.stage;ctx.fillRect(0,0,EX.VW,EX.VH);
  const time=window.__time!=null?window.__time:phaseT;
  const mode=window.__mode||MODE,variant=window.__var||VAR;
  const st=EX.state(mode,variant,time);
  if(window.__t!=null)st.t=window.__t;
  if(reduce&&window.__t==null){st.t=EX.reduceT!=null?EX.reduceT:1;st.t2=st.t;}
  const scene=EX.scene(st,variant,mode);
  const views=EX.layout(variant,mode);
  for(const vd of views){
    const v=mkView(vd.kind,vd.cx,vd.cy,vd.sc,vd.label,vd.yaw);
    ctx.save();ctx.translate(v.cx,v.cy);ctx.scale(v.sc,v.sc);
    if(v.kind!=='top'&&vd.mat!==false){ctx.fillStyle=c.mat;const w=vd.matW||300;ctx.beginPath();ctx.roundRect((vd.matX||0)-w/2,0,w,10,5);ctx.fill();}
    if(scene.props)scene.props(v,c);
    drawFigure(v,scene.fig,c,scene);
    ctx.restore();
    ctx.fillStyle=c.muted;ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign='center';
    ctx.fillText(vd.label||LABELS[vd.kind],vd.lx!=null?vd.lx:vd.cx,vd.ly);
  }
}
function frame(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;
  if(playing&&!reduce)phaseT+=dt*(slow?.5:1);
  render();
  requestAnimationFrame(frame);
}
/* hulpfuncties voor de tijdlijn */
function cycle(ph,out,hold,back,rest){
  const T=out+hold+back+rest;ph=((ph%T)+T)%T;
  if(ph<out)return ease(ph/out);
  if(ph<out+hold)return 1;
  if(ph<out+hold+back)return 1-ease((ph-out-hold)/back);
  return 0;
}
function repIndex(ph,T){return Math.floor(ph/T);}
/* isometrisch: vasthouden met lichte trillende spanning en ademhaling */
function isoT(time,hold=1){return hold-.012*(.5+.5*Math.sin(time*Math.PI*2*6.5))-.018*(.5+.5*Math.sin(time*Math.PI*2/4));}

function setMode(m){MODE=m;phaseT=0;document.querySelectorAll('[data-m]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===m)));save();}
function setVar(x){VAR=x;phaseT=0;document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===x)));save();}
function save(){try{localStorage.setItem(EX.key,JSON.stringify({m:MODE,v:VAR}))}catch(e){}}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>setVar(b.dataset.v));
try{const s=JSON.parse(localStorage.getItem(EX.key)||'null');if(s){if(s.m)setMode(s.m);if(s.v&&EX.variants.includes(s.v))setVar(s.v);}}catch(e){}
setMode(MODE);setVar(VAR);
document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
requestAnimationFrame(frame);

/* legenda volgt de gekozen variatie */
function legend(){document.querySelectorAll('.legend [data-when]').forEach(el=>{el.hidden=!el.dataset.when.split(',').includes(VAR);});}
document.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',legend));legend();
<\/script>

</body></html>
</script>
<script type="text/plain" data-ex="pullapart">
<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Band pull-apart</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one stage card with the animation, mode/variation buttons, playback controls and a muscle legend */
:root{
  --bg:#EDF0EE; --stage:#F8FAF9; --ink:#1E2426; --muted:#5E686A; --body:#2A3134; --far:#7C8689;
  --muscle:#E0452B; --mat:#D6DCD9; --line:#D3D9D6; --band:#2C8C7E; --bandfar:#8CC2B9; --post:#B9C1BE;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --text:"Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121617; --stage:#1A1F20; --ink:#E8ECEA; --muted:#98A3A0; --body:#D9E0DD; --far:#7F8A87;
  --muscle:#FF5B3E; --mat:#2A3133; --line:#2C3335; --band:#4DBDAC; --bandfar:#2F6E66; --post:#3A4345; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121617; --stage:#1A1F20; --ink:#E8ECEA; --muted:#98A3A0; --body:#D9E0DD; --far:#7F8A87;
  --muscle:#FF5B3E; --mat:#2A3133; --line:#2C3335; --band:#4DBDAC; --bandfar:#2F6E66; --post:#3A4345; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
main{max-width:860px;margin:0 auto;display:grid;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,7vw,52px);line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;height:auto}
.bar{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;border-top:1px solid var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button[aria-pressed="true"]{background:var(--ink);color:var(--stage);border-color:var(--ink)}
.mode{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.03em;padding:4px 12px}
button:focus-visible{outline:2px solid var(--muscle);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:15px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muscle)}
.dot.soft{opacity:.55}
</style>

<main>
  <header>
    <h1>Band pull-apart</h1>
    <p class="sub">Met elastiek · bovenrug en achterkant schouders</p>
  </header>

  <section class="stage">
    <canvas id="c" width="1200" height="975" aria-label="Animatie van een band pull-apart met elastiek, van voren en van bovenaf"></canvas>
    <div class="bar">
      <div class="seg" role="group" aria-label="Uitvoering">
        <button class="mode" data-m="iso" aria-pressed="false">Isometrisch</button>
        <button class="mode" data-m="dyn" aria-pressed="true">Dynamisch</button>
      </div>
      <div class="seg" role="group" aria-label="Variatie">
        <button data-v="hor" aria-pressed="true">Horizontaal</button>
        <button data-v="diag" aria-pressed="false">Diagonaal</button>
        <button data-v="over" aria-pressed="false">Boven het hoofd</button>
      </div>
      <div class="seg">
        <button id="play" aria-pressed="false">Pauze</button>
        <button id="slow" aria-pressed="false">Langzaam</button>
      </div>
    </div>
  </section>

  <div class="legend">
    <span><i class="dot"></i>Rhomboïden en middelste trapezius (primair)</span>
    <span><i class="dot soft"></i>Achterste schouder (secundair)</span>
  </div>
</main>

<script>
/* Band pull-apart: staand, elastiek in beide handen, gestrekte armen uit elkaar */
const EX={key:'pullapart',VW:640,VH:520,variants:['hor','diag','over'],reduceT:1,
  layout(){return[
    {kind:'front',cx:188,cy:468,sc:.66,ly:503,matW:440},
    {kind:'top',cx:494,cy:236,sc:.48,ly:503}];},
  state(mode,variant,time){
    if(mode==='iso'){const t=isoT(time);return{t,glow:.85+.15*Math.sin(time*Math.PI*2*6.5),flip:0};}
    const T=3.6,t=cycle(time,1.3,.5,1.3,.5);
    return{t,glow:.3+.7*t,flip:variant==='diag'?repIndex(time,T)%2:0};
  },
  scene(st,variant){
    const f=standing(),t=st.t;
    for(let i=0;i<2;i++){const s=i?1:-1;let d;
      if(variant==='hor'){const p=(4+78*t)*DEG;d=V(s*Math.sin(p),0,Math.cos(p));}
      else if(variant==='diag'){const up=(s*(st.flip?-1:1))>0,e=(up?40:-40)*t*DEG,p=(4+76*t)*DEG;
        d=V(s*Math.sin(p)*Math.cos(e),Math.sin(e),Math.cos(p)*Math.cos(e));}
      else{const a=(4+76*t)*DEG;d=nrm(V(s*Math.sin(a),Math.cos(a),.1-.24*t));}
      armDir(f,i,d,d,'fist');}
    const A=fistC(f.arms[0]),B=fistC(f.arms[1]);
    const g=st.glow;
    return{fig:f,
      bands:[{a:A,b:B,k:clamp((len(sub(A,B))-110)/300),sag:18,w:7.5}],
      onTorso(v,f,c){
        /* rhomboïden + middelste trapezius tussen de schouderbladen (zichtbaar van boven) */
        for(const s of [-1,1]){
          const p=sum(f.Sc,mul(f.fwd,-16),mul(f.lat,s*(36-9*t)),mul(f.up,-6));
          mus(v,c,p,add(mul(f.fwd,-1),mul(f.up,.9)),13,10,0,g);
        }
      },
      onArm(v,f,c,i){
        const a=f.arms[i];
        ctx.save();ctx.globalAlpha=g*.55;ctx.fillStyle=c.mus;
        const S=v.pr(a.sh);ctx.beginPath();ctx.ellipse(S.x,S.y,v.kind==='top'?13:12,v.kind==='top'?13:14,0,0,Math.PI*2);ctx.fill();ctx.restore();
      }};
  }
};

/* ===== Gedeelde engine groep 3 (staand met elastiek) =====
   Zelfde helpers en maten als plank / standing row / pass-through.
   Het figuur wordt als 3D-skelet opgebouwd (x = opzij, y = omhoog, z = naar voren)
   en per aanzicht geprojecteerd: voor, achter, zij (gezicht naar rechts) of boven. */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();ctx.fill();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
const P=(x,y)=>({x,y});
const ease=t=>.5-.5*Math.cos(Math.PI*t);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const DEG=Math.PI/180;

/* vaste spierprofielen */
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
/* voor-/achter-/bovenaanzicht: symmetrische varianten (zoals horse stance / pass-through) */
const S_UA=[[4,.5,.22]],S_FA=[[3,.25,.2]],S_TH_F=[[5,.45,.28]],S_TH_B=[[4,.4,.3]],S_SH=[[3,.28,.18]];
const L_TH=148,L_SH=132,L_UA=104,L_FA=81;

/* ---------- 3D ---------- */
const V=(x,y,z)=>({x,y,z});
const add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z),sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z);
const mul=(a,k)=>V(a.x*k,a.y*k,a.z*k),dt3=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const len=a=>Math.hypot(a.x,a.y,a.z),nrm=a=>mul(a,1/(len(a)||1));
const lerp=(a,b,t)=>V(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t,a.z+(b.z-a.z)*t);
const cross=(a,b)=>V(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x);
const sum=(...p)=>p.reduce(add);
function ik3(A,B,l1,l2,pole){
  let d=sub(B,A),L=len(d);const u=nrm(d);
  if(L>l1+l2-.01){L=l1+l2-.01;B=add(A,mul(u,L));}
  const a=(l1*l1-l2*l2+L*L)/(2*L),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  const p=nrm(sub(pole,mul(u,dt3(pole,u))));
  return [add(add(A,mul(u,a)),mul(p,h)),B];
}

/* ---------- figuur ---------- index 0 = kant x<0, index 1 = kant x>0 */
function body(Hc,Sc){
  const up=nrm(sub(Sc,Hc)),lat=V(1,0,0),fwd=nrm(cross(lat,up));
  const f={Hc,Sc,up,lat,fwd,arms:[null,null],legs:[null,null]};
  f.sh=[-1,1].map(s=>add(Sc,mul(lat,s*50)));
  f.hip=[-1,1].map(s=>sum(Hc,mul(lat,s*20),mul(up,-4)));
  f.head=sum(Sc,mul(up,56),mul(fwd,5));
  f.neck=[add(Sc,mul(up,14)),sum(Sc,mul(up,30),mul(fwd,2))];
  return f;
}
function leg(f,i,an,pole,foot){
  const [kn,a]=ik3(f.hip[i],an,L_TH,L_SH,pole);
  const fd=foot&&foot.dir?nrm(foot.dir):V(0,0,1);
  const heel=foot&&foot.heel?foot.heel:add(a,add(mul(fd,-6),V(0,-2,0)));
  const toe=foot&&foot.toe?foot.toe:add(a,add(mul(fd,38),V(0,-6,0)));
  f.legs[i]={hip:f.hip[i],kn,an:a,heel,toe,flatFront:!(foot&&foot.toe)};
}
function armDir(f,i,dUA,dFA,hand){
  const el=add(f.sh[i],mul(nrm(dUA),L_UA)),wr=add(el,mul(nrm(dFA),L_FA));
  f.arms[i]={sh:f.sh[i],el,wr,hand:hand||'fist'};
}
function armIK(f,i,wr,pole,hand){
  const [el,w]=ik3(f.sh[i],wr,L_UA,L_FA,pole);
  f.arms[i]={sh:f.sh[i],el,wr:w,hand:hand||'fist'};
}
/* ontspannen hangende arm langs het lichaam */
function armHang(f,i,swing=0){
  const s=i?1:-1;
  armDir(f,i,V(s*.08,-1,swing+f.up.z*.25),V(s*.04,-1,.12+swing+f.up.z*.25),'hang');
}
/* staande basishouding: voeten op heupbreedte, knieën heel licht gebogen */
function standing(o={}){
  const Hc=o.Hc||V(0,290,-4),lean=o.lean||0;
  const up=V(0,Math.cos(lean),Math.sin(lean));
  const f=body(Hc,add(Hc,mul(up,155)));
  for(let i=0;i<2;i++){const s=i?1:-1;
    const an=o.an?o.an[i]:V(s*(o.feet||24),12,0);
    leg(f,i,an,V(s*(o.kneeOut||0),0,1),o.foot?o.foot[i]:null);}
  return f;
}
const fistC=a=>add(a.wr,mul(nrm(sub(a.wr,a.el)),9));

/* ---------- aanzichten ---------- */
function mkView(kind,cx,cy,sc,label){
  const v={kind,cx,cy,sc,label};
  if(kind==='front'){v.pr=p=>P(p.x,-p.y);v.dp=p=>p.z;v.cam=V(0,0,1);}
  else if(kind==='back'){v.pr=p=>P(-p.x,-p.y);v.dp=p=>-p.z;v.cam=V(0,0,-1);}
  else if(kind==='side'){v.pr=p=>P(p.z,-p.y);v.dp=p=>-p.x;v.cam=V(-1,0,0);}
  else {v.pr=p=>P(p.x,p.z);v.dp=p=>p.y;v.cam=V(0,1,0);}
  return v;
}
const LABELS={front:'VOORAANZICHT',back:'ACHTERAANZICHT',side:'ZIJAANZICHT',top:'BOVENAANZICHT'};

function outlined(c,col,fn){
  const f0=ctx.fill;ctx.strokeStyle=c.stage;ctx.lineWidth=5;ctx.lineJoin='round';
  ctx.fill=function(){ctx.stroke();};fn(true);ctx.fill=f0;
  ctx.fillStyle=col;fn(false);
}
function offP(p,o){return o?P(p.x+o.x,p.y+o.y):p;}

function drawLeg(v,L,o){
  const pr=p=>offP(v.pr(p),o);
  const H=pr(L.hip),K=pr(L.kn),A=pr(L.an);
  const side=v.kind==='side';
  const thigh=()=>{side?limb(H,K,24,15,THIGH_F,THIGH_B):limb(H,K,24,16,S_TH_F,S_TH_B);dot(K,side?14.5:15);};
  const shin=()=>{side?limb(K,A,14.5,9,SHIN_F,SHIN_B):limb(K,A,15,9,S_SH,S_SH);foot();};
  const foot=()=>{
    if((v.kind==='front'||v.kind==='back')&&L.flatFront){
      ctx.beginPath();ctx.ellipse(A.x,A.y+4,13,10,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(A.x,A.y+7,16,6,0,0,Math.PI*2);ctx.fill();
    }else{
      const he=pr(L.heel),to=pr(L.toe);
      if(Math.hypot(to.x-he.x,to.y-he.y)<6){ctx.beginPath();ctx.ellipse(A.x,A.y+5,12,8,0,0,Math.PI*2);ctx.fill();}
      else capsule(he,v.kind==='top'?9:10,to,v.kind==='top'?8:6);
    }
  };
  const dT=v.dp(lerp(L.hip,L.kn,.5)),dS=v.dp(lerp(L.kn,L.an,.5));
  if(dS<dT-4){shin();thigh();}else{thigh();shin();}
}
function drawHand(v,a,o){
  const pr=p=>offP(v.pr(p),o);
  if(a.hand==='none')return;
  const d=nrm(sub(a.wr,a.el)),W=pr(a.wr);
  const off=a.hand==='hang'?11:9,C=pr(add(a.wr,mul(d,off)));
  const dx=C.x-W.x,dy=C.y-W.y,h=Math.hypot(dx,dy)/off;
  ctx.save();ctx.translate(C.x,C.y);ctx.rotate(Math.atan2(dy,dx));ctx.beginPath();
  if(a.hand==='hang')ctx.ellipse(0,0,Math.max(8.5,10.5*h),8.5,0,0,Math.PI*2);
  else ctx.ellipse(0,0,9.5+1.5*h,9.5,0,0,Math.PI*2);
  ctx.fill();ctx.restore();
}
function drawArm(v,a,o,hook){
  const pr=p=>offP(v.pr(p),o);
  const S=pr(a.sh),E=pr(a.el),W=pr(a.wr),side=v.kind==='side';
  const ua=()=>{side?limb(S,E,16,11,UA_F,UA_B):limb(S,E,16,11,S_UA,S_UA);dot(E,11);};
  const fa=()=>{side?limb(E,W,11.5,6.5,FA_F,FA_B):limb(E,W,11.5,6.5,S_FA,S_FA);drawHand(v,a,o);};
  const sh=()=>{if(side)dot(P(S.x+3,S.y-2),21);else dot(S,v.kind==='top'?18:17);if(hook)hook();};
  const dU=v.dp(lerp(a.sh,a.el,.5)),dF=v.dp(lerp(a.el,a.wr,.5));
  const parts=dF<dU-4?[fa,ua]:[ua,fa];
  /* arm die naar de camera wijst: schouderbol eerst, anders verdwijnt de vuist erachter */
  if(v.dp(a.el)>v.dp(a.sh)+8){sh();parts.forEach(p=>p());}
  else{parts.forEach(p=>p());sh();}
}
function drawTorso(v,f,c){
  const S=v.pr(f.Sc),H=v.pr(f.Hc);
  if(v.kind==='front'||v.kind==='back'){
    const k=Math.max(.55,(H.y-S.y)/155);
    ctx.save();ctx.translate(S.x,S.y);ctx.scale(1,k*155/128);ctx.translate(0,300);
    ctx.beginPath();ctx.moveTo(-15,-314);
    ctx.quadraticCurveTo(-28,-306,-44,-300);ctx.quadraticCurveTo(-54,-280,-49,-258);
    ctx.quadraticCurveTo(-42,-232,-37,-208);ctx.quadraticCurveTo(-46,-190,-45,-172);
    ctx.lineTo(45,-172);ctx.quadraticCurveTo(46,-190,37,-208);ctx.quadraticCurveTo(42,-232,49,-258);
    ctx.quadraticCurveTo(54,-280,44,-300);ctx.quadraticCurveTo(28,-306,15,-314);
    ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.ellipse(0,-172,48,16,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
    capsule(v.pr(f.neck[0]),13,v.pr(f.neck[1]),11);
    const hd=v.pr(f.head);ctx.beginPath();ctx.ellipse(hd.x,hd.y,24,30,0,0,Math.PI*2);ctx.fill();
  }else if(v.kind==='side'){
    F=-1;
    limb(S,H,27,24,T_FRONT,T_BACK);
    const rot=Math.atan2(S.x-H.x,-(S.y-H.y));
    const B=v.pr(sub(f.Hc,mul(f.fwd,15)));
    ctx.beginPath();ctx.ellipse(B.x,B.y,23,31,rot,0,Math.PI*2);ctx.fill();
    capsule(v.pr(f.neck[0]),12,v.pr(f.neck[1]),11);
    const hd=v.pr(f.head);ctx.beginPath();ctx.ellipse(hd.x,hd.y,25,29,rot*.6,0,Math.PI*2);ctx.fill();
  }else{
    const a=v.pr(f.Sc),b=v.pr(f.Hc);
    ctx.beginPath();ctx.moveTo(a.x-54,a.y);ctx.lineTo(b.x-42,b.y);ctx.lineTo(b.x+42,b.y);ctx.lineTo(a.x+54,a.y);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.ellipse(b.x,b.y,42,24,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(a.x,a.y,56,28,0,0,Math.PI*2);ctx.fill();
  }
}
function drawTopHead(v,f){
  const hd=v.pr(f.head);ctx.beginPath();ctx.ellipse(hd.x,hd.y,25,29,0,0,Math.PI*2);ctx.fill();
}
/* elastiek: a -> b, rek 0..1 maakt hem dunner en strakker; stub = alleen het eerste stuk vanaf a */
function drawBand(v,b,c){
  const A=v.pr(b.a),B0=v.pr(b.b),st=b.stub||1;
  const B=P(A.x+(B0.x-A.x)*st,A.y+(B0.y-A.y)*st);
  const sag=v.kind==='top'?0:(1-b.k)*(b.sag==null?14:b.sag)*st+1;
  ctx.strokeStyle=b.far?c.bandfar:c.band;ctx.lineCap='round';
  ctx.lineWidth=Math.max(2.6,(b.w||7)-3.6*b.k);
  ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.quadraticCurveTo((A.x+B.x)/2,(A.y+B.y)/2+sag,B.x,B.y);ctx.stroke();
}
/* spier op het lichaam: zichtbaarheid volgt de richting van het huidoppervlak t.o.v. de camera */
function mus(v,c,p3,n3,rx,ry,rot,alpha){
  const vis=clamp((dt3(nrm(n3),v.cam)+.35)/.6);
  if(vis<=0||alpha<=0)return;
  const p=v.pr(p3);
  ctx.save();ctx.globalAlpha=alpha*vis;ctx.fillStyle=c.mus;
  ctx.beginPath();ctx.ellipse(p.x,p.y,rx,ry,rot,0,Math.PI*2);ctx.fill();ctx.restore();
}
function torsoRot(v,f){const a=v.pr(f.Hc),b=v.pr(f.Sc);return Math.atan2(b.x-a.x,-(b.y-a.y));}
/* spier langs een ledemaatdeel */
function musLimb(v,c,p,q,t0,t1,r0,r1,alpha,n3){
  const vis=n3?clamp((dt3(nrm(n3),v.cam)+.35)/.6):1;if(vis<=0||alpha<=0)return;
  const a=v.pr(lerp(p,q,t0)),b=v.pr(lerp(p,q,t1));
  ctx.save();ctx.globalAlpha=alpha*vis;ctx.fillStyle=c.mus;capsule(a,r0,b,r1);ctx.restore();
}

function drawFigure(v,f,c,scene){
  const G=[],side=v.kind==='side',flat=v.kind==='front'||v.kind==='back';
  const td=v.dp(lerp(f.Hc,f.Sc,.5));
  const farOf=i=>side&&i===1;
  const col=i=>farOf(i)?c.far:c.body,off=i=>farOf(i)?P(-10,-3):null;
  for(let i=0;i<2;i++){const L=f.legs[i];if(!L)continue;
    let d=v.dp(lerp(L.hip,L.kn,.5));if(flat)d=td-40+d*.01;
    G.push({d,fn:()=>{ctx.fillStyle=v.kind==='top'?c.far:col(i);drawLeg(v,L,off(i));}});}
  G.push({d:td,fn:()=>{ctx.fillStyle=c.body;drawTorso(v,f,c);if(scene.onTorso)scene.onTorso(v,f,c);}});
  if(v.kind==='top')G.push({d:v.dp(f.head)-1,fn:()=>{outlined(c,c.body,()=>drawTopHead(v,f));if(scene.onHead)scene.onHead(v,f,c);}});
  for(let i=0;i<2;i++){const a=f.arms[i];if(!a)continue;
    let d=v.dp(lerp(a.el,a.wr,.5));
    if(flat&&d>td-25)d+=20;if(v.kind==='top')d+=5;
    const behind=d<td;
    const hook=scene.onArm?()=>scene.onArm(v,f,c,i):null;
    G.push({d,fn:()=>{
      if(behind||farOf(i)){ctx.fillStyle=col(i);drawArm(v,a,off(i),farOf(i)?null:hook);}
      else outlined(c,col(i),st=>drawArm(v,a,null,st?null:hook));}});}
  for(const b of scene.bands||[]){
    if(b.views&&!b.views.includes(v.kind))continue;
    const bb=Object.assign({},b);
    if(b.stubIn&&b.stubIn.includes(v.kind))bb.stub=b.stubLen||.18;
    let d=v.dp(lerp(b.a,b.b,bb.stub?bb.stub/2:.5))+(b.bias||0);
    if(b.depth&&b.depth[v.kind]!=null)d=b.depth[v.kind];
    bb.far=!b.near&&(d<td-10||b.forceFar);
    G.push({d,fn:()=>drawBand(v,bb,c)});
  }
  for(const x of scene.extras||[])if(!x.views||x.views.includes(v.kind))G.push({d:typeof x.d==='function'?x.d(v,td):x.d,fn:()=>x.fn(v,c)});
  G.sort((a,b)=>a.d-b.d).forEach(g=>g.fn());
  if(scene.onTop)scene.onTop(v,f,c);
}

/* paal of deurpost (token --post) */
function postFlat(c,x,top,bottom=0,w=16){ctx.fillStyle=c.post;ctx.beginPath();ctx.roundRect(x-w/2,-top,w,top-bottom,4);ctx.fill();}
function anchorClip(c,p){ctx.fillStyle=c.band;ctx.beginPath();ctx.roundRect(p.x-11,p.y-9,22,18,6);ctx.fill();}
function postTop(c,p){ctx.fillStyle=c.post;ctx.beginPath();ctx.roundRect(p.x-11,p.y-11,22,22,4);ctx.fill();}

/* ---------- pagina / afspelen ---------- */
let playing=true,slow=false,phaseT=0,last=performance.now();
let MODE='dyn',VAR=EX.variants[0];
function colors(){return{stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),
  muted:tok('--muted'),band:tok('--band'),bandfar:tok('--bandfar'),post:tok('--post')};}
function render(){
  const k=cv.width/EX.VW;ctx.setTransform(k,0,0,k,0,0);
  const c=colors();
  ctx.fillStyle=c.stage;ctx.fillRect(0,0,EX.VW,EX.VH);
  const time=window.__time!=null?window.__time:phaseT;
  const mode=window.__mode||MODE,variant=window.__var||VAR;
  const st=EX.state(mode,variant,time);
  if(window.__t!=null)st.t=window.__t;
  if(reduce&&window.__t==null){st.t=EX.reduceT!=null?EX.reduceT:1;st.t2=st.t;}
  const scene=EX.scene(st,variant,mode);
  const views=EX.layout(variant,mode);
  for(const vd of views){
    const v=mkView(vd.kind,vd.cx,vd.cy,vd.sc,vd.label);
    ctx.save();ctx.translate(v.cx,v.cy);ctx.scale(v.sc,v.sc);
    if(v.kind!=='top'&&vd.mat!==false){ctx.fillStyle=c.mat;const w=vd.matW||300;ctx.beginPath();ctx.roundRect((vd.matX||0)-w/2,0,w,10,5);ctx.fill();}
    if(scene.props)scene.props(v,c);
    drawFigure(v,scene.fig,c,scene);
    ctx.restore();
    ctx.fillStyle=c.muted;ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign='center';
    ctx.fillText(vd.label||LABELS[vd.kind],vd.lx!=null?vd.lx:vd.cx,vd.ly);
  }
}
function frame(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;
  if(playing&&!reduce)phaseT+=dt*(slow?.5:1);
  render();
  requestAnimationFrame(frame);
}
/* hulpfuncties voor de tijdlijn */
function cycle(ph,out,hold,back,rest){
  const T=out+hold+back+rest;ph=((ph%T)+T)%T;
  if(ph<out)return ease(ph/out);
  if(ph<out+hold)return 1;
  if(ph<out+hold+back)return 1-ease((ph-out-hold)/back);
  return 0;
}
function repIndex(ph,T){return Math.floor(ph/T);}
/* isometrisch: vasthouden met lichte trillende spanning en ademhaling */
function isoT(time,hold=1){return hold-.012*(.5+.5*Math.sin(time*Math.PI*2*6.5))-.018*(.5+.5*Math.sin(time*Math.PI*2/4));}

function setMode(m){MODE=m;phaseT=0;document.querySelectorAll('[data-m]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===m)));save();}
function setVar(x){VAR=x;phaseT=0;document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===x)));save();}
function save(){try{localStorage.setItem(EX.key,JSON.stringify({m:MODE,v:VAR}))}catch(e){}}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>setVar(b.dataset.v));
try{const s=JSON.parse(localStorage.getItem(EX.key)||'null');if(s){if(s.m)setMode(s.m);if(s.v&&EX.variants.includes(s.v))setVar(s.v);}}catch(e){}
setMode(MODE);setVar(VAR);
document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
requestAnimationFrame(frame);

<\/script>

</body></html>
</script>
<script type="text/plain" data-ex="exorotatie">
<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Exorotatie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one stage card with the animation, mode/variation buttons, playback controls and a muscle legend */
:root{
  --bg:#EDF0EE; --stage:#F8FAF9; --ink:#1E2426; --muted:#5E686A; --body:#2A3134; --far:#7C8689;
  --muscle:#E0452B; --mat:#D6DCD9; --line:#D3D9D6; --band:#2C8C7E; --bandfar:#8CC2B9; --post:#B9C1BE;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --text:"Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121617; --stage:#1A1F20; --ink:#E8ECEA; --muted:#98A3A0; --body:#D9E0DD; --far:#7F8A87;
  --muscle:#FF5B3E; --mat:#2A3133; --line:#2C3335; --band:#4DBDAC; --bandfar:#2F6E66; --post:#3A4345; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121617; --stage:#1A1F20; --ink:#E8ECEA; --muted:#98A3A0; --body:#D9E0DD; --far:#7F8A87;
  --muscle:#FF5B3E; --mat:#2A3133; --line:#2C3335; --band:#4DBDAC; --bandfar:#2F6E66; --post:#3A4345; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
main{max-width:860px;margin:0 auto;display:grid;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,7vw,52px);line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;height:auto}
.bar{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;border-top:1px solid var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:6px}

button[aria-pressed="true"]{background:var(--ink);color:var(--stage);border-color:var(--ink)}
.mode{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.03em;padding:4px 12px}
button:focus-visible{outline:2px solid var(--muscle);outline-offset:2px}
