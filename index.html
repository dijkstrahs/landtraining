<script>
/* ===== Gedeelde helpers (zelfde maten en spierprofielen als Plank hold / Bird dog) ===== */
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();ctx.fill();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
function curveLimb(a,c,b,rA,rB,front,back){
  const N=36,prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,cc,w]of bs)r+=m*Math.exp(-(((t-cc)/w)**2));return r};
  const pt=t=>P((1-t)*(1-t)*a.x+2*(1-t)*t*c.x+t*t*b.x,(1-t)*(1-t)*a.y+2*(1-t)*t*c.y+t*t*b.y);
  const tg=t=>{const x=2*(1-t)*(c.x-a.x)+2*t*(b.x-c.x),y=2*(1-t)*(c.y-a.y)+2*t*(b.y-c.y),l=Math.hypot(x,y)||1;return P(x/l,y/l)};
  const L=[],Rr=[];
  for(let i=0;i<=N;i++){const t=i/N,p=pt(t),u=tg(t),nx=-u.y*F,ny=u.x*F,rf=prof(t,front),rb=prof(t,back);
    L.push(P(p.x+nx*rf,p.y+ny*rf));Rr.push(P(p.x-nx*rb,p.y-ny*rb));}
  ctx.beginPath();L.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
  for(let i=N;i>=0;i--)ctx.lineTo(Rr[i].x,Rr[i].y);ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
  return {pt,tg};
}
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
const P=(x,y)=>({x,y});
const ell=(c,rx,ry,a)=>{ctx.beginPath();ctx.ellipse(c.x,c.y,rx,ry,a||0,0,Math.PI*2);ctx.fill();};

function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-4,W.y-9);
  ctx.quadraticCurveTo(W.x+14,W.y-10,W.x+28,W.y-3);
  ctx.quadraticCurveTo(W.x+40,W.y+1,W.x+40,W.y+5);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+16,W.y+8);
  ctx.lineTo(W.x-6,W.y+8);
  ctx.closePath();ctx.fill();
}
/* vlakke hand gedraaid; ang 0 = vingers naar voren plat op de vloer */
function rotHand(W,ang,flip){ctx.save();ctx.translate(W.x,W.y);ctx.rotate(ang);if(flip)ctx.scale(1,-1);hand(P(0,0));ctx.restore();}
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
function edgeHand(W,T){const dx=T.x-W.x,dy=T.y-W.y,L=Math.hypot(dx,dy);if(L<1){dot(W,8);return;}const a=Math.atan2(dy,dx),h=Math.min(1,L/16);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(2+17*h,0,6+15*h,9,0,0,Math.PI*2);ctx.fill();ctx.restore();}

const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];
const L_TORSO=155,L_THIGH=148,L_SHIN=132,L_UA=104,L_FA=81;

const ease=t=>.5-.5*Math.cos(Math.PI*Math.max(0,Math.min(1,t)));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const DEG=Math.PI/180,lerp=(a,b,t)=>a+(b-a)*t;
const add=(a,b)=>P(a.x+b.x,a.y+b.y),sub=(a,b)=>P(a.x-b.x,a.y-b.y),mul=(a,k)=>P(a.x*k,a.y*k);
const len=a=>Math.hypot(a.x,a.y),nrm=a=>{const l=len(a)||1;return P(a.x/l,a.y/l)};
const dirA=a=>P(Math.cos(a),Math.sin(a));
const along=(a,b,t)=>P(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t);
/* 2D-IK: gewricht tussen A en B, aan de kant van richting pref */
function ik(A,B,l1,l2,pref){
  const d0=len(sub(B,A)),d=Math.min(Math.max(d0,Math.abs(l1-l2)+.01),l1+l2-.01);
  const u=nrm(sub(B,A)),n=P(-u.y,u.x),a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  const s=(n.x*pref.x+n.y*pref.y)>=0?1:-1;
  return P(A.x+u.x*a+n.x*h*s,A.y+u.y*a+n.y*h*s);
}
/* 3D-punten {x,y,z}: x naar voren, y omlaag (scherm), z naar rechts van de persoon (naar de camera) */
const V=(x,y,z)=>({x,y,z:z||0});
const vadd=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z),vsub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z),vmul=(a,k)=>V(a.x*k,a.y*k,a.z*k);
const vdot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,vlen=a=>Math.sqrt(vdot(a,a)),vnrm=a=>vmul(a,1/(vlen(a)||1));
const vlerp=(a,b,t)=>V(lerp(a.x,b.x,t),lerp(a.y,b.y,t),lerp(a.z,b.z,t));
function ik3(A,B,l1,l2,pref){
  const AB=vsub(B,A),d0=vlen(AB),d=Math.min(Math.max(d0,Math.abs(l1-l2)+.01),l1+l2-.01),u=vnrm(AB);
  let n=vsub(pref,vmul(u,vdot(pref,u)));if(vlen(n)<1e-6)n=V(0,-1,0);n=vnrm(n);
  const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  return vadd(vadd(A,vmul(u,a)),vmul(n,h));
}
const sideP=p=>P(p.x,p.y),topP=p=>P(p.x,p.z);

/* ===== Onderdelen van het zijaanzicht (figuur kijkt naar rechts) ===== */
function torso(S,H){limb(S,H,27,24,T_FRONT,T_BACK);}
function bil(S,H){const u=nrm(sub(H,S)),a=Math.atan2(u.y,u.x);ell(P(H.x-u.y*15-u.x*2,H.y+u.x*15-u.y*2),31,23,a);}
function bilSeated(S,H){const u=nrm(sub(H,S)),a=Math.atan2(u.y,u.x);ell(P(H.x-u.y*9+u.x*3,H.y+u.x*9+u.y*3),27,22,a+.25);}
function head(S,hd){
  capsule(P(S.x+hd.x*14,S.y+hd.y*14),12,P(S.x+hd.x*30,S.y+hd.y*30),11);
  ell(P(S.x+hd.x*56,S.y+hd.y*56),29,25,Math.atan2(hd.y,hd.x));
}
function leg(H,K,A,footFn){limb(H,K,24,15,THIGH_F,THIGH_B);dot(K,14.5);limb(K,A,14.5,9,SHIN_F,SHIN_B);if(footFn)footFn(A,K);}
function arm(Sj,E,W,handFn){limb(Sj,E,16,11,UA_F,UA_B);dot(E,11);limb(E,W,11.5,6.5,FA_F,FA_B);if(handFn)handFn(W,E);dot(P(Sj.x+2,Sj.y-2),21);}
/* voeten */
const footStand=(A,rise)=>{rise=rise||0;const T=P(A.x+32,A.y+7),hl=P(A.x-6,A.y+3);
  if(!rise){capsule(hl,9,T,6);return;}const a=-rise,c=Math.cos(a),s=Math.sin(a),rot=p=>P(T.x+(p.x-T.x)*c-(p.y-T.y)*s,T.y+(p.x-T.x)*s+(p.y-T.y)*c);capsule(rot(hl),9,T,6);};
const footFlatBack=A=>capsule(A,9,P(A.x-34,A.y+6),6);
const footTucked=A=>{capsule(P(A.x-6,A.y+2),9,P(A.x+12,A.y+15),6);capsule(P(A.x+12,A.y+15),6,P(A.x+22,A.y+16),4);};
const footDir=(A,ang)=>{const d=dirA(ang);capsule(P(A.x-d.x*4,A.y-d.y*4),9,P(A.x+d.x*34,A.y+d.y*34),6);};
/* handen */
const hFlat=W=>hand(W);
const hAlong=(W,E)=>rotHand(W,Math.atan2(W.y-E.y,W.x-E.x));
/* nabije arm met dun randje in de achtergrondkleur */
function outlined(fn,c,col){const f0=ctx.fill;ctx.strokeStyle=c.stage;ctx.lineWidth=5;ctx.lineJoin='round';ctx.fill=function(){ctx.stroke();};fn();ctx.fill=f0;ctx.fillStyle=col||c.body;fn();}
function glow(alpha,fn){ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,alpha));ctx.fillStyle=COL.mus;fn();ctx.restore();}
/* spier langs een segment, naar de voorkant (+1) of achterkant (-1) */
function muscleOn(a,b,t0,t1,off,r0,r1){const u=nrm(sub(b,a)),n=P(u.y,-u.x);const p0=add(along(a,b,t0),mul(n,off)),p1=add(along(a,b,t1),mul(n,off));capsule(p0,r0,p1,r1);}
function label(txt,x,y,align){ctx.fillStyle=COL.muted;ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign=align||'left';ctx.fillText(txt,x,y);}
function mat(x,y,w){ctx.fillStyle=COL.mat;ctx.beginPath();ctx.roundRect(x,y,w,10,5);ctx.fill();}
let COL={};

/* ===== Extra helpers voor groep 6 ===== */
const hBack=W=>rotHand(W,Math.PI,true);           /* vlakke hand op de vloer, vingers naar achteren */
const rotV=(v,a)=>P(v.x*Math.cos(a)-v.y*Math.sin(a),v.x*Math.sin(a)+v.y*Math.cos(a));
/* staande voet; fa = hiel omhoog (rad), de bal blijft op de grond */
function footRise(A,fa){
  fa=fa||0;const r=v=>add(A,rotV(v,fa));
  const ball=r(P(27,6));capsule(r(P(-6,3)),9,ball,6.5);
  const toe=fa<.05?r(P(37,6.5)):P(ball.x+10,ball.y+.3);capsule(ball,6.5,toe,5);
}
const ankleOnBall=(ball,fa)=>add(ball,rotV(P(-27,-6),fa||0));
const FLAT_ANK=-13;                 /* hoogte van de enkel bij een platte voet */
/* arm met hoeken: a = schouderhoek vanaf recht omlaag (+ naar voren), b = elleboog (+ buigt naar voren) */
const dirD=a=>P(Math.sin(a),Math.cos(a));
function armFK(S,a,b){const E=add(S,mul(dirD(a),L_UA)),W=add(E,mul(dirD(a+(b||0)),L_FA));return {E,W};}
function legFK(H,a,b){const K=add(H,mul(dirD(a),L_THIGH)),A=add(K,mul(dirD(a-(b||0)),L_SHIN));return {K,A};}
/* tijdelijke laag met doorzichtigheid (voor in- en uitfaden zonder overlap te zien) */
const OFF=document.createElement('canvas');
function layer(alpha,fn){
  if(alpha>=.999){fn();return;}if(alpha<=.001)return;
  OFF.width=cv.width;OFF.height=cv.height;const o=OFF.getContext('2d');o.setTransform(ctx.getTransform());
  const m=ctx;ctx=o;try{fn();}finally{ctx=m;}
  m.save();m.setTransform(1,0,0,1,0,0);m.globalAlpha=alpha;m.drawImage(OFF,0,0);m.restore();
}
/* hoofdrichting: rompas (heup naar schouder) gedraaid met tilt (+ = kin naar de borst) */
function headDir(S,H,tilt){const u=nrm(sub(S,H)),n=P(-u.y,u.x),t=tilt||0;return P(u.x*Math.cos(t)+n.x*Math.sin(t),u.y*Math.cos(t)+n.y*Math.sin(t));}
/*
 Algemeen zijaanzicht, figuur kijkt naar rechts (+x), grond y=0.
 q: {H,S,C?(controlepunt ronde rug),tilt|hd,seat,
     legs:[ver,nabij] {H?,K,A,foot(A,K)}, arms:[ver,nabij] {Sj?,E,W,hand(W,E)}}
 hk: haken mus (spieren na het nabije been), far (na de verre ledematen), after
*/
function figSide(q,c,hk){
  hk=hk||{};F=-1;
  const fo=q.farOff||P(-11,-3),ao=q.farArmOff||P(-12,-4);
  const hd=q.hd||headDir(q.S,q.H,q.tilt);
  const L=(l,o)=>{ctx.save();ctx.translate(o.x,o.y);leg(l.H||q.H,l.K,l.A,l.foot);ctx.restore();};
  const A=(a,o)=>{ctx.save();ctx.translate(o.x,o.y);arm(a.Sj||q.S,a.E,a.W,a.hand);ctx.restore();};
  ctx.fillStyle=c.far;
  if(q.arms&&q.arms[0])A(q.arms[0],ao);
  if(q.legs&&q.legs[0])L(q.legs[0],fo);
  if(hk.far){ctx.save();hk.far();ctx.restore();}
  ctx.fillStyle=c.body;
  if(q.C)curveLimb(q.S,q.C,q.H,27,24,T_FRONT,T_BACK);else torso(q.S,q.H);
  (q.seat?bilSeated:bil)(q.C||q.S,q.H);
  if(q.legs&&q.legs[1]){if(q.legOutline)outlined(()=>L(q.legs[1],P(0,0)),c);else L(q.legs[1],P(0,0));}
  if(hk.mus){ctx.save();hk.mus();ctx.restore();}
  ctx.fillStyle=c.body;
  if(!q.noHead)head(q.S,hd);
  if(hk.beforeArm){ctx.save();hk.beforeArm();ctx.restore();ctx.fillStyle=c.body;}
  if(q.arms&&q.arms[1]){if(q.armPlain)A(q.arms[1],P(0,0));else outlined(()=>A(q.arms[1],P(0,0)),c);}
  if(hk.after){ctx.save();hk.after();ctx.restore();}
}
/* oplossen: rompkanteling zodat de schouder op afstand d van punt W ligt (bisectie) */
function leanFor(H,W,d,lo,hi){
  const f=l=>len(sub(add(H,P(L_TORSO*Math.sin(l),-L_TORSO*Math.cos(l))),W))-d;
  let a=lo,b=hi;for(let i=0;i<40;i++){const m=(a+b)/2;(f(a)*f(m)<=0)?b=m:a=m;}return (a+b)/2;
}
const shoulderAt=(H,lean)=>add(H,P(L_TORSO*Math.sin(lean),-L_TORSO*Math.cos(lean)));
const trem=t=>.5+.5*Math.sin(t*Math.PI*2*5.3)*Math.sin(t*Math.PI*2*.9+1);
const lerpP=(a,b,t)=>P(lerp(a.x,b.x,t),lerp(a.y,b.y,t));

/* hand plat op de vloer van bovenaf (handpalm naar beneden): palm + vingers ca. 22 voorbij de pols, duim aan de binnenkant.
   W = pols, d = richting van de onderarm (eenheid), inner = punt aan de lichaamskant */
function topHand(W,d,inner){
  const a=Math.atan2(d.y,d.x),ly=P(-d.y,d.x),s=((inner.x-W.x)*ly.x+(inner.y-W.y)*ly.y)>=0?1:-1;
  ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);
  ctx.beginPath();ctx.roundRect(-3,-8.5,25,17,[5,8,8,5]);ctx.fill();
  ctx.beginPath();ctx.ellipse(5,s*9.5,7.5,4.2,s*.55,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

/* ===== Enkel- en voetstrek: op de hielen, knieën omhoog, zittend met gestrekte benen ===== */
const E_A=P(-62,-12),E_HT=P(-76,-47);
/* lift: knieën omhoog 0..1 (onderbeen draait om de enkel), lean: romp (rad, - = naar achteren), hb: handen achter op de vloer 0..1 */
function kneelPose(lift,lean,hb){
  const al=lift*17*DEG,K=add(E_A,P(L_SHIN*Math.cos(al),-L_SHIN*Math.sin(al)));
  const H=add(K,mul(nrm(sub(E_HT,K)),L_THIGH));
  const S=shoulderAt(H,lean);
  const d=nrm(sub(K,H)),nup=P(d.y,-d.x),ta=Math.atan2(d.y,d.x);
  const Wt=add(along(H,K,.6),mul(nup,26));
  const Wb=P(S.x-40,-10);
  const W=lerpP(Wt,Wb,hb),E=ik(S,W,L_UA,L_FA,P(-1,.25));
  const ha=lerp(ta,0,hb);
  return {kind:0,H,S,K,A:E_A,E,W,ha,fa:Math.PI,lift,hb};
}
/* op de knieën met de tenen onder (gestrekt): k = 1 op de hielen, 0 = rechtop knielen */
const T_K=P(70,-14.5),T_A=P(-60,-36.5);
function tuckPose(k,b){
  const a0=Math.atan2(-147,-14),a1=Math.atan2(-57.5,-136.6),a=lerp(a0,a1,k);
  const H=add(T_K,P(L_THIGH*Math.cos(a),L_THIGH*Math.sin(a)));
  const S=shoulderAt(H,(2-4*k)*DEG);
  const d=nrm(sub(T_K,H)),nup=P(d.y,-d.x),ta=Math.atan2(d.y,d.x);
  const W=add(along(H,T_K,.6),mul(nup,26)),E=ik(S,W,L_UA,L_FA,P(-1,.25));
  return {kind:2,H,S,K:T_K,A:T_A,E,W,ha:ta,fa:0,seat:k>.5};
}
const footToes=A=>{const ball=add(A,P(8,30));capsule(add(A,P(-4,-2)),9,ball,6.5);capsule(ball,6.5,add(ball,P(13,.5)),5);};
function seatPose(fa){
  const H=P(0,-36),K=P(148,-27),A=P(280,-17);
  const S=shoulderAt(H,-12*DEG),W=P(-56,-10),E=ik(S,W,L_UA,L_FA,P(-1,0));
  return {kind:1,H,S,K,A,E,W,ha:0,fa};
}
const EX={
  key:'enkel-voetstrek',VW:640,VH:370,
  period:m=>m==='iso'?4:4.4,
  still:()=>0,
  state(m,v,t){
    const b=Math.sin(t*Math.PI*2/4);
    const osc=u=>u<1.6?ease(u/1.6):u<2.2?1:u<3.8?1-ease((u-2.2)/1.6):0;
    let o;
    if(v===0){const k=m==='iso'?0:osc(t);o=kneelPose(.28*k,(3-17*k)*DEG,0);o.gShin=m==='iso'?.85:.6+.4*k;}
    else if(v===1){const k=m==='iso'?1:.15+.85*osc(t);o=kneelPose(k,-22*DEG,1);o.gShin=.5+.5*k;}
    else if(v===2){const k=m==='iso'?0:osc(t);o=seatPose(lerp(22,-62,k)*DEG);o.gShin=1-k;o.gCalf=k;}
    else{const k=m==='iso'?1:.3+.7*osc(t);o=tuckPose(k);o.gToe=.45+.55*k;}
    o.S=P(o.S.x,o.S.y+b*(m==='iso'?1.2:0));
    o.g=m==='iso'?.8+.2*trem(t*.5):1;
    return o;
  },
  draw(m,c){
    const sd=m.kind===1,sc=sd?.95:m.kind===2?.85:1.05;
    ctx.save();ctx.translate(sd?190:250,338);ctx.scale(sc,sc);
    mat(sd?-130:-180,0,sd?520:430);
    enkelSide(m,c);
    ctx.restore();
    label('ZIJAANZICHT',24,362);
  }
};
function enkelSide(m,c){
  const foot=m.kind===1?(A=>footDir(A,m.fa)):m.kind===2?footToes:footFlatBack;
  const hand=W=>rotHand(W,m.ha);
  figSide({H:m.H,S:m.S,tilt:m.kind===1?.08:0,seat:m.kind===2?m.seat:1,
    legs:[{K:m.K,A:m.A,foot},{K:m.K,A:m.A,foot}],
    arms:[{E:m.E,W:m.W,hand},{E:m.E,W:m.W,hand}]},c,{
    mus(){
      const g=m.g;
      if(m.kind===2){
        glow(g*m.gToe,()=>{const ball=add(m.A,P(8,30));capsule(add(m.A,P(-10,4)),6.5,add(ball,P(-5,2)),5);capsule(ball,5,add(ball,P(12,0)),4);});
      }else if(m.kind){
        const d=dirA(m.fa);
        glow(g*(m.gShin||0),()=>{muscleOn(m.K,m.A,.12,.8,9,8,6);capsule(add(m.A,mul(d,6)),6,add(m.A,mul(d,28)),4.5);});
        glow(g*.55*(m.gCalf||0),()=>{muscleOn(m.K,m.A,.15,.45,-11,10,7);});
      }else{
        glow(g*m.gShin,()=>{muscleOn(m.K,m.A,.12,.82,8,8,6);capsule(P(m.A.x-6,m.A.y+3),6,P(m.A.x-28,m.A.y+5),4.5);});
      }
    }
  });
}

/* ===== Afspelen, modus- en variatieknoppen ===== */
let mode='iso',vari=0,playing=true,slow=false,phaseT=0,last=performance.now();
let shown=null,blendFrom=null,blendT=1;
function lerpObj(a,b,k){
  if(typeof b==='number')return typeof a==='number'?a+(b-a)*k:b;
  if(Array.isArray(b))return b.map((v,i)=>lerpObj(a&&a[i],v,k));
  if(b&&typeof b==='object'){const o={};for(const key in b)o[key]=lerpObj(a?a[key]:undefined,b[key],k);return o;}
  return b;
}
function render(s){
  const k=cv.width/EX.VW;
  ctx.setTransform(k,0,0,k,0,0);
  COL={stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),muted:tok('--muted'),band:tok('--band'),post:tok('--post')};
  ctx.fillStyle=COL.stage;ctx.fillRect(0,0,EX.VW,EX.VH);
  EX.draw(s,COL);
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!window.__freeze){
    if(playing&&!reduce)phaseT+=dt*(slow?.5:1);
    const per=EX.period(mode,vari);if(phaseT>=per)phaseT%=per;
    const target=EX.state(mode,vari,reduce?EX.still(mode,vari):phaseT);
    if(blendT<1&&blendFrom){blendT=Math.min(1,blendT+dt/.6);shown=lerpObj(blendFrom,target,ease(blendT));}else shown=target;
    render(shown);
  }
  requestAnimationFrame(frame);
}
function sync(){
  document.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===mode)));
  document.querySelectorAll('.var').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===vari)));
  try{localStorage.setItem(EX.key,mode+'-'+vari)}catch(e){}
}
function choose(m,v){if(m===mode&&v===vari)return;blendFrom=shown;blendT=0;mode=m;vari=v;phaseT=0;sync();}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>choose(b.dataset.m,vari));
document.querySelectorAll('.var').forEach(b=>b.onclick=()=>choose(mode,+b.dataset.v));
document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
(function init(){
  if(EX.modes){if(!EX.modes.includes(mode))mode=EX.modes[0];
    document.querySelectorAll('.mode').forEach(b=>{if(!EX.modes.includes(b.dataset.m))b.hidden=true;});}
  let s=null;try{s=localStorage.getItem(EX.key)}catch(e){}
  const h=location.hash.match(/^#(iso|dyn)-(\d)$/);if(h)s=h[1]+'-'+h[2];
  if(s){const[m,v]=s.split('-');if((m==='iso'||m==='dyn')&&(!EX.modes||EX.modes.includes(m))&&document.querySelector('.var[data-v="'+v+'"]')){mode=m;vari=+v;}}
  sync();
})();
/* testhaak: één moment tekenen */
window.__render=(m,v,ph)=>{window.__freeze=true;mode=m;vari=v;render(EX.state(m,v,ph));};
requestAnimationFrame(frame);

<\/script>

</body></html>
</script>

<script>
/* ---------- shared drawing helpers (vaste maten en spierprofielen) ---------- */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let VX=0,VY=0,VW=640,VH=440;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
const P=(x,y)=>({x,y});
const DEG=Math.PI/180,lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>.5-.5*Math.cos(Math.PI*clamp(t,0,1));
const lerpP=(a,b,t)=>P(lerp(a.x,b.x,t),lerp(a.y,b.y,t));
const dist=(a,b)=>Math.hypot(b.x-a.x,b.y-a.y);
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();ctx.fill();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
/* vlakke hand plat op de vloer: handpalm onder op W.y+8, dikke handrug bij de pols, dunne vingers naar +x */
function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-6,W.y+8);
  ctx.lineTo(W.x+29,W.y+8);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+33.5,W.y+5);
  ctx.quadraticCurveTo(W.x+32,W.y+2,W.x+26,W.y+2);
  ctx.lineTo(W.x+18,W.y+1.5);
  ctx.quadraticCurveTo(W.x+15,W.y-1.5,W.x+10,W.y-1);
  ctx.quadraticCurveTo(W.x+3,W.y-3,W.x-1,W.y-4);
  ctx.quadraticCurveTo(W.x-9,W.y-4,W.x-9,W.y+3);
  ctx.quadraticCurveTo(W.x-9,W.y+8,W.x-6,W.y+8);
  ctx.closePath();ctx.fill();
}
/* hand in de richting van de onderarm gedraaid (hand(W) geroteerd om de pols) */
function handAt(W,ang,flip){ctx.save();ctx.translate(W.x,W.y);ctx.rotate(ang);if(flip)ctx.scale(1,-1);hand(P(0,0));ctx.restore();}
const unit=(a,b)=>{const d=dist(a,b)||1;return P((b.x-a.x)/d,(b.y-a.y)/d);};
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
const fistC=(W,E)=>{const u=unit(E,W);return P(W.x+u.x*9,W.y+u.y*9);};
function edgeHand(W,T,wd=9){const dx=T.x-W.x,dy=T.y-W.y,L=Math.hypot(dx,dy);if(L<1){dot(W,8);return;}const a=Math.atan2(dy,dx),h=Math.min(1,L/16);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(2+17*h,0,6+15*h,wd,0,0,Math.PI*2);ctx.fill();ctx.restore();}
/* twee-segment IK: pick(c1,c2) geeft true als c1 de goede kant is */
function ik(a,b,l1,l2,pick){
  const dx=b.x-a.x,dy=b.y-a.y;let d=Math.hypot(dx,dy);
  d=clamp(d,Math.abs(l1-l2)+.5,l1+l2-.01);
  const ang=Math.atan2(dy,dx),al=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));
  const c1=P(a.x+l1*Math.cos(ang+al),a.y+l1*Math.sin(ang+al)),c2=P(a.x+l1*Math.cos(ang-al),a.y+l1*Math.sin(ang-al));
  return pick(c1,c2)?c1:c2;
}
/* 3D */
const V3=(x,y,z)=>({x,y,z}),add3=(a,b)=>V3(a.x+b.x,a.y+b.y,a.z+b.z),sub3=(a,b)=>V3(a.x-b.x,a.y-b.y,a.z-b.z),
  mul3=(a,k)=>V3(a.x*k,a.y*k,a.z*k),len3=a=>Math.hypot(a.x,a.y,a.z),nrm3=a=>mul3(a,1/(len3(a)||1)),dot3=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,
  lerp3=(a,b,t)=>V3(lerp(a.x,b.x,t),lerp(a.y,b.y,t),lerp(a.z,b.z,t));
/* 3D-IK: pole = richting waar het middengewricht heen wijst */
function ik3(S,W,l1,l2,pole){
  const d0=len3(sub3(W,S))||1,d=clamp(d0,Math.abs(l1-l2)+.5,l1+l2-.01);
  const u=mul3(sub3(W,S),1/d0);
  let v=sub3(pole,mul3(u,dot3(pole,u)));v=nrm3(v);
  const ca=clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1),sa=Math.sqrt(1-ca*ca);
  return add3(S,add3(mul3(u,l1*ca),mul3(v,l1*sa)));
}
/* teken een vorm als dun randje in de achtergrondkleur (eerst stroken, dan vullen) */
function outlined(fn,col){
  const f0=ctx.fill;ctx.save();ctx.strokeStyle=col||tok('--stage');ctx.lineWidth=5;ctx.lineJoin='round';
  ctx.fill=function(){ctx.stroke();};fn();ctx.fill=f0;ctx.restore();fn();
}
function label(c,t,x,y,align='center'){ctx.fillStyle=c.muted;ctx.font='500 15px "Barlow Condensed", sans-serif';ctx.textAlign=align;ctx.fillText(t,x,y);}
function mat(c,x0,w,y=0,h=10){ctx.fillStyle=c.mat;ctx.beginPath();ctx.roundRect(x0,y,w,h,h/2);ctx.fill();}
const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];
const THIGH_F=[[6,.45,.28]],THIGH_B=[[5,.38,.28]],SHIN_F=[[1.5,.3,.3]],SHIN_B=[[8,.27,.17]];
const UA_F=[[4.5,.55,.22]],UA_B=[[5.5,.42,.25]],FA_F=[[4,.22,.2]],FA_B=[[2.5,.25,.22]];
/* vooraanzicht-romp (zoals pass-through/horse stance): schouders op Sy, heup op Hy */
function frontTorso(Sy,Hy){
  const s=(Hy-Sy)/126;
  ctx.save();ctx.translate(0,Hy);ctx.scale(1,s);ctx.translate(0,172);
  ctx.beginPath();ctx.moveTo(-15,-314);
  ctx.quadraticCurveTo(-28,-306,-44,-300);ctx.quadraticCurveTo(-54,-280,-49,-258);
  ctx.quadraticCurveTo(-42,-232,-37,-208);ctx.quadraticCurveTo(-46,-190,-45,-172);
  ctx.lineTo(45,-172);ctx.quadraticCurveTo(46,-190,37,-208);ctx.quadraticCurveTo(42,-232,49,-258);
  ctx.quadraticCurveTo(54,-280,44,-300);ctx.quadraticCurveTo(28,-306,15,-314);
  ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.ellipse(0,-172,48,16,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function frontHead(Sy,dx=0){capsule(P(dx*.5,Sy-12),13,P(dx*.8,Sy-30),11);ctx.beginPath();ctx.ellipse(dx,Sy-56,25,29,0,0,Math.PI*2);ctx.fill();}
/* lichte trilling bij vasthouden, 0..1 */
const trem=T=>.5+.5*Math.sin(T*Math.PI*2*5.3)*Math.sin(T*Math.PI*2*.9+1);
const breath=T=>Math.sin(T*Math.PI*2/4);

/* Borst- en armrek in de deurpost: 3D-model (x opzij, y omhoog negatief, z naar voren), deurvlak op z=0.
   f = hoe ver de romp door de deur naar voren leunt (0 = rechtop in de deur, 1 = volle rek). */
const PAGE={key:'deurpost-state',defMode:'iso',
  groups:[{id:'v',label:'Armstand',opts:[['y','Y-vorm'],['ninety','90-90']]}]};
VX=0;VY=0;VW=640;VH=440;
PAGE.period=st=>st.mode==='iso'?8:6;
PAGE.still=st=>st.mode==='iso'?2:2.5;
const POST_IN=124,POST_OUT=170,LINTEL=-628,FRAME_D=34;
function motionF(st,T){
  if(st.mode==='iso')return .985+.015*breath(T);
  const x=T%6;return x<2?ease(x/2):x<3?1:x<5?1-ease((x-3)/2):0;
}
function pose(st,f){
  const M={f};
  const Hz=lerp(8,40,f),Af=95,Ab=-58;
  const vert=dz=>Math.sqrt(272*272-dz*dz);
  const hy=-12-Math.min(vert(Af-Hz),vert(Hz-Ab));
  M.legs=[[1,Af],[-1,Ab]].map(([s,az])=>{
    const H=V3(s*22,hy,Hz),A=V3(s*22,-12,az);
    return {H,A,K:ik3(H,A,148,132,V3(0,0,1)),front:s>0};
  });
  const lean=lerp(2,8,f)*DEG;
  M.H=V3(0,hy,Hz);M.S=V3(0,hy-155*Math.cos(lean),Hz+155*Math.sin(lean));M.lean=lean;
  M.arms=[1,-1].map(s=>{
    const Sh=V3(s*50,M.S.y+2,M.S.z),fd=Sh.z+6;
    let E,W,Hd;
    if(st.v==='ninety'){
      /* elleboog op schouderhoogte tegen de deurpost, onderarm verticaal, hand plat omhoog */
      const xe=50+Math.sqrt(Math.max(0,104*104-fd*fd));
      E=V3(s*xe,Sh.y+4,-6);W=V3(s*xe,E.y-81,-6);Hd=V3(s*xe,W.y-20,-6);
    }else{
      /* Y: gestrekte arm schuin omhoog, handpalm hoog tegen de deurpost */
      const xh=144,hy2=Math.sqrt(Math.max(0,185*185-(xh-50)**2-fd*fd));
      W=V3(s*xh,Sh.y-hy2,-6);
      E=ik3(Sh,W,104,81,V3(0,1,-.3));
      const u=nrm3(sub3(W,E));Hd=add3(W,mul3(u,20));
    }
    return {Sh,E,W,Hd,s};
  });
  M.glow=.3+.7*f;
  return M;
}
function sideView(M,c){
  const pr=p=>P(p.z,p.y);
  /* deurpost: je staat erachter, onderarmen drukken tegen de achterkant (z=0), de borst gaat door de opening */
  ctx.fillStyle=c.post;ctx.fillRect(0,LINTEL-22,FRAME_D,-LINTEL+22);
  const leg=(L,dx,dy)=>{
    const h=P(L.H.z+dx,L.H.y+dy),k=P(L.K.z+dx,L.K.y+dy),a=P(L.A.z+dx,L.A.y);
    F=-1;limb(h,k,24,15,THIGH_F,THIGH_B);dot(k,14.5);
    limb(k,a,14.5,9,SHIN_F,SHIN_B);
    capsule(P(a.x-8,a.y+3),9,P(a.x+34,a.y+6),6);
  };
  const arm=(a,dx,dy)=>{
    const s0=P(a.Sh.z+dx-2,a.Sh.y+dy),e=P(a.E.z+dx,a.E.y+dy),w=P(a.W.z+dx,a.W.y+dy),hd=P(a.Hd.z+dx,a.Hd.y+dy);
    F=1;limb(s0,e,16,11,UA_F,UA_B);dot(e,11);
    limb(e,w,11.5,6.5,FA_F,FA_B);edgeHand(w,hd,7);
  };
  ctx.fillStyle=c.far;arm(M.arms[1],-10,-3);leg(M.legs[1],-10,-3);
  ctx.fillStyle=c.body;
  const H=pr(M.H),S=pr(M.S),lean=M.lean,ux=Math.sin(lean),uy=-Math.cos(lean);
  F=-1;limb(S,H,27,24,T_FRONT,T_BACK);
  dot(H,27);ctx.beginPath();ctx.ellipse(H.x-15*Math.cos(lean),H.y+2,23,31,lean,0,Math.PI*2);ctx.fill();
  leg(M.legs[0],0,0);
  capsule(P(S.x+ux*14,S.y+uy*14),12,P(S.x+ux*30+2,S.y+uy*30),11);
  ctx.beginPath();ctx.ellipse(S.x+ux*56+5,S.y+uy*56,25,29,lean*.5,0,Math.PI*2);ctx.fill();
  /* borst (primair) */
  ctx.save();ctx.fillStyle=c.mus;ctx.globalAlpha=M.glow;
  ctx.beginPath();ctx.ellipse(S.x+ux*-30+16,S.y+uy*-30,13,22,lean,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.fillStyle=c.body;
  const A0=M.arms[0];
  outlined(()=>arm(A0,0,0));
  dot(P(S.x-2,S.y-2),21);
  ctx.save();ctx.fillStyle=c.mus;ctx.globalAlpha=.55*M.glow;
  ctx.beginPath();ctx.ellipse(S.x+6,S.y+2,10,15,0,0,Math.PI*2);ctx.fill();
  const s0=P(A0.Sh.z,A0.Sh.y),e=pr(A0.E);if(dist(s0,e)>40)capsule(lerpP(s0,e,.35),8,lerpP(s0,e,.8),6);
  ctx.restore();
}
/* achteraanzicht: de kijker staat achter het figuur, aan dezelfde kant als de onderarmen */
function backView(M,c){
  const pr=p=>P(-p.x,p.y);
  ctx.fillStyle=c.post;
  for(const s of [-1,1])ctx.fillRect(s>0?POST_IN:-POST_OUT,LINTEL,POST_OUT-POST_IN,-LINTEL);
  ctx.fillRect(-POST_OUT,LINTEL-22,POST_OUT*2,24);
  ctx.fillStyle=c.body;
  for(const L of M.legs){
    const h=pr(L.H),k=pr(L.K),a=pr(L.A),s=Math.sign(h.x);
    F=s<0?1:-1;
    limb(h,k,24,16,[[4,.42,.3]],[[4,.42,.3]]);dot(k,15);
    limb(k,a,15,9,[[3.5,.27,.18]],[[3.5,.27,.18]]);
    capsule(P(a.x,a.y),10,P(a.x+s*1,-6),11);
  }
  F=-1;
  const Sy=M.S.y,Hy=M.H.y;
  frontTorso(Sy,Hy);
  for(const s of [-1,1]){ctx.beginPath();ctx.ellipse(s*21,Hy+4,24,30,0,0,Math.PI*2);ctx.fill();}
  frontHead(Sy);
  for(const a of M.arms)dot(P(-a.Sh.x,Sy+2),17);
  /* armen tussen de kijker en de romp, dun randje tegen de rug */
  for(const a of M.arms){
    const s0=P(-a.Sh.x,a.Sh.y),e=pr(a.E),w=pr(a.W),hd=pr(a.Hd);
    outlined(()=>{
      limb(s0,e,16,11,[[4,.5,.22]],[[4,.5,.22]]);dot(e,11);
      limb(e,w,11.5,6.5,[[3,.25,.2]],[[3,.25,.2]]);
      const u=unit(w,hd),an=Math.atan2(u.y,u.x);
      ctx.save();ctx.translate(w.x,w.y);ctx.rotate(an);ctx.beginPath();ctx.ellipse(12,0,15,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();
    });
  }
  ctx.save();ctx.fillStyle=c.mus;ctx.globalAlpha=.55*M.glow;
  for(const a of M.arms){const s=-a.s;ctx.beginPath();ctx.ellipse(s*52,Sy+4,12,15,0,0,Math.PI*2);ctx.fill();}
  ctx.restore();
}
PAGE.draw=(st,T,c)=>{
  const M=pose(st,motionF(st,T));
  const sc=.6;
  for(const [cx,fn,lab] of [[170,backView,'ACHTERAANZICHT'],[440,sideView,'ZIJAANZICHT']]){
    ctx.save();ctx.translate(cx,400);ctx.scale(sc,sc);
    mat(c,-200,400);
    fn(M,c);
    ctx.restore();
    label(c,lab,cx,432);
  }
};


/* ---------- knoppen, toestand en afspeellus ---------- */
(function(){
  const MODES=PAGE.modes===false?[]:[['iso','Isometrisch'],['dyn','Dynamisch']];
  const groups=PAGE.groups;
  const st={mode:PAGE.defMode||'iso'};groups.forEach(g=>st[g.id]=g.def||g.opts[0][0]);
  let playing=true,slow=false,phaseT=0,last=performance.now();
  const bar=document.getElementById('opts');
  const mk=(key,list,cls,aria)=>{if(!list.length)return;const box=document.createElement('div');box.className='seg '+cls;box.setAttribute('role','group');box.setAttribute('aria-label',aria);box.dataset.g=key;
    list.forEach(([id,lab])=>{const b=document.createElement('button');b.type='button';b.id=key+'-'+id;b.textContent=lab;b.dataset.v=id;b.onclick=()=>set(key,id);box.appendChild(b);});bar.appendChild(box);};
  mk('mode',MODES,'modes','Uitvoering');
  groups.forEach(g=>mk(g.id,g.opts,'vars',g.label));
  function sync(){
    bar.querySelectorAll('.seg').forEach(box=>{const k=box.dataset.g;box.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===st[k])));});
    document.querySelectorAll('.legend [data-when]').forEach(el=>{const [g,vals]=el.dataset.when.split(':');el.hidden=!vals.split(',').includes(st[g]);});
    if(PAGE.onChange)PAGE.onChange(st);
  }
  function set(k,v){st[k]=v;phaseT=0;sync();try{localStorage.setItem(PAGE.key,JSON.stringify(st))}catch(e){}}
  try{const s=JSON.parse(localStorage.getItem(PAGE.key)||'null');if(s){if(MODES.some(m=>m[0]===s.mode))st.mode=s.mode;groups.forEach(g=>{if(g.opts.some(o=>o[0]===s[g.id]))st[g.id]=s[g.id];});}}catch(e){}
  sync();
  window.__set=o=>{Object.assign(st,o);sync();};
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(playing&&!reduce)phaseT+=dt*(slow?.5:1);
    const per=PAGE.period(st);if(per)phaseT%=per;
    const T=window.__T!=null?window.__T:(reduce?PAGE.still(st):phaseT);
    const k=cv.width/VW;
    ctx.setTransform(k,0,0,k,-VX*k,-VY*k);
    const c={stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),muted:tok('--muted'),post:tok('--post'),band:tok('--band'),bandfar:tok('--bandfar'),ink:tok('--ink')};
    ctx.fillStyle=c.stage;ctx.fillRect(VX,VY,VW,VH);
    PAGE.draw(st,T,c,dt);
    requestAnimationFrame(frame);
  }
  document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
  document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
  requestAnimationFrame(frame);
})();

<\/script>

</body></html>
</script>
<script type="text/plain" data-ex="touwtje">
<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Touwtje springen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one stage card with the animation, mode/variation/playback controls and a muscle legend */
:root{
  --bg:#EDF0EE; --stage:#F8FAF9; --ink:#1E2426; --muted:#5E686A; --body:#2A3134; --far:#7C8689;
  --muscle:#E0452B; --mat:#D6DCD9; --line:#D3D9D6; --post:#C9D0CD; --band:#2C8C7E; --bandfar:#8CC2B9;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --text:"Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121617; --stage:#1A1F20; --ink:#E8ECEA; --muted:#98A3A0; --body:#D9E0DD; --far:#7F8A87;
  --muscle:#FF5B3E; --mat:#2A3133; --line:#2C3335; --post:#323A3C; --band:#4DBDAC; --bandfar:#2F6E66; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121617; --stage:#1A1F20; --ink:#E8ECEA; --muted:#98A3A0; --body:#D9E0DD; --far:#7F8A87;
  --muscle:#FF5B3E; --mat:#2A3133; --line:#2C3335; --post:#323A3C; --band:#4DBDAC; --bandfar:#2F6E66; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
main{max-width:860px;margin:0 auto;display:grid;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,7vw,52px);line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;height:auto}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 16px;border-top:1px solid var(--line)}
#opts{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.seg.play{margin-left:auto}
.seg.modes button{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase;padding:5px 12px}
button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button[aria-pressed="true"]{background:var(--ink);color:var(--stage);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--muscle);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:15px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muscle)}
.dot.soft{opacity:.55}
@media (max-width:560px){.seg.play{margin-left:0}}
</style>

<main>
  <header>
    <h1>Touwtje springen</h1>
    <p class="sub">Warming-up · kuiten, voetzolen en schouders</p>
  </header>

  <section class="stage">
    <canvas id="c" width="1200" height="825" aria-label="Animatie van touwtje springen, van voren en van opzij"></canvas>
    <div class="bar">
      <div id="opts"></div>
      <div class="seg play">
        <button id="play" type="button" aria-pressed="false">Pauze</button>
        <button id="slow" type="button" aria-pressed="false">Langzaam</button>
      </div>
    </div>
  </section>

  <div class="legend">
    <span><i class="dot"></i>Kuiten (primair)</span>
    <span><i class="dot soft"></i>Schouders en onderarmen (secundair)</span>
  </div>
</main>

<script>
/* ---------- shared drawing helpers (vaste maten en spierprofielen) ---------- */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let VX=0,VY=0,VW=640,VH=440;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
const P=(x,y)=>({x,y});
const DEG=Math.PI/180,lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>.5-.5*Math.cos(Math.PI*clamp(t,0,1));
const lerpP=(a,b,t)=>P(lerp(a.x,b.x,t),lerp(a.y,b.y,t));
const dist=(a,b)=>Math.hypot(b.x-a.x,b.y-a.y);
const dot=(c,r)=>{ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.fill();};
function capsule(a,ra,b,rb){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const s=Math.asin(Math.max(-1,Math.min(1,(ra-rb)/L)));
  ctx.beginPath();
  ctx.arc(a.x,a.y,ra,ang+Math.PI/2+s,ang-Math.PI/2-s+Math.PI*2,false);
  ctx.arc(b.x,b.y,rb,ang-Math.PI/2-s,ang+Math.PI/2+s,false);
  ctx.closePath();ctx.fill();
}
let F=-1;
function limb(a,b,rA,rB,front,back){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const nx=-uy*F,ny=ux*F,N=28;
  const prof=(t,bs)=>{let r=rA+(rB-rA)*t;for(const[m,c,w]of bs)r+=m*Math.exp(-(((t-c)/w)**2));return r};
  ctx.beginPath();
  for(let i=0;i<=N;i++){const t=i/N,r=prof(t,front);const x=a.x+dx*t+nx*r,y=a.y+dy*t+ny*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const t=i/N,r=prof(t,back);ctx.lineTo(a.x+dx*t-nx*r,a.y+dy*t-ny*r);}
  ctx.closePath();ctx.fill();
  dot(a,(prof(0,front)+prof(0,back))/2);dot(b,(prof(1,front)+prof(1,back))/2);
}
/* vlakke hand plat op de vloer: handpalm onder op W.y+8, dikke handrug bij de pols, dunne vingers naar +x */
function hand(W){
  ctx.beginPath();
  ctx.moveTo(W.x-6,W.y+8);
  ctx.lineTo(W.x+29,W.y+8);
  ctx.quadraticCurveTo(W.x+34,W.y+8,W.x+33.5,W.y+5);
  ctx.quadraticCurveTo(W.x+32,W.y+2,W.x+26,W.y+2);
  ctx.lineTo(W.x+18,W.y+1.5);
  ctx.quadraticCurveTo(W.x+15,W.y-1.5,W.x+10,W.y-1);
  ctx.quadraticCurveTo(W.x+3,W.y-3,W.x-1,W.y-4);
  ctx.quadraticCurveTo(W.x-9,W.y-4,W.x-9,W.y+3);
  ctx.quadraticCurveTo(W.x-9,W.y+8,W.x-6,W.y+8);
  ctx.closePath();ctx.fill();
}
/* hand in de richting van de onderarm gedraaid (hand(W) geroteerd om de pols) */
function handAt(W,ang,flip){ctx.save();ctx.translate(W.x,W.y);ctx.rotate(ang);if(flip)ctx.scale(1,-1);hand(P(0,0));ctx.restore();}
const unit=(a,b)=>{const d=dist(a,b)||1;return P((b.x-a.x)/d,(b.y-a.y)/d);};
function fist(W,E){const a=Math.atan2(W.y-E.y,W.x-E.x);ctx.save();ctx.translate(W.x,W.y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(9,0,11,9.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
const fistC=(W,E)=>{const u=unit(E,W);return P(W.x+u.x*9,W.y+u.y*9);};

/* teken een vorm als dun randje in de achtergrondkleur (eerst stroken, dan vullen) */

const T_FRONT=[[9,.19,.15],[-2,.4,.06],[2.2,.5,.045],[2.2,.61,.045],[2.2,.72,.045]],T_BACK=[[3,.12,.18],[-7,.68,.17]];

/* vooraanzicht-romp (zoals pass-through/horse stance): schouders op Sy, heup op Hy */
function frontTorso(Sy,Hy){
  const s=(Hy-Sy)/126;
  ctx.save();ctx.translate(0,Hy);ctx.scale(1,s);ctx.translate(0,172);
  ctx.beginPath();ctx.moveTo(-15,-314);
  ctx.quadraticCurveTo(-28,-306,-44,-300);ctx.quadraticCurveTo(-54,-280,-49,-258);
  ctx.quadraticCurveTo(-42,-232,-37,-208);ctx.quadraticCurveTo(-46,-190,-45,-172);
  ctx.lineTo(45,-172);ctx.quadraticCurveTo(46,-190,37,-208);ctx.quadraticCurveTo(42,-232,49,-258);
  ctx.quadraticCurveTo(54,-280,44,-300);ctx.quadraticCurveTo(28,-306,15,-314);

function frontHead(Sy,dx=0){capsule(P(dx*.5,Sy-12),13,P(dx*.8,Sy-30),11);ctx.beginPath();ctx.ellipse(dx,Sy-56,25,29,0,0,Math.PI*2);ctx.fill();}
/* lichte trilling bij vasthouden, 0..1 */
const trem=T=>.5+.5*Math.sin(T*Math.PI*2*5.3)*Math.sin(T*Math.PI*2*.9+1);
const breath=T=>Math.sin(T*Math.PI*2/4);

/* Touwtje springen: één 3D-model (x opzij, y omhoog negatief, z naar voren), geprojecteerd op voor- en zijaanzicht.
   θ = touwhoek: 0 boven het hoofd, 90° voor het lichaam, 180° onder de voeten, 270° erachter. */
const PAGE={key:'touwtje-state2',defMode:'dyn',modes:false,
  groups:[{id:'v',label:'Voeten',opts:[['two','Twee voeten'],['alt','Afwisselend']]}]};
VX=0;VY=0;VW=640;VH=440;
const TR=.62;                 /* één omwenteling per sprong */
PAGE.period=st=>st.mode==='iso'?8:TR*4;
PAGE.still=st=>st.mode==='iso'?2:TR*.5;
const ROPE_R=318;
function pose(st,T){
  const iso=st.mode==='iso',alt=st.v==='alt';
  let th,hop=0,bend=.35,lift=[0,0],glow;
  if(iso){
    /* voorvoethouding: op de bal van de voet, knieën licht gebogen, touw ligt klaar achter de hielen */
    th=205*DEG;bend=.55+.04*breath(T);glow=.8+.15*trem(T);
    if(alt)lift=[1,0];
  }else{
    const rev=T/TR;th=(rev%1)*Math.PI*2;
    const air=Math.max(0,-Math.cos(th));             /* los van de grond als het touw onderlangs gaat */
    hop=(alt?9:14)*Math.pow(air,1.3);
    bend=.2+.55*Math.pow(Math.max(0,Math.cos(th)),2); /* verend landen terwijl het touw boven is */
    glow=.5+.5*Math.max(0,Math.cos(th))+.2*air;
    if(alt){const k=Math.floor(rev)%2,b=Math.sin(Math.PI*(rev%1));lift=k?[b,0]:[0,b];}
  }
  const M={th,hop,glow:clamp(glow,0,1)};
  /* benen: enkel boven de bal van de voet (hiel omhoog) */
  const Hz=4,legs=[1,-1].map((s,i)=>{
    const l=lift[i];
    const A=V3(s*24,-24-hop-26*l,-6*l-14*l*l);
    const d=272-16*bend;
    const H=V3(s*24,-24-hop-Math.sqrt(d*d-(Hz-A.z)**2),Hz);
    const K=ik3(H,A,148,132,V3(0,0,1));
    return {H,K,A,l};
  });
  /* steunbeen bepaalt de heuphoogte; het vrije been volgt met dezelfde heup */
  const hy=Math.max(legs[0].H.y,legs[1].H.y);
  legs.forEach(L=>{L.H.y=hy;L.K=ik3(L.H,L.A,148,132,V3(0,0,1));});
  M.legs=legs;
  const lean=4*DEG;
  M.H=V3(0,hy,Hz);M.S=V3(0,hy-155*Math.cos(lean),Hz+155*Math.sin(lean));

  M.arms=[1,-1].map(s=>{
    const Sh=V3(s*50,M.S.y+2,M.S.z-2);
    const E=V3(s*56,Sh.y+102,Sh.z-10);
    const w=iso?0:1,c=Math.cos(th),sn=Math.sin(th);
    const fd=nrm3(V3(s*.48,.42,.77));
    let W=add3(E,mul3(fd,81));W=add3(W,V3(0,-5*c*w,5*sn*w));
    const E2=ik3(Sh,W,104,81,V3(s*.2,0,-1));

/* touwpunten in 3D */
function rope(M){
  const a=M.arms[1].C,b=M.arms[0].C;            /* van linker- naar rechterhand */

  const pr=p=>P(p.z,p.y);

function frontView(M,c,withRope){
  const pr=p=>P(p.x,p.y);

PAGE.draw=(st,T,c)=>{

/* ---------- knoppen, toestand en afspeellus ---------- */
(function(){

  const st={mode:PAGE.defMode||'iso'};groups.forEach(g=>st[g.id]=g.def||g.opts[0][0]);
  let playing=true,slow=false,phaseT=0,last=performance.now();
  const bar=document.getElementById('opts');
  const mk=(key,list,cls,aria)=>{if(!list.length)return;const box=document.createElement('div');box.className='seg '+cls;box.setAttribute('role','group');box.setAttribute('aria-label',aria);box.dataset.g=key;
    list.forEach(([id,lab])=>{const b=document.createElement('button');b.type='button';b.id=key+'-'+id;b.textContent=lab;b.dataset.v=id;b.onclick=()=>set(key,id);box.appendChild(b);});bar.appendChild(box);};
  mk('mode',MODES,'modes','Uitvoering');
  groups.forEach(g=>mk(g.id,g.opts,'vars',g.label));

    bar.querySelectorAll('.seg').forEach(box=>{const k=box.dataset.g;box.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===st[k])));});
    document.querySelectorAll('.legend [data-when]').forEach(el=>{const [g,vals]=el.dataset.when.split(':');el.hidden=!vals.split(',').includes(st[g]);});
    if(PAGE.onChange)PAGE.onChange(st);
  }
  function set(k,v){st[k]=v;phaseT=0;sync();try{localStorage.setItem(PAGE.key,JSON.stringify(st))}catch(e){}}
  try{const s=JSON.parse(localStorage.getItem(PAGE.key)||'null');if(s){if(MODES.some(m=>m[0]===s.mode))st.mode=s.mode;groups.forEach(g=>{if(g.opts.some(o=>o[0]===s[g.id]))st[g.id]=s[g.id];});}}catch(e){}
  sync();
  window.__set=o=>{Object.assign(st,o);sync();};
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(playing&&!reduce)phaseT+=dt*(slow?.5:1);
    const per=PAGE.period(st);if(per)phaseT%=per;
    const T=window.__T!=null?window.__T:(reduce?PAGE.still(st):phaseT);
    const k=cv.width/VW;
    ctx.setTransform(k,0,0,k,-VX*k,-VY*k);
    const c={stage:tok('--stage'),body:tok('--body'),far:tok('--far'),mus:tok('--muscle'),mat:tok('--mat'),muted:tok('--muted'),post:tok('--post'),band:tok('--band'),bandfar:tok('--bandfar'),ink:tok('--ink')};
    ctx.fillStyle=c.stage;ctx.fillRect(VX,VY,VW,VH);
    PAGE.draw(st,T,c,dt);
    requestAnimationFrame(frame);
  }
  document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pauze':'Afspelen';e.target.setAttribute('aria-pressed',String(!playing));};
  document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
  requestAnimationFrame(frame);
})();

<\/script>
